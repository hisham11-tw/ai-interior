en_body:`
<h3>Purpose and day plan</h3>
<p>A training analyst needs a small, explainable list of police or traffic records. Opening question: "Which records are theft reports? Which recent crashes have known injuries? How can another analyst reproduce our list?" First describe the required columns and rows in plain language, then write SQL. A <b>query</b> is a precise request to a database; the answer is a result table whose <b>scope</b> must be explained. All classroom records are synthetic. Four-hour day: concepts 60 min (scenario 10, model & types 20, keys 10, query structure 20), Lab A police 90 min, Lab B traffic 90 min.</p>
<h3>The relational model</h3>
<table><tr><th>Term</th><th>Meaning in this course</th></tr>
<tr><td>Database</td><td><code>police_training</code> — a named collection of database objects</td></tr>
<tr><td>Schema</td><td><code>training</code> — a namespace grouping shared tables</td></tr>
<tr><td>Table</td><td><code>crimes</code> or <code>crashes</code> — rows with defined columns and rules</td></tr>
<tr><td>Row</td><td>one source record at the table's stated <b>grain</b></td></tr>
<tr><td>Column</td><td>a property such as crash_date or injuries_total</td></tr>
<tr><td>Primary key</td><td>a non-null, unique identifier for a row</td></tr>
<tr><td>Foreign key</td><td>a reference connecting a child row to an existing parent key</td></tr></table>
<p>One crash can have several vehicle-unit rows and several person rows, so counting vehicle rows ≠ counting crashes (crash A with 3 vehicles + crash B with 2 → 2 crash rows, 5 vehicle rows). A foreign key prevents a child from referencing a missing crash but doesn't prove all real-world records were collected. The crimes table's grain is a reported source record — don't call it a person table (official data may follow conventions such as one homicide record per victim). Joins come later.</p>
<h3>Types, keys and missing values</h3>
<table><tr><th>Column</th><th>Type</th><th>Why it matters</th></tr>
<tr><td>crimes.id</td><td>bigint</td><td>integer primary key of a crime-source record</td></tr>
<tr><td>crimes.date</td><td>timestamp</td><td>date and time used to order records</td></tr>
<tr><td>crimes.primary_type</td><td>text</td><td>categories such as THEFT</td></tr>
<tr><td>crimes.arrest</td><td>boolean</td><td>true, false or unknown — not evidence of guilt</td></tr>
<tr><td>crimes.district</td><td>text</td><td>keeps codes such as 01 with the leading zero</td></tr>
<tr><td>crashes.crash_record_id</td><td>text</td><td>crash primary key; an identifier, not a quantity</td></tr>
<tr><td>crashes.injuries_total</td><td>integer, nullable</td><td>a count when known; NULL when unavailable</td></tr></table>
<p>Timestamps are local wall times without a timezone offset — we order them but don't compute durations across daylight-saving changes. Identifiers may contain digits and still need text storage.</p>
<p><b>DDL</b> (Data Definition Language): <code>CREATE TABLE</code> declares structure and rules. Demo:</p>
<pre>CREATE TEMP TABLE day01_key_demo (
  record_id integer PRIMARY KEY,
  category text NOT NULL,
  recorded_at timestamp NOT NULL
) ON COMMIT DROP;   -- disappears at transaction end</pre>
<p>Inserting a second row with the same record_id violates the primary key (tested in an isolated transaction). <b>NULL is not zero</b>: zero injuries is a known value; NULL means unknown. An ordinary comparison with NULL is unknown, so WHERE doesn't keep that row. Use <code>IS NULL</code>, never <code>= NULL</code>.</p>
<h3>Build a query in small steps</h3>
<pre>SELECT id, date, primary_type, district   -- output columns
FROM training.crimes                     -- source (schema prefix explicit)
WHERE primary_type = 'THEFT'             -- keep rows where the condition is true
ORDER BY date DESC, id                   -- latest first; id breaks ties
LIMIT 10;                                -- at most ten rows</pre>
<p>Read clauses as a request (choose columns, name the source, match rows, order, bound) — a reasoning model, not the optimizer's physical plan. <code>LIMIT 10</code> returns <b>at most</b> ten rows, doesn't guarantee ten exist and deletes nothing; changing LIMIT doesn't change the source table, and changing SELECT columns doesn't change how many records qualify. Text values use single quotes and must match stored spelling and case. <code>DESC</code> = descending (later first); the next key is ascending by default. Without a unique order, "the first ten" isn't reproducible; a limited result is a selected preview, not a random sample or a city total.</p>
<p><b>DISTINCT</b> answers "which values occur?": <code>SELECT DISTINCT primary_type FROM training.crimes ORDER BY primary_type;</code> gives one row per value. It applies to the whole selected row — selecting a unique id with a category keeps repeated categories. It doesn't change stored data and isn't a frequency count.</p>
<p><b>Parameters:</b> <code>WHERE primary_type = %s</code> with Python supplying <code>('BATTERY',)</code>; the driver binds it safely. Never join user text into SQL. Placeholders represent <b>values</b>, not table or column names.</p>
<h3>Traffic records</h3>
<pre>SELECT crash_record_id, crash_date, injuries_total
FROM training.crashes
WHERE injuries_total &gt; 0              -- strictly positive (&gt;= 2 includes 2)
ORDER BY crash_date DESC, crash_record_id
LIMIT 10;
SELECT crash_record_id, injuries_total FROM training.crashes
WHERE injuries_total IS NULL ORDER BY crash_record_id LIMIT 5;</pre>
<p>A NULL injury total satisfies neither <code>&gt; 0</code> nor <code>&gt;= 2</code>. An empty result is valid if nothing is missing — don't invent rows. <code>posted_speed_limit</code> is a posted limit, not observed speed, so filtering it doesn't establish speeding or crash cause. The notebook chart of the 8 highest-injury crashes shows per-crash injuries, not city totals; horizontal position is result order, not geography.</p>
<h3>Practice notebook (SQL Queries Made Simple)</h3>
<pre>SELECT id, primary_type FROM training.crimes LIMIT 10;
SELECT crash_record_id, injuries_total, posted_speed_limit FROM training.crashes
 WHERE injuries_total &gt; 0 AND posted_speed_limit &gt;= 30 LIMIT 10;
 WHERE injuries_total &gt;= 2 OR posted_speed_limit &gt;= 40
SELECT crash_record_id, crash_date, injuries_total FROM training.crashes
 ORDER BY crash_date ASC, crash_record_id LIMIT 5;              -- earliest five
SELECT DISTINCT weather_condition FROM training.crashes ORDER BY weather_condition;
SELECT primary_type, COUNT(*) AS total_events FROM training.crimes
 GROUP BY primary_type ORDER BY total_events DESC;
SELECT COUNT(*) AS total_crashes FROM training.crashes;
SELECT district, COUNT(*) AS event_count FROM training.crimes
 GROUP BY district ORDER BY event_count DESC, district LIMIT 10;</pre>
<p>Clause order: <code>SELECT … FROM schema.table WHERE … GROUP BY … ORDER BY … DESC LIMIT n</code>; include GROUP BY only when grouping or aggregating. <code>COUNT(*)</code> counts rows; GROUP BY counts per category. Counts in synthetic data are not real risk rankings. Challenges: latest 10 THEFT records; top 5 <code>first_crash_type</code> by count; 10 crashes with injuries ≥ 2 sorted by injuries then ID; count of rows with NULL injuries.</p>
<h3>Colab + Neon setup</h3>
<p>Install <code>%pip -q install "psycopg[binary]&gt;=3.2,&lt;4" pandas certifi</code>. Add <code>DATABASE_URL</code> (restricted learner connection to <code>police_training</code>) in Colab <b>Secrets</b> and enable notebook access; never paste or print credentials. The setup checks the database name, requires the direct <code>.neon.tech</code> endpoint (not <code>-pooler</code>), sets <code>sslmode="verify-full"</code> with certifi, and defines <code>run_sql()</code>: read-only transaction, <code>statement_timeout = '30s'</code>, and an error if more than 200 rows return (add LIMIT). A quick check uses <code>to_regclass('training.crimes')</code> and <code>training.provenance</code> mode must be "synthetic". SQL does the filtering and ordering; Python only connects and displays. A Colab restart clears Python state; Neon keeps its tables.</p>
<table><tr><th>Symptom</th><th>What to do</th></tr>
<tr><td>Missing secret</td><td>check DATABASE_URL and its notebook-access switch</td></tr>
<tr><td>Missing training table</td><td>instructor imports the synthetic snapshot</td></tr>
<tr><td>Permission failure in DDL</td><td>instructor checks TEMPORARY permission</td></tr>
<tr><td>Column does not exist</td><td>crimes uses <code>date</code>, crashes uses <code>crash_date</code></td></tr>
<tr><td>No rows returned</td><td>check predicate and vocabulary; empty isn't always an error</td></tr>
<tr><td>= NULL returns nothing</td><td>use IS NULL</td></tr>
<tr><td>Unstable first records</td><td>ORDER BY with a unique tie-break key</td></tr></table>
<p class="ex">Daily Task: latest five crashes with injuries_total ≥ 2 (crash_record_id, crash_date, injuries_total), equal dates by ascending crash_record_id, plus three sentences on data mode, grain and one limit. Assessment: six SQL exercises 60, two interpretations 20, Daily Task 20. A Run All with unsubmitted answers (NOT SUBMITTED) isn't completion.</p>`,
ar_body:`
<h3>الهدف وخطة اليوم</h3>
<p>محلل تدريب يحتاج قائمة صغيرة قابلة للشرح من سجلات الشرطة أو المرور. السؤال الافتتاحي: "أي السجلات بلاغات سرقة؟ أي الحوادث الحديثة إصاباتها معروفة؟ كيف يعيد محلل آخر إنتاج قائمتنا؟" صِف أولاً الأعمدة والصفوف المطلوبة بلغة عادية ثم اكتب SQL. <b>الاستعلام</b> طلب دقيق لقاعدة البيانات، والإجابة جدول نتائج يجب شرح <b>نطاقه</b>. كل السجلات مصطنعة. اليوم 4 ساعات: مفاهيم 60 دقيقة (السيناريو 10، النموذج والأنواع 20، المفاتيح 10، بنية الاستعلام 20)، معمل A للشرطة 90 دقيقة، معمل B للمرور 90 دقيقة.</p>
<h3>النموذج العلائقي</h3>
<table><tr><th>المصطلح</th><th>المعنى في المقرر</th></tr>
<tr><td>قاعدة البيانات</td><td><code>police_training</code> — مجموعة مسماة من كائنات القاعدة</td></tr>
<tr><td>المخطط Schema</td><td><code>training</code> — مساحة أسماء تجمع الجداول المشتركة</td></tr>
<tr><td>الجدول</td><td><code>crimes</code> أو <code>crashes</code> — صفوف بأعمدة وقواعد محددة</td></tr>
<tr><td>الصف</td><td>سجل مصدر واحد حسب <b>مستوى</b> الجدول (grain)</td></tr>
<tr><td>العمود</td><td>خاصية مثل crash_date أو injuries_total</td></tr>
<tr><td>المفتاح الأساسي</td><td>معرّف فريد غير فارغ للصف</td></tr>
<tr><td>المفتاح الأجنبي</td><td>مرجع يربط صفاً ابناً بمفتاح أب موجود</td></tr></table>
<p>الحادث الواحد قد يكون له عدة صفوف مركبات وأشخاص، فعدّ صفوف المركبات ≠ عدّ الحوادث (الحادث A بـ 3 مركبات + B بمركبتين ← صفا حوادث و 5 صفوف مركبات). المفتاح الأجنبي يمنع الابن من الإشارة لحادث غير موجود لكنه لا يثبت جمع كل السجلات الواقعية. مستوى جدول crimes هو سجل مصدر مُبلّغ — لا تسمّه جدول أشخاص (البيانات الرسمية قد تتبع أعرافاً مثل سجل قتل لكل ضحية). الربط JOIN يأتي لاحقاً.</p>
<h3>الأنواع والمفاتيح والقيم المفقودة</h3>
<table><tr><th>العمود</th><th>النوع</th><th>أهميته</th></tr>
<tr><td>crimes.id</td><td>bigint</td><td>مفتاح أساسي عددي لسجل الجريمة</td></tr>
<tr><td>crimes.date</td><td>timestamp</td><td>التاريخ والوقت لترتيب السجلات</td></tr>
<tr><td>crimes.primary_type</td><td>text</td><td>فئات مثل THEFT</td></tr>
<tr><td>crimes.arrest</td><td>boolean</td><td>صح أو خطأ أو مجهول — ليس دليل إدانة</td></tr>
<tr><td>crimes.district</td><td>text</td><td>يحفظ رموزاً مثل 01 مع الصفر</td></tr>
<tr><td>crashes.crash_record_id</td><td>text</td><td>مفتاح الحادث؛ معرّف وليس كمية</td></tr>
<tr><td>crashes.injuries_total</td><td>integer يقبل NULL</td><td>عدد عند معرفته، و NULL عند عدم توفره</td></tr></table>
<p>الأوقات محلية بدون منطقة زمنية — نرتبها ولا نحسب المدد عبر تغيير التوقيت الصيفي. المعرّفات قد تحتوي أرقاماً وتبقى بحاجة لتخزين نصي.</p>
<p><b>DDL</b> (لغة تعريف البيانات): <code>CREATE TABLE</code> يعرّف الهيكل والقواعد. مثال:</p>
<pre>CREATE TEMP TABLE day01_key_demo (
  record_id integer PRIMARY KEY,
  category text NOT NULL,
  recorded_at timestamp NOT NULL
) ON COMMIT DROP;   -- يختفي عند نهاية المعاملة</pre>
<p>إدخال صف ثانٍ بنفس record_id يخالف المفتاح الأساسي (يُختبر في معاملة معزولة). <b>NULL ليست صفراً</b>: صفر إصابات قيمة معروفة، و NULL تعني مجهولة. المقارنة العادية مع NULL نتيجتها مجهولة فلا يحتفظ WHERE بالصف. استخدم <code>IS NULL</code> ولا تستخدم <code>= NULL</code>.</p>
<h3>بناء الاستعلام خطوة بخطوة</h3>
<pre>SELECT id, date, primary_type, district   -- أعمدة المخرج
FROM training.crimes                     -- المصدر (مع بادئة المخطط)
WHERE primary_type = 'THEFT'             -- احتفظ بالصفوف التي يتحقق فيها الشرط
ORDER BY date DESC, id                   -- الأحدث أولاً و id يفصل التعادل
LIMIT 10;                                -- عشرة صفوف كحد أقصى</pre>
<p>اقرأ الأوامر كطلب (اختر الأعمدة، سمِّ المصدر، طابق الصفوف، رتّب، حدّد) — نموذج تفكير وليس خطة التنفيذ الفعلية. <code>LIMIT 10</code> يرجع <b>عشرة كحد أقصى</b> ولا يضمن وجود عشرة ولا يحذف شيئاً؛ تغيير LIMIT لا يغيّر الجدول، وتغيير أعمدة SELECT لا يغيّر عدد السجلات المطابقة. القيم النصية بين تنصيص مفرد ويجب أن تطابق الإملاء وحالة الأحرف. <code>DESC</code> = تنازلي (الأحدث أولاً)، والمفتاح التالي تصاعدي افتراضياً. بدون ترتيب فريد "أول عشرة" غير قابلة للتكرار؛ والنتيجة المحدودة معاينة مختارة لا عينة عشوائية ولا مجموع المدينة.</p>
<p><b>DISTINCT</b> يجيب "ما القيم الموجودة؟": <code>SELECT DISTINCT primary_type FROM training.crimes ORDER BY primary_type;</code> يعطي صفاً لكل قيمة. ينطبق على الصف المختار كاملاً — اختيار id فريد مع الفئة يُبقي الفئات المكررة. لا يغيّر البيانات وليس عدّاً للتكرار.</p>
<p><b>المعاملات Parameters:</b> <code>WHERE primary_type = %s</code> وبايثون تعطي <code>('BATTERY',)</code> والمشغّل يربطها بأمان. لا تدمج نص المستخدم في SQL. العناصر النائبة <b>للقيم</b> لا لأسماء الجداول أو الأعمدة.</p>
<h3>سجلات المرور</h3>
<pre>SELECT crash_record_id, crash_date, injuries_total
FROM training.crashes
WHERE injuries_total &gt; 0              -- موجب تماماً (و &gt;= 2 تشمل 2)
ORDER BY crash_date DESC, crash_record_id
LIMIT 10;
SELECT crash_record_id, injuries_total FROM training.crashes
WHERE injuries_total IS NULL ORDER BY crash_record_id LIMIT 5;</pre>
<p>قيمة NULL لا تحقق <code>&gt; 0</code> ولا <code>&gt;= 2</code>. النتيجة الفارغة صالحة إذا لم يكن هناك مفقود — لا تخترع صفوفاً. <code>posted_speed_limit</code> هو الحد المعلن لا السرعة المرصودة، فتصفيته لا تثبت تجاوز السرعة أو سبب الحادث. رسم أعلى 8 حوادث إصابةً يعرض إصابات كل حادث لا مجموع المدينة، والموقع الأفقي ترتيب النتيجة لا الجغرافيا.</p>
<h3>دفتر التدريب (SQL Queries Made Simple)</h3>
<pre>SELECT id, primary_type FROM training.crimes LIMIT 10;
SELECT crash_record_id, injuries_total, posted_speed_limit FROM training.crashes
 WHERE injuries_total &gt; 0 AND posted_speed_limit &gt;= 30 LIMIT 10;
 WHERE injuries_total &gt;= 2 OR posted_speed_limit &gt;= 40
SELECT crash_record_id, crash_date, injuries_total FROM training.crashes
 ORDER BY crash_date ASC, crash_record_id LIMIT 5;              -- أقدم خمسة
SELECT DISTINCT weather_condition FROM training.crashes ORDER BY weather_condition;
SELECT primary_type, COUNT(*) AS total_events FROM training.crimes
 GROUP BY primary_type ORDER BY total_events DESC;
SELECT COUNT(*) AS total_crashes FROM training.crashes;
SELECT district, COUNT(*) AS event_count FROM training.crimes
 GROUP BY district ORDER BY event_count DESC, district LIMIT 10;</pre>
<p>ترتيب الأوامر: <code>SELECT … FROM schema.table WHERE … GROUP BY … ORDER BY … DESC LIMIT n</code>؛ و GROUP BY فقط عند التجميع. <code>COUNT(*)</code> يعدّ الصفوف، و GROUP BY يعدّ لكل فئة. أعداد البيانات المصطنعة ليست ترتيباً حقيقياً للخطر. التحديات: أحدث 10 سجلات THEFT؛ أعلى 5 فئات <code>first_crash_type</code>؛ 10 حوادث بإصابات ≥ 2 مرتبة بالإصابات ثم المعرّف؛ عدد الصفوف التي إصاباتها NULL.</p>
<h3>إعداد Colab + Neon</h3>
<p>التثبيت <code>%pip -q install "psycopg[binary]&gt;=3.2,&lt;4" pandas certifi</code>. أضف <code>DATABASE_URL</code> (اتصال متدرب مقيد بـ <code>police_training</code>) في <b>Secrets</b> وفعّل وصول الدفتر؛ لا تلصق ولا تطبع بيانات الدخول. الإعداد يتحقق من اسم القاعدة، ويشترط نقطة <code>.neon.tech</code> المباشرة (لا <code>-pooler</code>)، ويضبط <code>sslmode="verify-full"</code> مع certifi، ويعرّف <code>run_sql()</code>: معاملة للقراءة فقط، و <code>statement_timeout = '30s'</code>، وخطأ إذا رجع أكثر من 200 صف (أضف LIMIT). الفحص السريع يستخدم <code>to_regclass('training.crimes')</code> ويشترط أن يكون mode في <code>training.provenance</code> هو "synthetic". SQL يصفّي ويرتّب، وبايثون تتصل وتعرض فقط. إعادة تشغيل Colab تمسح حالة بايثون، و Neon يحفظ الجداول.</p>
<table><tr><th>العَرَض</th><th>الحل</th></tr>
<tr><td>السر مفقود</td><td>افحص DATABASE_URL ومفتاح وصول الدفتر</td></tr>
<tr><td>جدول التدريب مفقود</td><td>المدرب يستورد اللقطة المصطنعة</td></tr>
<tr><td>فشل صلاحية في DDL</td><td>المدرب يتحقق من صلاحية TEMPORARY</td></tr>
<tr><td>العمود غير موجود</td><td>crimes تستخدم <code>date</code> و crashes تستخدم <code>crash_date</code></td></tr>
<tr><td>لا توجد صفوف</td><td>افحص الشرط والمفردات؛ الفارغ ليس خطأ دائماً</td></tr>
<tr><td>= NULL لا يرجع شيئاً</td><td>استخدم IS NULL</td></tr>
<tr><td>أول السجلات غير ثابتة</td><td>ORDER BY مع مفتاح فاصل فريد</td></tr></table>
<p class="ex">المهمة اليومية: أحدث خمسة حوادث بإصابات ≥ 2 (crash_record_id و crash_date و injuries_total) والتواريخ المتساوية حسب crash_record_id تصاعدياً، مع ثلاث جمل عن نوع البيانات والمستوى وقيد واحد على التفسير. التقييم: ستة تمارين SQL 60، تفسيران 20، المهمة اليومية 20. تشغيل الكل مع إجابات غير مسلّمة (NOT SUBMITTED) لا يعني الإنجاز.</p>`}
);

SECTIONS.push(
{id:"s14", unit:"u3", en:"Filtering, NULL, Safe CRUD & Transactions", ar:"التصفية و NULL والتعديل الآمن والمعاملات",
en_body:`
<p>Day 02 lab outcomes: compound predicates, date bounds, NULL, parameters, constrained CRUD, RETURNING and rollback. Suggested session: setup 20 min, filtering 65, missingness/parameters 35, CRUD 65, transactions 25, assessment 30. Shared tables are queried in <b>read-only</b> transactions; every write demo uses <b>connection-local temporary tables</b>.</p>
<h3>Connection and safety checks</h3>
<p><code>RUN_AS = 'learner'</code> uses <code>DATABASE_URL</code>; <code>'instructor'</code> uses <code>NEON_ADMIN_DATABASE_URL</code> for a private owner demo (never share it). The helper requires the direct <code>.neon.tech</code> host without <code>-pooler</code>, database <code>police_training</code>, <code>sslmode='verify-full'</code>, <code>statement_timeout = '30s'</code>, <code>row_factory=dict_row</code>; <code>run_sql()</code> runs <code>SET TRANSACTION READ ONLY</code> and refuses more than 1000 rows (a result cap isn't a query-cost guarantee). Preflight: <code>current_database()</code>, <code>current_user</code>, provenance mode = synthetic, row counts before/after, <code>has_table_privilege(current_user, 'training.crimes', 'INSERT')</code> must be false for learners, and <code>has_database_privilege(..., 'TEMPORARY')</code> must be true.</p>
<h3>D1–D2: AND, OR, parentheses and IN</h3>
<pre>WHERE (primary_type = 'THEFT' OR primary_type = 'DAMAGE') AND district = '01'
WHERE primary_type IN ('THEFT','DAMAGE') AND district = '01'   -- same rows</pre>
<p>The parentheses apply the district rule to <b>both</b> categories (AND binds tighter than OR — without them, every DAMAGE row from any district would match). <code>IN</code> expresses a choice among values; the two results are equal.</p>
<h3>D3: a month as a half-open interval</h3>
<pre>WHERE crash_date &gt;= TIMESTAMP '2025-01-01' AND crash_date &lt; TIMESTAMP '2025-02-01'</pre>
<p>Inclusive start, <b>exclusive end</b>: includes every time on January 31 and excludes midnight February 1. February: <code>&gt;= '2025-02-01' AND &lt; '2025-03-01'</code>.</p>
<h3>D4–D5: patterns and unknown values</h3>
<pre>WHERE crash_record_id LIKE %s      -- parameter ('SYNTH-CRASH-%',)
CASE WHEN injuries_total IS NULL THEN 'UNKNOWN'
     WHEN injuries_total = 0     THEN 'RECORDED ZERO'
     ELSE 'RECORDED INJURIES' END AS injury_status
WHERE injuries_total IS NULL OR injuries_total = 0   -- unknown OR recorded zero</pre>
<p>In LIKE, <code>%</code> means zero or more characters; when the pattern is a parameter its % stays inside the parameter value. <code>CASE</code> creates a display label while the original nullable count is kept. Use <code>IS NULL</code> for unknown values.</p>
<h3>D6: parameters</h3>
<pre>run_sql('SELECT id, primary_type, district FROM training.crimes '
        'WHERE district = %s ORDER BY id LIMIT 8', ('01',))</pre>
<p>Python sends the SQL structure and the value <b>separately</b> (prevents SQL injection). The trailing comma makes a one-item tuple; don't quote <code>%s</code>; change the value, not the SQL structure.</p>
<h3>D7: a constrained temporary register</h3>
<pre>CREATE TEMP TABLE day02_requests (
  request_id integer PRIMARY KEY,
  category text NOT NULL,
  status text NOT NULL CHECK (status IN ('OPEN','CLOSED')),
  priority integer NOT NULL CHECK (priority BETWEEN 1 AND 3));
-- seed: (101,'PATROL SUPPORT','OPEN',2), (102,'TRAFFIC SUPPORT','OPEN',1), (103,'RECORD REVIEW','CLOSED',3)</pre>
<p>A temporary table belongs to <b>one session/connection</b> and disappears when the connection closes; a new connection can't see another connection's temp table (rerun the whole cell if "relation missing"). It never changes training.crimes or training.crashes.</p>
<h3>D8: CRUD with evidence (RETURNING)</h3>
<table><tr><th>Action</th><th>SQL</th><th>Evidence</th></tr>
<tr><td>Create</td><td>INSERT 104 'TRAINING REVIEW' OPEN 2</td><td>returned identifier [104]</td></tr>
<tr><td>Read</td><td>SELECT request_id, status WHERE request_id = 104</td><td>current key and status</td></tr>
<tr><td>Update</td><td>UPDATE … SET status='CLOSED' WHERE request_id=104 AND status='OPEN' RETURNING request_id, status</td><td>[{104, CLOSED}]</td></tr>
<tr><td>Repeat update</td><td>same guarded UPDATE</td><td>[] — zero rows (already CLOSED)</td></tr>
<tr><td>Delete</td><td>DELETE … WHERE request_id=104 AND status='CLOSED' RETURNING request_id</td><td>[104]</td></tr></table>
<p><code>RETURNING</code> shows exactly which rows changed. Guarded predicates (key <b>and</b> expected state) change only the intended row. Zero affected rows is a valid outcome — inspect the identifier and current status before calling it a failure; it differs from a <b>rejected</b> statement.</p>
<h3>D9–D10: transactions and rollback</h3>
<p>Inside one transaction: close request 101, then insert duplicate key 102 → <b>UniqueViolation</b> → the whole batch rolls back and 101 stays OPEN. Catch the exception <b>outside</b> the transaction block and compare every row before and after — a printed message isn't proof. Setting priority to 9 violates the CHECK → <b>CheckViolation</b> → original rows preserved. A rejected change is expected behavior, not a reason to remove the constraint. After an aborted transaction, let it roll back before querying again.</p>
<h3>Exercises and Daily Task</h3>
<ul><li>E1: BATTERY or DAMAGE in district 02, order by id, at most 7 rows.</li>
<li>E2: crashes in February 2025 (inclusive start, exclusive March), order by crash_date then id, at most 6.</li>
<li>E3: unknown OR zero injuries, keep NULLs, at most 8.</li>
<li>E4 (20 pts): parameterized UPDATE setting priority to 3 for request 101 only when OPEN — placeholders in order (new priority, id), RETURNING request_id, priority; every other value unchanged.</li>
<li>E5 (10 pts): why 101 stayed OPEN, where to catch the exception, and why zero affected rows differs from a rejected statement.</li>
<li>Daily Task (25): latest five Q1-2025 crashes with known injuries ≥ 2 (newest first, ties by id ascending); close request 102 only if OPEN and verify exactly one change; explain time bounds, NULL handling and sample limits.</li></ul>
<p>At the end, shared row counts must be unchanged. Constraints, precise predicates and transaction checks matter more than memorizing syntax.</p>`,
ar_body:`
<p>مخرجات معمل اليوم 02: الشروط المركبة، حدود التاريخ، NULL، المعاملات Parameters، CRUD المقيد، RETURNING والتراجع. الجلسة: إعداد 20 دقيقة، تصفية 65، الفقد والمعاملات 35، CRUD 65، المعاملات Transactions 25، تقييم 30. الجداول المشتركة تُستعلم في معاملات <b>للقراءة فقط</b>، وكل عروض الكتابة تستخدم <b>جداول مؤقتة خاصة بالاتصال</b>.</p>
<h3>الاتصال وفحوص الأمان</h3>
<p><code>RUN_AS = 'learner'</code> يستخدم <code>DATABASE_URL</code>، و <code>'instructor'</code> يستخدم <code>NEON_ADMIN_DATABASE_URL</code> لعرض خاص بحساب المالك (لا تشاركه). الدالة المساعدة تشترط مضيف <code>.neon.tech</code> المباشر بدون <code>-pooler</code>، وقاعدة <code>police_training</code>، و <code>sslmode='verify-full'</code>، و <code>statement_timeout = '30s'</code>، و <code>row_factory=dict_row</code>؛ و <code>run_sql()</code> تنفذ <code>SET TRANSACTION READ ONLY</code> وترفض أكثر من 1000 صف (الحد ليس ضماناً لتكلفة الاستعلام). الفحص المسبق: <code>current_database()</code> و <code>current_user</code> ونوع البيانات synthetic وعدد الصفوف قبل وبعد، و <code>has_table_privilege(current_user, 'training.crimes', 'INSERT')</code> يجب أن تكون false للمتدرب، و <code>has_database_privilege(..., 'TEMPORARY')</code> يجب أن تكون true.</p>
<h3>D1–D2: AND و OR والأقواس و IN</h3>
<pre>WHERE (primary_type = 'THEFT' OR primary_type = 'DAMAGE') AND district = '01'
WHERE primary_type IN ('THEFT','DAMAGE') AND district = '01'   -- نفس الصفوف</pre>
<p>الأقواس تجعل شرط الحي ينطبق على <b>الفئتين</b> (AND أقوى ارتباطاً من OR — بدونها تطابق كل صفوف DAMAGE من أي حي). و <code>IN</code> تعبّر عن اختيار من عدة قيم، والنتيجتان متساويتان.</p>
<h3>D3: الشهر كفترة نصف مفتوحة</h3>
<pre>WHERE crash_date &gt;= TIMESTAMP '2025-01-01' AND crash_date &lt; TIMESTAMP '2025-02-01'</pre>
<p>البداية مشمولة و<b>النهاية غير مشمولة</b>: تشمل كل أوقات 31 يناير وتستبعد منتصف ليل 1 فبراير. فبراير: <code>&gt;= '2025-02-01' AND &lt; '2025-03-01'</code>.</p>
<h3>D4–D5: الأنماط والقيم المجهولة</h3>
<pre>WHERE crash_record_id LIKE %s      -- المعامل ('SYNTH-CRASH-%',)
CASE WHEN injuries_total IS NULL THEN 'UNKNOWN'
     WHEN injuries_total = 0     THEN 'RECORDED ZERO'
     ELSE 'RECORDED INJURIES' END AS injury_status
WHERE injuries_total IS NULL OR injuries_total = 0   -- مجهول أو صفر مسجّل</pre>
<p>في LIKE علامة <code>%</code> تعني صفر أو أكثر من الأحرف، وعندما يكون النمط معاملاً تبقى % داخل قيمة المعامل. و <code>CASE</code> تصنع تسمية للعرض مع بقاء العدد الأصلي القابل لـ NULL. استخدم <code>IS NULL</code> للمجهول.</p>
<h3>D6: المعاملات Parameters</h3>
<pre>run_sql('SELECT id, primary_type, district FROM training.crimes '
        'WHERE district = %s ORDER BY id LIMIT 8', ('01',))</pre>
<p>بايثون ترسل هيكل SQL والقيمة <b>منفصلين</b> (يمنع حقن SQL). الفاصلة في النهاية تصنع tuple بعنصر واحد؛ لا تنصّص <code>%s</code>؛ غيّر القيمة لا هيكل SQL.</p>
<h3>D7: سجل مؤقت بقيود</h3>
<pre>CREATE TEMP TABLE day02_requests (
  request_id integer PRIMARY KEY,
  category text NOT NULL,
  status text NOT NULL CHECK (status IN ('OPEN','CLOSED')),
  priority integer NOT NULL CHECK (priority BETWEEN 1 AND 3));
-- البيانات: (101,'PATROL SUPPORT','OPEN',2), (102,'TRAFFIC SUPPORT','OPEN',1), (103,'RECORD REVIEW','CLOSED',3)</pre>
<p>الجدول المؤقت يخص <b>جلسة/اتصالاً واحداً</b> ويختفي عند إغلاق الاتصال، والاتصال الجديد لا يرى جدول اتصال آخر (أعد تشغيل الخلية كاملة عند "relation missing"). ولا يغيّر training.crimes أو training.crashes.</p>
<h3>D8: عمليات CRUD مع دليل (RETURNING)</h3>
<table><tr><th>العملية</th><th>SQL</th><th>الدليل</th></tr>
<tr><td>إنشاء</td><td>INSERT 104 'TRAINING REVIEW' OPEN 2</td><td>المعرّف المرجَع [104]</td></tr>
<tr><td>قراءة</td><td>SELECT request_id, status WHERE request_id = 104</td><td>المفتاح والحالة الحالية</td></tr>
<tr><td>تحديث</td><td>UPDATE … SET status='CLOSED' WHERE request_id=104 AND status='OPEN' RETURNING request_id, status</td><td>[{104, CLOSED}]</td></tr>
<tr><td>تكرار التحديث</td><td>نفس UPDATE المشروط</td><td>[] — صفر صفوف (مغلق مسبقاً)</td></tr>
<tr><td>حذف</td><td>DELETE … WHERE request_id=104 AND status='CLOSED' RETURNING request_id</td><td>[104]</td></tr></table>
<p><code>RETURNING</code> يوضح بالضبط أي الصفوف تغيّرت. الشروط المحمية (المفتاح <b>و</b>الحالة المتوقعة) تغيّر الصف المقصود فقط. صفر صفوف متأثرة نتيجة صالحة — افحص المعرّف والحالة قبل اعتباره فشلاً، وهو يختلف عن جملة <b>مرفوضة</b>.</p>
<h3>D9–D10: المعاملات والتراجع</h3>
<p>داخل معاملة واحدة: إغلاق الطلب 101 ثم إدخال مفتاح مكرر 102 ← <b>UniqueViolation</b> ← تتراجع الدفعة كاملة ويبقى 101 مفتوحاً OPEN. التقط الاستثناء <b>خارج</b> كتلة المعاملة وقارن كل الصفوف قبل وبعد — الرسالة المطبوعة ليست دليلاً. تعيين الأولوية إلى 9 يخالف CHECK ← <b>CheckViolation</b> ← تبقى الصفوف الأصلية. التغيير المرفوض سلوك متوقع وليس سبباً لحذف القيد. بعد معاملة فاشلة اتركها تتراجع قبل الاستعلام مجدداً.</p>
<h3>التمارين والمهمة اليومية</h3>
<ul><li>E1: BATTERY أو DAMAGE في الحي 02، ترتيب بـ id، حتى 7 صفوف.</li>
<li>E2: حوادث فبراير 2025 (بداية مشمولة ونهاية مارس غير مشمولة)، ترتيب بـ crash_date ثم id، حتى 6.</li>
<li>E3: إصابات مجهولة أو صفر مع إبقاء NULL، حتى 8.</li>
<li>E4 (20 درجة): UPDATE بمعاملات يضبط الأولوية 3 للطلب 101 فقط إذا كان OPEN — العناصر النائبة بالترتيب (الأولوية الجديدة، المعرّف)، و RETURNING request_id, priority، وبقية القيم لا تتغير.</li>
<li>E5 (10 درجات): لماذا بقي 101 مفتوحاً، وأين يُلتقط الاستثناء، ولماذا صفر صفوف متأثرة يختلف عن جملة مرفوضة.</li>
<li>المهمة اليومية (25): أحدث خمسة حوادث في الربع الأول 2025 بإصابات معروفة ≥ 2 (الأحدث أولاً والتعادل بالمعرّف تصاعدياً)؛ أغلق الطلب 102 فقط إذا كان OPEN وتحقق من تغيير واحد بالضبط؛ اشرح حدود الوقت ومعالجة NULL وقيود العينة.</li></ul>
<p>في النهاية يجب ألا يتغير عدد صفوف الجداول المشتركة. القيود والشروط الدقيقة وفحوص المعاملات أهم من حفظ الصياغة.</p>`}
);

SECTIONS.push(
{id:"s15", unit:"u4", en:"Aggregation, Denominators & CTEs", ar:"التجميع والمقامات و CTE",
en_body:`
<p><b>Outcomes:</b> distinguish row counts from observed-value counts, filter groups, define a defensible percentage denominator (Lab 1); use CTEs and derived tables to combine crash, vehicle and person measures at a consistent grain (Lab 2). Each day: 30 min concepts → Lab 1 (90) → 30 min review/second concept → Lab 2 (90). The notebooks keep <b>one connection open</b> so temporary tables survive between cells; the final cell closes it and removes temp objects. Shared training tables are read-only through <code>query()</code>; the <code>work()</code> helper is used only for session-local teaching objects.</p>
<h3>Lab 1 fixture</h3>
<pre>departments: (1,'Intake'), (2,'Records'), (3,'Training')
requests(request_id, department_id REFERENCES departments, status CHECK IN ('OPEN','CLOSED'),
         minutes CHECK BETWEEN 0 AND 120, created_at, closed_at CHECK closed_at &gt;= created_at)
R01 dept1 OPEN   NULL  2025-01-01
R02 dept1 CLOSED 30    2025-01-31 23:59  closed 2025-02-02
R03 dept2 CLOSED 0     2025-02-01        closed 2025-02-01
R04 dept2 OPEN   NULL  2025-02-12
R05 dept2 CLOSED 120   2025-03-01        closed 2025-03-03</pre>
<h3>Aggregate functions answer a defined group question</h3>
<pre>SELECT COUNT(*) AS requests, COUNT(minutes) AS observed, AVG(minutes) AS mean_minutes
FROM pg_temp.requests;                       -- 5, 3, 50.0</pre>
<p><code>COUNT(*)</code> counts rows; <code>COUNT(column)</code> counts <b>non-NULL</b> values; <code>SUM</code> and <code>AVG</code> ignore NULL. Three observed durations (30, 0, 120) → mean = 150 / 3 = <b>50</b>; the valid zero counts. Replacing unknowns with zero (150 / 5 = 30) changes the question and lowers the mean incorrectly. An average over missing durations is not an average over all requests.</p>
<h3>GROUP BY, WHERE, HAVING, ORDER BY</h3>
<p><code>GROUP BY</code> collapses records into one row per group (changes the grain). <code>WHERE</code> filters source rows <b>before</b> grouping; <code>HAVING</code> tests groups <b>after</b> aggregates exist; <code>ORDER BY</code> only sets presentation order.</p>
<pre>SELECT department_id, COUNT(*) AS requests FROM pg_temp.requests
GROUP BY department_id HAVING COUNT(*) &gt;= 3 ORDER BY department_id;   -- (2, 3)
SELECT d.name, COUNT(r.request_id) AS requests
FROM pg_temp.departments d LEFT JOIN pg_temp.requests r USING (department_id)
GROUP BY d.department_id, d.name ORDER BY d.department_id;   -- Intake 2, Records 3, Training 0</pre>
<p>The <code>LEFT JOIN</code> preserves the empty department; count the <b>child key</b> — <code>COUNT(*)</code> after a LEFT JOIN would count the NULL-extended row as 1. A plotted total is a record count, not a risk score.</p>
<h3>Conditional counts and guarded percentages</h3>
<pre>SELECT COUNT(*) AS requests, COUNT(*) FILTER (WHERE status='CLOSED') AS closed
FROM pg_temp.requests;                              -- 5, 3
SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status='CLOSED')
             / NULLIF(COUNT(*), 0), 1) AS closed_pct
FROM pg_temp.requests;                              -- 60.0</pre>
<p><code>FILTER</code> applies to one aggregate only; others keep the full input. <code>100.0</code> (numeric) prevents integer truncation; <code>NULLIF(x, 0)</code> turns an empty denominator into NULL, so an <b>empty cohort gives an undefined percentage, not 0%</b> (Training: zero count, undefined %). The completion share = currently CLOSED requests ÷ all requests in a declared creation cohort; February 2025 → 1/2 = 50%. It doesn't measure turnaround time, response time, quality or effectiveness.</p>
<p class="ex">Lab 1 tasks: departments with at least two requests; closed count for every department including zero; observed and mean minutes for department 2 (keep the observed zero); February 2025 requests and closed_pct to one decimal. Daily Task: present volumes and the February share, stating numerator, denominator, snapshot condition and missing-value policy.</p>
<h3>Lab 2: child aggregates without double counting</h3>
<p>A crash can have several vehicles and several people. Joining both children directly creates <b>combinations</b>: 2 vehicles × 3 people = <b>6 rows</b> for one crash (<code>WITH v(unit) AS (VALUES (1),(2)), p(person) AS (VALUES (1),(2),(3)) SELECT COUNT(*) FROM v CROSS JOIN p</code> → 6), repeating crash measures. <code>DISTINCT</code> on injury totals (or <code>SUM(DISTINCT injuries_total)</code>) is <b>not</b> a valid repair — equal numbers may belong to different crashes. Aggregate each child <b>separately to one row per crash</b>, then join:</p>
<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles FROM training.vehicles GROUP BY crash_record_id),
     p AS (SELECT crash_record_id, COUNT(*) AS people   FROM training.people   GROUP BY crash_record_id)
SELECT c.crash_record_id, COALESCE(v.vehicles, 0) AS vehicles, COALESCE(p.people, 0) AS people
FROM training.crashes c
LEFT JOIN v USING (crash_record_id)
LEFT JOIN p USING (crash_record_id)
ORDER BY c.crash_record_id;

-- derived-table alternative (a subquery in FROM needs an alias)
SELECT c.crash_record_id, COALESCE(v.n, 0) AS vehicles
FROM training.crashes c
LEFT JOIN (SELECT crash_record_id, COUNT(*) AS n FROM training.vehicles GROUP BY crash_record_id) v
USING (crash_record_id);

SELECT COUNT(*) AS crashes, COUNT(injuries_total) AS observed, SUM(injuries_total) AS injuries
FROM training.crashes;                 -- crash-level observed injuries</pre>
<p>A <b>CTE</b> (<code>WITH</code>) names a query stage that lasts for <b>one statement</b>; it improves readability but is not automatically a performance optimization. A <b>derived table</b> expresses the same stage inline with its own grain. A <b>scalar subquery</b> supplies one value, e.g. <code>WHERE injuries_total &gt; (SELECT AVG(injuries_total) FROM training.crashes)</code>. <code>COALESCE</code> fills missing <b>child counts</b> with 0 (no matching child records) — never unknown injury observations. Validate one row per crash (unique keys), the preserved parent count and reconciled child totals against the source tables.</p>
<p>Source-district comparison: <code>SELECT COALESCE(district,'UNKNOWN') AS source_district, COUNT(*) ... GROUP BY 1</code> and reconcile the sum with the crimes count. A source district label differs from a later geometric (spatial) assignment — don't treat them as interchangeable.</p>
<p class="ex">Lab 2 tasks: vehicles and people for all crashes from separate aggregates; crashes with at least two vehicle rows; vehicle_rows and person_rows by summing the aggregated counts after the join; crashes with injuries above the observed average (scalar subquery, limit 10). Rubric for each lab: SQL correctness 40, validation 25, interpretation 20, reproducibility & data minimization 15. Close with one correct conclusion, one limitation and one next check.</p>`,
ar_body:`
<p><b>المخرجات:</b> التمييز بين عدد الصفوف وعدد القيم الملاحظة، وتصفية المجموعات، وتحديد مقام نسبة يمكن الدفاع عنه (المعمل 1)؛ واستخدام CTE والجداول المشتقة لدمج قياسات الحوادث والمركبات والأشخاص على مستوى ثابت (المعمل 2). كل يوم: 30 دقيقة مفاهيم ← المعمل 1 (90) ← 30 دقيقة مراجعة ومفهوم ثانٍ ← المعمل 2 (90). الدفاتر تُبقي <b>اتصالاً واحداً مفتوحاً</b> لتبقى الجداول المؤقتة بين الخلايا، والخلية الأخيرة تغلقه وتحذف الكائنات المؤقتة. الجداول المشتركة للقراءة فقط عبر <code>query()</code>، و <code>work()</code> للكائنات التعليمية المحلية فقط.</p>
<h3>بيانات المعمل 1</h3>
<pre>departments: (1,'Intake'), (2,'Records'), (3,'Training')
requests(request_id, department_id REFERENCES departments, status CHECK IN ('OPEN','CLOSED'),
         minutes CHECK BETWEEN 0 AND 120, created_at, closed_at CHECK closed_at &gt;= created_at)
R01 dept1 OPEN   NULL  2025-01-01
R02 dept1 CLOSED 30    2025-01-31 23:59  closed 2025-02-02
R03 dept2 CLOSED 0     2025-02-01        closed 2025-02-01
R04 dept2 OPEN   NULL  2025-02-12
R05 dept2 CLOSED 120   2025-03-01        closed 2025-03-03</pre>
<h3>دوال التجميع تجيب سؤالاً محدداً عن المجموعة</h3>
<pre>SELECT COUNT(*) AS requests, COUNT(minutes) AS observed, AVG(minutes) AS mean_minutes
FROM pg_temp.requests;                       -- 5, 3, 50.0</pre>
<p><code>COUNT(*)</code> يعدّ الصفوف، و <code>COUNT(column)</code> يعدّ القيم <b>غير الفارغة</b>، و <code>SUM</code> و <code>AVG</code> يتجاهلان NULL. ثلاث مدد ملاحظة (30 و 0 و 120) ← المتوسط = 150 ÷ 3 = <b>50</b>؛ والصفر الصالح محسوب. استبدال المجهول بصفر (150 ÷ 5 = 30) يغيّر السؤال ويخفض المتوسط خطأً. متوسط المدد الملاحظة ليس متوسطاً لكل الطلبات.</p>
<h3>GROUP BY و WHERE و HAVING و ORDER BY</h3>
<p><code>GROUP BY</code> يختصر السجلات لصف لكل مجموعة (يغيّر المستوى). <code>WHERE</code> يصفّي الصفوف <b>قبل</b> التجميع، و <code>HAVING</code> يختبر المجموعات <b>بعد</b> حساب التجميعات، و <code>ORDER BY</code> لترتيب العرض فقط.</p>
<pre>SELECT department_id, COUNT(*) AS requests FROM pg_temp.requests
GROUP BY department_id HAVING COUNT(*) &gt;= 3 ORDER BY department_id;   -- (2, 3)
SELECT d.name, COUNT(r.request_id) AS requests
FROM pg_temp.departments d LEFT JOIN pg_temp.requests r USING (department_id)
GROUP BY d.department_id, d.name ORDER BY d.department_id;   -- Intake 2, Records 3, Training 0</pre>
<p><code>LEFT JOIN</code> يحفظ القسم الفارغ؛ عُدّ <b>مفتاح الابن</b> — لأن <code>COUNT(*)</code> بعد LEFT JOIN يعدّ الصف الممدود بـ NULL كواحد. المجموع المرسوم عدد سجلات وليس مؤشر خطر.</p>
<h3>العدّ المشروط والنسب المحمية</h3>
<pre>SELECT COUNT(*) AS requests, COUNT(*) FILTER (WHERE status='CLOSED') AS closed
FROM pg_temp.requests;                              -- 5, 3
SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status='CLOSED')
             / NULLIF(COUNT(*), 0), 1) AS closed_pct
FROM pg_temp.requests;                              -- 60.0</pre>
<p><code>FILTER</code> ينطبق على تجميع واحد فقط والبقية تأخذ كل المدخلات. <code>100.0</code> (عشري) يمنع قطع القسمة الصحيحة، و <code>NULLIF(x, 0)</code> يجعل المقام الفارغ NULL، فـ<b>المجموعة الفارغة تعطي نسبة غير معرّفة لا 0%</b> (Training: عدد صفر ونسبة غير معرّفة). نسبة الإنجاز = الطلبات المغلقة حالياً ÷ كل طلبات مجموعة إنشاء محددة؛ فبراير 2025 ← 1/2 = 50%. لا تقيس زمن الإنجاز أو الاستجابة أو الجودة أو الفعالية.</p>
<p class="ex">مهام المعمل 1: الأقسام التي لها طلبان على الأقل؛ عدد المغلق لكل قسم بما فيها الصفر؛ عدد الملاحظ ومتوسط الدقائق للقسم 2 (مع إبقاء الصفر الملاحظ)؛ طلبات فبراير 2025 و closed_pct بمنزلة عشرية. المهمة اليومية: اعرض الأحجام ونسبة فبراير مع ذكر البسط والمقام وشرط اللقطة وسياسة القيم المفقودة.</p>
<h3>المعمل 2: تجميع الأبناء بدون عدّ مكرر</h3>
<p>الحادث قد يضم عدة مركبات وعدة أشخاص. ربط الجدولين الابنين مباشرة يصنع <b>تركيبات</b>: مركبتان × 3 أشخاص = <b>6 صفوف</b> لحادث واحد (<code>WITH v(unit) AS (VALUES (1),(2)), p(person) AS (VALUES (1),(2),(3)) SELECT COUNT(*) FROM v CROSS JOIN p</code> ← 6) تكرر قياسات الحادث. <code>DISTINCT</code> على الإصابات (أو <code>SUM(DISTINCT injuries_total)</code>) <b>ليس</b> حلاً صحيحاً — الأرقام المتساوية قد تخص حوادث مختلفة. جمّع كل جدول ابن <b>منفصلاً إلى صف لكل حادث</b> ثم اربط:</p>
<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles FROM training.vehicles GROUP BY crash_record_id),
     p AS (SELECT crash_record_id, COUNT(*) AS people   FROM training.people   GROUP BY crash_record_id)
SELECT c.crash_record_id, COALESCE(v.vehicles, 0) AS vehicles, COALESCE(p.people, 0) AS people
FROM training.crashes c
LEFT JOIN v USING (crash_record_id)
LEFT JOIN p USING (crash_record_id)
ORDER BY c.crash_record_id;

-- بديل الجدول المشتق (الاستعلام الفرعي في FROM يحتاج اسماً مستعاراً)
SELECT c.crash_record_id, COALESCE(v.n, 0) AS vehicles
FROM training.crashes c
LEFT JOIN (SELECT crash_record_id, COUNT(*) AS n FROM training.vehicles GROUP BY crash_record_id) v
USING (crash_record_id);

SELECT COUNT(*) AS crashes, COUNT(injuries_total) AS observed, SUM(injuries_total) AS injuries
FROM training.crashes;                 -- الإصابات الملاحظة على مستوى الحادث</pre>
<p><b>CTE</b> (<code>WITH</code>) تسمّي مرحلة استعلام تدوم <b>لجملة واحدة</b>؛ تحسّن القراءة لكنها ليست تحسيناً للأداء تلقائياً. <b>الجدول المشتق</b> يعبّر عن نفس المرحلة داخل الاستعلام بمستواه الخاص. <b>الاستعلام الفرعي القياسي</b> يعطي قيمة واحدة، مثل <code>WHERE injuries_total &gt; (SELECT AVG(injuries_total) FROM training.crashes)</code>. <code>COALESCE</code> يملأ <b>أعداد الأبناء</b> المفقودة بصفر (لا توجد سجلات ابن) — وليس ملاحظات الإصابة المجهولة. تحقق من صف واحد لكل حادث (مفاتيح فريدة)، وحفظ عدد الآباء، ومطابقة مجاميع الأبناء مع الجداول المصدر.</p>
<p>مقارنة أحياء المصدر: <code>SELECT COALESCE(district,'UNKNOWN') AS source_district, COUNT(*) ... GROUP BY 1</code> ثم طابق المجموع مع عدد الجرائم. تسمية الحي في المصدر تختلف عن الإسناد المكاني اللاحق — لا تعاملهما كشيء واحد.</p>
<p class="ex">مهام المعمل 2: المركبات والأشخاص لكل الحوادث من تجميعين منفصلين؛ الحوادث التي فيها صفا مركبات على الأقل؛ vehicle_rows و person_rows بجمع الأعداد المجمّعة بعد الربط؛ الحوادث بإصابات فوق المتوسط الملاحظ (استعلام فرعي قياسي، حد 10). تقييم كل معمل: صحة SQL 40، التحقق 25، التفسير 20، قابلية التكرار وتقليل البيانات 15. اختم باستنتاج صحيح وقيد واحد وفحص تالٍ.</p>`}
);

{id:"s16", unit:"u4", en:"Time Series & Window Functions", ar:"السلاسل الزمنية ودوال النوافذ",
en_body:`
<p><b>Outcomes:</b> create missing periods and calculate previous values, running totals and explicit moving windows (Lab 1); apply window methods to the traffic sample, reconcile monthly totals and distinguish rank from row number (Lab 2). Prerequisites: Day 01 GROUP BY, CTEs, NULL and denominators. These are <b>descriptive</b> calculations, not forecasting models.</p>
<h3>Aggregate vs window</h3>
<p>An aggregate <b>reduces</b> observations to one row per month. A <b>window function</b> keeps those rows and adds a cross-row calculation. <code>ORDER BY</code> inside <code>OVER</code> defines the calculation order; the outer ORDER BY sets display order. <code>PARTITION BY</code> starts a separate calculation for each entity (series). A <code>ROWS</code> frame counts <b>physical rows</b>, so build a complete calendar before calling three rows "three months" — ROWS is not elapsed time on an incomplete calendar.</p>
<h3>Lab 1: a complete request calendar</h3>
<pre>SELECT DATE_TRUNC('month', created_at)::date AS month, COUNT(*) AS requests
FROM pg_temp.requests GROUP BY 1 ORDER BY 1;          -- [2, 2, 1]  (April absent)

CREATE TEMP VIEW request_months AS
SELECT m::date AS month, COUNT(r.request_id) AS requests
FROM generate_series(timestamp '2025-01-01', timestamp '2025-04-01', interval '1 month') m
LEFT JOIN pg_temp.requests r
  ON r.created_at &gt;= m AND r.created_at &lt; m + interval '1 month'
GROUP BY m;                                            -- [2, 2, 1, 0]  (April = 0)</pre>
<p><code>DATE_TRUNC('month', ...)</code> creates a month label; <code>generate_series</code> builds every month so April appears as 0. In this complete fixture April is a true zero, but in a partial operational feed an unobserved month may mean <b>missing coverage</b> — an empty month is zero only when coverage is established.</p>
<pre>LAG(requests) OVER (ORDER BY month)                                      -- previous: NULL, 2, 2, 1
SUM(requests) OVER (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)   -- 2, 4, 5, 5
ROUND(AVG(requests) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) -- 2, 2, 1.67, 1</pre>
<p>LAG looks at the previous ordered row; the first month has no predecessor (NULL). A running SUM uses <code>UNBOUNDED PRECEDING</code>. The trailing 3-row mean: early rows use the available one or two months; March = 5/3 = 1.67, April = 3/3 = 1 — smoothing, not a forecast.</p>
<p><b>Filter placement:</b> to show March onward while keeping February as LAG's predecessor, compute the window in a <b>CTE</b> and filter its result. Filtering March first removes February from the window and changes the comparison population, even though the displayed dates look the same.</p>
<p class="ex">Lab 1 tasks: month and delta vs prior month (first NULL); trailing two-row mean_2; cumulative for all four months; LAG over the full calendar in a CTE, then only March and April.</p>
<h3>Lab 2: traffic trends and tied rankings</h3>
<pre>CREATE TEMP VIEW traffic_months AS
SELECT m::date AS month, COUNT(c.crash_record_id) AS crashes
FROM generate_series(timestamp '2025-01-01', timestamp '2025-12-01', interval '1 month') m
LEFT JOIN training.crashes c ON c.crash_date &gt;= m AND c.crash_date &lt; m + interval '1 month'
GROUP BY m;                                    -- 12 rows

SELECT month, crashes,
  RANK()       OVER (ORDER BY crashes DESC) AS rank,
  DENSE_RANK() OVER (ORDER BY crashes DESC) AS dense_rank,
  ROW_NUMBER() OVER (ORDER BY crashes DESC, month) AS position
FROM pg_temp.traffic_months;

WITH w AS (SELECT month, crashes, LAG(crashes) OVER (ORDER BY month) AS previous
           FROM pg_temp.traffic_months)
SELECT month, ROUND(100.0 * (crashes - previous) / NULLIF(previous, 0), 2) AS pct_change
FROM w;                                        -- zero predecessor → undefined %

WITH w AS (SELECT month, crashes, ROW_NUMBER() OVER (ORDER BY crashes DESC, month) AS position
           FROM pg_temp.traffic_months)
SELECT month, crashes, position FROM w WHERE position &lt;= 3 ORDER BY position;</pre>
<table><tr><th>Function</th><th>Ties</th><th>Values for 10, 8, 8, 5</th></tr>
<tr><td>RANK</td><td>equal values share a rank, then gaps</td><td>1, 2, 2, 4</td></tr>
<tr><td>DENSE_RANK</td><td>shared rank, no gaps</td><td>1, 2, 2, 3</td></tr>
<tr><td>ROW_NUMBER</td><td>distinct positions</td><td>1, 2, 3, 4</td></tr></table>
<p>Rank by the <b>measure alone</b> to keep ties (don't add a secondary key to DENSE_RANK if equal measures should stay tied). Use a stable tie-breaker (month) with ROW_NUMBER to select <b>exactly three</b> rows reproducibly. "Exactly three months" and "every month tied at the top" answer different questions — a top rank can contain more than one month. <code>crashes - LAG(crashes)</code> gives the monthly delta (first NULL); guard percentage change with <code>NULLIF(previous, 0)</code>.</p>
<p><b>Reconciliation:</b> month counts are compared with an independent Python grouping of raw timestamps (<code>dt.to_period('M').value_counts().reindex(..., fill_value=0)</code>), and the final cumulative value must equal the annual source count. Synthetic quota sampling can create flat counts and ties — such patterns demonstrate SQL behavior, not real changes in crime, traffic demand or staffing; a quota sample doesn't permit growth-rate conclusions about the city. Timestamps are <code>timestamp without time zone</code>: don't silently convert to UTC; an operational design would first establish the source time zone and daylight-saving policy.</p>
<p class="ex">Lab 2 tasks: exactly three months by ROW_NUMBER (crashes desc, then month); every month tied at the highest count via DENSE_RANK in a CTE; trailing three-row mean_3; LAG on all 12 months, then July–December only. Daily Task: a traffic time chart with two top-month definitions, explaining the ranking choice, calendar coverage, first-period NULL and the sampling limitation.</p>`,
ar_body:`
<p><b>المخرجات:</b> إنشاء الفترات الناقصة وحساب القيم السابقة والمجاميع التراكمية والنوافذ المتحركة الصريحة (المعمل 1)؛ وتطبيق النوافذ على عينة المرور ومطابقة المجاميع الشهرية والتمييز بين الرتبة ورقم الصف (المعمل 2). المتطلبات: GROUP BY و CTE و NULL والمقامات من اليوم 01. هذه حسابات <b>وصفية</b> وليست نماذج تنبؤ.</p>
<h3>التجميع مقابل النافذة</h3>
<p>التجميع <b>يختصر</b> الملاحظات إلى صف لكل شهر. أما <b>دالة النافذة</b> فتحتفظ بالصفوف وتضيف حساباً عبرها. <code>ORDER BY</code> داخل <code>OVER</code> يحدد ترتيب الحساب، والـ ORDER BY الخارجي يحدد ترتيب العرض. <code>PARTITION BY</code> يبدأ حساباً مستقلاً لكل كيان (سلسلة). إطار <code>ROWS</code> يعدّ <b>صفوفاً فعلية</b>، لذلك ابنِ تقويماً كاملاً قبل اعتبار ثلاثة صفوف "ثلاثة أشهر" — ROWS ليس زمناً منقضياً في تقويم ناقص.</p>
<h3>المعمل 1: تقويم طلبات كامل</h3>
<pre>SELECT DATE_TRUNC('month', created_at)::date AS month, COUNT(*) AS requests
FROM pg_temp.requests GROUP BY 1 ORDER BY 1;          -- [2, 2, 1]  (أبريل غائب)

CREATE TEMP VIEW request_months AS
SELECT m::date AS month, COUNT(r.request_id) AS requests
FROM generate_series(timestamp '2025-01-01', timestamp '2025-04-01', interval '1 month') m
LEFT JOIN pg_temp.requests r
  ON r.created_at &gt;= m AND r.created_at &lt; m + interval '1 month'
GROUP BY m;                                            -- [2, 2, 1, 0]  (أبريل = 0)</pre>
<p><code>DATE_TRUNC('month', ...)</code> يصنع تسمية الشهر، و <code>generate_series</code> يبني كل الأشهر فيظهر أبريل بصفر. في هذه البيانات الكاملة أبريل صفر حقيقي، لكن في مصدر تشغيلي ناقص قد يعني الشهر غير الملاحظ <b>نقص تغطية</b> — الشهر الفارغ صفر فقط إذا ثبتت التغطية.</p>
<pre>LAG(requests) OVER (ORDER BY month)                                      -- السابق: NULL, 2, 2, 1
SUM(requests) OVER (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)   -- 2, 4, 5, 5
ROUND(AVG(requests) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) -- 2, 2, 1.67, 1</pre>
<p>LAG تنظر للصف السابق بالترتيب، والشهر الأول ليس له سابق (NULL). المجموع التراكمي يستخدم <code>UNBOUNDED PRECEDING</code>. متوسط آخر 3 صفوف: الصفوف الأولى تستخدم الشهر أو الشهرين المتاحين؛ مارس = 5/3 = 1.67 وأبريل = 3/3 = 1 — تنعيم وليس تنبؤاً.</p>
<p><b>مكان التصفية:</b> لعرض مارس فما بعد مع بقاء فبراير سابقاً لـ LAG، احسب النافذة داخل <b>CTE</b> ثم صفِّ نتيجتها. تصفية مارس أولاً تحذف فبراير من النافذة وتغيّر مجتمع المقارنة رغم أن التواريخ المعروضة تبدو نفسها.</p>
<p class="ex">مهام المعمل 1: الشهر والفرق عن السابق (الأول NULL)؛ متوسط آخر صفين mean_2؛ التراكمي للأشهر الأربعة؛ LAG على التقويم الكامل في CTE ثم مارس وأبريل فقط.</p>
<h3>المعمل 2: اتجاهات المرور والترتيب مع التعادل</h3>
<pre>CREATE TEMP VIEW traffic_months AS
SELECT m::date AS month, COUNT(c.crash_record_id) AS crashes
FROM generate_series(timestamp '2025-01-01', timestamp '2025-12-01', interval '1 month') m
LEFT JOIN training.crashes c ON c.crash_date &gt;= m AND c.crash_date &lt; m + interval '1 month'
GROUP BY m;                                    -- 12 صفاً

SELECT month, crashes,
  RANK()       OVER (ORDER BY crashes DESC) AS rank,
  DENSE_RANK() OVER (ORDER BY crashes DESC) AS dense_rank,
  ROW_NUMBER() OVER (ORDER BY crashes DESC, month) AS position
FROM pg_temp.traffic_months;

WITH w AS (SELECT month, crashes, LAG(crashes) OVER (ORDER BY month) AS previous
           FROM pg_temp.traffic_months)
SELECT month, ROUND(100.0 * (crashes - previous) / NULLIF(previous, 0), 2) AS pct_change
FROM w;                                        -- السابق صفر ← نسبة غير معرّفة

WITH w AS (SELECT month, crashes, ROW_NUMBER() OVER (ORDER BY crashes DESC, month) AS position
           FROM pg_temp.traffic_months)
SELECT month, crashes, position FROM w WHERE position &lt;= 3 ORDER BY position;</pre>
<table><tr><th>الدالة</th><th>التعادل</th><th>القيم لـ 10، 8، 8، 5</th></tr>
<tr><td>RANK</td><td>القيم المتساوية تشترك في الرتبة ثم فجوات</td><td>1، 2، 2، 4</td></tr>
<tr><td>DENSE_RANK</td><td>رتبة مشتركة بدون فجوات</td><td>1، 2، 2، 3</td></tr>
<tr><td>ROW_NUMBER</td><td>مواقع فريدة</td><td>1، 2، 3، 4</td></tr></table>
<p>رتّب حسب <b>المقياس وحده</b> لإبقاء التعادل (لا تضف مفتاحاً ثانياً لـ DENSE_RANK إذا أردت بقاء المتساويين متعادلين). استخدم فاصلاً ثابتاً (الشهر) مع ROW_NUMBER لاختيار <b>ثلاثة بالضبط</b> بشكل قابل للتكرار. "ثلاثة أشهر بالضبط" و"كل الأشهر المتعادلة في القمة" يجيبان سؤالين مختلفين — الرتبة الأولى قد تضم أكثر من شهر. و <code>crashes - LAG(crashes)</code> يعطي الفرق الشهري (الأول NULL)، واحمِ نسبة التغير بـ <code>NULLIF(previous, 0)</code>.</p>
<p><b>المطابقة:</b> أعداد الأشهر تُقارن بتجميع مستقل في بايثون للأوقات الخام (<code>dt.to_period('M').value_counts().reindex(..., fill_value=0)</code>)، والقيمة التراكمية الأخيرة يجب أن تساوي عدد المصدر السنوي. العينة المصطنعة بالحصص قد تصنع أعداداً متساوية وتعادلات — هذه الأنماط تعرض سلوك SQL لا تغيرات حقيقية في الجريمة أو الطلب المروري أو الاحتياج للعاملين، والعينة بالحصص لا تسمح باستنتاج معدلات نمو للمدينة. الأوقات من نوع <code>timestamp without time zone</code>: لا تحوّلها إلى UTC بصمت، والتصميم التشغيلي يحدد أولاً المنطقة الزمنية للمصدر وسياسة التوقيت الصيفي.</p>
<p class="ex">مهام المعمل 2: ثلاثة أشهر بالضبط بـ ROW_NUMBER (الحوادث تنازلياً ثم الشهر)؛ كل الأشهر المتعادلة في القمة عبر DENSE_RANK في CTE؛ متوسط آخر ثلاثة صفوف mean_3؛ LAG على 12 شهراً ثم يوليو–ديسمبر فقط. المهمة اليومية: رسم زمني للمرور مع تعريفين لأعلى شهر، وشرح اختيار الترتيب وتغطية التقويم و NULL الفترة الأولى وقيد العينة.</p>`}
);

{id:"s17", unit:"u4", en:"Views, Query Plans & Indexes", ar:"العروض وخطط الاستعلام والفهارس",
en_body:`
<p><b>Outcomes:</b> define a view, inspect its contract and build a category report with explicit observation denominators (Lab 1); read estimated and actual plans, add a local index and verify equivalent results <b>before</b> discussing speed (Lab 2). Prerequisites: aggregates, CTEs, date ranges, window interpretation.</p>
<h3>Views as reporting contracts</h3>
<p>A <b>normal view</b> stores a SELECT <b>definition</b> and runs against the current data each time it's queried — it is not a snapshot. A <b>materialized view</b> stores results and needs a refresh policy (today's labs use normal temporary views only). Reusing a view centralizes logic but doesn't automatically improve performance, doesn't make an incorrect denominator correct and doesn't inherently grant access. Distinguish <b>query reuse</b>, <b>result freshness</b> and <b>authorization</b>.</p>
<pre>CREATE TEMP VIEW crime_summary AS
SELECT COALESCE(primary_type, 'UNKNOWN') AS category,
       COUNT(*) AS records,
       COUNT(arrest) AS observed_arrest,                       -- known flags
       COUNT(*) FILTER (WHERE arrest IS TRUE) AS marked_arrest -- true flags
FROM training.crimes
WHERE date &gt;= '2025-01-01' AND date &lt; '2026-01-01'          -- year cohort is part of the contract
GROUP BY COALESCE(primary_type, 'UNKNOWN');

SELECT pg_get_viewdef('pg_temp.crime_summary'::regclass, true);  -- inspect the saved definition
SELECT category, records FROM pg_temp.crime_summary ORDER BY records DESC, category LIMIT 5;
SELECT category, ROUND(100.0 * marked_arrest / NULLIF(observed_arrest, 0), 2) AS marked_pct
FROM pg_temp.crime_summary;                                     -- per category, undefined → NULL
SELECT SUM(records), SUM(observed_arrest) FROM pg_temp.crime_summary;   -- reconcile with source</pre>
<p>Every category appears once (unique). A deterministic tie-breaker (<code>records DESC, category</code>) makes the top-five reproducible. The observed-flag percentage uses <b>known flags</b> as the denominator, not all records; missing flags stay visible as <code>records − observed_arrest</code>. The overall rate must <b>pool</b> numerator and denominator:</p>
<pre>SELECT ROUND(100.0 * SUM(marked_arrest) / NULLIF(SUM(observed_arrest), 0), 2) AS marked_pct
FROM pg_temp.crime_summary;</pre>
<p><b>Averaging category percentages</b> gives small and large groups equal weight — misleading. An arrest flag is a dataset attribute, not proof of guilt or a measure of enforcement effectiveness; quota-sampled category volumes don't establish real prevalence. A useful chart states its cohort, grain and missing values beside the number. The solution reconciles the view's totals with the source-year cohort independently (Python <code>fillna('UNKNOWN')</code>, <code>notna().sum()</code>).</p>
<p class="ex">Lab 1 tasks: category and records for every category; the three largest (records desc, then category); missing_flags = records − observed_arrest; overall pooled marked_pct (don't average). Daily Task: a reconciled category report with a denominator explanation, distinguishing reuse, freshness and authorization.</p>
<h3>Performance follows correctness</h3>
<pre>CREATE TEMP TABLE perf_crashes AS SELECT crash_record_id, crash_date, injuries_total FROM training.crashes;
ANALYZE pg_temp.perf_crashes;                                   -- collect statistics
EXPLAIN (FORMAT JSON) SELECT crash_record_id FROM pg_temp.perf_crashes
 WHERE crash_date &gt;= '2025-02-01' AND crash_date &lt; '2025-03-01';   -- estimated plan
-- baseline result saved (ORDER BY crash_record_id) to prove equivalence later
CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date); -- returns no rows
EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT ...;            -- executes; adds actual rows & buffers</pre>
<p>The experiment works on a <b>temporary copy</b> so the shared source stays intact. <code>EXPLAIN</code> describes the chosen plan with <b>estimates</b>; <code>EXPLAIN ANALYZE</code> <b>executes</b> the statement and adds actual observations — use SELECT-only experiments and never apply it casually to writes. Plan <b>costs are planner units, not milliseconds</b>; execution time is measured separately. A plan tree may include scans, filters, joins, aggregates and sorts; comparing estimated vs actual row counts reveals wrong selectivity assumptions. In JSON output the root has a <code>"Plan"</code> key, and ANALYZE adds <code>"Actual Rows"</code>.</p>
<p>A raw range on <code>crash_date</code> fits an ordinary <b>B-tree</b> index. Wrapping the column in <code>DATE_TRUNC('month', crash_date)</code> may need a matching <b>expression index</b>. The optimizer can reasonably choose a <b>sequential scan</b> for a small table or a broad result even when an index exists — not automatically a problem; don't force a plan for a preferred screenshot. Cache, statistics, selectivity and environment affect timings, so no fixed threshold or index-scan assertion is used. A performance claim needs repeated observations on the same environment, accounting for warm caches and network time, with a constant result contract; one local timing can't predict Neon classroom performance.</p>
<h3>Traffic dashboard from SQL</h3>
<pre>SELECT DATE_TRUNC('month', crash_date)::date AS month,
       COUNT(*) AS crashes, COUNT(injuries_total) AS observed,
       ROUND(AVG(injuries_total), 2) AS mean_injuries
FROM pg_temp.perf_crashes GROUP BY 1 ORDER BY 1;   -- 12 months; sum reconciles with the copy</pre>
<p>SQL computes the metrics; Python displays the table and chart. Keep the observation denominator visible. It complements the crime-category dashboard from Lab 1.</p>
<p class="ex">Lab 2 tasks: March IDs with a raw timestamp range; March IDs with DATE_TRUNC (compare, discuss index implications); the estimated JSON plan for the first (scan type, estimated rows); observed and injuries for March reconciled with the source. Daily Task: two equivalent March queries, their plan interpretation and a measured limitation with correctness evidence.</p>`,
ar_body:`
<p><b>المخرجات:</b> تعريف عرض وفحص عقده وبناء تقرير فئات بمقامات ملاحظة صريحة (المعمل 1)؛ وقراءة الخطط المقدّرة والفعلية وإضافة فهرس محلي والتحقق من تطابق النتائج <b>قبل</b> الحديث عن السرعة (المعمل 2). المتطلبات: التجميعات و CTE ونطاقات التاريخ وتفسير النوافذ.</p>
<h3>العروض كعقود للتقارير</h3>
<p><b>العرض العادي</b> يحفظ <b>تعريف</b> جملة SELECT ويعمل على البيانات الحالية في كل استعلام — ليس لقطة. و<b>العرض المادي</b> يحفظ النتائج ويحتاج سياسة تحديث (معامل اليوم تستخدم عروضاً مؤقتة عادية فقط). إعادة استخدام العرض توحّد المنطق لكنها لا تحسّن الأداء تلقائياً ولا تصحح مقاماً خاطئاً ولا تمنح صلاحية بذاتها. ميّز بين <b>إعادة استخدام الاستعلام</b> و<b>حداثة النتيجة</b> و<b>الصلاحيات</b>.</p>
<pre>CREATE TEMP VIEW crime_summary AS
SELECT COALESCE(primary_type, 'UNKNOWN') AS category,
       COUNT(*) AS records,
       COUNT(arrest) AS observed_arrest,                       -- العلامات المعروفة
       COUNT(*) FILTER (WHERE arrest IS TRUE) AS marked_arrest -- العلامات الصحيحة
FROM training.crimes
WHERE date &gt;= '2025-01-01' AND date &lt; '2026-01-01'          -- مجموعة السنة جزء من العقد
GROUP BY COALESCE(primary_type, 'UNKNOWN');

SELECT pg_get_viewdef('pg_temp.crime_summary'::regclass, true);  -- عرض التعريف المحفوظ
SELECT category, records FROM pg_temp.crime_summary ORDER BY records DESC, category LIMIT 5;
SELECT category, ROUND(100.0 * marked_arrest / NULLIF(observed_arrest, 0), 2) AS marked_pct
FROM pg_temp.crime_summary;                                     -- لكل فئة، غير المعرّف ← NULL
SELECT SUM(records), SUM(observed_arrest) FROM pg_temp.crime_summary;   -- مطابقة مع المصدر</pre>
<p>كل فئة تظهر مرة واحدة (فريدة). الفاصل الحتمي (<code>records DESC, category</code>) يجعل أعلى خمسة قابلة للتكرار. نسبة العلامات الملاحظة تستخدم <b>العلامات المعروفة</b> مقاماً لا كل السجلات، والعلامات المفقودة تبقى ظاهرة كـ <code>records − observed_arrest</code>. النسبة الكلية يجب أن <b>تجمع</b> البسط والمقام:</p>
<pre>SELECT ROUND(100.0 * SUM(marked_arrest) / NULLIF(SUM(observed_arrest), 0), 2) AS marked_pct
FROM pg_temp.crime_summary;</pre>
<p><b>متوسط نسب الفئات</b> يعطي المجموعات الصغيرة والكبيرة وزناً متساوياً — مضلل. علامة القبض خاصية في البيانات وليست دليل إدانة ولا مقياساً لفعالية الضبط، والأحجام المأخوذة بالحصص لا تثبت انتشاراً حقيقياً. الرسم المفيد يذكر المجموعة والمستوى والقيم المفقودة بجانب الرقم. الحل يطابق مجاميع العرض مع مجموعة السنة في المصدر بشكل مستقل (بايثون <code>fillna('UNKNOWN')</code> و <code>notna().sum()</code>).</p>
<p class="ex">مهام المعمل 1: الفئة والسجلات لكل فئة؛ أكبر ثلاث فئات (السجلات تنازلياً ثم الفئة)؛ missing_flags = records − observed_arrest؛ النسبة الكلية المجمّعة marked_pct (بدون متوسط النسب). المهمة اليومية: تقرير فئات مطابَق مع شرح المقام والتمييز بين إعادة الاستخدام والحداثة والصلاحيات.</p>
<h3>الأداء يأتي بعد الصحة</h3>
<pre>CREATE TEMP TABLE perf_crashes AS SELECT crash_record_id, crash_date, injuries_total FROM training.crashes;
ANALYZE pg_temp.perf_crashes;                                   -- جمع الإحصاءات
EXPLAIN (FORMAT JSON) SELECT crash_record_id FROM pg_temp.perf_crashes
 WHERE crash_date &gt;= '2025-02-01' AND crash_date &lt; '2025-03-01';   -- الخطة المقدّرة
-- حفظ النتيجة الأساسية (ORDER BY crash_record_id) لإثبات التطابق لاحقاً
CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date); -- لا يرجع صفوفاً
EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) SELECT ...;            -- ينفذ ويضيف الصفوف الفعلية والذاكرة</pre>
<p>التجربة على <b>نسخة مؤقتة</b> فيبقى المصدر المشترك سليماً. <code>EXPLAIN</code> يصف الخطة المختارة <b>بتقديرات</b>، و <code>EXPLAIN ANALYZE</code> <b>ينفذ</b> الجملة ويضيف القيم الفعلية — استخدم تجارب SELECT فقط ولا تطبقه عشوائياً على جمل الكتابة. <b>التكاليف وحدات للمخطط وليست أجزاء من الثانية</b>، وزمن التنفيذ يُقاس منفصلاً. شجرة الخطة قد تضم مسحاً وتصفية وربطاً وتجميعاً وترتيباً، ومقارنة الصفوف المقدّرة بالفعلية تكشف افتراضات الانتقائية الخاطئة. في مخرج JSON الجذر فيه مفتاح <code>"Plan"</code>، و ANALYZE يضيف <code>"Actual Rows"</code>.</p>
<p>نطاق خام على <code>crash_date</code> يناسب فهرس <b>B-tree</b> عادياً. تغليف العمود بـ <code>DATE_TRUNC('month', crash_date)</code> قد يحتاج <b>فهرس تعبير</b> مطابقاً. المخطط قد يختار <b>المسح التسلسلي</b> لجدول صغير أو نتيجة واسعة رغم وجود فهرس — ليس مشكلة بالضرورة؛ لا تفرض خطة من أجل لقطة مفضلة. الذاكرة المؤقتة والإحصاءات والانتقائية والبيئة تؤثر على الأزمنة، فلا يُستخدم حد ثابت ولا افتراض لمسح الفهرس. ادعاء الأداء يحتاج قياسات متكررة في نفس البيئة مع مراعاة الذاكرة الدافئة وزمن الشبكة وثبات عقد النتيجة؛ وقياس محلي واحد لا يتنبأ بأداء Neon في الفصل.</p>
<h3>لوحة المرور من SQL</h3>
<pre>SELECT DATE_TRUNC('month', crash_date)::date AS month,
       COUNT(*) AS crashes, COUNT(injuries_total) AS observed,
       ROUND(AVG(injuries_total), 2) AS mean_injuries
FROM pg_temp.perf_crashes GROUP BY 1 ORDER BY 1;   -- 12 شهراً، والمجموع يطابق النسخة</pre>
<p>SQL يحسب المقاييس وبايثون تعرض الجدول والرسم. أبقِ مقام الملاحظة ظاهراً. وهي تكمّل لوحة فئات الجرائم في المعمل 1.</p>
<p class="ex">مهام المعمل 2: معرّفات مارس بنطاق وقت خام؛ معرّفات مارس بـ DATE_TRUNC (قارن وناقش أثر الفهرس)؛ الخطة المقدّرة JSON للأول (نوع المسح والصفوف المقدّرة)؛ الملاحظ والإصابات لمارس مطابقة مع المصدر. المهمة اليومية: استعلاما مارس المتكافئان مع تفسير خطتهما وقيد مقاس ودليل صحة.</p>`}
);

{id:"s18", unit:"u4", en:"Spatial SQL with PostGIS", ar:"SQL المكاني مع PostGIS",
en_body:`
<p><b>Outcomes:</b> inspect geometry metadata, distinguish boundary predicates and preserve unmatched points in a deterministic assignment (Lab 1); measure proximity in metres, inspect a compatible GiST index and aggregate projected points into kilometre grid cells (Lab 2). Prerequisites: joins, aggregates, CTEs and index plans.</p>
<h3>PostGIS and coordinates</h3>
<p><b>PostGIS</b> extends PostgreSQL with spatial types and functions. The trainer verifies it with <code>SELECT PostGIS_Version();</code> and enables it in <code>police_training</code> with the instructor account before class — <b>learners don't create extensions</b>. For <b>EPSG:4326</b>, longitude is <b>X</b> and latitude is <b>Y</b>: <code>ST_MakePoint(lon, lat)</code>. <code>ST_SetSRID</code> <b>labels</b> coordinates with a reference system; <code>ST_Transform</code> <b>calculates</b> coordinates in another system. Swapping them gives plausible-looking but wrong results; a label alone can't repair swapped coordinates.</p>
<h3>Lab 1: point-to-zone assignment</h3>
<pre>CREATE TEMP TABLE demo_zones(zone text PRIMARY KEY, geom geometry(Polygon,4326));
INSERT INTO demo_zones VALUES
 ('A', ST_MakeEnvelope(-87.70,41.80,-87.65,41.85,4326)),
 ('B', ST_MakeEnvelope(-87.65,41.80,-87.60,41.85,4326));       -- share the edge at -87.65
CREATE TEMP TABLE demo_points(id int PRIMARY KEY, geom geometry(Point,4326));
-- 1 (-87.68,41.82) inside A | 2 (-87.65,41.82) on the shared edge | 3 (-87.55,41.90) outside | 4 NULL
SELECT id, ST_SRID(geom), ST_X(geom) AS longitude, ST_Y(geom) AS latitude FROM demo_points;
SELECT zone, ST_IsValid(geom) FROM demo_zones;                   -- validate before topology
SELECT p.id, z.zone FROM demo_points p JOIN demo_zones z ON ST_Covers(z.geom, p.geom);
-- (1,A), (2,A), (2,B)  → 3 matches for 4 points</pre>
<p><code>ST_Covers</code> <b>includes</b> boundaries, so the edge point 2 is covered by <b>both</b> adjacent zones; <code>ST_Contains</code> <b>excludes</b> a point lying only on the boundary. A higher match count doesn't mean more unique events. Invalid polygons can give misleading predicate results.</p>
<pre>SELECT p.id, z.zone
FROM demo_points p
LEFT JOIN LATERAL (
  SELECT zone FROM demo_zones z
  WHERE ST_Covers(z.geom, p.geom)
  ORDER BY zone LIMIT 1) z ON true
ORDER BY p.id;                       -- (1,A), (2,A), (3,NULL), (4,NULL)

WITH a AS (...same assignment...)
SELECT COUNT(*) AS points, COUNT(zone) AS assigned,
       COUNT(*) FILTER (WHERE zone IS NULL) AS unmatched FROM a;   -- 4, 2, 2</pre>
<p>The declared tie rule (alphabetically first zone) keeps <b>one row per point</b>; it's a teaching policy, not an official jurisdiction rule — any single-zone rule must be declared. <code>LEFT JOIN</code> keeps unmatched points. Report <b>outside coverage</b> (point 3) and <b>missing coordinates</b> (point 4) separately; a boundary tie must not silently duplicate a point or make it disappear. The fixture is drawn from SQL <code>ST_AsGeoJSON</code> (axes in degrees).</p>
<p class="ex">Lab 1 tasks: id and zone with ST_Contains; points with geometry but no covering zone; points with missing geometry; tie rule changed to the alphabetically LAST zone. Daily Task: present assignment, coverage counts and boundary policy, distinguishing point 3 from point 4.</p>
<h3>Lab 2: distances and units</h3>
<p><b>Geography</b> distance is in <b>metres</b>; <b>geometry</b> distance uses its CRS units — on 4326 that's <b>degrees</b>, so a threshold of 500 on a 4326 geometry does not mean 500 m.</p>
<pre>CREATE TEMP TABLE distance_demo(id int PRIMARY KEY, geom geometry(Point,4326));
-- 1 (-87.65,41.82) anchor | 2 (-87.65,41.821) ~111 m north | 3 (-87.65,41.84) ~2.2 km north
SELECT id, ROUND(ST_Distance(geom::geography,
       ST_SetSRID(ST_MakePoint(-87.65,41.82),4326)::geography)::numeric, 1) AS metres
FROM distance_demo;                                  -- 0, ~111, ~2200
SELECT id FROM distance_demo
WHERE ST_DWithin(geom::geography, ST_SetSRID(ST_MakePoint(-87.65,41.82),4326)::geography, 500);  -- 1, 2
-- 150 m → 1, 2 ; 50 m → 1 only</pre>
<h3>Spatial index and proximity</h3>
<pre>CREATE TEMP TABLE spatial_crashes AS
  SELECT crash_record_id, geom, geom::geography AS geog FROM training.crashes WHERE geom IS NOT NULL;
CREATE INDEX spatial_crashes_geog_idx ON pg_temp.spatial_crashes USING gist(geog);
ANALYZE pg_temp.spatial_crashes;
SELECT crash_record_id, ROUND(ST_Distance(geog, anchor)::numeric, 1) AS metres
FROM pg_temp.spatial_crashes
WHERE ST_DWithin(geog, anchor, 5000)           -- 5 km
ORDER BY metres, crash_record_id LIMIT 10;</pre>
<p>A <b>GiST</b> index must match the queried expression — geometry and geography indexes are not interchangeable. <code>ST_DWithin</code> can use it; the plan (<code>EXPLAIN (FORMAT JSON)</code>) may still choose a sequential scan on a small sample. Check correctness first (e.g., compare ST_DWithin 5000 with explicit <code>ST_Distance &lt;= 5000</code>). The located count must equal crashes with non-NULL geometry.</p>
<h3>Kilometre grid</h3>
<pre>WITH p AS (SELECT ST_Transform(geom, 26916) AS g FROM pg_temp.spatial_crashes)
SELECT FLOOR(ST_X(g)/1000)::int AS gx, FLOOR(ST_Y(g)/1000)::int AS gy, COUNT(*) AS records
FROM p GROUP BY 1, 2 ORDER BY records DESC, gx, gy;</pre>
<p>Transform first to <b>EPSG:26916</b>, a metre-based local projection suitable for the Chicago example; divide X and Y by 1000 and take <code>FLOOR</code>. The grid origin follows that projection. A cell label is not a named district. Every located point belongs to exactly <b>one</b> cell, so cell counts sum to the located total (the reconciliation check). Cell size and origin change the picture; a grid count is a sampled observation volume, <b>not</b> a population-adjusted risk or density rate, and synthetic records can't support deployment decisions. Missing coordinates belong in the coverage note even though they can't appear on the map.</p>
<p class="ex">Lab 2 tasks: ids within 150 m; ids within 50 m; total_records by summing all 1 km cells (no limit); crashes within 5 km compared with ST_Distance ≤ 5000. Daily Task: a metre-based proximity query, its plan interpretation, a complete grid reconciliation and a CRS/coverage note.</p>`,
ar_body:`
<p><b>المخرجات:</b> فحص البيانات الوصفية للأشكال، والتمييز بين شروط الحدود، والإبقاء على النقاط غير المطابقة في إسناد حتمي (المعمل 1)؛ وقياس القرب بالأمتار، وفحص فهرس GiST متوافق، وتجميع النقاط المسقطة في خلايا كيلومترية (المعمل 2). المتطلبات: الربط والتجميع و CTE وخطط الفهارس.</p>
<h3>PostGIS والإحداثيات</h3>
<p><b>PostGIS</b> يضيف لـ PostgreSQL أنواعاً ودوالاً مكانية. المدرب يتحقق بـ <code>SELECT PostGIS_Version();</code> ويفعّلها في <code>police_training</code> بحساب المدرب قبل الدرس — <b>المتدرب لا ينشئ إضافات</b>. في <b>EPSG:4326</b> خط الطول هو <b>X</b> ودائرة العرض <b>Y</b>: <code>ST_MakePoint(lon, lat)</code>. <code>ST_SetSRID</code> <b>يوسم</b> الإحداثيات بنظام مرجعي، و <code>ST_Transform</code> <b>يحسب</b> الإحداثيات في نظام آخر. الخلط بينهما يعطي نتائج تبدو معقولة لكنها خاطئة، والوسم وحده لا يصلح إحداثيات معكوسة.</p>
<h3>المعمل 1: إسناد النقاط للمناطق</h3>
<pre>CREATE TEMP TABLE demo_zones(zone text PRIMARY KEY, geom geometry(Polygon,4326));
INSERT INTO demo_zones VALUES
 ('A', ST_MakeEnvelope(-87.70,41.80,-87.65,41.85,4326)),
 ('B', ST_MakeEnvelope(-87.65,41.80,-87.60,41.85,4326));       -- يشتركان في الضلع عند -87.65
CREATE TEMP TABLE demo_points(id int PRIMARY KEY, geom geometry(Point,4326));
-- 1 (-87.68,41.82) داخل A | 2 (-87.65,41.82) على الضلع المشترك | 3 (-87.55,41.90) خارج | 4 NULL
SELECT id, ST_SRID(geom), ST_X(geom) AS longitude, ST_Y(geom) AS latitude FROM demo_points;
SELECT zone, ST_IsValid(geom) FROM demo_zones;                   -- تحقق قبل العلاقات المكانية
SELECT p.id, z.zone FROM demo_points p JOIN demo_zones z ON ST_Covers(z.geom, p.geom);
-- (1,A), (2,A), (2,B)  ← 3 تطابقات لأربع نقاط</pre>
<p><code>ST_Covers</code> <b>يشمل</b> الحدود، فنقطة الضلع 2 مغطاة من <b>المنطقتين</b>؛ و <code>ST_Contains</code> <b>يستبعد</b> النقطة الواقعة على الحد فقط. عدد التطابقات الأكبر لا يعني أحداثاً فريدة أكثر. والمضلعات غير الصالحة قد تعطي نتائج مضللة.</p>
<pre>SELECT p.id, z.zone
FROM demo_points p
LEFT JOIN LATERAL (
  SELECT zone FROM demo_zones z
  WHERE ST_Covers(z.geom, p.geom)
  ORDER BY zone LIMIT 1) z ON true
ORDER BY p.id;                       -- (1,A), (2,A), (3,NULL), (4,NULL)

WITH a AS (...نفس الإسناد...)
SELECT COUNT(*) AS points, COUNT(zone) AS assigned,
       COUNT(*) FILTER (WHERE zone IS NULL) AS unmatched FROM a;   -- 4, 2, 2</pre>
<p>قاعدة التعادل المعلنة (أول منطقة أبجدياً) تحفظ <b>صفاً واحداً لكل نقطة</b>؛ سياسة تعليمية لا قاعدة اختصاص رسمية — وأي قاعدة منطقة واحدة يجب إعلانها. <code>LEFT JOIN</code> يبقي النقاط غير المطابقة. أبلغ عن <b>خارج التغطية</b> (النقطة 3) و<b>الإحداثيات المفقودة</b> (النقطة 4) منفصلين؛ ولا يجوز أن يكرر التعادل نقطة أو يخفيها بصمت. الرسم من <code>ST_AsGeoJSON</code> في SQL (المحاور بالدرجات).</p>
<p class="ex">مهام المعمل 1: المعرّف والمنطقة بـ ST_Contains؛ النقاط التي لها شكل وبلا منطقة تغطيها؛ النقاط بلا إحداثيات؛ تغيير قاعدة التعادل إلى آخر منطقة أبجدياً. المهمة اليومية: اعرض الإسناد وأعداد التغطية وسياسة الحدود، وميّز النقطة 3 عن النقطة 4.</p>
<h3>المعمل 2: المسافات والوحدات</h3>
<p>مسافة <b>geography</b> بـ<b>الأمتار</b>، ومسافة <b>geometry</b> بوحدات نظامها — في 4326 هي <b>درجات</b>، فحد 500 على geometry بنظام 4326 لا يعني 500 متر.</p>
<pre>CREATE TEMP TABLE distance_demo(id int PRIMARY KEY, geom geometry(Point,4326));
-- 1 (-87.65,41.82) المرجع | 2 (-87.65,41.821) ~111 م شمالاً | 3 (-87.65,41.84) ~2.2 كم شمالاً
SELECT id, ROUND(ST_Distance(geom::geography,
       ST_SetSRID(ST_MakePoint(-87.65,41.82),4326)::geography)::numeric, 1) AS metres
FROM distance_demo;                                  -- 0، ~111، ~2200
SELECT id FROM distance_demo
WHERE ST_DWithin(geom::geography, ST_SetSRID(ST_MakePoint(-87.65,41.82),4326)::geography, 500);  -- 1، 2
-- 150 م ← 1، 2 ؛ 50 م ← 1 فقط</pre>
<h3>الفهرس المكاني والقرب</h3>
<pre>CREATE TEMP TABLE spatial_crashes AS
  SELECT crash_record_id, geom, geom::geography AS geog FROM training.crashes WHERE geom IS NOT NULL;
CREATE INDEX spatial_crashes_geog_idx ON pg_temp.spatial_crashes USING gist(geog);
ANALYZE pg_temp.spatial_crashes;
SELECT crash_record_id, ROUND(ST_Distance(geog, anchor)::numeric, 1) AS metres
FROM pg_temp.spatial_crashes
WHERE ST_DWithin(geog, anchor, 5000)           -- 5 كم
ORDER BY metres, crash_record_id LIMIT 10;</pre>
<p>فهرس <b>GiST</b> يجب أن يطابق التعبير المستعلم — فهارس geometry و geography غير متبادلة. <code>ST_DWithin</code> يمكنه استخدامه، والخطة (<code>EXPLAIN (FORMAT JSON)</code>) قد تختار المسح التسلسلي في عينة صغيرة. تحقق من الصحة أولاً (مثلاً قارن ST_DWithin 5000 مع <code>ST_Distance &lt;= 5000</code> الصريح). وعدد النقاط ذات الموقع يجب أن يساوي الحوادث التي شكلها ليس NULL.</p>
<h3>شبكة الكيلومتر</h3>
<pre>WITH p AS (SELECT ST_Transform(geom, 26916) AS g FROM pg_temp.spatial_crashes)
SELECT FLOOR(ST_X(g)/1000)::int AS gx, FLOOR(ST_Y(g)/1000)::int AS gy, COUNT(*) AS records
FROM p GROUP BY 1, 2 ORDER BY records DESC, gx, gy;</pre>
<p>حوّل أولاً إلى <b>EPSG:26916</b>، إسقاط محلي بالأمتار يناسب مثال شيكاغو؛ ثم اقسم X و Y على 1000 وخذ <code>FLOOR</code>. أصل الشبكة يتبع هذا الإسقاط، ومعرّف الخلية ليس اسم حي. كل نقطة لها موقع تقع في خلية <b>واحدة</b> بالضبط، فمجموع الخلايا = مجموع النقاط (فحص المطابقة). حجم الخلية وأصلها يغيّران الصورة؛ وعدد الشبكة حجم ملاحظات في عينة <b>وليس</b> معدل خطر أو كثافة معدلاً بالسكان، والسجلات المصطنعة لا تدعم قرارات نشر. الإحداثيات المفقودة تُذكر في ملاحظة التغطية رغم أنها لا تظهر على الخريطة.</p>
<p class="ex">مهام المعمل 2: المعرّفات ضمن 150 م؛ المعرّفات ضمن 50 م؛ total_records بجمع كل خلايا 1 كم (بدون حد)؛ الحوادث ضمن 5 كم مقارنة بـ ST_Distance ≤ 5000. المهمة اليومية: استعلام قرب بالأمتار مع تفسير خطته ومطابقة كاملة للشبكة وملاحظة عن نظام الإحداثيات والتغطية.</p>`}
);
