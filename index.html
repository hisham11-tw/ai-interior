{id:"s12", unit:"u3", en:"Relational Model & SQL Queries", ar:"النموذج العلائقي واستعلامات SQL",
en_body:`
<h3>Purpose</h3>
<p>A training analyst needs a small, explainable list of police or traffic records. A <b>query</b> is a precise request to a database; the answer is a result table whose scope must be explained. All classroom records are <b>synthetic</b>. First describe the required columns and rows in ordinary language, then write SQL.</p>
<h3>Relational terms</h3>
<table><tr><th>Term</th><th>Meaning in this course</th></tr>
<tr><td>Database</td><td>police_training — a named collection of database objects</td></tr>
<tr><td>Schema</td><td>training — a namespace grouping shared tables</td></tr>
<tr><td>Table</td><td>crimes or crashes — rows with defined columns and rules</td></tr>
<tr><td>Row</td><td>one source record at the table's stated <b>grain</b></td></tr>
<tr><td>Column</td><td>a property such as crash_date or injuries_total</td></tr>
<tr><td>Primary key</td><td>a non-null, unique identifier for a row</td></tr>
<tr><td>Foreign key</td><td>a reference connecting a child row to an existing parent key</td></tr></table>
<p>One crash can have several vehicle rows and person rows, so counting vehicle rows ≠ counting crashes. A foreign key prevents a child from referencing a missing crash, but does not prove all real-world records were collected. The crimes table's grain is a reported source record — not a person table.</p>
<h3>Types, keys and missing values</h3>
<p><code>crimes.id</code> bigint PK; <code>crimes.date</code> timestamp; <code>primary_type</code> text (e.g., THEFT); <code>arrest</code> boolean (true/false/unknown — not evidence of guilt); <code>district</code> <b>text</b> to keep codes like <code>01</code> with the leading zero; <code>crash_record_id</code> text (an identifier, not a quantity); <code>injuries_total</code> integer, <b>nullable</b> (NULL when unavailable). <b>NULL ≠ zero.</b> Timestamps are local wall times without timezone. <b>DDL</b> (Data Definition Language) — <code>CREATE TABLE</code> declares structure and rules.</p>
<h3>Core clauses</h3>
<pre>SELECT id, date, primary_type, district   -- which columns
FROM training.crimes                     -- which table
WHERE primary_type = 'THEFT'             -- filter rows (text in quotes)
  AND district = '01'
ORDER BY date DESC, id                   -- deterministic order
LIMIT 10;                                -- bound the result</pre>
<p>Clause order is fixed: <code>SELECT … FROM … WHERE … GROUP BY … ORDER BY … LIMIT</code>. <code>DISTINCT</code> returns distinct selected combinations; <code>IS NULL</code> checks missingness (<code>= NULL</code> doesn't work); <code>COUNT(*)</code> counts rows; <code>GROUP BY</code> groups for aggregates. Without <code>ORDER BY</code> there is no guaranteed row order. Numbers are written without quotes.</p>
<h3>Classroom setup (Colab + Neon)</h3>
<p>Put <code>DATABASE_URL</code> in Colab <b>Secrets</b> (never print credentials). The helper <code>run_sql()</code> runs <b>read-only</b> transactions with a 30s timeout and requires LIMIT ≤ 200. Install with <code>%pip install "psycopg[binary]" pandas certifi</code>. A small selected sample cannot establish population risk or causation.</p>`,
ar_body:`
<h3>الهدف</h3>
<p>محلل تدريب يحتاج قائمة صغيرة قابلة للشرح من سجلات الشرطة أو المرور. <b>الاستعلام</b> طلب دقيق لقاعدة البيانات، والإجابة جدول نتائج يجب شرح نطاقه. كل سجلات الصف <b>مصطنعة</b>. صِف أولاً الأعمدة والصفوف المطلوبة بلغة عادية ثم اكتب SQL.</p>
<h3>مصطلحات النموذج العلائقي</h3>
<table><tr><th>المصطلح</th><th>المعنى في المقرر</th></tr>
<tr><td>قاعدة البيانات</td><td>police_training — مجموعة مسماة من كائنات القاعدة</td></tr>
<tr><td>المخطط Schema</td><td>training — مساحة أسماء تجمع الجداول المشتركة</td></tr>
<tr><td>الجدول</td><td>crimes أو crashes — صفوف بأعمدة وقواعد محددة</td></tr>
<tr><td>الصف</td><td>سجل مصدر واحد حسب <b>حُبيبة/مستوى</b> الجدول (grain)</td></tr>
<tr><td>العمود</td><td>خاصية مثل crash_date أو injuries_total</td></tr>
<tr><td>المفتاح الأساسي</td><td>معرّف فريد وغير فارغ للصف</td></tr>
<tr><td>المفتاح الأجنبي</td><td>مرجع يربط صفاً ابناً بمفتاح أب موجود</td></tr></table>
<p>الحادث الواحد قد يكون له عدة صفوف مركبات وأشخاص، فعدّ صفوف المركبات ≠ عدّ الحوادث. المفتاح الأجنبي يمنع الابن من الإشارة لحادث غير موجود، لكنه لا يثبت أن كل السجلات الواقعية جُمعت. مستوى جدول crimes هو سجل مُبلّغ — ليس جدول أشخاص.</p>
<h3>الأنواع والمفاتيح والقيم المفقودة</h3>
<p><code>crimes.id</code> bigint مفتاح أساسي؛ <code>crimes.date</code> timestamp؛ <code>primary_type</code> نص (مثل THEFT)؛ <code>arrest</code> منطقي (صح/خطأ/مجهول — ليس دليل إدانة)؛ <code>district</code> <b>نص</b> للحفاظ على الصفر في <code>01</code>؛ <code>crash_record_id</code> نص (معرّف لا كمية)؛ <code>injuries_total</code> عدد صحيح <b>يقبل NULL</b> عند عدم التوفر. <b>NULL ≠ صفر.</b> الأوقات محلية بدون منطقة زمنية. <b>DDL</b> لغة تعريف البيانات — <code>CREATE TABLE</code> يعرّف الهيكل والقواعد.</p>
<h3>الأوامر الأساسية</h3>
<pre>SELECT id, date, primary_type, district   -- أي الأعمدة
FROM training.crimes                     -- أي جدول
WHERE primary_type = 'THEFT'             -- تصفية الصفوف (النص بين تنصيص)
  AND district = '01'
ORDER BY date DESC, id                   -- ترتيب حتمي
LIMIT 10;                                -- تحديد عدد النتائج</pre>
<p>ترتيب الأوامر ثابت: <code>SELECT … FROM … WHERE … GROUP BY … ORDER BY … LIMIT</code>. <code>DISTINCT</code> يرجع التركيبات المختلفة، و <code>IS NULL</code> يفحص الفقد (<code>= NULL</code> لا يعمل)، و <code>COUNT(*)</code> يعدّ الصفوف، و <code>GROUP BY</code> للتجميع. بدون <code>ORDER BY</code> لا يوجد ترتيب مضمون. الأرقام تُكتب بدون تنصيص.</p>
<h3>إعداد الفصل (Colab + Neon)</h3>
<p>ضع <code>DATABASE_URL</code> في <b>Secrets</b> في Colab (لا تطبع بيانات الدخول أبداً). الدالة <code>run_sql()</code> تنفذ معاملات <b>للقراءة فقط</b> بمهلة 30 ثانية وتشترط LIMIT ≤ 200. التثبيت: <code>%pip install "psycopg[binary]" pandas certifi</code>. العينة الصغيرة المختارة لا تثبت خطراً على المجتمع ولا سببية.</p>`},

{id:"s13", unit:"u3", en:"Database Infrastructure & Serverless", ar:"البنية التحتية لقواعد البيانات والـ Serverless",
en_body:`
<h3>Where a database fits</h3>
<p>A <b>client</b> (Colab or an application) requests data; the <b>database engine</b> (PostgreSQL compute) executes SQL and returns rows; <b>persistent data</b> (tables, indexes, history) is stored.</p>
<h3>Traditional servers</h3>
<p>A <b>physical server</b> is a dedicated machine; a <b>VPS / virtual machine</b> is allocated on shared hardware (e.g., a Hetzner Cloud VPS running Linux and PostgreSQL). The provider handles facilities and the physical host; <b>you</b> manage the guest OS and database.</p>
<table><tr><th>Resource</th><th>Purpose</th><th>Bottleneck when</th></tr>
<tr><td>CPU / vCPU</td><td>execute queries</td><td>many expensive queries</td></tr>
<tr><td>RAM</td><td>cache pages, working data</td><td>large sorts, high concurrency</td></tr>
<tr><td>SSD / disk</td><td>tables, indexes, WAL</td><td>storage growth, slow I/O</td></tr>
<tr><td>Network</td><td>requests and result rows</td><td>distance, size, congestion</td></tr></table>
<p><b>WAL</b> = write-ahead log, used for recovery and durability. Software layers: Linux OS → service manager/Docker → PostgreSQL process → database objects → data files & WAL → logs & monitoring. A request path: browser (HTTPS) → application (validates input & identity) → PostgreSQL (checks role). DNS resolves names; a firewall limits ports; TLS protects the connection; credentials stay outside browser code.</p>
<p>Self-managed setup: choose region/VM size → updates, SSH, firewall → install PostgreSQL & roles → storage, TLS, backups (a test restore succeeds) → monitoring. Daily admin: updates, access, monitoring, reliability, maintenance.</p>
<h3>Backups and recovery</h3>
<p><b>Backup</b> = recoverable copy (can we restore it?). <b>Replica</b> = copy receiving changes (it will copy the same mistake). <b>High availability</b> = continuity during failure. <b>RPO/RTO</b> = allowed data loss / outage. <b>A tested restore proves recoverability</b>, not just a successful backup job. A powered-off Hetzner server still incurs charges until deleted.</p>
<h3>Serverless and Neon</h3>
<p><b>Serverless</b> means the provider operates servers and allocates resources — servers still exist, and it is <b>not free</b>. Neon separates <b>compute</b> (CPU/RAM running SQL) from <b>durable storage</b>. <b>Scale to zero</b> suspends idle compute (committed data remains); a new connection reactivates it with extra latency = <b>cold start</b>. <b>Autoscaling</b> changes compute size. Pricing: compute usage, storage/history, network, plan limits, operating effort — serverless isn't guaranteed cheaper.</p>
<p>Connection string: <code>postgresql://ROLE:PASSWORD@HOST:5432/police_training</code>. A Colab restart loses Python variables; committed Neon data remains. Learners use <code>DATABASE_URL</code>; the instructor <code>NEON_ADMIN_DATABASE_URL</code> (RUN_AS = 'instructor'); use the direct endpoint (no pooler) for temp-table labs.</p>
<h3>Agentic AI architecture</h3>
<p>Frontend (UI / Open WebUI) → agent runtime (FastAPI + LangGraph) → LLM provider; Neon PostgreSQL stores state, history and retrieval data. A database suspension does <b>not</b> stop the agent process on its host. Stored data: user profiles/sessions, runs & checkpoints, tool calls, conversation memory, documents & embeddings. <b>RAG + pgvector:</b> an embedding represents content as numbers for similarity search (<code>CREATE EXTENSION IF NOT EXISTS vector;</code>). <b>Serverless</b> (who operates infra), <b>containers</b> (how software is packaged — FastAPI in Docker) and <b>microservices</b> (how the app is divided) solve different problems and can be combined.</p>
<h3>Choosing an operating model</h3>
<table><tr><th>Situation</th><th>What to evaluate</th></tr>
<tr><td>Intermittent teaching or prototype use</td><td>idle suspension, quotas, restart latency</td></tr>
<tr><td>Steady or latency-sensitive traffic</td><td>predictable capacity and total monthly cost</td></tr>
<tr><td>Need for host-level control</td><td>OS access, extensions, maintenance effort</td></tr>
<tr><td>Limited administration capacity</td><td>managed service capabilities and support</td></tr>
<tr><td>Any deployment</td><td>region, data access, recovery, workload tests</td></tr></table>
<table><tr><th>Task</th><th>Self-managed VPS</th><th>Neon</th></tr>
<tr><td>Physical infrastructure</td><td>provider</td><td>provider</td></tr><tr><td>Guest OS & database operation</td><td>your team</td><td>provider</td></tr>
<tr><td>Compute sizing / scaling</td><td>your team configures</td><td>service, within chosen limits</td></tr>
<tr><td>Schema, SQL, data quality</td><td>your team</td><td>your team</td></tr><tr><td>Roles, secrets, recovery policy</td><td>your team</td><td>your team selects and verifies</td></tr></table>
<p>The class uses Colab + Neon to focus on SQL and data behavior. A new Neon project needs a name and region; the class uses the existing <code>police_training</code> database and synthetic snapshot via the direct endpoint. <b>Review questions:</b> Does serverless mean no physical server exists? (no) What survives when Neon compute suspends? (committed data) Does a Neon suspension stop an agent running on Hetzner? (no) Which responsibilities remain with the application team? (schema, SQL, data quality, roles, secrets, recovery policy) What happens when statement two fails in a transaction? (the whole transaction rolls back).</p>`,
ar_body:`
<h3>موقع قاعدة البيانات</h3>
<p><b>العميل</b> (Colab أو تطبيق) يطلب البيانات، و<b>محرك القاعدة</b> (حوسبة PostgreSQL) ينفذ SQL ويرجع الصفوف، و<b>البيانات الدائمة</b> (جداول وفهارس وسجل) محفوظة.</p>
<h3>الخوادم التقليدية</h3>
<p><b>الخادم الفعلي</b> جهاز مخصص، و<b>VPS / الآلة الافتراضية</b> تُخصص على عتاد مشترك (مثل VPS من Hetzner يشغّل لينكس و PostgreSQL). المزود يتولى المبنى والجهاز الفعلي، و<b>أنت</b> تدير نظام التشغيل الضيف وقاعدة البيانات.</p>
<table><tr><th>المورد</th><th>الغرض</th><th>يصبح عنق زجاجة عند</th></tr>
<tr><td>المعالج CPU</td><td>تنفيذ الاستعلامات</td><td>كثرة الاستعلامات الثقيلة</td></tr>
<tr><td>الذاكرة RAM</td><td>تخزين الصفحات مؤقتاً</td><td>الترتيب الكبير أو التزامن العالي</td></tr>
<tr><td>القرص SSD</td><td>الجداول والفهارس و WAL</td><td>نمو التخزين أو بطء الإدخال/الإخراج</td></tr>
<tr><td>الشبكة</td><td>الطلبات وصفوف النتائج</td><td>المسافة والحجم والازدحام</td></tr></table>
<p><b>WAL</b> = سجل الكتابة المسبقة، للاسترداد والمتانة. الطبقات: لينكس ← مدير الخدمات/Docker ← عملية PostgreSQL ← كائنات القاعدة ← ملفات البيانات و WAL ← السجلات والمراقبة. مسار الطلب: المتصفح (HTTPS) ← التطبيق (يتحقق من المدخلات والهوية) ← PostgreSQL (يتحقق من الدور). DNS يحل الأسماء، والجدار الناري يحدد المنافذ، و TLS يحمي الاتصال، وبيانات الدخول تبقى خارج كود المتصفح.</p>
<p>الإعداد الذاتي: اختيار المنطقة وحجم الآلة ← التحديثات و SSH والجدار الناري ← تثبيت PostgreSQL والأدوار ← التخزين و TLS والنسخ الاحتياطي (نجاح استعادة تجريبية) ← المراقبة. الإدارة اليومية: التحديثات، الصلاحيات، المراقبة، الموثوقية، الصيانة.</p>
<h3>النسخ الاحتياطي والاسترداد</h3>
<p><b>النسخة الاحتياطية</b> نسخة قابلة للاستعادة (هل نقدر نستعيدها؟). <b>النسخة المتماثلة Replica</b> تستقبل التغييرات (فتنسخ نفس الخطأ). <b>التوفر العالي</b> = استمرار الخدمة أثناء العطل. <b>RPO/RTO</b> = الفقد المسموح للبيانات / مدة التوقف. <b>الاستعادة المجرّبة هي التي تثبت القدرة على الاسترداد</b> وليس مجرد نجاح مهمة النسخ. خادم Hetzner المطفأ يبقى يُحاسب عليه حتى حذفه.</p>
<h3>Serverless و Neon</h3>
<p><b>Serverless</b> يعني أن المزود يشغّل الخوادم ويخصص الموارد — الخوادم موجودة، و<b>ليست مجانية</b>. Neon يفصل <b>الحوسبة</b> (المعالج والذاكرة لتنفيذ SQL) عن <b>التخزين الدائم</b>. <b>Scale to zero</b> يعلّق الحوسبة الخاملة (البيانات المحفوظة تبقى)، والاتصال الجديد يعيد تشغيلها بتأخير إضافي = <b>البدء البارد Cold start</b>. <b>Autoscaling</b> يغيّر حجم الحوسبة. التكلفة: استخدام الحوسبة، التخزين والسجل، الشبكة، حدود الخطة، جهد التشغيل — ليس أرخص بالضرورة.</p>
<p>نص الاتصال: <code>postgresql://ROLE:PASSWORD@HOST:5432/police_training</code>. إعادة تشغيل Colab تفقد متغيرات بايثون، وبيانات Neon المحفوظة تبقى. المتدرب يستخدم <code>DATABASE_URL</code> والمدرب <code>NEON_ADMIN_DATABASE_URL</code> (RUN_AS = 'instructor')، ونستخدم نقطة الاتصال المباشرة (بدون pooler) لمعامل الجداول المؤقتة.</p>
<h3>معمارية الذكاء الاصطناعي الوكيلي</h3>
<p>الواجهة (UI / Open WebUI) ← بيئة الوكيل (FastAPI + LangGraph) ← مزود LLM، و Neon PostgreSQL يحفظ الحالة والسجل وبيانات الاسترجاع. تعليق قاعدة البيانات <b>لا</b> يوقف عملية الوكيل على خادمها. البيانات المحفوظة: ملفات المستخدمين والجلسات، التشغيلات ونقاط الحفظ، استدعاءات الأدوات، ذاكرة المحادثة، المستندات والـ embeddings. <b>RAG + pgvector:</b> الـ embedding يمثل المحتوى كأرقام للبحث بالتشابه (<code>CREATE EXTENSION IF NOT EXISTS vector;</code>). <b>Serverless</b> (من يشغّل البنية) و<b>الحاويات</b> (كيف يُغلّف البرنامج — FastAPI في Docker) و<b>الخدمات المصغرة</b> (كيف يُقسم التطبيق) تحل مشاكل مختلفة ويمكن جمعها.</p>
<h3>اختيار نموذج التشغيل</h3>
<table><tr><th>الحالة</th><th>ما يُقيَّم</th></tr>
<tr><td>استخدام متقطع للتدريس أو النماذج الأولية</td><td>التعليق عند الخمول، الحصص، تأخر إعادة التشغيل</td></tr>
<tr><td>حركة ثابتة أو حساسة للتأخير</td><td>سعة متوقعة والتكلفة الشهرية الكلية</td></tr>
<tr><td>الحاجة للتحكم بالخادم</td><td>وصول نظام التشغيل والإضافات وجهد الصيانة</td></tr>
<tr><td>قدرة إدارية محدودة</td><td>إمكانات الخدمة المُدارة والدعم</td></tr>
<tr><td>أي نشر</td><td>المنطقة، الوصول للبيانات، الاسترداد، اختبارات الحمل</td></tr></table>
<table><tr><th>المهمة</th><th>VPS مُدار ذاتياً</th><th>Neon</th></tr>
<tr><td>البنية الفعلية</td><td>المزود</td><td>المزود</td></tr><tr><td>تشغيل نظام التشغيل والقاعدة</td><td>فريقك</td><td>المزود</td></tr>
<tr><td>حجم الحوسبة والتوسع</td><td>فريقك يضبطه</td><td>الخدمة ضمن الحدود المختارة</td></tr>
<tr><td>المخطط و SQL وجودة البيانات</td><td>فريقك</td><td>فريقك</td></tr><tr><td>الأدوار والأسرار وسياسة الاسترداد</td><td>فريقك</td><td>فريقك يختار ويتحقق</td></tr></table>
<p>الفصل يستخدم Colab + Neon للتركيز على SQL وسلوك البيانات. مشروع Neon الجديد يحتاج اسماً ومنطقة، والفصل يستخدم قاعدة <code>police_training</code> الموجودة واللقطة المصطنعة عبر نقطة الاتصال المباشرة. <b>أسئلة المراجعة:</b> هل Serverless يعني عدم وجود خادم فعلي؟ (لا) ماذا يبقى عند تعليق حوسبة Neon؟ (البيانات المحفوظة) هل تعليق Neon يوقف وكيلاً يعمل على Hetzner؟ (لا) ما المسؤوليات التي تبقى على فريق التطبيق؟ (المخطط و SQL وجودة البيانات والأدوار والأسرار وسياسة الاسترداد) ماذا يحدث إذا فشلت الجملة الثانية في معاملة؟ (تتراجع المعاملة كاملة).</p>
`},

{id:"s14", unit:"u3", en:"Filtering, NULL, Safe CRUD & Transactions", ar:"التصفية و NULL والتعديل الآمن والمعاملات",
en_body:`
<h3>Compound filters</h3>
<pre>WHERE (primary_type = 'THEFT' OR primary_type = 'DAMAGE') AND district = '01'
-- equivalent:
WHERE primary_type IN ('THEFT','DAMAGE') AND district = '01'</pre>
<p>Parentheses make the district rule apply to <b>both</b> categories (AND binds tighter than OR). <code>IN</code> expresses a choice among values.</p>
<h3>Date ranges (half-open interval)</h3>
<pre>WHERE crash_date &gt;= TIMESTAMP '2025-01-01'
  AND crash_date &lt;  TIMESTAMP '2025-02-01'</pre>
<p>Inclusive start, <b>exclusive end</b>: includes every time on January 31, excludes midnight February 1.</p>
<h3>Pattern matching and NULL</h3>
<p><code>LIKE '%REAR%'</code> — <code>%</code> means zero or more characters. Unknown vs zero: <code>WHERE injuries_total IS NULL OR injuries_total = 0</code>. Use <code>IS NULL</code> for unknown values and keep the original nullable count.</p>
<h3>Parameters</h3>
<pre>run_sql('SELECT id, district FROM training.crimes '
        'WHERE district = %s ORDER BY id LIMIT 8', (district,))</pre>
<p>Python sends the SQL structure and the value <b>separately</b> (safer than string formatting, prevents SQL injection). The trailing comma makes a one-item tuple; don't quote <code>%s</code>.</p>
<h3>Constraints in a temporary table</h3>
<pre>CREATE TEMP TABLE day02_requests (
  request_id integer PRIMARY KEY,
  category text NOT NULL,
  status text NOT NULL CHECK (status IN ('OPEN','CLOSED')),
  priority integer NOT NULL CHECK (priority BETWEEN 1 AND 3));</pre>
<p>A temporary table belongs to <b>one session</b> and disappears when it ends; a new connection can't see another's temp table.</p>
<h3>CRUD with evidence</h3>
<table><tr><th>Action</th><th>SQL</th><th>Evidence</th></tr>
<tr><td>Create</td><td>INSERT</td><td>returned identifier</td></tr><tr><td>Read</td><td>SELECT</td><td>current key and status</td></tr>
<tr><td>Update</td><td>UPDATE only the intended key and status</td><td>returned changed row</td></tr><tr><td>Delete</td><td>DELETE the intended closed request</td><td>returned deleted id</td></tr></table>
<pre>UPDATE pg_temp.day02_requests SET status = 'CLOSED'
WHERE request_id = 104 AND status = 'OPEN'
RETURNING request_id;</pre>
<p><code>RETURNING</code> shows exactly which rows changed. Zero changed rows: inspect the identifier and current status before treating it as failure.</p>
<h3>Transactions and rollback</h3>
<p>BEGIN → close request 101 (pending) → insert duplicate key 102 (primary-key error) → <b>ROLLBACK</b> → request 101 remains OPEN. A failed statement undoes the earlier change in the same transaction (atomic unit of work). Verify the full table before and after — a printed "rollback" message is not evidence. After an aborted transaction, let it roll back before querying again.</p>`,
ar_body:`
<h3>الشروط المركبة</h3>
<pre>WHERE (primary_type = 'THEFT' OR primary_type = 'DAMAGE') AND district = '01'
-- مكافئ:
WHERE primary_type IN ('THEFT','DAMAGE') AND district = '01'</pre>
<p>الأقواس تجعل شرط الحي ينطبق على <b>الفئتين معاً</b> (AND أقوى ارتباطاً من OR). و <code>IN</code> تعبّر عن اختيار من عدة قيم.</p>
<h3>نطاقات التاريخ (فترة نصف مفتوحة)</h3>
<pre>WHERE crash_date &gt;= TIMESTAMP '2025-01-01'
  AND crash_date &lt;  TIMESTAMP '2025-02-01'</pre>
<p>البداية مشمولة و<b>النهاية غير مشمولة</b>: تشمل كل أوقات 31 يناير وتستبعد منتصف ليل 1 فبراير.</p>
<h3>مطابقة الأنماط و NULL</h3>
<p><code>LIKE '%REAR%'</code> — <code>%</code> تعني صفر أو أكثر من الأحرف. المجهول مقابل الصفر: <code>WHERE injuries_total IS NULL OR injuries_total = 0</code>. استخدم <code>IS NULL</code> للقيم المجهولة واحتفظ بالعدد الأصلي القابل لـ NULL.</p>
<h3>المعاملات (Parameters)</h3>
<pre>run_sql('SELECT id, district FROM training.crimes '
        'WHERE district = %s ORDER BY id LIMIT 8', (district,))</pre>
<p>بايثون ترسل هيكل SQL والقيمة <b>منفصلين</b> (أكثر أماناً من تنسيق النص ويمنع حقن SQL). الفاصلة في النهاية تصنع tuple بعنصر واحد، ولا تضع <code>%s</code> بين تنصيص.</p>
<h3>القيود في جدول مؤقت</h3>
<pre>CREATE TEMP TABLE day02_requests (
  request_id integer PRIMARY KEY,
  category text NOT NULL,
  status text NOT NULL CHECK (status IN ('OPEN','CLOSED')),
  priority integer NOT NULL CHECK (priority BETWEEN 1 AND 3));</pre>
<p>الجدول المؤقت يخص <b>جلسة واحدة</b> ويختفي بانتهائها، والاتصال الجديد لا يرى جدول اتصال آخر.</p>
<h3>عمليات CRUD مع دليل</h3>
<table><tr><th>العملية</th><th>SQL</th><th>الدليل</th></tr>
<tr><td>إنشاء</td><td>INSERT</td><td>المعرّف المرجَع</td></tr><tr><td>قراءة</td><td>SELECT</td><td>المفتاح والحالة الحالية</td></tr>
<tr><td>تحديث</td><td>UPDATE للمفتاح والحالة المقصودة فقط</td><td>الصف المعدّل المرجَع</td></tr><tr><td>حذف</td><td>DELETE للطلب المغلق المقصود</td><td>المعرّف المحذوف</td></tr></table>
<pre>UPDATE pg_temp.day02_requests SET status = 'CLOSED'
WHERE request_id = 104 AND status = 'OPEN'
RETURNING request_id;</pre>
<p><code>RETURNING</code> يوضح بالضبط أي الصفوف تغيّرت. إذا لم يتغير أي صف افحص المعرّف والحالة الحالية قبل اعتباره فشلاً.</p>
<h3>المعاملات Transactions والتراجع</h3>
<p>BEGIN ← إغلاق الطلب 101 (معلّق) ← إدخال مفتاح مكرر 102 (خطأ مفتاح أساسي) ← <b>ROLLBACK</b> ← الطلب 101 يبقى OPEN. فشل جملة يلغي التغيير السابق في نفس المعاملة (وحدة عمل ذرية). تحقق من الجدول كاملاً قبل وبعد — رسالة "rollback" المطبوعة ليست دليلاً. بعد معاملة فاشلة اتركها تتراجع قبل الاستعلام مجدداً.</p>`},

{id:"s15", unit:"u4", en:"Aggregation, Denominators & CTEs", ar:"التجميع والمقامات و CTE",
en_body:`
<h3>Aggregate functions</h3>
<p><code>COUNT(*)</code> counts <b>rows</b>; <code>COUNT(column)</code> counts <b>non-NULL</b> values; <code>SUM</code> and <code>AVG</code> ignore NULL. Example: five requests with three observed durations 30, 0, 120 → mean = 150/3 = <b>50</b> (observed denominator 3). Replacing unknowns with zero (150/5 = 30) changes the question and lowers the mean incorrectly.</p>
<h3>GROUP BY, WHERE, HAVING</h3>
<p><code>GROUP BY</code> changes the grain (one row per group). <code>WHERE</code> filters source rows <b>before</b> grouping; <code>HAVING</code> tests groups <b>after</b> aggregates exist; <code>ORDER BY</code> only sets presentation order.</p>
<pre>SELECT department_id, COUNT(*) AS requests
FROM pg_temp.requests
GROUP BY department_id
HAVING COUNT(*) &gt;= 3;</pre>
<p>To keep an empty department, <code>LEFT JOIN</code> from departments and count the child key: <code>COUNT(r.request_id)</code> (COUNT(*) would count the NULL-extended row as 1). Expected volumes: Intake 2, Records 3, Training 0.</p>
<h3>Guarded percentages</h3>
<pre>SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status='CLOSED')
             / NULLIF(COUNT(*), 0), 1) AS closed_pct
FROM pg_temp.requests;</pre>
<p><code>100.0</code> (numeric) prevents integer truncation; <code>NULLIF(x, 0)</code> makes an empty denominator NULL (undefined) instead of a division error. A completion share needs a declared cohort (e.g., February: 1/2 = 50%) and doesn't measure turnaround time or effectiveness.</p>
<h3>CTEs protect the grain</h3>
<p>A crash can have several vehicles and people. Joining both children directly creates <b>combinations</b>: 2 vehicles × 3 people = 6 rows, repeating crash measures. <code>DISTINCT</code> on injury totals is <b>not</b> a valid fix (equal numbers can belong to different crashes). Aggregate each child <b>separately</b> to one row per crash, then join:</p>
<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles
           FROM training.vehicles GROUP BY crash_record_id),
     p AS (SELECT crash_record_id, COUNT(*) AS people
           FROM training.people GROUP BY crash_record_id)
SELECT c.crash_record_id,
       COALESCE(v.vehicles,0) AS vehicles, COALESCE(p.people,0) AS people
FROM training.crashes c
LEFT JOIN v USING (crash_record_id)
LEFT JOIN p USING (crash_record_id);</pre>
<p>A <b>CTE</b> (<code>WITH</code>) names a query stage that lasts for <b>one statement</b>; it improves readability but is not automatically a performance optimization. A <b>derived table</b> expresses the same stage inline; a <b>scalar subquery</b> returns one value (e.g., above-average injuries). <code>COALESCE</code> fills missing child counts with 0 — not unknown injury observations. Reconcile child totals against source table lengths.</p>`,
ar_body:`
<h3>دوال التجميع</h3>
<p><code>COUNT(*)</code> يعدّ <b>الصفوف</b>، و <code>COUNT(column)</code> يعدّ القيم <b>غير الفارغة</b>، و <code>SUM</code> و <code>AVG</code> يتجاهلان NULL. مثال: خمسة طلبات منها ثلاث مدد معروفة 30 و 0 و 120 ← المتوسط = 150/3 = <b>50</b> (المقام الملاحظ 3). استبدال المجهول بصفر (150/5 = 30) يغيّر السؤال ويخفض المتوسط خطأً.</p>
<h3>GROUP BY و WHERE و HAVING</h3>
<p><code>GROUP BY</code> يغيّر المستوى (صف لكل مجموعة). <code>WHERE</code> يصفّي الصفوف <b>قبل</b> التجميع، و <code>HAVING</code> يختبر المجموعات <b>بعد</b> حساب التجميعات، و <code>ORDER BY</code> لترتيب العرض فقط.</p>
<pre>SELECT department_id, COUNT(*) AS requests
FROM pg_temp.requests
GROUP BY department_id
HAVING COUNT(*) &gt;= 3;</pre>
<p>للإبقاء على قسم فارغ استخدم <code>LEFT JOIN</code> من جدول الأقسام وعُدّ مفتاح الابن: <code>COUNT(r.request_id)</code> (لأن COUNT(*) سيعدّ الصف الممدود بـ NULL كواحد). النتائج المتوقعة: Intake 2 و Records 3 و Training 0.</p>
<h3>النسب المحمية</h3>
<pre>SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE status='CLOSED')
             / NULLIF(COUNT(*), 0), 1) AS closed_pct
FROM pg_temp.requests;</pre>
<p><code>100.0</code> (عدد عشري) يمنع قطع القسمة الصحيحة، و <code>NULLIF(x, 0)</code> يجعل المقام الفارغ NULL (غير معرّف) بدل خطأ القسمة على صفر. نسبة الإنجاز تحتاج مجموعة محددة (مثلاً فبراير: 1/2 = 50%) ولا تقيس زمن الإنجاز أو الفعالية.</p>
<h3>الـ CTE تحمي المستوى</h3>
<p>الحادث قد يضم عدة مركبات وأشخاص. ربط الجدولين الابنين مباشرة يصنع <b>تركيبات</b>: مركبتان × 3 أشخاص = 6 صفوف تكرر قياسات الحادث. <code>DISTINCT</code> على الإصابات <b>ليس</b> حلاً صحيحاً (الأرقام المتساوية قد تخص حوادث مختلفة). جمّع كل جدول ابن <b>منفصلاً</b> إلى صف لكل حادث ثم اربط:</p>
<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles
           FROM training.vehicles GROUP BY crash_record_id),
     p AS (SELECT crash_record_id, COUNT(*) AS people
           FROM training.people GROUP BY crash_record_id)
SELECT c.crash_record_id,
       COALESCE(v.vehicles,0) AS vehicles, COALESCE(p.people,0) AS people
FROM training.crashes c
LEFT JOIN v USING (crash_record_id)
LEFT JOIN p USING (crash_record_id);</pre>
<p><b>CTE</b> (<code>WITH</code>) تسمّي مرحلة استعلام تدوم <b>لجملة واحدة</b>، وتحسّن القراءة لكنها ليست تحسيناً للأداء تلقائياً. <b>الجدول المشتق</b> يعبّر عن نفس المرحلة داخل الاستعلام، و<b>الاستعلام الفرعي القياسي</b> يرجع قيمة واحدة (مثل الإصابات فوق المتوسط). <code>COALESCE</code> يملأ أعداد الأبناء المفقودة بصفر — لا ملاحظات الإصابة المجهولة. طابق مجاميع الأبناء مع أطوال الجداول المصدر.</p>`},

{id:"s16", unit:"u4", en:"Time Series & Window Functions", ar:"السلاسل الزمنية ودوال النوافذ",
en_body:`
<h3>Aggregate vs window</h3>
<p>An aggregate <b>reduces</b> observations to one row per group. A <b>window function</b> keeps the rows and adds a cross-row calculation. <code>ORDER BY</code> inside <code>OVER</code> defines calculation order; the outer ORDER BY sets display order. <code>PARTITION BY</code> starts a separate calculation per entity (e.g., per district).</p>
<h3>Complete calendar</h3>
<p>A <code>ROWS</code> frame counts physical rows, so build a complete monthly calendar (e.g., <code>generate_series</code>) before calling "three rows" "three months". Requests fixture: Jan 2, Feb 2, Mar 1, Apr 0 — the calendar makes April visible. An empty month is zero only when source coverage is established; otherwise it may be missing coverage.</p>
<h3>LAG, running totals, moving averages</h3>
<pre>LAG(requests) OVER (ORDER BY month)            -- previous value (NULL in first row)
requests - LAG(requests) OVER (ORDER BY month) -- delta
SUM(crashes) OVER (ORDER BY month
  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)   -- running total
AVG(requests) OVER (ORDER BY month
  ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)            -- trailing 3-row mean</pre>
<p>Moving means for [2,2,1,0]: 2, 2, 1.67, 1 — early windows use fewer rows. It is <b>smoothing, not forecasting</b>. Guard percentage change when the prior value is zero. The final cumulative value must equal the annual total. To show March onward while keeping February as LAG's predecessor, calculate the window in a <b>CTE</b> and filter afterwards — filtering first changes the comparison population.</p>
<h3>Ranking</h3>
<table><tr><th>Function</th><th>Ties</th><th>Values for 10, 8, 8, 5</th></tr>
<tr><td>RANK</td><td>same rank, leaves gaps</td><td>1, 2, 2, 4</td></tr>
<tr><td>DENSE_RANK</td><td>same rank, no gaps</td><td>1, 2, 2, 3</td></tr>
<tr><td>ROW_NUMBER</td><td>unique positions</td><td>1, 2, 3, 4</td></tr></table>
<p>Use ROW_NUMBER with a stable tie-breaker (e.g., <code>ORDER BY crashes DESC, month</code>) to select exactly three rows reproducibly; use DENSE_RANK = 1 to return every month tied for the top. Quota-based synthetic samples create flat counts and ties — they don't show real changes. Timestamps are <code>timestamp without time zone</code>; don't silently convert to UTC.</p>`,
ar_body:`
<h3>التجميع مقابل النافذة</h3>
<p>التجميع <b>يختصر</b> الملاحظات إلى صف لكل مجموعة. أما <b>دالة النافذة</b> فتحتفظ بالصفوف وتضيف حساباً عبر الصفوف. <code>ORDER BY</code> داخل <code>OVER</code> يحدد ترتيب الحساب، والـ ORDER BY الخارجي يحدد ترتيب العرض. <code>PARTITION BY</code> يبدأ حساباً مستقلاً لكل كيان (مثل كل حي).</p>
<h3>التقويم الكامل</h3>
<p>إطار <code>ROWS</code> يعدّ صفوفاً فعلية، لذلك ابنِ تقويماً شهرياً كاملاً (مثل <code>generate_series</code>) قبل اعتبار "ثلاثة صفوف" = "ثلاثة أشهر". مثال الطلبات: يناير 2، فبراير 2، مارس 1، أبريل 0 — التقويم يُظهر أبريل. الشهر الفارغ صفر فقط إذا ثبتت تغطية المصدر، وإلا قد يعني نقص تغطية.</p>
<h3>LAG والمجموع التراكمي والمتوسط المتحرك</h3>
<pre>LAG(requests) OVER (ORDER BY month)            -- القيمة السابقة (NULL في أول صف)
requests - LAG(requests) OVER (ORDER BY month) -- الفرق
SUM(crashes) OVER (ORDER BY month
  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)   -- مجموع تراكمي
AVG(requests) OVER (ORDER BY month
  ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)            -- متوسط آخر 3 صفوف</pre>
<p>المتوسطات المتحركة لـ [2,2,1,0]: 2، 2، 1.67، 1 — النوافذ الأولى تستخدم صفوفاً أقل. هذا <b>تنعيم وليس تنبؤاً</b>. احمِ نسبة التغير إذا كانت القيمة السابقة صفراً. القيمة التراكمية الأخيرة يجب أن تساوي المجموع السنوي. لعرض مارس فما بعد مع بقاء فبراير كسابق لـ LAG، احسب النافذة داخل <b>CTE</b> ثم صفِّ — التصفية أولاً تغيّر مجتمع المقارنة.</p>
<h3>الترتيب Ranking</h3>
<table><tr><th>الدالة</th><th>التعادل</th><th>القيم لـ 10، 8، 8، 5</th></tr>
<tr><td>RANK</td><td>نفس الرتبة مع فجوات</td><td>1، 2، 2، 4</td></tr>
<tr><td>DENSE_RANK</td><td>نفس الرتبة بدون فجوات</td><td>1، 2، 2، 3</td></tr>
<tr><td>ROW_NUMBER</td><td>مواقع فريدة</td><td>1، 2، 3، 4</td></tr></table>
<p>استخدم ROW_NUMBER مع مفتاح فاصل ثابت (مثل <code>ORDER BY crashes DESC, month</code>) لاختيار ثلاثة صفوف بالضبط بشكل قابل للتكرار، واستخدم DENSE_RANK = 1 لإرجاع كل الأشهر المتعادلة في القمة. العينات المصطنعة بحصص تصنع أعداداً متساوية وتعادلات — لا تعكس تغيرات حقيقية. الأوقات من نوع <code>timestamp without time zone</code> فلا تحوّلها لـ UTC بصمت.</p>`},

{id:"s17", unit:"u4", en:"Views, Query Plans & Indexes", ar:"العروض وخطط الاستعلام والفهارس",
en_body:`
<h3>Views as reporting contracts</h3>
<p>A <b>normal view</b> stores a SELECT <b>definition</b> and runs against current data each time it is queried. A <b>materialized view</b> stores results and needs a refresh policy. A view centralizes logic but doesn't make a wrong denominator correct, doesn't automatically improve performance and doesn't inherently grant access. A view is not a snapshot.</p>
<h3>Pooled vs averaged percentages</h3>
<pre>SELECT ROUND(100.0 * SUM(marked_arrest) / NULLIF(SUM(observed_arrest), 0), 2)
       AS marked_pct
FROM pg_temp.crime_summary;</pre>
<p>Pooling numerator and denominator gives the overall percentage. <b>Averaging category percentages</b> gives each group equal weight regardless of size — misleading. Observed-flag percentages use <b>known</b> flags as the denominator; missing flags stay visible (records − observed). An arrest flag is not a finding of guilt. Use a deterministic tie-breaker for top-N (<code>ORDER BY records DESC, category</code>). Reconcile sums with the source cohort.</p>
<h3>EXPLAIN and indexes</h3>
<p><b>Performance follows correctness:</b> first verify equivalent results, then compare plans. <code>EXPLAIN</code> shows the chosen plan (estimates); <code>EXPLAIN ANALYZE</code> <b>executes</b> the statement and adds actual observations — never apply it casually to writes. <code>EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)</code> gives detailed output. Costs are <b>planner units, not milliseconds</b>. Read scan/filter/sort nodes and estimated vs actual rows.</p>
<pre>CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date);</pre>
<p>A B-tree index fits a raw range filter (<code>crash_date &gt;= ... AND &lt; ...</code>). Wrapping the column in a function (e.g., <code>DATE_TRUNC('month', crash_date)</code>) may need an <b>expression index</b>. A small table may still use a <b>sequential scan</b> — that isn't automatically a problem. Cache, statistics, selectivity and environment affect timings, so no fixed threshold is asserted.</p>
<h3>Traffic dashboard from SQL</h3>
<pre>SELECT DATE_TRUNC('month', crash_date)::date AS month,
       COUNT(*) AS crashes, COUNT(injuries_total) AS observed,
       ROUND(AVG(injuries_total), 2) AS mean_injuries
FROM pg_temp.perf_crashes GROUP BY 1 ORDER BY 1;</pre>
<p>Plot only SQL result tables; keep the observation denominator visible. Quota-sampled volumes don't establish real prevalence.</p>`,
ar_body:`
<h3>العروض Views كعقود للتقارير</h3>
<p><b>العرض العادي</b> يحفظ <b>تعريف</b> جملة SELECT ويعمل على البيانات الحالية في كل مرة. <b>العرض المادي Materialized</b> يحفظ النتائج ويحتاج سياسة تحديث. العرض يوحّد المنطق لكنه لا يصحح مقاماً خاطئاً ولا يحسن الأداء تلقائياً ولا يمنح صلاحيات بذاته. العرض ليس لقطة ثابتة.</p>
<h3>النسب المجمّعة مقابل متوسط النسب</h3>
<pre>SELECT ROUND(100.0 * SUM(marked_arrest) / NULLIF(SUM(observed_arrest), 0), 2)
       AS marked_pct
FROM pg_temp.crime_summary;</pre>
<p>تجميع البسط والمقام يعطي النسبة الكلية. <b>متوسط نسب الفئات</b> يعطي كل مجموعة وزناً متساوياً بغض النظر عن حجمها — مضلل. نسبة العلامات الملاحظة تستخدم العلامات <b>المعروفة</b> مقاماً، والمفقودة تبقى ظاهرة (records − observed). علامة القبض ليست حكماً بالإدانة. استخدم فاصلاً حتمياً لأعلى N (<code>ORDER BY records DESC, category</code>) وطابق المجاميع مع المصدر.</p>
<h3>EXPLAIN والفهارس</h3>
<p><b>الأداء يأتي بعد الصحة:</b> تحقق أولاً من تطابق النتائج ثم قارن الخطط. <code>EXPLAIN</code> يعرض الخطة المختارة (تقديرات)، و <code>EXPLAIN ANALYZE</code> <b>ينفذ</b> الجملة ويضيف القيم الفعلية — لا تستخدمه عشوائياً مع جمل الكتابة. <code>EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)</code> لمخرجات مفصلة. التكاليف <b>وحدات للمخطط وليست أجزاء من الثانية</b>. اقرأ عقد المسح والتصفية والترتيب والصفوف المقدّرة مقابل الفعلية.</p>
<pre>CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date);</pre>
<p>فهرس B-tree يناسب تصفية نطاق خام (<code>crash_date &gt;= ... AND &lt; ...</code>). تغليف العمود بدالة (مثل <code>DATE_TRUNC('month', crash_date)</code>) قد يحتاج <b>فهرس تعبير</b>. الجدول الصغير قد يستخدم <b>المسح التسلسلي</b> رغم وجود فهرس — وهذا ليس مشكلة بالضرورة. الذاكرة المؤقتة والإحصاءات والانتقائية والبيئة تؤثر على الأزمنة، فلا يُفترض حد ثابت.</p>
<h3>لوحة المرور من SQL</h3>
<pre>SELECT DATE_TRUNC('month', crash_date)::date AS month,
       COUNT(*) AS crashes, COUNT(injuries_total) AS observed,
       ROUND(AVG(injuries_total), 2) AS mean_injuries
FROM pg_temp.perf_crashes GROUP BY 1 ORDER BY 1;</pre>
<p>ارسم جداول نتائج SQL فقط وأبقِ مقام الملاحظات ظاهراً. الأحجام المأخوذة بحصص لا تثبت انتشاراً حقيقياً.</p>`},

{id:"s18", unit:"u4", en:"Spatial SQL with PostGIS", ar:"SQL المكاني مع PostGIS",
en_body:`
<h3>Coordinates and SRID</h3>
<p><b>PostGIS</b> extends PostgreSQL with spatial types and functions (check with <code>SELECT PostGIS_Version();</code>; learners don't create extensions). For <b>EPSG:4326</b>, longitude is <b>X</b> and latitude is <b>Y</b>: <code>ST_MakePoint(lon, lat)</code>. <code>ST_SetSRID</code> <b>labels</b> coordinates with a system; <code>ST_Transform</code> <b>converts</b> them to another system. Swapping them gives plausible-looking but wrong results.</p>
<h3>Boundaries: ST_Covers vs ST_Contains</h3>
<p>Two rectangles A and B share an edge. Point 1 inside A, point 2 on the shared boundary, point 3 outside, point 4 has no geometry. <code>ST_Covers</code> <b>includes</b> boundaries (point 2 matches both A and B → 3 matches for 4 points); <code>ST_Contains</code> <b>excludes</b> a point lying only on the boundary.</p>
<pre>SELECT p.id, z.zone
FROM pg_temp.demo_points p
LEFT JOIN LATERAL (
  SELECT zone FROM pg_temp.demo_zones z
  WHERE ST_Covers(z.geom, p.geom)
  ORDER BY zone LIMIT 1) z ON true
ORDER BY p.id;</pre>
<p>The declared tie-break (first zone alphabetically / lowest district number) keeps <b>one row per point</b> — a teaching policy, not an official jurisdiction rule. Report <b>outside coverage</b> and <b>missing coordinates</b> separately; never silently count an event twice or drop it.</p>
<h3>Distance and units</h3>
<p><b>Geography</b> distance is in <b>metres</b>; <b>geometry</b> distance uses its CRS units — on 4326 that's <b>degrees</b>, so 500 ≠ 500 m.</p>
<pre>WHERE ST_DWithin(geom::geography,
      ST_SetSRID(ST_MakePoint(-87.65, 41.82), 4326)::geography, 150)</pre>
<p>Fixture: one point at the anchor, one ~111 m north, one ~2.2 km north → within 150 m returns points 1 and 2. <code>ST_Distance</code> on geography returns metres.</p>
<h3>Indexes and grids</h3>
<p>A <b>GiST</b> index must match the queried expression (geometry and geography indexes aren't interchangeable). A small sample may still use a sequential scan — check correctness first. For a <b>1 km grid</b>, transform points to the metre-based <b>EPSG:26916</b> (local projection for the Chicago example), divide X and Y by 1000 and take <code>FLOOR</code>. Every located point belongs to exactly one cell, so cell counts sum to the located total. Cell size and origin affect the picture; a count map is <b>not</b> a population-adjusted risk map. Invalid polygons produce misleading predicates.</p>`,
ar_body:`
<h3>الإحداثيات و SRID</h3>
<p><b>PostGIS</b> يضيف لـ PostgreSQL أنواعاً ودوالاً مكانية (تحقق بـ <code>SELECT PostGIS_Version();</code>، والمتدرب لا ينشئ إضافات). في <b>EPSG:4326</b> خط الطول هو <b>X</b> ودائرة العرض هي <b>Y</b>: <code>ST_MakePoint(lon, lat)</code>. <code>ST_SetSRID</code> <b>يوسم</b> الإحداثيات بنظام، و <code>ST_Transform</code> <b>يحوّلها</b> لنظام آخر. الخلط بينهما يعطي نتائج تبدو معقولة لكنها خاطئة.</p>
<h3>الحدود: ST_Covers مقابل ST_Contains</h3>
<p>مستطيلان A و B يشتركان في ضلع. النقطة 1 داخل A، والنقطة 2 على الحد المشترك، والنقطة 3 خارجهما، والنقطة 4 بدون إحداثيات. <code>ST_Covers</code> <b>يشمل</b> الحدود (النقطة 2 تطابق A و B ← 3 تطابقات لأربع نقاط)، و <code>ST_Contains</code> <b>يستبعد</b> النقطة الواقعة على الحد فقط.</p>
<pre>SELECT p.id, z.zone
FROM pg_temp.demo_points p
LEFT JOIN LATERAL (
  SELECT zone FROM pg_temp.demo_zones z
  WHERE ST_Covers(z.geom, p.geom)
  ORDER BY zone LIMIT 1) z ON true
ORDER BY p.id;</pre>
<p>قاعدة كسر التعادل المعلنة (أول منطقة أبجدياً / أصغر رقم حي) تحفظ <b>صفاً واحداً لكل نقطة</b> — سياسة تعليمية وليست قاعدة اختصاص رسمية. أبلغ عن <b>خارج التغطية</b> و<b>الإحداثيات المفقودة</b> منفصلين، ولا تعدّ حدثاً مرتين أو تحذفه بصمت.</p>
<h3>المسافة والوحدات</h3>
<p>مسافة <b>geography</b> بـ<b>الأمتار</b>، ومسافة <b>geometry</b> بوحدات نظامها — في 4326 هي <b>درجات</b>، فـ 500 ≠ 500 متر.</p>
<pre>WHERE ST_DWithin(geom::geography,
      ST_SetSRID(ST_MakePoint(-87.65, 41.82), 4326)::geography, 150)</pre>
<p>المثال: نقطة عند المرجع، ونقطة ~111 متراً شمالاً، ونقطة ~2.2 كم شمالاً ← ضمن 150 متراً تُرجع النقطتين 1 و 2. و <code>ST_Distance</code> على geography يرجع أمتاراً.</p>
<h3>الفهارس والشبكات</h3>
<p>فهرس <b>GiST</b> يجب أن يطابق التعبير المستعلم (فهارس geometry و geography غير متبادلة). العينة الصغيرة قد تستخدم المسح التسلسلي — تحقق من الصحة أولاً. لـ<b>شبكة 1 كم</b> حوّل النقاط لنظام <b>EPSG:26916</b> المتري (إسقاط محلي لمثال شيكاغو)، واقسم X و Y على 1000 وخذ <code>FLOOR</code>. كل نقطة لها موقع تقع في خلية واحدة فقط، فمجموع الخلايا = مجموع النقاط ذات الموقع. حجم الخلية وأصلها يؤثران على الصورة، وخريطة الأعداد <b>ليست</b> خريطة خطر معدّلة بالسكان. المضلعات غير الصالحة تعطي نتائج مضللة.</p>`},

{id:"s19", unit:"u4", en:"Integrated District-Month Capstone", ar:"مشروع التكامل: الحي والشهر",
en_body:`
<h3>Week 05 setup (Colab + Neon)</h3>
<p>Continue the Week 04 connection on the same Neon database; no Docker needed. The instructor imports the snapshot, enables PostGIS, creates analytical views and provisions restricted roles. Run <code>00_colab_neon_spatial_check.ipynb</code>: enable <code>DATABASE_URL</code> in Secrets, set <code>COURSE_TEAM_SCHEMA</code>, verify valid district geometries with SRID 4326 and a passing metric-distance assertion. Restarting Colab doesn't require re-importing the shared database. Daily plan: Day 1 joins/CTEs, Day 2 rankings/LAG/moving averages, Day 3 views & dashboards, Day 4 PostGIS, Day 5 integrated report. Each day: 30 min concepts + 90 min lab + 30 min review + 90 min lab. Notebooks keep <b>one connection open</b> so temporary tables and views survive between cells.</p>
<h3>Capstone contract</h3>
<p>Integrate crime and traffic records at <b>district-month grain</b> for 2025. Team roles: data-quality analyst, SQL analyst, spatial analyst, reviewer/presenter. Agree on output key, calendar, assignment rule, observation denominators and exclusions <b>before</b> coding.</p>
<ol><li>Verify synthetic provenance and the year boundary.</li>
<li>Assign each event to at most one district with <code>ST_Covers</code>, lowest district id on ties.</li>
<li>Retain unmatched events for coverage accounting.</li>
<li>Aggregate crime and traffic <b>independently</b> by district and month.</li>
<li>Build all districts × twelve months (<code>CROSS JOIN generate_series(...)</code>).</li>
<li>Join the aggregates on <b>both</b> keys, filling absent counts with zero.</li>
<li>Reconcile every count before drawing conclusions.</li></ol>
<pre>SELECT d.dist_num, m::date AS month
FROM training.districts d
CROSS JOIN generate_series(timestamp '2025-01-01', timestamp '2025-12-01',
                           interval '1 month') m;</pre>
<p>Expected shape: 12 rows per district with a unique (district, month) key. Pitfalls: joining raw event tables multiplies events; joining on district alone multiplies months; <code>LAG</code> without <code>PARTITION BY dist_num</code> leaks the previous district into the next; a mean of district means changes weights (use pooled sums). Missing injury observations stay separate from zero event counts. Reconcile mapped totals with assigned sources and all-source totals with assigned + unmatched.</p>
<h3>Dashboard and handover</h3>
<p>Dashboards show SQL result tables with explicit units and coverage; keep crime and crash counts separate. A peer reviewer must reproduce the report from a fresh session without seeing a private credential; outputs must contain no credentials or event identifiers. Exporting only a chart loses query and denominator evidence. Rubric: correct SQL & grain 40, validation 25, interpretation 20, reproducibility 15. A district with more sampled events is not necessarily more dangerous (no exposure adjustment).</p>`,
ar_body:`
<h3>إعداد الأسبوع 05 (Colab + Neon)</h3>
<p>نكمل اتصال الأسبوع 04 على نفس قاعدة Neon بدون Docker. المدرب يستورد اللقطة ويفعّل PostGIS وينشئ العروض التحليلية ويجهز الأدوار المقيدة. شغّل <code>00_colab_neon_spatial_check.ipynb</code>: فعّل <code>DATABASE_URL</code> في Secrets، وحدد <code>COURSE_TEAM_SCHEMA</code>، وتحقق من صلاحية أشكال الأحياء بـ SRID 4326 ونجاح اختبار المسافة بالأمتار. إعادة تشغيل Colab لا تتطلب إعادة استيراد القاعدة المشتركة. الخطة: اليوم 1 الربط و CTE، اليوم 2 الترتيب و LAG والمتوسطات المتحركة، اليوم 3 العروض واللوحات، اليوم 4 PostGIS، اليوم 5 التقرير المتكامل. كل يوم: 30 دقيقة مفاهيم + 90 معمل + 30 مراجعة + 90 معمل. الدفاتر تُبقي <b>اتصالاً واحداً مفتوحاً</b> لتبقى الجداول والعروض المؤقتة بين الخلايا.</p>
<h3>عقد المشروع</h3>
<p>دمج سجلات الجرائم والمرور على <b>مستوى الحي-الشهر</b> لسنة 2025. الأدوار: محلل جودة البيانات، محلل SQL، المحلل المكاني، المراجع/المقدم. اتفقوا على مفتاح المخرج والتقويم وقاعدة الإسناد ومقامات الملاحظة والاستثناءات <b>قبل</b> البرمجة.</p>
<ol><li>تحقق من أن المصدر مصطنع ومن حدود السنة.</li>
<li>أسند كل حدث لحي واحد على الأكثر بـ <code>ST_Covers</code>، وأصغر رقم حي عند التعادل.</li>
<li>احتفظ بالأحداث غير المطابقة لحساب التغطية.</li>
<li>جمّع الجرائم والمرور <b>كلاً على حدة</b> حسب الحي والشهر.</li>
<li>ابنِ كل الأحياء × 12 شهراً (<code>CROSS JOIN generate_series(...)</code>).</li>
<li>اربط التجميعات على <b>المفتاحين معاً</b> واملأ الغائب بصفر.</li>
<li>طابق كل الأعداد قبل الاستنتاج.</li></ol>
<pre>SELECT d.dist_num, m::date AS month
FROM training.districts d
CROSS JOIN generate_series(timestamp '2025-01-01', timestamp '2025-12-01',
                           interval '1 month') m;</pre>
<p>الشكل المتوقع: 12 صفاً لكل حي بمفتاح فريد (الحي، الشهر). أخطاء شائعة: ربط جداول الأحداث الخام يضاعف الأحداث؛ الربط على الحي فقط يضاعف الأشهر؛ <code>LAG</code> بدون <code>PARTITION BY dist_num</code> يسرّب قيمة الحي السابق للتالي؛ متوسط متوسطات الأحياء يغيّر الأوزان (استخدم المجاميع المجمّعة). ملاحظات الإصابة المفقودة تبقى منفصلة عن الأعداد الصفرية. طابق المجاميع المرسومة مع المسندة، والمجموع الكلي = المسند + غير المطابق.</p>
<h3>اللوحة والتسليم</h3>
<p>اللوحات تعرض جداول نتائج SQL بوحدات وتغطية واضحة، مع فصل أعداد الجرائم عن الحوادث. المراجع يجب أن يعيد إنتاج التقرير من جلسة جديدة بدون رؤية بيانات دخول خاصة، والمخرجات بدون بيانات دخول أو معرّفات أحداث. تصدير الرسم فقط يفقد دليل الاستعلام والمقام. التقييم: صحة SQL والمستوى 40، التحقق 25، التفسير 20، قابلية التكرار 15. الحي الذي فيه أحداث أكثر في العينة ليس بالضرورة أخطر (لا يوجد تعديل حسب التعرض).</p>`},

{id:"s20", unit:"u5", en:"Week 06 Overview: NumPy & Pandas Plan", ar:"نظرة على الأسبوع 06: خطة NumPy و Pandas",
en_body:`
<p class="note">Only the "Start here" resource is open in your account now; the rest of Week 06 unlocks as you progress.</p>
<h3>The four curriculum topics</h3>
<ul><li><b>06.01</b> NumPy numerical and matrix operations</li>

en_body:`
<h3>Notebook basics (Colab)</h3>
<p>Python has an <b>interactive mode</b>: typing <code>2 + 5</code> shows 7 immediately. In a notebook cell only the <b>last</b> expression is displayed — if a cell has <code>5 + 5</code> then <code>9 - 4</code>, only 5 appears; use <code>print()</code> to show both. <code>print()</code> prints text, numbers or results and accepts several items separated by commas. <b>Ctrl+Enter</b> runs the selected cell; <b>Shift+Enter</b> runs it and moves to the next. The <b>+</b> button adds a code cell. Google Drive is mounted in Colab with <code>from google.colab import drive; drive.mount('/content/drive')</code>. Cells depend on run order: using <code>y</code> in a cell before the cell that defines it raises <b>NameError: name 'y' is not defined</b>.</p>
<h3>Arithmetic and bitwise operators</h3>
<table><tr><th>Operation</th><th>Example</th><th>Result</th></tr>
<tr><td>add / subtract</td><td>5 + 5 / 9 - 4</td><td>10 / 5</td></tr>
<tr><td>multiply</td><td>2 * 5 * 10</td><td>100</td></tr>
<tr><td>divide (always float)</td><td>5 / 5</td><td>1.0</td></tr>
<tr><td>power</td><td>2 ** 4</td><td>16</td></tr>
<tr><td>shift left (× 2)</td><td>5 &lt;&lt; 1 (0101 → 1010)</td><td>10</td></tr>
<tr><td>shift right (÷ 2)</td><td>10 &gt;&gt; 1 (1010 → 101)</td><td>5</td></tr></table>
<p>Augmented assignment: <code>age += 20</code> means <code>age = age + 20</code> (20 → 40 → 60). <code>sum([3,4,2,1])</code> = 10.</p>
<h3>Variables and assignment</h3>
<ol><li>A <b>variable</b> is a name that refers to a value (the value is stored in memory and accessed by the name).</li><li>An <b>assignment statement</b> creates new variables and gives them values.</li><li>The assignment operator is <code>=</code>, not the equality operator <code>==</code>.</li><li>The type of a variable is the type of the value it refers to.</li><li><code>print</code> displays the value of a variable.</li></ol>
<p>In <code>x = 5</code>: x is the variable, 5 the value, = the assignment operator. Expressions evaluate to a value and every value has a type: <code>type(4 + 2)</code> → int, <code>type(9 &gt; 5)</code> → bool, <code>type("alice" + " " + "bob")</code> → str, <code>type(10 + float('.5'))</code> → float, <code>type(int('10'))</code> → int, <code>type(['3000.0000000000', 2])</code> → list.</p>
<p><b>Dynamic typing:</b> unlike statically typed languages, Python lets a variable change type: <code>x = 1</code> (int) → <code>x = 'hello'</code> (str) → <code>x = [1, 2, 3]</code> (list).</p>
<h3>Numbers vs number strings</h3>
<p>20 is an <code>int</code>; "20" is a <code>str</code> (single and double quotes are equivalent). <code>20 + '20'</code> → <b>TypeError: unsupported operand type(s) for +: 'int' and 'str'</b>. Convert first: <code>z = int(y)</code> then <code>x + z</code> = 40. To join text and numbers use <code>str()</code>: <code>print('hi ' + name + ' your age is ' + str(age))</code>. Other type errors: <code>int(['adm','body'])</code> → TypeError (int() needs a string, bytes or real number, not a list); <code>[9,13,15,40] + 1986</code> → TypeError (can only concatenate list to list). <code>"1" + str(0000)</code> → '10'.</p>
<h3>input()</h3>
<p><code>input("message")</code> prints the message, waits for the user to type and press Enter, and <b>always returns a string</b>. Convert numbers with <code>int()</code>:</p>
<pre>name = input("write your name")
age = input("write your age")
print("your birthyear is", 2026 - int(age))   # 40 → 1986
print(name + age)                              # 'hani' + '40' → hani40
password = input("Enter password: ")
if password == "AI": print("Welcome to the course")
else: print("Sorry, wrong password")</pre>
<p>String comparison is case-sensitive: <code>'Hani' == 'hani'</code> → False (so typing "ai" fails the "AI" password).</p>
<h3>Rules for naming variables</h3>
<ol><li>Names are <b>case-sensitive</b>: <code>my_variable</code> ≠ <code>My_Variable</code>.</li><li>Names <b>cannot start with a number</b> (<code>2my_variable</code> is invalid).</li><li>You cannot use <b>reserved keywords</b>: <code>class = 5</code>, <code>break = True</code>, <code>True = 0</code> → SyntaxError: cannot assign to True.</li><li>You <b>should not</b> use built-in function names (<code>sum</code>, <code>max</code>, <code>list</code>) — it works but hides the built-in.</li></ol>
<table><tr><th>Category</th><th>Keywords</th></tr>
<tr><td>Logical operators</td><td>and, or, not, is</td></tr><tr><td>Conditionals</td><td>if, elif, else</td></tr><tr><td>Loops</td><td>while, for, break, continue</td></tr>
<tr><td>Exception handling</td><td>try, except, finally</td></tr><tr><td>Functions & classes</td><td>def, class, return, yield, lambda</td></tr>
<tr><td>Special values</td><td>None, True, False</td></tr><tr><td>Other</td><td>import, from, as, assert, global, nonlocal, with, pass</td></tr></table>
<p>Use <b>meaningful names</b>: <code>x2 = 35.0; y = 12.50; mne = x2*y</code> is unclear; <code>hours = 35.0; rate = 12.50; pay = hours * rate</code> (437.5) shows intent.</p>
<h3>Built-in data types</h3>
<p>A data type tells which operations can be performed (numbers are added/multiplied; strings are concatenated).</p>
<table><tr><th>Category</th><th>Types</th><th>Example</th></tr>
<tr><td>Text</td><td>str</td><td>message = "Hello, world!"</td></tr>
<tr><td>Numeric</td><td>int, float, complex</td><td>10, 3.14, 1 + 2j</td></tr>
<tr><td>Sequence</td><td>list, tuple, range</td><td>[1,2,3], (1,2,3), range(10)</td></tr>
<tr><td>Mapping</td><td>dict</td><td>{"name": "Alice", "age": 25}</td></tr>
<tr><td>Set</td><td>set, frozenset</td><td>{1,2,3}, frozenset({1,2,3})</td></tr>
<tr><td>Boolean</td><td>bool</td><td>True / False</td></tr>
<tr><td>Binary</td><td>bytes, bytearray, memoryview</td><td>b"Hello"</td></tr>
<tr><td>None</td><td>NoneType</td><td>None</td></tr></table>
<p><code>for i in range(10): print(i)</code> prints 0 to 9.</p>
<p class="ex">Exercises: build <code>full_name</code> from "Alice" and "Smith" with a space; greet the user by first and last name using input; rectangle area from input width and height (convert with int); tell the user their age in 10 years; print every number in <code>grades = [85, 42, 90, 67, 38, 76, 59, 95]</code> with a for loop; types of <code>3.14</code>, <code>"5" + "5"</code>, <code>10 + 5</code>, <code>True or False</code>.</p>`,
ar_body:`
<h3>أساسيات الدفتر (Colab)</h3>
<p>بايثون لها <b>وضع تفاعلي</b>: كتابة <code>2 + 5</code> تعرض 7 فوراً. في خلية الدفتر تُعرض <b>آخر</b> قيمة فقط — إذا كتبت <code>5 + 5</code> ثم <code>9 - 4</code> يظهر 5 فقط، فاستخدم <code>print()</code> لعرض الاثنين. <code>print()</code> تطبع النصوص والأرقام والنتائج وتقبل عدة عناصر بينها فواصل. <b>Ctrl+Enter</b> يشغّل الخلية المحددة، و <b>Shift+Enter</b> يشغّلها وينتقل للتالية، وزر <b>+</b> يضيف خلية كود. ربط Google Drive في Colab: <code>from google.colab import drive; drive.mount('/content/drive')</code>. الخلايا تعتمد على ترتيب التشغيل: استخدام <code>y</code> قبل تشغيل الخلية التي تعرّفه يعطي <b>NameError: name 'y' is not defined</b>.</p>
<h3>العمليات الحسابية والثنائية</h3>
<table><tr><th>العملية</th><th>مثال</th><th>النتيجة</th></tr>
<tr><td>جمع / طرح</td><td>5 + 5 / 9 - 4</td><td>10 / 5</td></tr>
<tr><td>ضرب</td><td>2 * 5 * 10</td><td>100</td></tr>
<tr><td>قسمة (دائماً عشري)</td><td>5 / 5</td><td>1.0</td></tr>
<tr><td>أس</td><td>2 ** 4</td><td>16</td></tr>
<tr><td>إزاحة لليسار (× 2)</td><td>5 &lt;&lt; 1 (0101 ← 1010)</td><td>10</td></tr>
<tr><td>إزاحة لليمين (÷ 2)</td><td>10 &gt;&gt; 1 (1010 ← 101)</td><td>5</td></tr></table>
<p>الإسناد المختصر: <code>age += 20</code> يعني <code>age = age + 20</code> (20 ← 40 ← 60). و <code>sum([3,4,2,1])</code> = 10.</p>
<h3>المتغيرات والإسناد</h3>
<ol><li><b>المتغير</b> اسم يشير إلى قيمة (القيمة محفوظة في الذاكرة ونصل لها بالاسم).</li><li><b>جملة الإسناد</b> تنشئ المتغيرات وتعطيها قيماً.</li><li>عامل الإسناد هو <code>=</code> وليس عامل المساواة <code>==</code>.</li><li>نوع المتغير هو نوع القيمة التي يشير إليها.</li><li><code>print</code> تعرض قيمة المتغير.</li></ol>
<p>في <code>x = 5</code>: x المتغير، و 5 القيمة، و = عامل الإسناد. التعابير تُحسب لتعطي قيمة، ولكل قيمة نوع: <code>type(4 + 2)</code> ← int، و <code>type(9 &gt; 5)</code> ← bool، و <code>type("alice" + " " + "bob")</code> ← str، و <code>type(10 + float('.5'))</code> ← float، و <code>type(int('10'))</code> ← int، و <code>type(['3000.0000000000', 2])</code> ← list.</p>
<p><b>الأنواع الديناميكية:</b> بعكس اللغات ذات الأنواع الثابتة، بايثون تسمح بتغيير نوع المتغير: <code>x = 1</code> (int) ← <code>x = 'hello'</code> (str) ← <code>x = [1, 2, 3]</code> (list).</p>
<h3>الأرقام مقابل النصوص الرقمية</h3>
<p>20 من نوع <code>int</code> و "20" من نوع <code>str</code> (التنصيص المفرد والمزدوج متساويان). <code>20 + '20'</code> ← <b>TypeError: unsupported operand type(s) for +: 'int' and 'str'</b>. حوّل أولاً: <code>z = int(y)</code> ثم <code>x + z</code> = 40. ولدمج نص مع رقم استخدم <code>str()</code>: <code>print('hi ' + name + ' your age is ' + str(age))</code>. أخطاء أنواع أخرى: <code>int(['adm','body'])</code> ← TypeError (int تحتاج نصاً أو bytes أو رقماً لا قائمة)؛ <code>[9,13,15,40] + 1986</code> ← TypeError (القائمة تُدمج مع قائمة فقط). و <code>"1" + str(0000)</code> ← '10'.</p>
<h3>الدالة input()</h3>
<p><code>input("رسالة")</code> تطبع الرسالة وتنتظر المستخدم يكتب ويضغط Enter، و<b>ترجع نصاً دائماً</b>. حوّل الأرقام بـ <code>int()</code>:</p>
<pre>name = input("write your name")
age = input("write your age")
print("your birthyear is", 2026 - int(age))   # 40 ← 1986
print(name + age)                              # 'hani' + '40' ← hani40
password = input("Enter password: ")
if password == "AI": print("Welcome to the course")
else: print("Sorry, wrong password")</pre>
<p>مقارنة النصوص حساسة لحالة الأحرف: <code>'Hani' == 'hani'</code> ← False (لذلك كتابة "ai" تفشل مع كلمة المرور "AI").</p>
<h3>قواعد تسمية المتغيرات</h3>
<ol><li>الأسماء <b>حساسة لحالة الأحرف</b>: <code>my_variable</code> ≠ <code>My_Variable</code>.</li><li><b>لا تبدأ برقم</b> (<code>2my_variable</code> غير صالح).</li><li><b>لا تستخدم الكلمات المحجوزة</b>: <code>class = 5</code> و <code>break = True</code> و <code>True = 0</code> ← SyntaxError: cannot assign to True.</li><li><b>لا يُنصح</b> باستخدام أسماء الدوال المدمجة (<code>sum</code> و <code>max</code> و <code>list</code>) — تعمل لكنها تخفي الدالة الأصلية.</li></ol>
<table><tr><th>الفئة</th><th>الكلمات المحجوزة</th></tr>
<tr><td>العوامل المنطقية</td><td>and, or, not, is</td></tr><tr><td>الشروط</td><td>if, elif, else</td></tr><tr><td>الحلقات</td><td>while, for, break, continue</td></tr>
<tr><td>الاستثناءات</td><td>try, except, finally</td></tr><tr><td>الدوال والأصناف</td><td>def, class, return, yield, lambda</td></tr>
<tr><td>قيم خاصة</td><td>None, True, False</td></tr><tr><td>أخرى</td><td>import, from, as, assert, global, nonlocal, with, pass</td></tr></table>
<p>استخدم <b>أسماء ذات معنى</b>: <code>x2 = 35.0; y = 12.50; mne = x2*y</code> غير واضح، أما <code>hours = 35.0; rate = 12.50; pay = hours * rate</code> (437.5) فيوضح القصد.</p>
<h3>أنواع البيانات المدمجة</h3>
<p>نوع البيانات يحدد العمليات الممكنة (الأرقام تُجمع وتُضرب، والنصوص تُدمج).</p>
<table><tr><th>الفئة</th><th>الأنواع</th><th>مثال</th></tr>
<tr><td>نص</td><td>str</td><td>message = "Hello, world!"</td></tr>
<tr><td>أرقام</td><td>int, float, complex</td><td>10, 3.14, 1 + 2j</td></tr>
<tr><td>تسلسلات</td><td>list, tuple, range</td><td>[1,2,3], (1,2,3), range(10)</td></tr>
<tr><td>ربط</td><td>dict</td><td>{"name": "Alice", "age": 25}</td></tr>
<tr><td>مجموعات</td><td>set, frozenset</td><td>{1,2,3}, frozenset({1,2,3})</td></tr>
<tr><td>منطقي</td><td>bool</td><td>True / False</td></tr>
<tr><td>ثنائي</td><td>bytes, bytearray, memoryview</td><td>b"Hello"</td></tr>
<tr><td>لا شيء</td><td>NoneType</td><td>None</td></tr></table>
<p><code>for i in range(10): print(i)</code> تطبع 0 إلى 9.</p>
<p class="ex">تمارين: كوّن <code>full_name</code> من "Alice" و "Smith" بينهما مسافة؛ رحّب بالمستخدم باسمه الأول والأخير عبر input؛ احسب مساحة مستطيل من عرض وطول مُدخلين (حوّل بـ int)؛ أخبر المستخدم بعمره بعد 10 سنوات؛ اطبع كل رقم في <code>grades = [85, 42, 90, 67, 38, 76, 59, 95]</code> بحلقة for؛ ما نوع <code>3.14</code> و <code>"5" + "5"</code> و <code>10 + 5</code> و <code>True or False</code>.</p>`},

{id:"s06", unit:"u2", en:"Strings", ar:"النصوص Strings",
en_body:`
<h3>Creating strings</h3>
<p>Strings represent text such as names, addresses (<code>"Riyadh, Saudi Arabia"</code>), phone numbers kept as text (<code>"00966555555555"</code>) and messages. Single and double quotes are equivalent; one can contain the other (<code>"wor'h'ld"</code>). Triple quotes <code>"""..."""</code> or <code>'''...'''</code> create multi-line strings and may contain both quote types. Escape a quote with <code>\\'</code>; inside a string a line break appears as <code>\\n</code>.</p>
<pre>name = 'ahmeddd'
for ch in name: print(ch)   # a h m e d d d (one per line)
len(name)                   # 7
"0" * 8                     # '00000000'  (repetition)
2 * 100                     # 200         (numbers multiply)
"a" in "aeiou"              # True        (membership)
5 in [1, 2, 3]              # False</pre>
<h3>Indexing and slicing</h3>
<p>A string is a <b>sequence of characters</b> indexed with <code>[]</code>: first element at 0, second at 1, last at −1. An index past the end raises <b>IndexError: string index out of range</b>; slices never raise (<code>name[:200]</code> returns the whole string).</p>
<pre>name = "Pythonista"
name[0], name[-1], name[9]   # 'P', 'a', 'a'
name[10]                     # IndexError
name[:5], name[5:]           # 'Pytho', 'nista'
name[2:5]                    # 'tho'
name[-4:]                    # 'ista'
name[-5:]                    # 'nista'
s = "ABCDEF"
s[::-1]     # 'FEDCBA'   reverse
s[0::2]     # 'ACE'      every 2nd
s[::-3]     # 'FC'
s[-1:0:-1]  # 'FEDCB'    (end index 0 excluded)
"Johnson"[0:4]  # 'John'</pre>
<p>Slicing is <code>[start:end:step]</code>; <code>end</code> is excluded; omitted start/end mean the beginning/end of the string.</p>
<h3>Methods (strings are objects)</h3>
<p>Objects have methods called with the dot operator. <code>dir(name)</code> lists them all; <code>for i in dir(name): if 'is' in i: print(i)</code> shows the checks: isalnum, isalpha, isascii, isdecimal, isdigit, isidentifier, islower, isnumeric, isprintable, isspace, istitle, isupper.</p>
<table><tr><th>Method</th><th>Example → result</th></tr>
<tr><td>upper / lower</td><td>"hello".upper() → 'HELLO'; "HeLLO".lower() → 'hello'</td></tr>
<tr><td>capitalize</td><td>'ahmed'.capitalize() → 'Ahmed'</td></tr>
<tr><td>title</td><td>'john doe'.title() → 'John Doe'</td></tr>
<tr><td>islower / isupper</td><td>'john doe'.islower() → True</td></tr>
<tr><td>count</td><td>'ahmed'.count('ah') → 1; 'John Doe'.count('m') → 0</td></tr>
<tr><td>find</td><td>'John Doe'.find(' Do') → 4; .find('ohn') → 1; −1 if missing</td></tr>
<tr><td>replace(old, new, count)</td><td>'John Doe'.replace('ohn','Owen') → 'JOwen Doe'</td></tr>
<tr><td>strip</td><td>" na me ".strip() → 'na me'</td></tr>
<tr><td>split</td><td>'hello,world worl'.split() → ['hello,world', 'worl']</td></tr>
<tr><td>join</td><td>" ibraheem ".join(["ahmed","mo","fatima",""])</td></tr>
<tr><td>startswith / endswith</td><td>'Jhone'.startswith('J') → True</td></tr>
<tr><td>ljust / rjust / center</td><td>pad to a width: len(name.ljust(100)) → 100</td></tr></table>
<p>Writing <code>name.center</code> without parentheses prints the method object, not a result. Padding with format: <code>format(123, "&lt;06d")</code> → '123000' (a str). Decorating: <code>'John'.center(20, '-')</code> → <code>--------John--------</code> between two lines of <code>'-' * 20</code>.</p>
<h3>Three ways to build strings</h3>
<pre>name, age = "John", 30
"My name is " + name + " and my age is " + str(age)   # + operator (needs str())
"My name is {} and my age is {}".format(name, age)       # format method
f"My name is {name} and my age is {age}"                 # f-string
print("Age:", age, "test")                               # print with commas</pre>
<h3>Number formatting</h3>
<pre>num = 10.5679
"{:.3f}".format(num)  # '10.568'
f"{num:.3f}"          # '10.568'
f"{num:&gt;100.2f}"      # right-aligned, width 100 → '10.57'
f"{1000000:,}"        # '1,000,000'
f"{0.235:.2%}"        # '23.50%'
f"$ {19.95:,.2f}"     # currency
f"{9000:.2e}"         # '9.00e+03'</pre>
<p class="ex">Exercises: name[0], [1], [-1], [-2] for "Johnson"; name[1:3], [3:5]; start/end/step of <code>[::2]</code>, <code>[::-1]</code>, <code>[1:5:2]</code>; reverse a string (<code>'ahmed'[None:None:-1]</code> → 'demha'); every other character (abcdef → bdf); reverse every other and capitalize (abcdef → FDB); count "o" in "hello world"; concatenate first and last name three ways; a 5-line text task: count letters with spaces, count words, add "," at each line end, check for digits, loop line by line, save words in a list.</p>`,
ar_body:`
<h3>إنشاء النصوص</h3>
<p>النصوص تمثل الكتابة مثل الأسماء والعناوين (<code>"Riyadh, Saudi Arabia"</code>) وأرقام الجوال المحفوظة كنص (<code>"00966555555555"</code>) والرسائل. التنصيص المفرد والمزدوج متساويان، وأحدهما يمكن أن يحتوي الآخر (<code>"wor'h'ld"</code>). التنصيص الثلاثي <code>"""..."""</code> أو <code>'''...'''</code> ينشئ نصاً متعدد الأسطر ويحتوي النوعين. تهريب علامة التنصيص بـ <code>\\'</code>، وفاصل السطر يظهر داخل النص كـ <code>\\n</code>.</p>
<pre>name = 'ahmeddd'
for ch in name: print(ch)   # a h m e d d d (حرف بكل سطر)
len(name)                   # 7
"0" * 8                     # '00000000'  (تكرار)
2 * 100                     # 200         (الأرقام تُضرب)
"a" in "aeiou"              # True        (العضوية)
5 in [1, 2, 3]              # False</pre>
<h3>الفهرسة والتقطيع</h3>
<p>النص <b>تسلسل من الأحرف</b> يُفهرس بـ <code>[]</code>: أول عنصر عند 0 والثاني عند 1 والأخير عند −1. الفهرس بعد النهاية يعطي <b>IndexError: string index out of range</b>، أما التقطيع فلا يعطي خطأ (<code>name[:200]</code> يرجع النص كاملاً).</p>
<pre>name = "Pythonista"
name[0], name[-1], name[9]   # 'P', 'a', 'a'
name[10]                     # IndexError
name[:5], name[5:]           # 'Pytho', 'nista'
name[2:5]                    # 'tho'
name[-4:]                    # 'ista'
name[-5:]                    # 'nista'
s = "ABCDEF"
s[::-1]     # 'FEDCBA'   عكس
s[0::2]     # 'ACE'      كل ثاني حرف
s[::-3]     # 'FC'
s[-1:0:-1]  # 'FEDCB'    (الفهرس 0 غير مشمول)
"Johnson"[0:4]  # 'John'</pre>
<p>التقطيع <code>[start:end:step]</code>، و <code>end</code> غير مشمول، وحذف البداية/النهاية يعني بداية/نهاية النص.</p>
<h3>الدوال (النصوص كائنات)</h3>
<p>للكائنات دوال تُستدعى بالنقطة. <code>dir(name)</code> يعرضها كلها، و <code>for i in dir(name): if 'is' in i: print(i)</code> يعرض دوال الفحص: isalnum و isalpha و isascii و isdecimal و isdigit و isidentifier و islower و isnumeric و isprintable و isspace و istitle و isupper.</p>
<table><tr><th>الدالة</th><th>مثال ← النتيجة</th></tr>
<tr><td>upper / lower</td><td>"hello".upper() ← 'HELLO'؛ "HeLLO".lower() ← 'hello'</td></tr>
<tr><td>capitalize</td><td>'ahmed'.capitalize() ← 'Ahmed'</td></tr>
<tr><td>title</td><td>'john doe'.title() ← 'John Doe'</td></tr>
<tr><td>islower / isupper</td><td>'john doe'.islower() ← True</td></tr>
<tr><td>count</td><td>'ahmed'.count('ah') ← 1؛ 'John Doe'.count('m') ← 0</td></tr>
<tr><td>find</td><td>'John Doe'.find(' Do') ← 4؛ ‎.find('ohn') ← 1؛ و −1 إذا لم يوجد</td></tr>
<tr><td>replace(old, new, count)</td><td>'John Doe'.replace('ohn','Owen') ← 'JOwen Doe'</td></tr>
<tr><td>strip</td><td>" na me ".strip() ← 'na me'</td></tr>
<tr><td>split</td><td>'hello,world worl'.split() ← ['hello,world', 'worl']</td></tr>
<tr><td>join</td><td>" ibraheem ".join(["ahmed","mo","fatima",""])</td></tr>
<tr><td>startswith / endswith</td><td>'Jhone'.startswith('J') ← True</td></tr>
<tr><td>ljust / rjust / center</td><td>الحشو لعرض معين: len(name.ljust(100)) ← 100</td></tr></table>
<p>كتابة <code>name.center</code> بدون أقواس تطبع كائن الدالة لا النتيجة. الحشو بـ format: <code>format(123, "&lt;06d")</code> ← '123000' (نص). التزيين: <code>'John'.center(20, '-')</code> ← <code>--------John--------</code> بين سطرين من <code>'-' * 20</code>.</p>
<h3>ثلاث طرق لبناء النصوص</h3>
<pre>name, age = "John", 30
"My name is " + name + " and my age is " + str(age)   # عامل + (يحتاج str())
"My name is {} and my age is {}".format(name, age)       # دالة format
f"My name is {name} and my age is {age}"                 # f-string
print("Age:", age, "test")                               # print مع فواصل</pre>
<h3>تنسيق الأرقام</h3>
<pre>num = 10.5679
"{:.3f}".format(num)  # '10.568'
f"{num:.3f}"          # '10.568'
f"{num:&gt;100.2f}"      # محاذاة لليمين بعرض 100 ← '10.57'
f"{1000000:,}"        # '1,000,000'
f"{0.235:.2%}"        # '23.50%'
f"$ {19.95:,.2f}"     # العملة
f"{9000:.2e}"         # '9.00e+03'</pre>
<p class="ex">تمارين: name[0] و [1] و [-1] و [-2] لـ "Johnson"؛ name[1:3] و [3:5]؛ البداية والنهاية والخطوة في <code>[::2]</code> و <code>[::-1]</code> و <code>[1:5:2]</code>؛ عكس نص (<code>'ahmed'[None:None:-1]</code> ← 'demha')؛ كل حرف ثانٍ (abcdef ← bdf)؛ العكس مع كل حرف ثانٍ وتكبيره (abcdef ← FDB)؛ عدّ حرف o في "hello world"؛ دمج الاسم الأول والأخير بالطرق الثلاث؛ مهمة نص من 5 أسطر: عدّ الأحرف مع المسافات، عدّ الكلمات، إضافة "," لنهاية كل سطر، فحص وجود أرقام، المرور سطراً سطراً، حفظ الكلمات في قائمة.</p>`}
);
