 --ink:#ece9f7; --paper:#14121c; --panel:#1d1a28; --line:#2f2b40; --muted:#a19cb8;

html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}

.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}

{id:"s01", unit:"u1", en:"AI & Data Science Introduction", ar:"مقدمة الذكاء الاصطناعي وعلم البيانات",
en_body:`
<h3>The bootcamp journey</h3>
<p>The Data Science & Machine Learning bootcamp (instructor: Hany Elshafey — AI researcher, AI & Data Science instructor, GeoSpatial AI engineer) follows an 8-week path:</p>
<table><tr><th>Week</th><th>Topic</th></tr>
<tr><td>1</td><td>Python</td></tr><tr><td>2</td><td>Linear Algebra & Statistics</td></tr><tr><td>3</td><td>EDA (Exploratory Data Analysis)</td></tr><tr><td>4</td><td>Supervised Machine Learning</td></tr><tr><td>5</td><td>Unsupervised Machine Learning</td></tr><tr><td>6</td><td>Deep Learning</td></tr><tr><td>7</td><td>Computer Vision</td></tr><tr><td>8</td><td>NLP and Project</td></tr></table>
<p><b>How to get the most out of the course:</b> be curious (ask questions), practice daily (code every day), collaborate (help peers), experiment (mistakes are part of learning) and stay connected (Discord channels for support).</p>
<h3>What is Data Science?</h3>
<p>"Data Science is the art and science of extracting insights and knowledge from data, using statistics, programming, and domain expertise."</p>
<p><b>Data Science pipeline:</b> Data Collection → Data Cleaning → Data Analysis → Insights → Decision.</p>
<p><b>Why it matters:</b> (1) data is everywhere — social media, sensors, business, health; (2) DS helps organizations make informed decisions; (3) examples: recommending movies on Netflix, detecting fraud, predicting trends.</p>
<h3>What is AI?</h3>
<p>Artificial Intelligence is the field of computer science focused on creating systems that perform tasks that normally require human intelligence — learning, reasoning, problem-solving, perception and language understanding. In short: machines that "think" and "learn" like humans to solve complex problems. Examples: chatbots, self-driving cars, recommendation systems, image recognition.</p>
<p><b>AI / ML pipeline:</b> Data → EDA → Features → Model → Deploy.</p>
<h3>Teams</h3>
<table><tr><th>Data Science team</th><th>Role</th></tr>
<tr><td>Data Analyst</td><td>Reports & dashboards</td></tr><tr><td>Data Scientist</td><td>Experiments & modeling</td></tr><tr><td>Data Engineer</td><td>Data pipelines & storage</td></tr><tr><td>ML Engineer</td><td>Puts models into production</td></tr><tr><td>Business Analyst</td><td>Domain knowledge</td></tr></table>
<table><tr><th>AI team</th><th>Role</th></tr>
<tr><td>ML Engineer</td><td>Develops, trains, tests and optimizes ML models; packages them for deployment</td></tr>
<tr><td>AI Researcher</td><td>Develops new algorithms or improves existing ones; cutting-edge problems</td></tr>
<tr><td>MLOps Engineer</td><td>Automates the ML model lifecycle: versioning, testing, deployment, monitoring</td></tr>
<tr><td>Domain Expert</td><td>Business/industry knowledge to guide goals and interpret results</td></tr></table>
<h3>Where DS and AI are used</h3>
<ul><li><b>Finance & Banking:</b> fraud detection (e.g., JPMorgan Chase detects suspicious transactions in real time).</li>
<li><b>Healthcare:</b> medical imaging (e.g., Google DeepMind helps detect diabetic retinopathy or cancer).</li>
<li><b>Marketing:</b> targeted ads (Meta predicts user interests).</li>
<li><b>E-commerce:</b> product recommendations (Amazon).</li>
<li><b>Smart Cities:</b> traffic management (Barcelona optimizes traffic lights).</li>
<li><b>Space & Geospatial AI:</b> satellite image analysis (NASA, Planet Labs).</li>
<li><b>AI & Robotics:</b> autonomous vehicles (Tesla).</li></ul>
<h3>WSL and the CLI</h3>
<p><b>WSL (Windows Subsystem for Linux)</b> runs a real Linux environment inside Windows — no separate PC or dual boot. You get a Linux terminal (bash/zsh) and tools like apt, pip, grep, awk, sed. It is lightweight (no full VM overhead) and lets you keep Windows apps (VS Code, Excel).</p>
<p><b>Why WSL matters for AI:</b> most AI tools are developed for Linux first (cross-platform consistency), you get Linux-only tools, and most production ML servers run Linux — fewer "it worked on my machine" problems. Check: <code>wsl -l -v</code>; install: <code>wsl --install</code> (WSL 2 is the default on Windows 11).</p>
<p><b>Keywords:</b> Shell = command-line interpreter; Terminal = text input/output environment; CMD = the original shell of MS-DOS; PowerShell = a stronger shell with more commands.</p>
<p><b>Why use the CLI?</b> It uses fewer system resources than a GUI, offers tab completion, repeating commands, regular expressions, automation of repetitive tasks (batch files), power-user access to commands unavailable in the GUI, and it is the home of Git & GitHub. Examples: ipconfig, searching subdirectories, deleting files by extension, creating many directories at once.</p>`,
ar_body:`
<h3>رحلة المعسكر</h3>
<p>معسكر علم البيانات وتعلم الآلة (المدرب: هاني الشافعي — باحث ذكاء اصطناعي ومدرب علم بيانات ومهندس ذكاء اصطناعي جغرافي) يسير على خطة من 8 أسابيع:</p>
<table><tr><th>الأسبوع</th><th>الموضوع</th></tr>
<tr><td>1</td><td>بايثون</td></tr><tr><td>2</td><td>الجبر الخطي والإحصاء</td></tr><tr><td>3</td><td>تحليل البيانات الاستكشافي EDA</td></tr><tr><td>4</td><td>تعلم الآلة الموجّه Supervised</td></tr><tr><td>5</td><td>تعلم الآلة غير الموجّه Unsupervised</td></tr><tr><td>6</td><td>التعلم العميق Deep Learning</td></tr><tr><td>7</td><td>الرؤية الحاسوبية Computer Vision</td></tr><tr><td>8</td><td>معالجة اللغات الطبيعية NLP والمشروع</td></tr></table>
<p><b>كيف تستفيد أقصى استفادة:</b> كن فضولياً واسأل، تدرّب يومياً ولو بتمارين صغيرة، تعاون مع زملائك، جرّب ولا تخف من الأخطاء، وابقَ على تواصل عبر قنوات Discord.</p>
<h3>ما هو علم البيانات؟</h3>
<p>"علم البيانات هو فن وعلم استخراج الرؤى والمعرفة من البيانات باستخدام الإحصاء والبرمجة وخبرة المجال".</p>
<p><b>مسار علم البيانات:</b> جمع البيانات ← تنظيف البيانات ← تحليل البيانات ← الرؤى ← القرار.</p>
<p><b>أهميته:</b> (1) البيانات في كل مكان: وسائل التواصل والحساسات والأعمال والصحة؛ (2) يساعد المنظمات على اتخاذ قرارات مبنية على معرفة؛ (3) أمثلة: ترشيح الأفلام في Netflix، كشف الاحتيال، التنبؤ بالاتجاهات.</p>
<h3>ما هو الذكاء الاصطناعي؟</h3>
<p>الذكاء الاصطناعي فرع من علوم الحاسب يهتم ببناء أنظمة تنفذ مهاماً تحتاج عادةً ذكاءً بشرياً: التعلم والاستدلال وحل المشكلات والإدراك وفهم اللغة. باختصار: آلات "تفكر وتتعلم" مثل الإنسان لحل مشكلات معقدة. أمثلة: روبوتات المحادثة، السيارات ذاتية القيادة، أنظمة التوصية، التعرف على الصور.</p>
<p><b>مسار الذكاء الاصطناعي/تعلم الآلة:</b> البيانات ← EDA ← الخصائص Features ← النموذج Model ← النشر Deploy.</p>
<h3>الفرق</h3>
<table><tr><th>فريق علم البيانات</th><th>الدور</th></tr>
<tr><td>محلل البيانات Data Analyst</td><td>التقارير ولوحات المعلومات</td></tr><tr><td>عالم البيانات Data Scientist</td><td>التجارب وبناء النماذج</td></tr><tr><td>مهندس البيانات Data Engineer</td><td>خطوط نقل البيانات والتخزين</td></tr><tr><td>مهندس تعلم الآلة ML Engineer</td><td>ينقل النماذج إلى بيئة الإنتاج</td></tr><tr><td>محلل الأعمال Business Analyst</td><td>معرفة المجال</td></tr></table>
<table><tr><th>فريق الذكاء الاصطناعي</th><th>الدور</th></tr>
<tr><td>مهندس تعلم الآلة</td><td>يطوّر ويدرّب ويختبر ويحسّن النماذج ويجهزها للنشر</td></tr>
<tr><td>باحث الذكاء الاصطناعي</td><td>يطوّر خوارزميات جديدة أو يحسّن الموجودة</td></tr>
<tr><td>مهندس MLOps</td><td>يؤتمت دورة حياة النموذج: الإصدارات والاختبار والنشر والمراقبة</td></tr>
<tr><td>خبير المجال Domain Expert</td><td>معرفة القطاع لتوجيه الأهداف وتفسير النتائج</td></tr></table>
<h3>أين يُستخدم علم البيانات والذكاء الاصطناعي؟</h3>
<ul><li><b>المالية والبنوك:</b> كشف الاحتيال (مثل JPMorgan Chase لحظياً).</li>
<li><b>الصحة:</b> التصوير الطبي (مثل DeepMind من Google لاكتشاف اعتلال الشبكية السكري أو السرطان).</li>
<li><b>التسويق:</b> الإعلانات الموجّهة (Meta تتنبأ باهتمامات المستخدم).</li>
<li><b>التجارة الإلكترونية:</b> توصيات المنتجات (Amazon).</li>
<li><b>المدن الذكية:</b> إدارة المرور (برشلونة تضبط الإشارات).</li>
<li><b>الفضاء والذكاء الجغرافي:</b> تحليل صور الأقمار الصناعية (NASA و Planet Labs).</li>
<li><b>الروبوتات:</b> المركبات ذاتية القيادة (Tesla).</li></ul>
<h3>WSL وسطر الأوامر</h3>
<p><b>WSL</b> (نظام ويندوز الفرعي للينكس) يشغّل بيئة لينكس حقيقية داخل ويندوز بدون جهاز منفصل أو إقلاع مزدوج. تحصل على طرفية لينكس (bash/zsh) وأدوات مثل apt و pip و grep و awk و sed. وهو خفيف (بدون عبء آلة افتراضية كاملة) وتبقى تطبيقات ويندوز متاحة.</p>
<p><b>أهميته للذكاء الاصطناعي:</b> أغلب الأدوات تُطوَّر للينكس أولاً، وتصل لأدوات لينكس فقط، وأغلب خوادم الإنتاج تعمل بلينكس فتقل مشكلة "اشتغل على جهازي". للتحقق: <code>wsl -l -v</code>، وللتثبيت: <code>wsl --install</code> (WSL 2 هو الافتراضي في ويندوز 11).</p>
<p><b>مصطلحات:</b> الصدفة Shell = مفسّر الأوامر؛ الطرفية Terminal = بيئة إدخال وإخراج نصي؛ CMD = الصدفة الأصلية لنظام MS-DOS؛ PowerShell = صدفة أقوى بأوامر أكثر.</p>
<p><b>لماذا CLI؟</b> يستهلك موارد أقل من الواجهة الرسومية، فيه إكمال تلقائي بزر Tab، تكرار الأوامر، التعابير النمطية، أتمتة المهام المتكررة، أوامر غير متاحة في الواجهة الرسومية، وهو بيت Git و GitHub. أمثلة: ipconfig، البحث في المجلدات الفرعية، حذف ملفات بامتداد معيّن، إنشاء مجلدات كثيرة دفعة واحدة.</p>`},

{id:"s02", unit:"u1", en:"CLI Fundamentals & Bash Workflow", ar:"أساسيات سطر الأوامر و Bash",
en_body:`
<h3>Terminal, shell, command, program</h3>
<p>A <b>terminal</b> is the window that shows text and accepts keyboard input. A <b>shell</b> interprets the command line (Bash and PowerShell are different shells). A <b>CLI</b> is a program's text interface. The lab runs in Bash on Ubuntu (Linux, WSL2 or a VM).</p>
<pre>head -n 3 data/observations.csv
# head = command, -n = option, 3 = option value, path = positional argument</pre>
<p>Options are program-specific (<code>-h</code> doesn't mean the same everywhere). Use <code>--help</code>; shell built-ins use <code>help cd</code>. <code>type cd</code> shows cd is a built-in; <code>command -v head</code> prints head's path. <b>cd must be a built-in</b> because a child process cannot change its parent shell's directory.</p>
<p>Keys: <b>Tab</b> completes, <b>Up Arrow</b> recalls, <b>Ctrl+C</b> interrupts, <b>Ctrl+L</b> clears the screen (doesn't delete files), <b>q</b> leaves <code>less</code>. <code>$</code> is a prompt (don't paste it); <code>&gt;&gt;&gt;</code> is Python's prompt — use <code>exit()</code>.</p>
<h3>Workspace and paths</h3>
<pre>lab_dir=$(mktemp -d "$HOME/cli-day.XXXXXX")
cd "$lab_dir"; mkdir data reports scripts logs scratch</pre>
<p><code>mktemp -d</code> creates a unique directory; <code>$(...)</code> captures output; double quotes keep a path with spaces as one argument. A new terminal won't know <code>lab_dir</code>.</p>
<p>An <b>absolute path</b> starts at <code>/</code>; a <b>relative path</b> is resolved from the current directory. <code>.</code> = current, <code>..</code> = parent. Linux names are <b>case-sensitive</b> (data ≠ Data). WSL exposes Windows drives as <code>/mnt/c</code>. <code>find . -maxdepth 3 -type f</code> lists files; <code>ls -ld</code> describes the directory itself; <code>ls -la</code> lists entries including hidden ones (a leading dot hides a name — it is not security).</p>
<h3>Create data and preserve input</h3>
<pre>cat &gt; data/observations.csv &lt;&lt;'CSV'
id,city,value
1,Riyadh,12
...
CSV
cp data/observations.csv data/observations_backup.csv
mv scratch/working.csv scratch/review.csv
cmp data/observations.csv data/observations_backup.csv; echo $?</pre>
<p>A <b>here-document</b> sends several lines to a command; quoting <code>'CSV'</code> stops variable expansion. <code>&gt;</code> creates/<b>replaces</b> a file; <code>&gt;&gt;</code> <b>appends</b>. <code>cp</code> copies, <code>mv</code> moves/renames. <code>cmp</code> prints nothing and exits 0 for equal files, 1 when different. <code>$?</code> holds the status of the <b>immediately preceding</b> command. Copies are not version history.</p>
<h3>Inspect, search, pipelines</h3>
<pre>head -n 4 f; tail -n 2 f; wc -l f; grep -n 'Riyadh' f
tail -n +2 f | cut -d, -f2 | sort | uniq -c
awk -F, 'NR == 1 || $3 + 0 &gt;= 12' f &gt; reports/high_values.csv</pre>
<p>A <b>pipe |</b> sends stdout of one command to stdin of the next. <code>tail -n +2</code> starts at line 2 (skips header); <code>cut -d, -f2</code> takes field 2; <code>sort</code> groups equal lines; <code>uniq -c</code> counts <b>adjacent</b> repeats (so sort first). In awk: <code>-F,</code> separator, <code>NR</code> row number, <code>$3</code> field 3, <code>||</code> or. These text tools are <b>not general CSV parsers</b> (quoted commas). Never use the same file as input and <code>&gt;</code> output — it may be truncated first.</p>
<h3>Streams and exit status</h3>
<p>stdin = 0, stdout = 1, stderr = 2. A pipe carries stdout only. <code>cmd &gt; out 2&gt; err</code> separates them; <code>cmd &gt; file 2&gt;&amp;1</code> combines both (order matters: <code>2&gt;&amp;1 &gt; file</code> is different). Exit 0 = success by convention; <code>grep</code> returns 1 for "no matches". Bash reports the last pipeline command's status; <code>set -o pipefail</code> exposes earlier failures (<code>false | cat</code> → 0 normally, 1 with pipefail).</p>
<h3>Variables, quoting, PATH</h3>
<pre>city=Riyadh            # no spaces around =
printf '%s\\n' "$city"  # Riyadh (double quotes expand)
printf '%s\\n' '$city'  # literal $city (single quotes)
export CLI_LAB_CITY="$city"   # visible to child processes
unset CLI_LAB_CITY</pre>
<p><code>export</code> doesn't persist across unrelated terminal sessions. <code>PATH</code> lists directories searched for commands; <code>command -v python3</code> shows which one runs.</p>
<h3>Python command, runner script, diagnosis</h3>
<p>The lab runs a small Python command with options (argparse), saves results and an error log, and builds a repeatable Bash runner: <code>bash file.sh</code> runs a script and <code>bash -n file.sh</code> checks its syntax without running. Diagnose a wrong path, missing command ("command not found"), denied permission or invalid argument using stderr and the exit status. Don't run the guide with global <code>set -e</code> because it deliberately shows nonzero statuses.</p>`,
ar_body:`
<h3>الطرفية والصدفة والأمر والبرنامج</h3>
<p><b>الطرفية</b> هي النافذة التي تعرض النص وتستقبل لوحة المفاتيح. <b>الصدفة Shell</b> تفسّر سطر الأوامر (Bash و PowerShell صدفتان مختلفتان). <b>CLI</b> هو الواجهة النصية للبرنامج. الدرس يعمل في Bash على Ubuntu.</p>
<pre>head -n 3 data/observations.csv
# head = الأمر، -n = خيار، 3 = قيمة الخيار، المسار = وسيط موضعي</pre>
<p>الخيارات خاصة بكل برنامج (<code>-h</code> لا تعني نفس الشيء دائماً). استخدم <code>--help</code>، والأوامر المدمجة تستخدم <code>help cd</code>. <code>type cd</code> يبيّن أن cd مدمج، و <code>command -v head</code> يطبع مسار head. <b>cd لازم يكون مدمجاً</b> لأن العملية الابن لا تستطيع تغيير مجلد الصدفة الأب.</p>
<p>المفاتيح: <b>Tab</b> للإكمال، <b>السهم للأعلى</b> لاسترجاع أمر، <b>Ctrl+C</b> للإيقاف، <b>Ctrl+L</b> لمسح الشاشة (لا يحذف ملفات)، <b>q</b> للخروج من <code>less</code>. علامة <code>$</code> هي المحث فلا تنسخها، و <code>&gt;&gt;&gt;</code> محث بايثون — اخرج بـ <code>exit()</code>.</p>
<h3>مساحة العمل والمسارات</h3>
<pre>lab_dir=$(mktemp -d "$HOME/cli-day.XXXXXX")
cd "$lab_dir"; mkdir data reports scripts logs scratch</pre>
<p><code>mktemp -d</code> ينشئ مجلداً فريداً، و <code>$(...)</code> يلتقط المخرجات، وعلامات التنصيص المزدوجة تحفظ المسار الذي فيه مسافات كوسيط واحد. الطرفية الجديدة لا تعرف <code>lab_dir</code>.</p>
<p><b>المسار المطلق</b> يبدأ من <code>/</code>، و<b>النسبي</b> يُحسب من المجلد الحالي. <code>.</code> = الحالي، <code>..</code> = الأب. أسماء لينكس <b>حساسة لحالة الأحرف</b> (data ≠ Data). أقراص ويندوز تظهر في WSL كـ <code>/mnt/c</code>. <code>find . -maxdepth 3 -type f</code> يعرض الملفات، <code>ls -ld</code> يصف المجلد نفسه، <code>ls -la</code> يعرض محتواه مع المخفي (النقطة في بداية الاسم تخفيه وليست حماية).</p>
<h3>إنشاء البيانات وحماية المدخلات</h3>
<pre>cat &gt; data/observations.csv &lt;&lt;'CSV'
id,city,value
1,Riyadh,12
...
CSV
cp data/observations.csv data/observations_backup.csv
mv scratch/working.csv scratch/review.csv
cmp data/observations.csv data/observations_backup.csv; echo $?</pre>
<p><b>Here-document</b> يرسل عدة أسطر لأمر، وتنصيص <code>'CSV'</code> يمنع توسيع المتغيرات. <code>&gt;</code> ينشئ الملف أو <b>يستبدله</b>، و <code>&gt;&gt;</code> <b>يضيف</b> للنهاية. <code>cp</code> ينسخ و <code>mv</code> ينقل أو يعيد التسمية. <code>cmp</code> لا يطبع شيئاً ويرجع 0 للملفات المتطابقة و 1 للمختلفة. <code>$?</code> يحمل حالة <b>الأمر السابق مباشرة</b>. النسخ ليست سجلاً للإصدارات.</p>
<h3>الفحص والبحث وخطوط الأنابيب</h3>
<pre>head -n 4 f; tail -n 2 f; wc -l f; grep -n 'Riyadh' f
tail -n +2 f | cut -d, -f2 | sort | uniq -c
awk -F, 'NR == 1 || $3 + 0 &gt;= 12' f &gt; reports/high_values.csv</pre>
<p><b>الأنبوب |</b> يرسل المخرجات القياسية لأمر إلى مدخلات الأمر التالي. <code>tail -n +2</code> يبدأ من السطر 2 (يتجاوز العنوان)، <code>cut -d, -f2</code> يأخذ الحقل 2، <code>sort</code> يجمع الأسطر المتساوية، <code>uniq -c</code> يعدّ التكرارات <b>المتجاورة</b> فقط (لذلك نرتب أولاً). في awk: <code>-F,</code> الفاصل، <code>NR</code> رقم السطر، <code>$3</code> الحقل الثالث، <code>||</code> تعني "أو". هذه الأدوات <b>ليست محللات CSV عامة</b> (الفواصل داخل التنصيص). لا تستخدم نفس الملف كمدخل ومخرج بـ <code>&gt;</code> لأنه قد يُفرَّغ أولاً.</p>
<h3>التدفقات وحالة الخروج</h3>
<p>stdin = 0، stdout = 1، stderr = 2. الأنبوب ينقل stdout فقط. <code>cmd &gt; out 2&gt; err</code> يفصلهما، و <code>cmd &gt; file 2&gt;&amp;1</code> يجمعهما (الترتيب مهم: <code>2&gt;&amp;1 &gt; file</code> مختلف). الصفر يعني النجاح عرفاً، و <code>grep</code> يرجع 1 عند "لا تطابق". Bash يعطي حالة آخر أمر في الأنبوب، و <code>set -o pipefail</code> يكشف فشل المراحل السابقة (<code>false | cat</code> يعطي 0 عادةً و 1 مع pipefail).</p>
<h3>المتغيرات والتنصيص و PATH</h3>
<pre>city=Riyadh            # بدون مسافات حول =
printf '%s\\n' "$city"  # Riyadh (التنصيص المزدوج يوسّع)
printf '%s\\n' '$city'  # النص الحرفي $city (التنصيص المفرد)
export CLI_LAB_CITY="$city"   # يصبح متاحاً للعمليات الابن
unset CLI_LAB_CITY</pre>
<p><code>export</code> لا يبقى بين جلسات طرفية مستقلة. <code>PATH</code> قائمة المجلدات التي يُبحث فيها عن الأوامر، و <code>command -v python3</code> يبيّن أيها سيعمل.</p>
<h3>أمر بايثون وسكربت التشغيل والتشخيص</h3>
<p>الدرس يشغّل أمر بايثون بخيارات (argparse) ويحفظ النتائج وسجل الأخطاء، ويبني سكربت Bash قابلاً للتكرار: <code>bash file.sh</code> يشغّله و <code>bash -n file.sh</code> يفحص الصياغة بدون تشغيل. شخّص المسار الخاطئ أو الأمر المفقود ("command not found") أو رفض الصلاحية أو الوسيط غير الصالح عبر stderr وحالة الخروج. لا تشغّل الدليل مع <code>set -e</code> عام لأنه يعرض حالات فشل مقصودة.</p>`},

{id:"s03", unit:"u1", en:"uv Environments, Git & GitHub", ar:"بيئات uv و Git و GitHub",
en_body:`
<h3>uv — the fast package manager</h3>
<p><b>uv</b> is an ultra-fast Python package manager, an alternative to pip and venv.</p>
<pre>pip install uv                       # or the install script (curl ... | sh / PowerShell irm ... | iex)
uv venv my_env                       # create a virtual environment
source my_env/bin/activate           # activate (Linux/macOS)
my_env\\Scripts\\activate               # activate (Windows cmd)
my_env\\Scripts\\Activate.ps1           # activate (PowerShell)
deactivate                           # leave the environment
uv pip install numpy pandas          # install packages
uv pip install -r requirements.txt   # install from a requirements file
uv pip list                          # installed packages
uv pip uninstall package_name
rm -rf my_env   /   rd /s /q my_env  # delete the environment
uv init                              # create pyproject.toml
uv add pandas                        # add a dependency to the project
uv add notebook ; jupyter notebook   # install and run Jupyter
pip freeze &gt; requirements.txt        # write a requirements file
uv cache clean                       # remove cache entries
uv sync --all-extras --dev           # sync a cloned project</pre>
<h3>WSL management</h3>
<pre>wsl --list --verbose  (wsl -l -v)   # list distributions and states
wsl --install                       # install WSL + default distro
wsl --set-default-version 2         # make WSL 2 the default
wsl --update ; wsl --shutdown       # update / stop all distros
wsl --unregister &lt;Distro&gt;           # delete a distribution
wsl --set-default &lt;Distro&gt;
wsl --export &lt;Distro&gt; file.tar / wsl --import ...
wsl --terminate &lt;Distro&gt; ; wsl --list --online</pre>
<p>Linux distributions (Ubuntu, Debian, Fedora) can be installed from the Microsoft Store; on first launch you create a user and password.</p>
<h3>Git basics</h3>
<p>You need <b>Git</b> before using GitHub (<code>git --version</code>).</p>
<pre>git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git config --list
git init
git add README.md
git commit -m "first commit"
git branch -M main             # rename current branch to main
git branch / git branch -r     # list local / remote branches
git remote add origin &lt;url&gt;    # connect local repo to GitHub
git remote -v
git push -u origin main
git restore --staged &lt;file&gt;    # unstage a file
git checkout -b feature-branch # create and switch to a branch
git checkout main ; git merge feature-branch</pre>
<h3>pull vs fetch vs merge</h3>
<table><tr><th>Command</th><th>Action</th></tr>
<tr><td>git fetch</td><td>Downloads latest changes from the remote, no merge</td></tr>
<tr><td>git merge</td><td>Merges changes into your current branch</td></tr>
<tr><td>git pull</td><td>fetch + merge in one step</td></tr></table>
<p><code>git diff origin/main</code> shows differences between your branch and the remote main. If cloning fails due to file names on Windows: <code>git config --global core.protectNTFS false</code>.</p>`,
ar_body:`
<h3>uv — مدير الحزم السريع</h3>
<p><b>uv</b> مدير حزم بايثون سريع جداً، بديل لـ pip و venv.</p>
<pre>pip install uv                       # أو سكربت التثبيت
uv venv my_env                       # إنشاء بيئة افتراضية
source my_env/bin/activate           # التفعيل (لينكس/ماك)
my_env\\Scripts\\activate               # التفعيل (ويندوز cmd)
my_env\\Scripts\\Activate.ps1           # التفعيل (PowerShell)
deactivate                           # الخروج من البيئة
uv pip install numpy pandas          # تثبيت حزم
uv pip install -r requirements.txt   # التثبيت من ملف المتطلبات
uv pip list                          # الحزم المثبتة
uv pip uninstall package_name        # إزالة حزمة
rm -rf my_env   /   rd /s /q my_env  # حذف البيئة
uv init                              # إنشاء pyproject.toml
uv add pandas                        # إضافة اعتمادية للمشروع
uv add notebook ; jupyter notebook   # تثبيت وتشغيل Jupyter
pip freeze &gt; requirements.txt        # كتابة ملف المتطلبات
uv cache clean                       # تنظيف الذاكرة المؤقتة
uv sync --all-extras --dev           # مزامنة مشروع مستنسخ</pre>
<h3>إدارة WSL</h3>
<pre>wsl --list --verbose  (wsl -l -v)   # عرض التوزيعات وحالاتها
wsl --install                       # تثبيت WSL مع التوزيعة الافتراضية
wsl --set-default-version 2         # جعل WSL 2 الافتراضي
wsl --update ; wsl --shutdown       # تحديث / إيقاف كل التوزيعات
wsl --unregister &lt;Distro&gt;           # حذف توزيعة
wsl --set-default &lt;Distro&gt;
wsl --export &lt;Distro&gt; file.tar / wsl --import ...
wsl --terminate &lt;Distro&gt; ; wsl --list --online</pre>
<p>تُثبّت توزيعات لينكس (Ubuntu و Debian و Fedora) من Microsoft Store، وعند أول تشغيل تنشئ مستخدماً وكلمة مرور.</p>
<h3>أساسيات Git</h3>
<p>تحتاج <b>Git</b> قبل استخدام GitHub (<code>git --version</code>).</p>
<pre>git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git config --list
git init
git add README.md
git commit -m "first commit"
git branch -M main             # إعادة تسمية الفرع الحالي إلى main
git branch / git branch -r     # الفروع المحلية / البعيدة
git remote add origin &lt;url&gt;    # ربط المستودع المحلي بـ GitHub
git remote -v
git push -u origin main
git restore --staged &lt;file&gt;    # إخراج ملف من منطقة التجهيز
git checkout -b feature-branch # إنشاء فرع والانتقال له
git checkout main ; git merge feature-branch</pre>
<h3>الفرق بين pull و fetch و merge</h3>
<table><tr><th>الأمر</th><th>العمل</th></tr>
<tr><td>git fetch</td><td>يجلب آخر التغييرات من المستودع البعيد بدون دمج</td></tr>
<tr><td>git merge</td><td>يدمج التغييرات في الفرع الحالي</td></tr>
<tr><td>git pull</td><td>fetch ثم merge في خطوة واحدة</td></tr></table>
<p><code>git diff origin/main</code> يعرض الفرق بين فرعك و main البعيد. إذا فشل الاستنساخ بسبب أسماء الملفات في ويندوز: <code>git config --global core.protectNTFS false</code>.</p>`},

{id:"s04", unit:"u1", en:"Statistics Fundamentals", ar:"أساسيات الإحصاء",
en_body:`
<h3>Types of data</h3>
<ul><li><b>Qualitative (categorical):</b> not numeric; values form categories. <b>Nominal</b> = no order (e.g., city); <b>ordinal</b> = ordered categories (e.g., low/medium/high).</li>
<li><b>Quantitative:</b> numeric magnitude. <b>Discrete</b> = countable, limited values (number of children); <b>continuous</b> = infinitely many values (age, weight).</li></ul>
<h3>Independent vs dependent variables</h3>
<p><b>Independent:</b> manipulated/controlled, represents the <b>cause</b> (e.g., age, income). <b>Dependent:</b> changes as a result, the observed <b>effect/outcome</b> (e.g., expenditure, experience).</p>
<h3>Population, sample, sampling</h3>
<p><b>Population</b> = complete set of elements of interest. <b>Sample</b> = subset used for inference.</p>
<ul><li><b>Random:</b> every member has an equal chance.</li>
<li><b>Stratified:</b> divide into strata, draw a random sample from <b>each</b> stratum.</li>
<li><b>Cluster:</b> divide into clusters and select <b>entire</b> clusters.</li>
<li><b>Systematic:</b> number individuals and choose every n-th.</li></ul>
<h3>Approaches to analysis</h3>
<p><b>Descriptive</b> — "What happened?" (measures and charts). <b>Diagnostic</b> — "Why did it happen?" (hypothesis testing, correlation). <b>Predictive</b> — "What will happen?" (regression, classification, forecasting).</p>
<h3>Central tendency</h3>
<p><b>Mean</b> μ = Σx / N (sensitive to extreme values). <b>Median</b> = middle of ordered data (50% below, 50% above). <b>Mode</b> = most frequent value (data can have several modes).</p>
<h3>Variation</h3>
<p><b>Range</b> = max − min (sensitive to outliers). <b>IQR</b> = Q3 − Q1 (middle 50%, robust to outliers). <b>Variance</b> σ² = (1/N) Σ(x − μ)². <b>Standard deviation</b> σ = √σ² (same units as the data).</p>
<h3>Position</h3>
<p><b>Quartiles:</b> Q1 (25% below), Q2 = median (50%), Q3 (75%). <b>Z-score</b> z = (X − μ) / σ — how many standard deviations a value is from the mean; |z| &gt; 2 may be considered unusual (outlier detection).</p>
<p class="ex">Example: data 2, 4, 4, 6, 9 → mean = 5, median = 4, mode = 4, range = 7.</p>`,
ar_body:`
<h3>أنواع البيانات</h3>
<ul><li><b>نوعية (فئوية):</b> ليست أرقاماً وتشكّل فئات. <b>اسمية Nominal</b> بدون ترتيب (مثل المدينة)، و<b>ترتيبية Ordinal</b> فئات مرتبة (منخفض/متوسط/مرتفع).</li>
<li><b>كمية:</b> أرقام تقيس المقدار. <b>منفصلة Discrete</b> قابلة للعد (عدد الأطفال)، و<b>متصلة Continuous</b> قيمها لا نهائية (العمر، الوزن).</li></ul>
<h3>المتغير المستقل والتابع</h3>
<p><b>المستقل:</b> يُتحكم فيه ويمثل <b>السبب</b> (مثل العمر والدخل). <b>التابع:</b> يتغير نتيجة له ويمثل <b>الأثر/النتيجة</b> (مثل الإنفاق والخبرة).</p>
<h3>المجتمع والعينة وطرق المعاينة</h3>
<p><b>المجتمع</b> = كل العناصر محل الاهتمام. <b>العينة</b> = جزء منه نستدل به.</p>
<ul><li><b>العشوائية:</b> لكل فرد فرصة متساوية.</li>
<li><b>الطبقية:</b> نقسم المجتمع لطبقات ونسحب عينة عشوائية من <b>كل</b> طبقة.</li>
<li><b>العنقودية:</b> نقسم لعناقيد ونختار عناقيد <b>كاملة</b>.</li>
<li><b>المنتظمة:</b> نرقّم الأفراد ونختار كل n-ـث فرد.</li></ul>
<h3>أنواع التحليل</h3>
<p><b>الوصفي</b> — "ماذا حدث؟" (مقاييس ورسوم). <b>التشخيصي</b> — "لماذا حدث؟" (اختبار الفرضيات والارتباط). <b>التنبؤي</b> — "ماذا سيحدث؟" (الانحدار والتصنيف والتنبؤ).</p>
<h3>مقاييس النزعة المركزية</h3>
<p><b>المتوسط</b> μ = Σx / N (يتأثر بالقيم المتطرفة). <b>الوسيط</b> = القيمة الوسطى بعد الترتيب (50% تحته و 50% فوقه). <b>المنوال</b> = الأكثر تكراراً (قد يوجد أكثر من منوال).</p>
<h3>مقاييس التشتت</h3>
<p><b>المدى</b> = الأكبر − الأصغر (يتأثر بالمتطرفة). <b>المدى الربيعي IQR</b> = Q3 − Q1 (أوسط 50% ولا يتأثر بالمتطرفة). <b>التباين</b> σ² = (1/N) Σ(x − μ)². <b>الانحراف المعياري</b> σ = √σ² (بنفس وحدة البيانات).</p>
<h3>مقاييس الموقع</h3>
<p><b>الربيعيات:</b> Q1 (25% أقل منه)، Q2 = الوسيط (50%)، Q3 (75%). <b>الدرجة المعيارية Z</b>: z = (X − μ) / σ — كم انحرافاً معيارياً تبعد القيمة عن المتوسط، وإذا |z| &gt; 2 قد تُعتبر قيمة غير عادية (كشف القيم الشاذة).</p>
<p class="ex">مثال: البيانات 2، 4، 4، 6، 9 ← المتوسط 5، الوسيط 4، المنوال 4، المدى 7.</p>`}
);

{id:"s05", unit:"u2", en:"Variables, Data Types & Operators", ar:"المتغيرات وأنواع البيانات والعمليات",
en_body:`
<h3>Variables and assignment</h3>
<ol><li>A <b>variable</b> is a name that refers to a value.</li><li>An <b>assignment statement</b> creates variables and gives them values.</li><li>The assignment operator is <code>=</code>, not the equality operator <code>==</code>.</li><li>The type of a variable is the type of the value it refers to.</li><li>The <code>print</code> function displays a value.</li></ol>
<pre>age = 20
age = age + 20   # 40
age += 20        # same as age = age + 20 → 60
print('hi ' + name + ' your age is ' + str(age))</pre>
<p>Python has an interactive mode: typing <code>2 + 5</code> shows 7 immediately. In a notebook cell only the <b>last</b> expression is displayed; use <code>print()</code> to show several. <b>Ctrl+Enter</b> runs a cell, <b>Shift+Enter</b> runs it and moves to the next.</p>
<h3>Arithmetic and type errors</h3>
<p>add <code>5 + 5</code>, subtract <code>9 - 4</code>, multiply <code>2 * 5</code>, divide <code>5 / 5</code> (gives float 1.0), power <code>2 ** 4</code> = 16. Bitwise shift: <code>5 &lt;&lt; 1</code> = 10 (binary 101 → 1010).</p>
<p>Concatenating a string with a number needs <code>str()</code>: <code>"My age is:" + str(40)</code>. <code>int(['a'])</code> → TypeError; <code>[9,13] + 1986</code> → TypeError (can only concatenate list to list).</p>
<h3>Built-in data types</h3>
<table><tr><th>Category</th><th>Types</th><th>Example</th></tr>
<tr><td>Text</td><td>str</td><td>"Hello"</td></tr>
<tr><td>Numeric</td><td>int, float, complex</td><td>10, 3.14, 1+2j</td></tr>
<tr><td>Sequence</td><td>list, tuple, range</td><td>[1,2], (1,2), range(10)</td></tr>
<tr><td>Mapping</td><td>dict</td><td>{"name": "Alice"}</td></tr>
<tr><td>Set</td><td>set, frozenset</td><td>{1,2,3}</td></tr>
<tr><td>Boolean</td><td>bool</td><td>True / False</td></tr>
<tr><td>Binary</td><td>bytes, bytearray, memoryview</td><td>b"Hello"</td></tr>
<tr><td>None</td><td>NoneType</td><td>None</td></tr></table>
<p><code>type(x)</code> returns the type: <code>type(str(age))</code> → str; <code>type(['3000', 2])</code> → list. <code>range(10)</code> produces 0..9 in a for loop.</p>`,
ar_body:`
<h3>المتغيرات والإسناد</h3>
<ol><li><b>المتغير</b> اسم يشير إلى قيمة.</li><li><b>جملة الإسناد</b> تنشئ المتغيرات وتعطيها قيماً.</li><li>عامل الإسناد هو <code>=</code> وليس عامل المساواة <code>==</code>.</li><li>نوع المتغير هو نوع القيمة التي يشير إليها.</li><li>الدالة <code>print</code> تعرض القيمة.</li></ol>
<pre>age = 20
age = age + 20   # 40
age += 20        # نفس age = age + 20 ← 60
print('hi ' + name + ' your age is ' + str(age))</pre>
<p>بايثون لها وضع تفاعلي: كتابة <code>2 + 5</code> تظهر 7 فوراً. في خلية الدفتر تُعرض <b>آخر</b> قيمة فقط، فاستخدم <code>print()</code> لعرض أكثر من نتيجة. <b>Ctrl+Enter</b> يشغّل الخلية و <b>Shift+Enter</b> يشغّلها وينتقل للتالية.</p>
<h3>العمليات الحسابية وأخطاء الأنواع</h3>
<p>الجمع <code>5 + 5</code>، الطرح <code>9 - 4</code>، الضرب <code>2 * 5</code>، القسمة <code>5 / 5</code> (تعطي عدداً عشرياً 1.0)، الأس <code>2 ** 4</code> = 16. الإزاحة الثنائية: <code>5 &lt;&lt; 1</code> = 10 (الثنائي 101 يصبح 1010).</p>
<p>دمج نص مع رقم يحتاج <code>str()</code>: <code>"My age is:" + str(40)</code>. <code>int(['a'])</code> يعطي TypeError، و <code>[9,13] + 1986</code> يعطي TypeError (القائمة تُدمج مع قائمة فقط).</p>
<h3>أنواع البيانات المدمجة</h3>
<table><tr><th>الفئة</th><th>الأنواع</th><th>مثال</th></tr>
<tr><td>نص</td><td>str</td><td>"Hello"</td></tr>
<tr><td>أرقام</td><td>int, float, complex</td><td>10, 3.14, 1+2j</td></tr>
<tr><td>تسلسلات</td><td>list, tuple, range</td><td>[1,2], (1,2), range(10)</td></tr>
<tr><td>ربط</td><td>dict</td><td>{"name": "Alice"}</td></tr>
<tr><td>مجموعات</td><td>set, frozenset</td><td>{1,2,3}</td></tr>
<tr><td>منطقي</td><td>bool</td><td>True / False</td></tr>
<tr><td>ثنائي</td><td>bytes, bytearray, memoryview</td><td>b"Hello"</td></tr>
<tr><td>لا شيء</td><td>NoneType</td><td>None</td></tr></table>
<p><code>type(x)</code> يرجع النوع: <code>type(str(age))</code> ← str، و <code>type(['3000', 2])</code> ← list. و <code>range(10)</code> ينتج 0 إلى 9 في حلقة for.</p>`},

{id:"s06", unit:"u2", en:"Strings", ar:"النصوص Strings",
en_body:`
<h3>Creating strings</h3>
<p>Strings represent text (names, addresses, messages). Single and double quotes are equivalent; triple quotes <code>"""..."""</code> create multi-line strings and can contain both quote types. Escape a quote with <code>\\'</code>.</p>
<pre>name = 'ahmeddd'
for ch in name: print(ch)   # one character per line
len(name)                   # 7
"0" * 8                     # '00000000' (repetition)
"a" in "aeiou"              # True (membership)</pre>
<h3>Methods (strings are objects)</h3>
<table><tr><th>Method</th><th>Example → result</th></tr>
<tr><td>upper / lower</td><td>"hello".upper() → 'HELLO'</td></tr>
<tr><td>capitalize</td><td>'ahmed'.capitalize() → 'Ahmed'</td></tr>
<tr><td>title</td><td>'john doe'.title() → 'John Doe'</td></tr>
<tr><td>islower / isupper / isdigit / isalpha / isalnum</td><td>return True/False</td></tr>
<tr><td>count</td><td>'John Doe'.count('m') → 0</td></tr>
<tr><td>find</td><td>'John Doe'.find(' Do') → 4 (−1 if missing)</td></tr>
<tr><td>replace(old, new, count)</td><td>'ahmaahhaad'.replace('aa','e',2)</td></tr>
<tr><td>strip</td><td>"  na me  ".strip() → 'na me'</td></tr>
<tr><td>split</td><td>'hello,world worl'.split() → ['hello,world', 'worl']</td></tr>
<tr><td>join</td><td>" - ".join(["a","b"]) → 'a - b'</td></tr>
<tr><td>rjust / center</td><td>alignment</td></tr></table>
<p><code>dir(name)</code> lists all methods; filter with <code>if 'is' in i</code>. <code>split()</code> with no argument splits on whitespace.</p>
<h3>Formatting</h3>
<pre>age = 40
f"Age: {age}"            # f-string
"Age: {}".format(age)    # format()
num = 10.5679
f"{num:.3f}"     # '10.568'   (3 decimals)
f"{num:&gt;100.2f}" # right-aligned in width 100
f"{1000000:,}"   # '1,000,000' (thousands separator)
f"{0.235:.2%}"   # '23.50%'
f"$ {19.95:,.2f}"# currency
f"{9000:.2e}"    # '9.00e+03' (scientific)</pre>`,
ar_body:`
<h3>إنشاء النصوص</h3>
<p>النصوص تمثل الكتابة (أسماء، عناوين، رسائل). التنصيص المفرد والمزدوج متساويان، والتنصيص الثلاثي <code>"""..."""</code> ينشئ نصاً متعدد الأسطر ويمكن أن يحتوي النوعين. تهريب علامة التنصيص يكون بـ <code>\\'</code>.</p>
<pre>name = 'ahmeddd'
for ch in name: print(ch)   # حرف في كل سطر
len(name)                   # 7
"0" * 8                     # '00000000' (التكرار)
"a" in "aeiou"              # True (عامل العضوية)</pre>
<h3>الدوال المرتبطة (النصوص كائنات)</h3>
<table><tr><th>الدالة</th><th>مثال ← النتيجة</th></tr>
<tr><td>upper / lower</td><td>"hello".upper() ← 'HELLO'</td></tr>
<tr><td>capitalize</td><td>'ahmed'.capitalize() ← 'Ahmed'</td></tr>
<tr><td>title</td><td>'john doe'.title() ← 'John Doe'</td></tr>
<tr><td>islower / isupper / isdigit / isalpha / isalnum</td><td>ترجع True/False</td></tr>
<tr><td>count</td><td>'John Doe'.count('m') ← 0</td></tr>
<tr><td>find</td><td>'John Doe'.find(' Do') ← 4 (و −1 إذا لم يوجد)</td></tr>
<tr><td>replace(old, new, count)</td><td>'ahmaahhaad'.replace('aa','e',2)</td></tr>
<tr><td>strip</td><td>"  na me  ".strip() ← 'na me'</td></tr>
<tr><td>split</td><td>'hello,world worl'.split() ← ['hello,world', 'worl']</td></tr>
<tr><td>join</td><td>" - ".join(["a","b"]) ← 'a - b'</td></tr>
<tr><td>rjust / center</td><td>المحاذاة</td></tr></table>
<p><code>dir(name)</code> يعرض كل الدوال، ويمكن التصفية بـ <code>if 'is' in i</code>. و <code>split()</code> بدون وسيط يقسم على المسافات.</p>
<h3>التنسيق</h3>
<pre>age = 40
f"Age: {age}"            # f-string
"Age: {}".format(age)    # format()
num = 10.5679
f"{num:.3f}"     # '10.568'   (3 منازل عشرية)
f"{num:&gt;100.2f}" # محاذاة لليمين بعرض 100
f"{1000000:,}"   # '1,000,000' (فاصل الآلاف)
f"{0.235:.2%}"   # '23.50%'
f"$ {19.95:,.2f}"# العملة
f"{9000:.2e}"    # '9.00e+03' (الصيغة العلمية)</pre>`},

{id:"s07", unit:"u2", en:"Lists, Sets, Dictionaries & Tuples", ar:"القوائم والمجموعات والقواميس والصفوف",
en_body:`
<h3>Lists: indexing and slicing</h3>
<p>Lists are <b>ordered</b> collections. Indexing is <b>0-based</b>; <code>-1</code> is the last element. Slicing <code>[start:end:step]</code> excludes <code>end</code>; defaults are start=0, end=len, step=1. A negative step goes backwards.</p>
<pre>fruits = ["Apple", "Banana", "Orange", "Lemon"]
fruits[0]     # 'Apple'      fruits[-1]  # 'Lemon'
fruits[1:3]   # ['Banana', 'Orange']
fruits[::2]   # ['Apple', 'Orange']
fruits[::-1]  # ['Lemon', 'Orange', 'Banana', 'Apple']
fruits[::-2]  # ['Lemon', 'Banana']</pre>
<p>Lists are heterogeneous (can hold any type, even other lists): <code>m = ["abc", 123, False, ['AABB','CC']]</code>; <code>m[3][0][-1]</code> → 'B'.</p>
<h3>List methods</h3>
<p><code>append</code> (add one item to end — appending a list adds it as one element), <code>extend</code> (add elements), <code>insert(i, x)</code>, <code>remove(x)</code> (by value, first occurrence), <code>pop(i)</code> (remove and return), <code>clear</code>, <code>index</code>, <code>count</code>, <code>reverse</code>, <code>sort</code> (in place), <code>copy</code>. <code>sorted(lst)</code> returns a <b>new</b> list and doesn't change the original. <code>min</code>, <code>max</code>, <code>sum</code> work on numbers. <code>400 in numbers</code> checks membership.</p>
<h3>Copy vs view</h3>
<pre>a = [1,2,3]
b = a          # view: same object, changing b changes a
c = a.copy()   # new copy
d = a[:]       # new copy</pre>
<h3>Sets</h3>
<p>Sets hold <b>unique</b> unordered values: <code>set([1,2,2,3])</code> → {1,2,3}. Methods: <code>add</code>, <code>remove</code> (error if missing), <code>discard</code> (no error), <code>pop</code>. Sets <b>cannot be indexed</b> (<code>my_set[1]</code> → TypeError: 'set' object is not subscriptable).</p>
<table><tr><th>Operation</th><th>Operator</th><th>Method</th></tr>
<tr><td>Union</td><td>a | b</td><td>a.union(b)</td></tr>
<tr><td>Intersection</td><td>a &amp; b</td><td>a.intersection(b)</td></tr>
<tr><td>Difference (only a)</td><td>a - b</td><td>a.difference(b)</td></tr>
<tr><td>In one but not both</td><td>a ^ b</td><td>a.symmetric_difference(b)</td></tr></table>
<p><code>next(iter(s), None)</code> gets an element safely (None if empty). A for loop uses iter and next internally.</p>
<h3>Dictionaries</h3>
<p>Key → value pairs in curly braces; changeable and indexed by key. Since Python 3.7 dictionaries keep <b>insertion order</b> (3.6 and earlier: unordered). Access <code>d['key']</code> (KeyError if missing) or <code>d.get('key')</code>; loop with <code>d.items()</code>, <code>d.keys()</code>, <code>d.values()</code>.</p>
<h3>Tuples and zip</h3>
<p>Tuples <code>(1, 2, 3)</code> are ordered and <b>immutable</b>. A function returning several values returns a tuple: <code>return s, d, s10</code> → (15, 5, 25); unpack with <code>a, b = f()</code>.</p>
<pre>students = ['Ahmad','Badr','Camal','Dania']
marks = [90, 80, 75, 85]
list(zip(students, marks))  # [('Ahmad', 90), ...]
dict(zip(students, marks))  # {'Ahmad': 90, ...}</pre>
<p><code>zip</code> stops at the <b>shortest</b> input (an extra student without a mark is dropped).</p>`,
ar_body:`
<h3>القوائم: الفهرسة والتقطيع</h3>
<p>القوائم مجموعات <b>مرتبة</b>. الفهرسة تبدأ من <b>صفر</b>، و <code>-1</code> هو آخر عنصر. التقطيع <code>[start:end:step]</code> لا يشمل <code>end</code>، والقيم الافتراضية start=0 و end=الطول و step=1. الخطوة السالبة تمشي للخلف.</p>
<pre>fruits = ["Apple", "Banana", "Orange", "Lemon"]
fruits[0]     # 'Apple'      fruits[-1]  # 'Lemon'
fruits[1:3]   # ['Banana', 'Orange']
fruits[::2]   # ['Apple', 'Orange']
fruits[::-1]  # ['Lemon', 'Orange', 'Banana', 'Apple']
fruits[::-2]  # ['Lemon', 'Banana']</pre>
<p>القوائم غير متجانسة (تحمل أي نوع حتى قوائم أخرى): <code>m = ["abc", 123, False, ['AABB','CC']]</code>، و <code>m[3][0][-1]</code> ← 'B'.</p>
<h3>دوال القوائم</h3>
<p><code>append</code> (يضيف عنصراً واحداً للنهاية — إضافة قائمة تجعلها عنصراً واحداً)، <code>extend</code> (يضيف العناصر)، <code>insert(i, x)</code>، <code>remove(x)</code> (بالقيمة، أول ظهور)، <code>pop(i)</code> (يحذف ويرجع)، <code>clear</code>، <code>index</code>، <code>count</code>، <code>reverse</code>، <code>sort</code> (في نفس القائمة)، <code>copy</code>. أما <code>sorted(lst)</code> فيرجع قائمة <b>جديدة</b> ولا يغيّر الأصل. و <code>min</code> و <code>max</code> و <code>sum</code> للأرقام. و <code>400 in numbers</code> لفحص العضوية.</p>
<h3>النسخ مقابل المرجع</h3>
<pre>a = [1,2,3]
b = a          # مرجع لنفس الكائن، تعديل b يعدّل a
c = a.copy()   # نسخة جديدة
d = a[:]       # نسخة جديدة</pre>
<h3>المجموعات Sets</h3>
<p>المجموعة تحمل قيماً <b>فريدة</b> بدون ترتيب: <code>set([1,2,2,3])</code> ← {1,2,3}. الدوال: <code>add</code>، <code>remove</code> (خطأ إذا غير موجود)، <code>discard</code> (بدون خطأ)، <code>pop</code>. المجموعات <b>لا تُفهرس</b> (<code>my_set[1]</code> ← TypeError: 'set' object is not subscriptable).</p>
<table><tr><th>العملية</th><th>العامل</th><th>الدالة</th></tr>
<tr><td>الاتحاد</td><td>a | b</td><td>a.union(b)</td></tr>
<tr><td>التقاطع</td><td>a &amp; b</td><td>a.intersection(b)</td></tr>
<tr><td>الفرق (في a فقط)</td><td>a - b</td><td>a.difference(b)</td></tr>
<tr><td>في واحدة وليس الاثنتين</td><td>a ^ b</td><td>a.symmetric_difference(b)</td></tr></table>
<p><code>next(iter(s), None)</code> يأخذ عنصراً بأمان (None إذا فارغة). حلقة for تستخدم iter و next داخلياً.</p>
<h3>القواميس Dictionaries</h3>
<p>أزواج مفتاح ← قيمة داخل أقواس معقوفة، قابلة للتعديل ومفهرسة بالمفتاح. منذ بايثون 3.7 القواميس <b>تحفظ ترتيب الإدخال</b> (3.6 وما قبل: غير مرتبة). الوصول بـ <code>d['key']</code> (KeyError إذا غير موجود) أو <code>d.get('key')</code>، والتكرار بـ <code>d.items()</code> و <code>d.keys()</code> و <code>d.values()</code>.</p>
<h3>الصفوف Tuples و zip</h3>
<p>الصف <code>(1, 2, 3)</code> مرتب و<b>غير قابل للتعديل</b>. الدالة التي ترجع عدة قيم ترجع صفاً: <code>return s, d, s10</code> ← (15, 5, 25)، ويمكن الفك بـ <code>a, b = f()</code>.</p>
<pre>students = ['Ahmad','Badr','Camal','Dania']
marks = [90, 80, 75, 85]
list(zip(students, marks))  # [('Ahmad', 90), ...]
dict(zip(students, marks))  # {'Ahmad': 90, ...}</pre>
<p><code>zip</code> يتوقف عند <b>أقصر</b> مدخل (الطالب الزائد بدون درجة يُهمل).</p>`},

{id:"s08", unit:"u2", en:"Comprehensions, Functions & Lambda", ar:"الـ Comprehensions والدوال و Lambda",
en_body:`
<h3>List comprehensions</h3>
<p>Syntax: <code>[&lt;expression&gt; for &lt;item&gt; in &lt;iterable&gt; if &lt;condition&gt;]</code> — concise one-line replacement for a loop + append.</p>
<pre>nums = list(range(10))
[x + 10 for x in nums]               # add 10 to each
[x**2 for x in nums if x % 2 == 0]   # [0, 4, 16, 36, 64]
[x for x in fruits if "a" in x]      # filter strings
{x for x in range(5)}                # set comprehension {0,1,2,3,4}
{x: x**2 for x in [1,2,3]}           # dict comprehension {1:1, 2:4, 3:9}</pre>
<h3>Built-in and library functions</h3>
<p>Built-ins: <code>print()</code>, <code>input()</code>, <code>int()</code>, <code>abs()</code>. Modules: <code>import math</code> then <code>math.sqrt(64)</code> = 8.0, <code>math.pow(2,3)</code> = 8.0; <code>from math import sqrt, pow</code> imports specific functions; <code>import pandas as pd</code> uses an alias. <code>help(math)</code> / <code>dir(math)</code> show what's available. Don't name your functions <code>sum</code>, <code>min</code>, <code>max</code>, <code>print</code>, <code>input</code>, <code>int</code> — it hides the built-ins.</p>
<h3>User-defined functions</h3>
<pre>def add(num1, num2, num3=0):   # num3 has a default value
    result = num1 + num2 + num3
    return result
add(10, 20)      # 30
add(10, 20, 5)   # 35</pre>
<p>A function without <code>return</code> is a <b>void function</b> — it performs an action and returns <code>None</code>. Returning several values returns a tuple. <code>*args</code> collects positional arguments into a tuple; <code>**kwargs</code> collects keyword arguments into a dict.</p>
<h3>Modules and packages</h3>
<p>A package is a folder with <code>__init__.py</code> and modules: <code>import pkg.module1 as m1</code>; the code in <code>__init__.py</code> runs when the package is first imported. A missing package raises <b>ModuleNotFoundError</b>.</p>
<h3>Lambda</h3>
<p>Syntax <code>lambda parameters: expression</code> — a small <b>anonymous</b> function with any number of arguments but <b>only one expression</b>.</p>
<pre>square = lambda x: x * x
list(map(lambda x: x*x, [1,2,3,4,5]))     # [1, 4, 9, 16, 25]
list(map(lambda s: s.upper(), ["hello","world"]))
tuples.sort(key=lambda t: t[1])            # sort by 2nd element
sorted(people, key=lambda p: p["age"])</pre>
<p><code>map()</code> applies a function to every item and returns an <b>iterator</b> (wrap with <code>list()</code>). A list comprehension often does the same: <code>[x*x for x in numbers]</code>. Passing <code>key=second_element</code> passes the function itself, not its result. A conditional lambda: <code>lambda x: "positive" if x &gt; 0 else "negative" if x &lt; 0 else "zero"</code>.</p>`,
ar_body:`
<h3>الـ List Comprehension</h3>
<p>الصيغة: <code>[&lt;expression&gt; for &lt;item&gt; in &lt;iterable&gt; if &lt;condition&gt;]</code> — بديل مختصر بسطر واحد للحلقة مع append.</p>
<pre>nums = list(range(10))
[x + 10 for x in nums]               # إضافة 10 لكل عنصر
[x**2 for x in nums if x % 2 == 0]   # [0, 4, 16, 36, 64]
[x for x in fruits if "a" in x]      # تصفية النصوص
{x for x in range(5)}                # set comprehension {0,1,2,3,4}
{x: x**2 for x in [1,2,3]}           # dict comprehension {1:1, 2:4, 3:9}</pre>
<h3>الدوال المدمجة ودوال المكتبات</h3>
<p>المدمجة: <code>print()</code> و <code>input()</code> و <code>int()</code> و <code>abs()</code>. الوحدات: <code>import math</code> ثم <code>math.sqrt(64)</code> = 8.0 و <code>math.pow(2,3)</code> = 8.0؛ و <code>from math import sqrt, pow</code> يستورد دوالاً محددة؛ و <code>import pandas as pd</code> باسم مستعار. <code>help(math)</code> و <code>dir(math)</code> لعرض المتاح. لا تسمِّ دوالك <code>sum</code> أو <code>min</code> أو <code>max</code> أو <code>print</code> أو <code>input</code> أو <code>int</code> لأنها تخفي الدوال المدمجة.</p>
<h3>الدوال المعرّفة من المستخدم</h3>
<pre>def add(num1, num2, num3=0):   # num3 لها قيمة افتراضية
    result = num1 + num2 + num3
    return result
add(10, 20)      # 30
add(10, 20, 5)   # 35</pre>
<p>الدالة بدون <code>return</code> تسمى <b>void</b> — تنفّذ عملاً وترجع <code>None</code>. إرجاع عدة قيم يرجع صفاً tuple. <code>*args</code> يجمع الوسائط الموضعية في tuple، و <code>**kwargs</code> يجمع الوسائط المسماة في dict.</p>
<h3>الوحدات والحزم</h3>
<p>الحزمة مجلد فيه <code>__init__.py</code> ووحدات: <code>import pkg.module1 as m1</code>، والكود في <code>__init__.py</code> يعمل عند أول استيراد. الحزمة غير الموجودة تعطي <b>ModuleNotFoundError</b>.</p>
<h3>دالة Lambda</h3>
<p>الصيغة <code>lambda parameters: expression</code> — دالة صغيرة <b>بدون اسم</b> تقبل أي عدد من الوسائط لكن <b>تعبيراً واحداً فقط</b>.</p>
<pre>square = lambda x: x * x
list(map(lambda x: x*x, [1,2,3,4,5]))     # [1, 4, 9, 16, 25]
list(map(lambda s: s.upper(), ["hello","world"]))
tuples.sort(key=lambda t: t[1])            # الترتيب حسب العنصر الثاني
sorted(people, key=lambda p: p["age"])</pre>
<p><code>map()</code> يطبّق دالة على كل عنصر ويرجع <b>مكرِّراً iterator</b> (نغلفه بـ <code>list()</code>). والـ list comprehension غالباً يؤدي نفس الشيء: <code>[x*x for x in numbers]</code>. تمرير <code>key=second_element</code> يمرر الدالة نفسها لا نتيجتها. Lambda شرطية: <code>lambda x: "positive" if x &gt; 0 else "negative" if x &lt; 0 else "zero"</code>.</p>`},

{id:"s09", unit:"u2", en:"Control Flow, Errors & Exceptions", ar:"التحكم بالتدفق والأخطاء والاستثناءات",
en_body:`
<h3>Order of execution</h3>
<p>Python is a <b>procedural</b> language (as opposed to declarative): code runs in the order written. If <code>x = 5</code> then later <code>x = 2</code>, printing x at the end gives 2.</p>
<h3>Boolean expressions</h3>
<p>Comparison operators: <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>. Combine with <code>and</code>, <code>or</code>, <code>not</code>. <code>5 &gt; 9</code> → False; <code>len('aaa') &gt; len('bc')</code> → True.</p>
<h3>Conditionals</h3>
<pre>if x &lt; 10:
    print('Smaller')
elif x &gt; 20:
    print('Bigger')
else:
    print('Between')</pre>
<p><code>elif</code> and <code>else</code> are optional; <code>elif</code> may repeat; <code>else</code> appears once at the end. Nested ifs check one range inside another (e.g., the fitness category exercise: age range first, then run time).</p>
<h3>match (switch)</h3>
<pre>match value:
    case 1: return "One"
    case 3 | 4: return "Three or Four"   # multiple matches
    case _: return "Invalid choice"      # default</pre>
<h3>Reading errors</h3>
<p>Errors are your friends. In a <b>stack trace</b> the bottom line shows the error type and message; the trace shows the chain of calls (e.g., A() → B() → C()) leading to the failing line.</p>
<table><tr><th>Error</th><th>When</th></tr>
<tr><td>NameError</td><td>a variable/function used before it is defined or misspelled</td></tr>
<tr><td>TypeError</td><td>operation on an inappropriate type, e.g. <code>'5' ** 2</code></td></tr>
<tr><td>ValueError</td><td>right type, bad value, e.g. <code>int('abc')</code></td></tr>
<tr><td>IndexError</td><td>index out of range, e.g. <code>[10,20,30][3]</code></td></tr>
<tr><td>KeyError</td><td>missing dictionary key</td></tr>
<tr><td>AttributeError</td><td>object has no such attribute/method</td></tr></table>
<h3>Exception handling</h3>
<p>An <b>exception</b> is a run-time error that the programmer may handle; it interrupts the "happy path" when interacting with the real world (user input, files, network).</p>
<pre>try:
    num = int(str_idx)
    text = my_list[num]
except ValueError:
    print("please enter an integer")
except IndexError:
    print("index is out of range")
except Exception as e:
    print(f"Error: {e}")
else:
    print("runs only when no exception happens")
finally:
    print("runs either way")</pre>
<p><b>Raising:</b> <code>raise ValueError(f"invalid number {x} must be positive")</code>; catch it with <code>except ValueError as e: print(e)</code>.</p>`,
ar_body:`
<h3>ترتيب التنفيذ</h3>
<p>بايثون لغة <b>إجرائية</b> (عكس التصريحية): الكود يُنفذ بترتيب كتابته. إذا كتبت <code>x = 5</code> ثم لاحقاً <code>x = 2</code> فطباعة x في النهاية تعطي 2.</p>
<h3>التعابير المنطقية</h3>
<p>عوامل المقارنة: <code>==</code> و <code>!=</code> و <code>&gt;</code> و <code>&lt;</code> و <code>&gt;=</code> و <code>&lt;=</code>. ونربطها بـ <code>and</code> و <code>or</code> و <code>not</code>. <code>5 &gt; 9</code> ← False، و <code>len('aaa') &gt; len('bc')</code> ← True.</p>
<h3>الجمل الشرطية</h3>
<pre>if x &lt; 10:
    print('Smaller')
elif x &gt; 20:
    print('Bigger')
else:
    print('Between')</pre>
<p><code>elif</code> و <code>else</code> اختياريتان، و <code>elif</code> تتكرر، و <code>else</code> مرة واحدة في النهاية. الشروط المتداخلة تفحص نطاقاً داخل نطاق (مثل تمرين اللياقة: العمر أولاً ثم زمن الجري).</p>
<h3>جملة match</h3>
<pre>match value:
    case 1: return "One"
    case 3 | 4: return "Three or Four"   # أكثر من تطابق
    case _: return "Invalid choice"      # الحالة الافتراضية</pre>
<h3>قراءة الأخطاء</h3>
<p>الأخطاء أصدقاؤك. في <b>تتبع المكدس Stack Trace</b> يظهر في الأسفل نوع الخطأ ورسالته، ويظهر تسلسل الاستدعاءات (مثل A() ← B() ← C()) حتى السطر الذي فشل.</p>
<table><tr><th>الخطأ</th><th>متى يحدث</th></tr>
<tr><td>NameError</td><td>استخدام متغير/دالة قبل تعريفها أو خطأ إملائي</td></tr>
<tr><td>TypeError</td><td>عملية على نوع غير مناسب مثل <code>'5' ** 2</code></td></tr>
<tr><td>ValueError</td><td>النوع صحيح والقيمة خاطئة مثل <code>int('abc')</code></td></tr>
<tr><td>IndexError</td><td>فهرس خارج النطاق مثل <code>[10,20,30][3]</code></td></tr>
<tr><td>KeyError</td><td>مفتاح غير موجود في القاموس</td></tr>
<tr><td>AttributeError</td><td>الكائن ليس له هذه الخاصية/الدالة</td></tr></table>
<h3>معالجة الاستثناءات</h3>
<p><b>الاستثناء</b> خطأ وقت التشغيل يمكن للمبرمج معالجته، ويقطع "المسار السعيد" عند التعامل مع العالم الحقيقي (إدخال المستخدم، الملفات، الشبكة).</p>
<pre>try:
    num = int(str_idx)
    text = my_list[num]
except ValueError:
    print("please enter an integer")
except IndexError:
    print("index is out of range")
except Exception as e:
    print(f"Error: {e}")
else:
    print("يعمل فقط إذا لم يحدث استثناء")
finally:
    print("يعمل في كل الأحوال")</pre>
<p><b>رفع استثناء:</b> <code>raise ValueError(f"invalid number {x} must be positive")</code>، والتقاطه بـ <code>except ValueError as e: print(e)</code>.</p>`},

{id:"s10", unit:"u2", en:"CSV & JSON Files", ar:"ملفات CSV و JSON",
en_body:`
<h3>Paths, handles, formats</h3>
<p>A <b>path</b> locates a resource; a <b>file handle</b> is an open connection to it; a <b>format</b> explains how its content is interpreted. A successful <code>open</code> doesn't prove valid CSV.</p>
<table><tr><th>Mode</th><th>Meaning</th></tr>
<tr><td>r</td><td>read</td></tr><tr><td>w</td><td>write — <b>replaces</b> existing content</td></tr><tr><td>a</td><td>append — adds to the end (rerunning can duplicate rows)</td></tr><tr><td>x</td><td>exclusive creation (fails if the file exists)</td></tr></table>
<p><code>with open(...)</code> closes the handle automatically on normal exit and on exceptions. A missing path (FileNotFoundError) is not a permission failure. Don't rely on the current working directory accidentally — build the path explicitly.</p>
<h3>CSV with the csv module</h3>
<pre>import csv
with open(path, encoding="utf-8", newline="") as f:
    rows = list(csv.reader(f))
# 'T1,"Login failed, retry"' → ['T1', 'Login failed, retry']</pre>
<p>Use UTF-8 and <code>newline=""</code>. The parser understands a <b>comma inside a quoted field</b>; <code>split(",")</code> does not. CSV values arrive as <b>text</b> — parse numbers only after checking header, row width and missing values. <code>rstrip("\\n")</code> removes the line ending without deleting meaningful spaces (unlike <code>strip</code>). A CSV record may span several physical lines. A round trip (write then read back) checks serialization but not the schema (duplicate IDs, blank messages need separate validation).</p>
<h3>JSON</h3>
<p>A dictionary lives in Python memory; JSON text is its written representation; a .json file stores that text.</p>
<table><tr><th>Function</th><th>Does</th></tr>
<tr><td>json.dump(obj, f)</td><td>writes Python → JSON to an open <b>file</b></td></tr>
<tr><td>json.load(f)</td><td>reads JSON file → Python</td></tr>
<tr><td>json.dumps(obj)</td><td>Python → JSON <b>string</b> ("s" = string)</td></tr>
<tr><td>json.loads(text)</td><td>JSON string → Python</td></tr></table>
<table><tr><th>JSON</th><th>Python</th></tr>
<tr><td>object</td><td>dict</td></tr><tr><td>array</td><td>list</td></tr><tr><td>string</td><td>str</td></tr><tr><td>number</td><td>int / float</td></tr><tr><td>true / false</td><td>True / False</td></tr><tr><td>null</td><td>None</td></tr></table>
<p>JSON object keys are strings in <b>double quotes</b>. JSON doesn't support comments, trailing commas, sets or Python expressions. A .json extension alone doesn't make text valid JSON. Write readable UTF-8 with <code>json.dump(data, f, ensure_ascii=False, indent=2)</code>. Diagnose missing files (FileNotFoundError), malformed JSON (json.JSONDecodeError) and invalid application data separately. In Colab, session storage is temporary — download files or use Google Drive.</p>`,
ar_body:`
<h3>المسارات والمقابض والصيغ</h3>
<p><b>المسار</b> يحدد مكان المورد، و<b>مقبض الملف</b> اتصال مفتوح به، و<b>الصيغة</b> تشرح كيف يُفسَّر المحتوى. نجاح <code>open</code> لا يثبت أن الـ CSV صالح.</p>
<table><tr><th>الوضع</th><th>المعنى</th></tr>
<tr><td>r</td><td>قراءة</td></tr><tr><td>w</td><td>كتابة — <b>يستبدل</b> المحتوى الموجود</td></tr><tr><td>a</td><td>إضافة للنهاية (إعادة التشغيل قد تكرر الصفوف)</td></tr><tr><td>x</td><td>إنشاء حصري (يفشل إذا الملف موجود)</td></tr></table>
<p><code>with open(...)</code> يغلق المقبض تلقائياً عند الخروج الطبيعي وعند الاستثناءات. المسار غير الموجود (FileNotFoundError) ليس فشل صلاحيات. لا تعتمد على مجلد العمل الحالي بالصدفة — ابنِ المسار صراحة.</p>
<h3>CSV مع وحدة csv</h3>
<pre>import csv
with open(path, encoding="utf-8", newline="") as f:
    rows = list(csv.reader(f))
# 'T1,"Login failed, retry"' ← ['T1', 'Login failed, retry']</pre>
<p>استخدم UTF-8 و <code>newline=""</code>. المحلل يفهم <b>الفاصلة داخل حقل منصّص</b> أما <code>split(",")</code> فلا. قيم CSV تصل <b>نصوصاً</b> — حوّل الأرقام فقط بعد فحص العنوان وعرض الصف والقيم المفقودة. <code>rstrip("\\n")</code> يحذف نهاية السطر بدون حذف المسافات المهمة (عكس <code>strip</code>). السجل الواحد قد يمتد على عدة أسطر فعلية. الكتابة ثم القراءة (round trip) تتحقق من التحويل لا من المخطط (المعرّفات المكررة والرسائل الفارغة تحتاج تحققاً منفصلاً).</p>
<h3>JSON</h3>
<p>القاموس يعيش في ذاكرة بايثون، ونص JSON هو تمثيله المكتوب، وملف .json يحفظ هذا النص.</p>
<table><tr><th>الدالة</th><th>العمل</th></tr>
<tr><td>json.dump(obj, f)</td><td>تكتب من بايثون إلى JSON في <b>ملف</b> مفتوح</td></tr>
<tr><td>json.load(f)</td><td>تقرأ ملف JSON إلى بايثون</td></tr>
<tr><td>json.dumps(obj)</td><td>من بايثون إلى <b>نص</b> JSON (حرف s = string)</td></tr>
<tr><td>json.loads(text)</td><td>من نص JSON إلى بايثون</td></tr></table>
<table><tr><th>JSON</th><th>Python</th></tr>
<tr><td>object</td><td>dict</td></tr><tr><td>array</td><td>list</td></tr><tr><td>string</td><td>str</td></tr><tr><td>number</td><td>int / float</td></tr><tr><td>true / false</td><td>True / False</td></tr><tr><td>null</td><td>None</td></tr></table>
<p>مفاتيح كائن JSON نصوص بين <b>علامتي تنصيص مزدوجة</b>. JSON لا يدعم التعليقات ولا الفاصلة الزائدة في النهاية ولا المجموعات sets ولا تعابير بايثون. امتداد .json وحده لا يجعل النص صالحاً. اكتب UTF-8 مقروءاً بـ <code>json.dump(data, f, ensure_ascii=False, indent=2)</code>. شخّص الملف المفقود (FileNotFoundError) والـ JSON التالف (json.JSONDecodeError) والبيانات غير الصالحة كلاً على حدة. في Colab التخزين مؤقت — نزّل الملفات أو استخدم Google Drive.</p>`},

{id:"s11", unit:"u2", en:"Python Projects: Ticket Batch & Police Log", ar:"مشاريع بايثون: معالجة التذاكر وسجل العمليات",
en_body:`
<h3>Team project: Shared Ticket Workspace with CI</h3>
<p>Four engineers maintain one ticket-summary utility (180 minutes). They build <b>one installable <code>ticket-batch</code> command</b> that reads synthetic CSV records, validates them and prints a <b>deterministic JSON summary</b>. No prediction model, database or service is required.</p>
<pre>CSV path -&gt; read_tickets -&gt; summarize_tickets -&gt; CLI -&gt; JSON stdout
              |                    |
              +-&gt; ValueError &lt;-----+       SUPPORT_TEAM (config)
Feature branches -&gt; reviewed PRs -&gt; integrated main -&gt; CI locked sync -&gt; smoke checks</pre>
<p><b>Learning outcomes:</b> agree on interfaces before parallel work, combine Python modules, diagnose integration failures, preserve a dependency lock (<code>uv.lock</code>), demonstrate a CI failure followed by a corrected run (GitHub Actions). Project structure includes <code>pyproject.toml</code>, <code>uv.lock</code>, <code>.python-version</code>, <code>.gitignore</code>, <code>.env.example</code> (non-secret config), <code>README.md</code>, <code>data/tickets.csv</code>, <code>src/ticket_batch/</code>. Tools: Bash, Git, Python 3.12, uv, GitHub. Milestones: A (workspace, repository, environment, reproducible commands) then B (independent implementation, invalid-input tests, full rubric). Local success is <b>not</b> a hosted workflow run — record remote CI as pending if unavailable.</p>
<h3>Week 03 team project: Synthetic Police Operations Log</h3>
<p>A fictional training station records administrative activities during a shift. The team (four learners, ~360 minutes) builds a local command-line application that reads a <b>CSV or JSON</b> file, validates each record, separates <b>accepted</b> and <b>rejected</b> records and writes <b>three reports</b>. Both formats must produce the same result for equivalent records. All data is invented (SIM identifiers).</p>
<pre>generate_data.py -&gt; data/raw/shift.csv + shift.json
app.py -&gt; storage.read_records -&gt; rules.process_records
       -&gt; accepted + rejected + summary
storage.write_reports -&gt; accepted.csv / rejected.csv / summary.json
checks.py -&gt; compares results and reopens saved reports</pre>
<p><b>Skills:</b> small functions with explicit parameters/returns; lists, dicts, loops, counters; CSV/JSON with context managers and UTF-8; separate <b>pure validation and aggregation</b> from file operations; handle <b>malformed files</b> differently from <b>invalid individual records</b>.</p>
<table><tr><th>Role</th><th>Ownership</th></tr>
<tr><td>Learner 1 – Data & validation</td><td>generator review, normalize_record, validation cases</td></tr>
<tr><td>Learner 2 – File handling</td><td>read_records, write_reports, file-error cases</td></tr>
<tr><td>Learner 3 – Processing</td><td>build_summary, process_records, expected totals</td></tr>
<tr><td>Learner 4 – Integration</td><td>app.py, checks.py, demo coordination</td></tr></table>
<p>Rubric total 100 (e.g., error handling & verification 20, teamwork & explanation 10). Hard-coded fixture totals fail the scale check; raw files must stay unchanged; a terminal success message alone is insufficient — inspect exported reports and test failure paths.</p>`,
ar_body:`
<h3>مشروع الفريق: مساحة تذاكر مشتركة مع CI</h3>
<p>أربعة مهندسين يصونون أداة واحدة لتلخيص التذاكر (180 دقيقة). يبنون <b>أمراً واحداً قابلاً للتثبيت <code>ticket-batch</code></b> يقرأ سجلات CSV مصطنعة ويتحقق منها ويطبع <b>ملخص JSON حتمياً</b> (نفس المدخل يعطي نفس المخرج). لا يحتاج نموذج تنبؤ ولا قاعدة بيانات ولا خدمة.</p>
<pre>CSV path -&gt; read_tickets -&gt; summarize_tickets -&gt; CLI -&gt; JSON stdout
              |                    |
              +-&gt; ValueError &lt;-----+       SUPPORT_TEAM (إعداد)
Feature branches -&gt; reviewed PRs -&gt; integrated main -&gt; CI locked sync -&gt; smoke checks</pre>
<p><b>المخرجات التعليمية:</b> الاتفاق على الواجهات قبل العمل المتوازي، دمج وحدات بايثون، تشخيص أخطاء التكامل، الحفاظ على قفل الاعتماديات (<code>uv.lock</code>)، وعرض فشل CI ثم تشغيل مصحح (GitHub Actions). هيكل المشروع يضم <code>pyproject.toml</code> و <code>uv.lock</code> و <code>.python-version</code> و <code>.gitignore</code> و <code>.env.example</code> (إعدادات غير سرية) و <code>README.md</code> و <code>data/tickets.csv</code> و <code>src/ticket_batch/</code>. الأدوات: Bash و Git و Python 3.12 و uv و GitHub. المراحل: A (المساحة والمستودع والبيئة وأوامر قابلة للتكرار) ثم B (التنفيذ المستقل واختبارات المدخلات الخاطئة والمعايير الكاملة). النجاح المحلي <b>ليس</b> تشغيلاً على الخادم — سجّل CI البعيد كمعلّق إذا لم يتوفر.</p>
<h3>مشروع الأسبوع 03: سجل عمليات شرطة مصطنع</h3>
<p>مركز تدريب وهمي يسجل أنشطة إدارية خلال المناوبة. الفريق (4 متدربين، حوالي 360 دقيقة) يبني تطبيق سطر أوامر محلياً يقرأ ملف <b>CSV أو JSON</b>، ويتحقق من كل سجل، ويفصل السجلات <b>المقبولة</b> عن <b>المرفوضة</b>، ويكتب <b>ثلاثة تقارير</b>. الصيغتان يجب أن تعطيا نفس النتيجة للسجلات المتكافئة. كل البيانات مختلقة (معرّفات SIM).</p>
<pre>generate_data.py -&gt; data/raw/shift.csv + shift.json
app.py -&gt; storage.read_records -&gt; rules.process_records
       -&gt; accepted + rejected + summary
storage.write_reports -&gt; accepted.csv / rejected.csv / summary.json
checks.py -&gt; يقارن النتائج ويعيد فتح التقارير المحفوظة</pre>
<p><b>المهارات:</b> دوال صغيرة بمعاملات ومخرجات واضحة؛ قوائم وقواميس وحلقات وعدادات؛ CSV و JSON مع مديري السياق و UTF-8؛ فصل <b>التحقق والتجميع الصافي</b> عن عمليات الملفات؛ معالجة <b>الملفات التالفة</b> بشكل مختلف عن <b>السجلات الفردية غير الصالحة</b>.</p>
<table><tr><th>الدور</th><th>المسؤولية</th></tr>
<tr><td>المتدرب 1 – البيانات والتحقق</td><td>مراجعة المولّد، normalize_record، حالات التحقق</td></tr>
<tr><td>المتدرب 2 – الملفات</td><td>read_records، write_reports، حالات أخطاء الملفات</td></tr>
<tr><td>المتدرب 3 – المعالجة</td><td>build_summary، process_records، المجاميع المتوقعة</td></tr>
<tr><td>المتدرب 4 – التكامل</td><td>app.py، checks.py، تنسيق العرض</td></tr></table>
<p>مجموع التقييم 100 (مثلاً معالجة الأخطاء والتحقق 20، العمل الجماعي والشرح 10). المجاميع المكتوبة يدوياً تفشل في اختبار الحجم، والملفات الخام يجب ألا تتغير، ورسالة نجاح في الطرفية وحدها لا تكفي — افحص التقارير المصدّرة واختبر مسارات الفشل.</p>`}
);
