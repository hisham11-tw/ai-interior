{id:"s21", unit:"u5", en:"NumPy Arrays, Selection & Calculation", ar:"مصفوفات NumPy: الإنشاء والاختيار والحساب",
en_body:`<h3>Key points</h3><ul>
<li>Lists store objects; arrays compute: <code>[12, 8] * 2</code> repeats, <code>np.array([12, 8]) * 2</code> doubles (<b>vectorization</b>).</li>
<li>Anatomy: <code>shape</code> (4, 3), <code>ndim</code> 2, <code>size</code> 12, <code>dtype</code>. Axis 0 = rows (desks), axis 1 = columns (types). Keep label arrays beside the data.</li>
<li>One dtype per array; IDs like '007' are text; <code>astype(int)</code> truncates; int8 overflows silently (120 + 10 → −126).</li>
<li>Create: zeros, full, <code>arange</code> (end excluded), <code>linspace</code> (end included), <code>np.random.default_rng(seed)</code>.</li>
<li><code>reshape</code> regroups in order; <code>.T</code> swaps the meaning of axes. <code>np.stack</code> adds a new axis; <code>concatenate</code> joins an existing one.</li>
<li>Masks: <code>(a &gt;= 6) &amp; (a &lt;= 9)</code> — parentheses required; <code>and</code> fails on arrays.</li>
<li>Slices are <b>views</b> (changing them changes the source); fancy/mask indexing makes copies; use <code>.copy()</code> first.</li>
<li><b>The axis you pass disappears</b>: <code>sum(axis=0)</code> → per type; <code>sum(axis=1)</code> → per desk. argmax returns the first on ties.</li>
<li>Broadcasting lines up shapes from the right; per-desk vector → <code>hours[:, None]</code>. On square tables a wrong broadcast gives no error.</li>
<li>nan = unknown: <code>np.nanmean</code>, <code>np.nanmedian</code>; zero hours → rate nan via <code>np.divide(..., where=)</code>.</li></ul>
<pre>shares = requests / requests.sum(axis=1, keepdims=True)
rate = np.divide(c, h, out=np.full(c.shape, np.nan), where=h &gt; 0)</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>القوائم تخزن كائنات والمصفوفات تحسب: <code>[12, 8] * 2</code> تكرر، و <code>np.array([12, 8]) * 2</code> تضاعف (<b>التوجيه</b>).</li>
<li>التشريح: <code>shape</code> ‏(4, 3) و <code>ndim</code> ‏2 و <code>size</code> ‏12 و <code>dtype</code>. المحور 0 = الصفوف (المكاتب) والمحور 1 = الأعمدة (الأنواع). أبقِ مصفوفات الأسماء بجانب البيانات.</li>
<li>نوع واحد لكل مصفوفة؛ والمعرّفات مثل '007' نصوص؛ و <code>astype(int)</code> تقطع؛ و int8 يفيض بصمت (120 + 10 ← −126).</li>
<li>الإنشاء: zeros و full و <code>arange</code> (النهاية غير مشمولة) و <code>linspace</code> (مشمولة) و <code>np.random.default_rng(seed)</code>.</li>
<li><code>reshape</code> يعيد التجميع بالترتيب، و <code>.T</code> تبدّل معنى المحاور. ‏<code>np.stack</code> تضيف محوراً جديداً و <code>concatenate</code> تدمج على محور موجود.</li>
<li>الأقنعة: <code>(a &gt;= 6) &amp; (a &lt;= 9)</code> — الأقواس ضرورية، و <code>and</code> تفشل مع المصفوفات.</li>
<li>التقطيع <b>عرض</b> (تعديله يغيّر المصدر)، والفهرسة الخاصة والأقنعة نسخ؛ استخدم <code>.copy()</code> أولاً.</li>
<li><b>المحور الذي تمرره يختفي</b>: <code>sum(axis=0)</code> ← لكل نوع، و <code>sum(axis=1)</code> ← لكل مكتب. ‏argmax ترجع الأول عند التعادل.</li>
<li>البث يطابق الأشكال من اليمين؛ ومتجه المكاتب ← <code>hours[:, None]</code>. في الجداول المربعة البث الخاطئ لا يعطي خطأ.</li>
<li>nan = مجهول: <code>np.nanmean</code> و <code>np.nanmedian</code>؛ والساعات صفر ← المعدل nan عبر <code>np.divide(..., where=)</code>.</li></ul>
<pre>shares = requests / requests.sum(axis=1, keepdims=True)
rate = np.divide(c, h, out=np.full(c.shape, np.nan), where=h &gt; 0)</pre>`},

{id:"s22", unit:"u5", en:"Vectors, Matrices & Linear Systems", ar:"المتجهات والمصفوفات والأنظمة الخطية",
en_body:`<h3>Key points</h3><ul>
<li>A row is a vector: position = meaning; keep one feature order.</li>
<li>Norms: L1 = sum of absolute values (= total for counts), L2 = length √Σx², max = largest feature. [3, 4] → 7, 5, 4.</li>
<li>Dot product = weighted total: <code>north @ w</code> = 217 minutes; <code>requests @ w</code> = one total per desk.</li>
<li>Distance = norm of the difference (Euclidean, Manhattan); <b>cosine similarity</b> compares direction only: a vs 2a → 1; zero vector → undefined (nan).</li>
<li>Standardize before distances: <code>(X − X.mean(axis=0)) / X.std(axis=0)</code>; constant column → z = 0. Scaling statistics come from training data only.</li>
<li>Dot product 0 = orthogonal (90°); clip cosine before arccos.</li>
<li>Matrix product rule: <b>(n, k) @ (k, m) → (n, m)</b>; <code>*</code> is elementwise; order matters (A@B ≠ B@A); (A@B).T = B.T @ A.T.</li>
<li>One-hot matrix @ table aggregates groups; Gram matrix X @ X.T holds all pair dot products.</li>
<li><code>np.linalg.solve(A, b)</code>, then verify the residual ≈ 0 and interpret; rank &lt; n → no unique answer; <code>lstsq</code> for more equations than unknowns (regression).</li></ul>
<pre>cos = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))
x = np.linalg.solve([[2, 1], [1, 2]], [24, 21])   # [9, 6]</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>الصف متجه: الموضع = المعنى؛ التزم بترتيب خصائص واحد.</li>
<li>المعايير: L1 = مجموع القيم المطلقة (= المجموع للأعداد)، و L2 = الطول √Σx²، و max = أكبر خاصية. [3, 4] ← 7 و 5 و 4.</li>
<li>الضرب النقطي = مجموع موزون: <code>north @ w</code> = ‏217 دقيقة، و <code>requests @ w</code> = مجموع لكل مكتب.</li>
<li>المسافة = معيار الفرق (إقليدية، مانهاتن)؛ و<b>تشابه جيب التمام</b> يقارن الاتجاه فقط: a مقابل 2a ← 1؛ والمتجه الصفري ← غير معرّف (nan).</li>
<li>وحّد المقياس قبل المسافات: <code>(X − X.mean(axis=0)) / X.std(axis=0)</code>؛ والعمود الثابت ← z = 0. إحصاءات التحجيم من بيانات التدريب فقط.</li>
<li>الضرب النقطي 0 = متعامد (90°)؛ وقصّ جيب التمام قبل arccos.</li>
<li>قاعدة ضرب المصفوفات: <b>(n, k) @ (k, m) ← (n, m)</b>؛ و <code>*</code> عنصراً بعنصر؛ والترتيب مهم (A@B ≠ B@A)؛ و (A@B).T = B.T @ A.T.</li>
<li>مصفوفة One-hot @ الجدول تجمّع المجموعات؛ ومصفوفة غرام X @ X.T فيها الضرب النقطي لكل زوج.</li>
<li><code>np.linalg.solve(A, b)</code> ثم تحقق أن البواقي ≈ 0 وفسّر؛ والرتبة &lt; n ← لا حل وحيد؛ و <code>lstsq</code> لمعادلات أكثر من المجاهيل (الانحدار).</li></ul>
<pre>cos = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))
x = np.linalg.solve([[2, 1], [1, 2]], [24, 21])   # [9, 6]</pre>`},

{id:"s23", unit:"u5", en:"Pandas: Loading & Inspecting Data", ar:"Pandas: تحميل البيانات وفحصها",
en_body:`<h3>Key points</h3><ul>
<li><b>Series</b> = one labelled column; <b>DataFrame</b> = several Series sharing an index. <code>s["East"]</code> by label, <code>s.iloc[0]</code> by position.</li>
<li>read_csv guesses and can damage data (007 → 7, 'unknown' turns numbers into text). Use a contract: <code>dtype=</code>, <code>na_values=</code>, <code>parse_dates=</code>.</li>
<li>Rule of the day: describe and report problems; don't fix them yet.</li>
<li>First look: shape, head/tail (not representative), <code>sample(random_state=)</code>, info, dtypes; profile with describe and <code>value_counts(dropna=False)</code>.</li>
<li>Report missing values with a denominator: "3 of 12 (25%)". <code>duplicated(keep=False)</code> shows every copy.</li>
<li>Select with <code>loc</code> (labels/masks) and <code>iloc</code> (positions); avoid chained assignment <code>df[m]['x'] = …</code>.</li>
<li>Find bad tokens: present before but NaN after <code>pd.to_numeric(errors="coerce")</code>.</li>
<li>SQLite: open read-only, name columns, close with <code>closing()</code>; pass values as <b>parameters</b> (f-strings allow SQL injection).</li>
<li>Honest numbers: count() is the denominator, not len(); <code>fillna(0)</code> before a mean is biased; size vs count = missing per group.</li>
<li>Samples: random, stratified <code>groupby().sample()</code>; <code>head(30)</code> is a convenience sample.</li></ul>
<pre>df = pd.read_csv(p, dtype={"desk_code": str}, na_values=["unknown", "n/a"], parse_dates=["opened_at"])
pd.read_sql_query("SELECT ... WHERE desk = ?", con, params=(desk,))</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li><b>Series</b> = عمود واحد مسمّى؛ و <b>DataFrame</b> = عدة Series تتشارك فهرساً. ‏<code>s["East"]</code> بالاسم و <code>s.iloc[0]</code> بالموضع.</li>
<li>read_csv يخمّن وقد يتلف البيانات (007 ← 7، و 'unknown' تحوّل الأرقام نصاً). استخدم عقداً: <code>dtype=</code> و <code>na_values=</code> و <code>parse_dates=</code>.</li>
<li>قاعدة اليوم: صِف المشكلات وأبلغ عنها ولا تصلحها بعد.</li>
<li>النظرة الأولى: shape و head/tail (لا تمثل الكل) و <code>sample(random_state=)</code> و info و dtypes؛ والتحليل بـ describe و <code>value_counts(dropna=False)</code>.</li>
<li>أبلغ عن المفقود بمقام: "3 من 12 (25%)". و <code>duplicated(keep=False)</code> تعرض كل النسخ.</li>
<li>اختر بـ <code>loc</code> (أسماء/أقنعة) و <code>iloc</code> (مواضع)؛ وتجنب الإسناد المتسلسل <code>df[m]['x'] = …</code>.</li>
<li>الرموز السيئة: موجودة قبل و NaN بعد <code>pd.to_numeric(errors="coerce")</code>.</li>
<li>SQLite: افتح للقراءة فقط، وسمِّ الأعمدة، وأغلق بـ <code>closing()</code>؛ ومرّر القيم كـ<b>معاملات</b> (f-strings تسمح بحقن SQL).</li>
<li>أرقام صادقة: count() هو المقام لا len()؛ و <code>fillna(0)</code> قبل المتوسط منحازة؛ و size مقابل count = المفقود لكل مجموعة.</li>
<li>العينات: عشوائية، وطبقية <code>groupby().sample()</code>؛ و <code>head(30)</code> عينة ملائمة.</li></ul>
<pre>df = pd.read_csv(p, dtype={"desk_code": str}, na_values=["unknown", "n/a"], parse_dates=["opened_at"])
pd.read_sql_query("SELECT ... WHERE desk = ?", con, params=(desk,))</pre>`},

{id:"s24", unit:"u5", en:"Cleaning, Merging & Pipelines", ar:"التنظيف والدمج وخطوط المعالجة",
en_body:`<h3>Key points</h3><ul>
<li>Rule: every change is a named rule, every removed row has a reason, every count reconciles: <b>exact duplicates + accepted + rejected = raw rows</b>.</li>
<li>Raw stays raw: load as text (<code>dtype=str, keep_default_na=False</code>), add <code>source_row</code>, work on a copy.</li>
<li>Normalize: strip, lower/title, explicit mappings; unknown values are <b>flagged</b>, never guessed.</li>
<li>Convert with named rules ("30 min" → 30); dates with an explicit <code>format=</code>; impossible dates → NaT and listed.</li>
<li>IDs: strip, <code>zfill(3)</code> for digit-only codes, then validate against the lookup; never convert IDs to numbers.</li>
<li>Exact duplicate → keep the first; conflicting duplicate (same ID, different content) → reject all copies.</li>
<li>Missing: keep (default), exclude with a count, or impute with a flag column (<code>groupby().transform("median")</code>).</li>
<li>Implausible values (range rule) are flagged/rejected with reasons; IQR outliers are only "worth a look".</li>
<li>Joins: check cardinality; <code>merge(..., how="left", validate="many_to_one", indicator=True)</code>; normalize keys in both tables.</li>
<li>Reshape: <code>pivot_table</code> (aggregates repeats), <code>melt</code>; agg = row per group, transform = value per row.</li>
<li>Pipeline: validate first, write last; sort rows and fix column order for identical reruns.</li></ul>
<pre>m = req.merge(desks, on="desk_code", how="left", validate="many_to_one", indicator=True)
assert (m["_merge"] == "both").all()</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>القاعدة: كل تغيير قاعدة مسماة، وكل صف محذوف له سبب، وكل عدد يتطابق: <b>التكرارات التامة + المقبول + المرفوض = صفوف الخام</b>.</li>
<li>الخام يبقى خاماً: حمّل كنص (<code>dtype=str, keep_default_na=False</code>)، وأضف <code>source_row</code>، واعمل على نسخة.</li>
<li>التوحيد: strip و lower/title وربط صريح؛ والقيم المجهولة <b>تُعلّم</b> ولا تُخمّن.</li>
<li>التحويل بقواعد مسماة ("30 min" ← 30)؛ والتواريخ بـ <code>format=</code> صريح؛ والتواريخ المستحيلة ← NaT وتُسرد.</li>
<li>المعرّفات: strip و <code>zfill(3)</code> للرموز الرقمية ثم التحقق من جدول البحث؛ ولا تحوّل المعرّفات لأرقام أبداً.</li>
<li>التكرار التام ← أبقِ الأول؛ والتكرار المتعارض (نفس المعرّف بمحتوى مختلف) ← ارفض كل النسخ.</li>
<li>المفقود: أبقِه (افتراضي)، أو استبعده مع العدّ، أو عوّضه مع عمود علامة (<code>groupby().transform("median")</code>).</li>
<li>القيم غير المعقولة (قاعدة المدى) تُعلّم/تُرفض بأسباب؛ وقيم IQR الشاذة "تستحق النظر" فقط.</li>
<li>الربط: افحص العلاقة العددية؛ ‏<code>merge(..., how="left", validate="many_to_one", indicator=True)</code>؛ ووحّد المفاتيح في الجدولين.</li>
<li>إعادة التشكيل: <code>pivot_table</code> (تجمّع المكرر) و <code>melt</code>؛ و agg = صف لكل مجموعة، و transform = قيمة لكل صف.</li>
<li>خط المعالجة: تحقق أولاً واكتب آخراً؛ ورتّب الصفوف وثبّت ترتيب الأعمدة لإعادة تشغيل متطابقة.</li></ul>
<pre>m = req.merge(desks, on="desk_code", how="left", validate="many_to_one", indicator=True)
assert (m["_merge"] == "both").all()</pre>`},

{id:"s26", unit:"u6", en:"EDA: Distributions, Relationships & Outliers", ar:"التحليل الاستكشافي: التوزيعات والعلاقات والقيم الشاذة",
en_body:`<h3>Key points</h3><ul>
<li>EDA asks "what is in this table and what could mislead us?" Each finding = <b>number + denominator + caveat</b>.</li>
<li>Audit first: shape, dtypes, missing, duplicates, row grain (<code>is_unique</code>), ranges.</li>
<li>Skewed data (mean 35.8 &gt; median 25.0): report median + IQR + P95; the mean is not robust. Don't delete extreme cases — test sensitivity.</li>
<li>Histograms show shape; bins change the story; skew &gt; 0 = right tail.</li>
<li>Categories: counts + shares; keep zero hours/days with <code>reindex(..., fill_value=0)</code> or <code>resample</code>. Box plots and ECDFs compare groups; always show n.</li>
<li>Missingness is a pattern: report response rates per group.</li>
<li>Pairs: number–number → scatter + Pearson/Spearman; number–category → box plot; category–category → crosstab with the right <code>normalize=</code>.</li>
<li>Pearson = straight-line pattern; Spearman = ranks (monotonic). Association is not cause.</li>
<li>Outlier rules disagree (IQR 42, robust z 36, z 5 flags): z is masked by outliers. Flag, investigate, report both versions; delete nothing.</li></ul>
<pre>q1, q3 = s.quantile([.25, .75]); iqr = q3 - q1
flag = (s &lt; q1 - 1.5*iqr) | (s &gt; q3 + 1.5*iqr)</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>التحليل الاستكشافي يسأل "ماذا في الجدول وما الذي قد يضللنا؟" وكل نتيجة = <b>رقم + مقام + تحفظ</b>.</li>
<li>دقّق أولاً: الشكل والأنواع والمفقود والتكرار ومستوى الصف (<code>is_unique</code>) والمدى.</li>
<li>البيانات الملتوية (المتوسط 35.8 &gt; الوسيط 25.0): اذكر الوسيط و IQR والمئين 95؛ المتوسط غير متين. لا تحذف الحالات المتطرفة — اختبر الحساسية.</li>
<li>المدرج التكراري يُظهر الشكل والفئات تغيّر القصة؛ والالتواء &gt; 0 = ذيل يميني.</li>
<li>الفئات: أعداد + نسب؛ وأبقِ الساعات/الأيام الصفرية بـ <code>reindex(..., fill_value=0)</code> أو <code>resample</code>. الصندوق و ECDF لمقارنة المجموعات، واعرض n دائماً.</li>
<li>الفقد نمط بحد ذاته: اذكر معدل الاستجابة لكل مجموعة.</li>
<li>الأزواج: رقم–رقم ← تشتت + بيرسون/سبيرمان؛ ورقم–فئة ← صندوق؛ وفئة–فئة ← جدول تقاطع بـ <code>normalize=</code> الصحيح.</li>
<li>بيرسون = نمط خط مستقيم، وسبيرمان = رتب (رتيب). الارتباط ليس سببية.</li>
<li>قواعد الشذوذ تختلف (IQR ‏42 و robust z ‏36 و z ‏5): ‏z يتأثر بالإخفاء. علّم وافحص واذكر النسختين ولا تحذف شيئاً.</li></ul>
<pre>q1, q3 = s.quantile([.25, .75]); iqr = q3 - q1
flag = (s &lt; q1 - 1.5*iqr) | (s &gt; q3 + 1.5*iqr)</pre>`},

{id:"s27", unit:"u6", en:"Charts: Matplotlib & Seaborn", ar:"الرسوم: Matplotlib و Seaborn",
en_body:`<h3>Key points</h3><ul>
<li>Every chart: a question, title, axis labels, honest scale, stated denominator.</li>
<li>Figure (savefig, suptitle) → Axes (bar, plot, set_title) → Axis → Artists (<code>ax.patches</code>, <code>ax.lines</code> can be checked in code).</li>
<li>Choose by question: comparison → bar; trend → line; one distribution → histogram/ECDF; groups → box; two numbers → scatter; composition → stacked bar; two categories → heatmap. Avoid 3-D, big pies, dual y-axes.</li>
<li>Bars start at 0 and are sorted; lines may start above 0; mention partial periods.</li>
<li>Small multiples share axes and bins; one highlight colour, the rest grey; same colour = same category everywhere.</li>
<li>Order months by period (<code>dt.to_period('M')</code>), not by count. Annotations are computed, never typed.</li>
<li>Export: <code>savefig(dpi=150, bbox_inches="tight")</code> before <code>show()</code>.</li>
<li>Seaborn uses tidy data (data=, x=, y=, hue=, col=). Axes-level returns Axes; figure-level returns FacetGrid.</li>
<li><code>stat="percent", common_norm=False</code> compares group shapes; bar of means hides skew; heatmaps: <code>annot=True</code>, <code>RdBu_r, center=0</code> for correlations.</li></ul>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>كل رسم: سؤال وعنوان وأسماء محاور ومقياس صادق ومقام مذكور.</li>
<li>Figure ‏(savefig و suptitle) ← Axes ‏(bar و plot و set_title) ← Axis ← Artists (<code>ax.patches</code> و <code>ax.lines</code> يمكن فحصها بالكود).</li>
<li>اختر حسب السؤال: مقارنة ← أعمدة؛ اتجاه ← خط؛ توزيع واحد ← مدرج/ECDF؛ مجموعات ← صندوق؛ رقمان ← تشتت؛ تركيبة ← أعمدة مكدسة؛ فئتان ← خريطة حرارية. تجنب الثلاثي الأبعاد والدوائر الكبيرة والمحورين الصاديين.</li>
<li>الأعمدة تبدأ من 0 ومرتبة؛ والخطوط قد تبدأ فوق 0؛ واذكر الفترات الجزئية.</li>
<li>المضاعفات الصغيرة تتشارك المحاور والفئات؛ ولون تمييز واحد والباقي رمادي؛ ونفس اللون = نفس الفئة في كل مكان.</li>
<li>رتّب الأشهر بالفترة (<code>dt.to_period('M')</code>) لا بالعدد. والتعليقات محسوبة لا مكتوبة يدوياً.</li>
<li>التصدير: <code>savefig(dpi=150, bbox_inches="tight")</code> قبل <code>show()</code>.</li>
<li>Seaborn يستخدم بيانات مرتبة (data= و x= و y= و hue= و col=). مستوى المحاور يرجع Axes ومستوى الشكل يرجع FacetGrid.</li>
<li><code>stat="percent", common_norm=False</code> تقارن أشكال المجموعات؛ وأعمدة المتوسطات تخفي الالتواء؛ والخرائط الحرارية: <code>annot=True</code> و <code>RdBu_r, center=0</code> للارتباطات.</li></ul>`},

{id:"s28", unit:"u6", en:"Interactive Dashboards with Streamlit", ar:"لوحات المعلومات التفاعلية بـ Streamlit",
en_body:`<h3>Key points</h3><ul>
<li><code>streamlit run app.py</code>: any widget change <b>reruns the whole script</b>; elements appear in creation order.</li>
<li>Load data with <code>@st.cache_data</code> (returns a fresh copy); <code>@st.cache_resource</code> is for shared objects like connections — never mutate cached data.</li>
<li>Keep logic in pure, tested functions (dash_logic.py); the page only has widgets and layout.</li>
<li><code>st.metric</code> with units and one format; empty table → 0 and "—", never nan or a crash.</li>
<li>Widgets: selectbox, multiselect, slider, date_input — in the sidebar, open at "All"/full range, options from the data, a unique <code>key=</code> each.</li>
<li>Layout: title + data note → KPIs (<code>st.columns</code>) → main chart → <code>st.tabs</code> → <code>st.expander</code> for method notes.</li>
<li>Normal variables reset each rerun; use <code>st.session_state</code>. A button is True only in the rerun right after the click.</li>
<li>Whole-day date filter: compare <code>opened_at.dt.date</code>. Reset with <code>on_click</code> callback; a form applies only on submit.</li>
<li>Test with AppTest: known data, one action, expected value from pandas, a test that can fail. Show "Showing n of N requests".</li></ul>
<pre>@st.cache_data
def load(path): return pd.read_csv(path, parse_dates=["opened_at"])
region = st.sidebar.selectbox("Region", ["All", *regions], key="region")</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li><code>streamlit run app.py</code>: أي تغيير في أداة <b>يعيد تشغيل السكربت كله</b>، والعناصر تظهر بترتيب إنشائها.</li>
<li>حمّل البيانات بـ <code>@st.cache_data</code> (ترجع نسخة جديدة)؛ و <code>@st.cache_resource</code> للكائنات المشتركة كالاتصالات — ولا تعدّل البيانات المخزنة.</li>
<li>أبقِ المنطق في دوال نقية مختبرة (dash_logic.py)، والصفحة فيها الأدوات والتخطيط فقط.</li>
<li><code>st.metric</code> بوحدات وتنسيق واحد؛ والجدول الفارغ ← 0 و "—" لا nan ولا تعطل.</li>
<li>الأدوات: selectbox و multiselect و slider و date_input — في الشريط الجانبي، تفتح على "All"/المدى الكامل، والخيارات من البيانات، و <code>key=</code> فريد لكل منها.</li>
<li>التخطيط: العنوان وملاحظة البيانات ← المؤشرات (<code>st.columns</code>) ← الرسم الرئيسي ← <code>st.tabs</code> ← <code>st.expander</code> لملاحظات الطريقة.</li>
<li>المتغيرات العادية تُصفّر كل تشغيل؛ استخدم <code>st.session_state</code>. والزر True فقط في التشغيل الذي يلي الضغطة.</li>
<li>مرشح التاريخ بيوم كامل: قارن <code>opened_at.dt.date</code>. إعادة الضبط بدالة <code>on_click</code>، والنموذج يُطبق عند الإرسال فقط.</li>
<li>اختبر بـ AppTest: بيانات معروفة وإجراء واحد وقيمة متوقعة من pandas واختبار يمكن أن يفشل. اعرض "Showing n of N requests".</li></ul>
<pre>@st.cache_data
def load(path): return pd.read_csv(path, parse_dates=["opened_at"])
region = st.sidebar.selectbox("Region", ["All", *regions], key="region")</pre>`},

{id:"s29", unit:"u6", en:"Communicating & Verifying Findings", ar:"إيصال النتائج والتحقق منها",
en_body:`<h3>Key points</h3><ul>
<li>Three rules: every number from code; every number with its denominator; every comparison fair.</li>
<li>A verifiable claim has: value, numerator/denominator, population, period, method.</li>
<li>Counts answer "where is the most work"; rates answer "where is it most likely".</li>
<li>Shares change in <b>percentage points</b> (17.1% → 22.9% = +5.9 pp); counts change in % of the old value. Check the middle of the path.</li>
<li>Use complete periods only — partial weeks make fake trends.</li>
<li>Simpson's paradox: compare within types and show the mix.</li>
<li>Small groups: bootstrap interval; label evidence: interval includes 0 → weak; excludes 0 but smaller group &lt; 30 → moderate; both ≥ 30 → strong.</li>
<li>Report response rates for survey numbers; association words ("is associated with") for observational data, not "causes".</li>
<li>Strong headline: answer first, value + unit + comparison. Round sensibly (shares whole %, hours 1 decimal).</li>
<li>Robustness: run pre-chosen variants and report all. Limitations with numbers. Build the report from finding records so every number is traceable.</li></ul>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>ثلاث قواعد: كل رقم من الكود؛ ولكل رقم مقامه؛ وكل مقارنة عادلة.</li>
<li>الادعاء القابل للتحقق فيه: القيمة والبسط/المقام والمجتمع والفترة والطريقة.</li>
<li>الأعداد تجيب "أين أكثر عمل"، والمعدلات تجيب "أين يُرجّح أكثر".</li>
<li>النسب تتغير بـ<b>النقاط المئوية</b> (17.1% ← 22.9% = ‏+5.9 نقطة)، والأعداد بنسبة من القيمة القديمة. افحص منتصف المسار.</li>
<li>استخدم الفترات الكاملة فقط — الأسابيع الجزئية تصنع اتجاهات زائفة.</li>
<li>مفارقة سيمبسون: قارن داخل الأنواع واعرض المزيج.</li>
<li>المجموعات الصغيرة: فترة Bootstrap؛ وتسمية الدليل: الفترة تشمل 0 ← ضعيف؛ تستبعد 0 والأصغر &lt; 30 ← متوسط؛ الاثنان ≥ 30 ← قوي.</li>
<li>اذكر معدل الاستجابة لأرقام الاستبيان؛ واستخدم كلمات الارتباط ("يرتبط بـ") للبيانات الرصدية لا "يسبب".</li>
<li>العنوان القوي: الإجابة أولاً، قيمة + وحدة + مقارنة. قرّب بمنطق (النسب بالمئة الصحيحة والساعات منزلة واحدة).</li>
<li>المتانة: شغّل نسخاً محددة مسبقاً واذكرها كلها. القيود بالأرقام. ابنِ التقرير من سجلات النتائج ليكون كل رقم قابلاً للتتبع.</li></ul>`},

{id:"s31", unit:"u7", en:"ML Concepts, Lifecycle & Baselines", ar:"مفاهيم تعلم الآلة ودورة حياتها وخطوط الأساس",
en_body:`<h3>Key points</h3><ul>
<li>ML learns a rule (model) from data + known answers; a traditional program uses rules written by a person. Biased examples → biased rule.</li>
<li><b>Supervised</b>: classification (category) or regression (number). <b>Unsupervised</b>: clustering, anomaly detection, dimensionality reduction. Semi-supervised, self-supervised (LLMs), reinforcement (rewards, return G).</li>
<li>If a query, count or fixed rule answers exactly → not ML.</li>
<li>X = feature table, y = label vector, same rows; the label is never a feature. Unit of prediction = one row; decision time decides which columns are allowed.</li>
<li>Columns recorded after the decision (outcome, supervisor_id, minutes) are leaks. IDs are never features.</li>
<li>Nominal → one-hot (<code>get_dummies</code>); dates → hour/weekday/weekend (Fri–Sat in Saudi Arabia). Unknown labels: dropna, not fillna(0).</li>
<li>Lifecycle: define → collect → prepare → split → baseline → train → evaluate → deploy → monitor. Decision gates: ≥ 200 labelled, ≥ 30 per class, someone will act.</li>
<li>Metrics: accuracy, precision TP/(TP+FP), recall TP/(TP+FN), F1. Majority baseline 0.813 accuracy with recall 0 — accuracy misleads on unbalanced classes.</li>
<li>Regression: MAE, MSE, RMSE, R². The median minimizes MAE; the mean minimizes MSE. A model must beat the baseline.</li></ul>
<pre>clf = DummyClassifier(strategy="most_frequent").fit(X, y)
reg = DummyRegressor(strategy="median").fit(X, minutes)</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>تعلم الآلة يتعلم قاعدة (نموذجاً) من بيانات + إجابات معروفة؛ والبرنامج التقليدي يستخدم قواعد يكتبها شخص. الأمثلة المنحازة ← قاعدة منحازة.</li>
<li><b>الموجّه</b>: تصنيف (فئة) أو انحدار (رقم). <b>غير الموجّه</b>: تجميع وكشف شذوذ وتقليل أبعاد. وشبه الموجّه، والذاتي (النماذج اللغوية)، والتعزيزي (مكافآت وعائد G).</li>
<li>إذا أجاب استعلام أو عدّ أو قاعدة ثابتة بدقة ← ليس تعلم آلة.</li>
<li>X = جدول الخصائص و y = متجه التسمية بنفس الصفوف؛ والتسمية لا تكون خاصية. وحدة التنبؤ = صف واحد، ووقت القرار يحدد الأعمدة المسموحة.</li>
<li>الأعمدة المسجلة بعد القرار (outcome و supervisor_id و minutes) تسرب. والمعرّفات ليست خصائص أبداً.</li>
<li>الاسمية ← One-hot ‏(<code>get_dummies</code>)؛ والتواريخ ← الساعة واليوم ونهاية الأسبوع (الجمعة والسبت في السعودية). التسميات المجهولة: dropna لا fillna(0).</li>
<li>دورة الحياة: التعريف ← الجمع ← التحضير ← التقسيم ← خط الأساس ← التدريب ← التقييم ← النشر ← المراقبة. بوابات القرار: ≥ 200 مسمى، و ≥ 30 لكل فئة، وشخص سيتصرف.</li>
<li>المقاييس: الدقة، والضبط TP/(TP+FP)، والاستدعاء TP/(TP+FN)، و F1. خط أساس الأغلبية دقته 0.813 واستدعاؤه 0 — الدقة تضلل مع الفئات غير المتوازنة.</li>
<li>الانحدار: MAE و MSE و RMSE و R². الوسيط يقلل MAE والمتوسط يقلل MSE. النموذج يجب أن يتفوق على خط الأساس.</li></ul>
<pre>clf = DummyClassifier(strategy="most_frequent").fit(X, y)
reg = DummyRegressor(strategy="median").fit(X, minutes)</pre>`},

{id:"s32", unit:"u7", en:"Data Splitting, Evaluation & Leakage", ar:"تقسيم البيانات والتقييم والتسرب",
en_body:`<h3>Key points</h3><ul>
<li>A score is honest only if the model never saw the test rows, the answer or the future.</li>
<li>Generalisation gap = test error − training error. A memorising model: train 1.000, test 0.791.</li>
<li>Underfitting: both errors high (high bias). Overfitting: training very low, test high (high variance).</li>
<li>Training = fit + all preparation; validation = choose settings; test = used once at the end.</li>
<li><code>train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)</code> keeps the class mix.</li>
<li>Time split for future cases (train before cutoff); group split (GroupShuffleSplit) for unseen desks.</li>
<li>SE of accuracy ≈ √(a(1−a)/n); 95% ≈ a ± 1.96·SE. Four times the rows halves the SE.</li>
<li>Leakage types: <b>target</b> (column recorded after the label), <b>contamination</b> (statistics from test rows), <b>record/group</b> (same record on both sides), <b>temporal</b> (future information).</li>
<li>A split can't catch target leakage — only the timing check can. Fit preparation on train only; drop duplicates before splitting; use past-only windows.</li></ul>
<pre>(t &gt;= opened - pd.Timedelta(days=7)) &amp; (t &lt; opened)   # past-only feature</pre>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>الدرجة صادقة فقط إذا لم يرَ النموذج صفوف الاختبار ولا الإجابة ولا المستقبل.</li>
<li>فجوة التعميم = خطأ الاختبار − خطأ التدريب. نموذج الحفظ: تدريب 1.000 واختبار 0.791.</li>
<li>نقص التلاؤم: الخطآن مرتفعان (تحيز عالٍ). فرط التلاؤم: التدريب منخفض جداً والاختبار مرتفع (تباين عالٍ).</li>
<li>التدريب = التدريب + كل التحضير؛ والتحقق = اختيار الإعدادات؛ والاختبار = مرة واحدة في النهاية.</li>
<li><code>train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)</code> يحافظ على مزيج الفئات.</li>
<li>التقسيم الزمني للحالات المستقبلية (التدريب قبل القطع)، والتقسيم بالمجموعات (GroupShuffleSplit) للمكاتب غير المرئية.</li>
<li>الخطأ المعياري للدقة ≈ √(a(1−a)/n)؛ وفترة 95% ≈ a ± 1.96·SE. أربعة أضعاف الصفوف تنصّفه.</li>
<li>أنواع التسرب: <b>الهدف</b> (عمود سُجل بعد التسمية)، و<b>التلوث</b> (إحصاءات من الاختبار)، و<b>السجل/المجموعة</b> (نفس السجل في الطرفين)، و<b>الزمني</b> (معلومات مستقبلية).</li>
<li>التقسيم لا يكشف تسرب الهدف — فحص التوقيت وحده يكشفه. درّب التحضير على التدريب فقط، واحذف المكرر قبل التقسيم، واستخدم نوافذ الماضي فقط.</li></ul>
<pre>(t &gt;= opened - pd.Timedelta(days=7)) &amp; (t &lt; opened)   # خاصية من الماضي فقط</pre>`},

{id:"s33", unit:"u7", en:"Police Data: Cleaning & Indicators", ar:"بيانات الشرطة: التنظيف والمؤشرات",
en_body:`<h3>Key points</h3><ul>
<li>An indicator is a definition, a denominator and a check before it is a number. Indicators never evaluate people.</li>
<li>Two sources: reports (1 row per report) → service_records (many actions per report) + desks lookup.</li>
<li>Policy first; a rule matrix instead of silent <code>dropna()</code>; reconcile: 432 = 8 duplicates + 403 accepted + 21 rejected.</li>
<li>Normalize labels ('urgent' → high, 'DOCS' → Document), strict date format, reject future dates.</li>
<li>Exact duplicate → drop the copy; conflicting ID → reject all versions.</li>
<li>Minutes as text: parse '9.5 min'; '', 'N/A' → missing (kept); '0', '-5', '900' → implausible.</li>
<li>Record rules: orphan_record, bad_date, action_before_report (checked after the join), implausible_minutes. Join with <code>validate="many_to_one"</code>.</li>
<li>Target compliance: denominator = reports with a first action (not service records).</li>
<li><b>Censoring</b>: judge 7-day closure only for reports at least 7 days old (March 0.62 naive vs 0.76 eligible).</li>
<li>Flag small groups (n &lt; 20), never delete them; explain two-path mismatches; compare with medians, n and spread.</li></ul>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>المؤشر تعريف ومقام وفحص قبل أن يكون رقماً، والمؤشرات لا تقيّم الأشخاص أبداً.</li>
<li>مصدران: البلاغات (صف لكل بلاغ) ← سجلات الخدمة (إجراءات كثيرة لكل بلاغ) + جدول المكاتب.</li>
<li>السياسة أولاً؛ ومصفوفة قواعد بدل <code>dropna()</code> الصامت؛ والمطابقة: 432 = ‏8 تكرارات + 403 مقبولة + 21 مرفوضة.</li>
<li>وحّد الأسماء ('urgent' ← high و 'DOCS' ← Document)، وصيغة تاريخ صارمة، وارفض التواريخ المستقبلية.</li>
<li>التكرار التام ← احذف النسخة؛ والمعرّف المتعارض ← ارفض كل النسخ.</li>
<li>الدقائق كنص: حلّل '9.5 min'؛ و '' و 'N/A' ← مفقودة (تبقى)؛ و '0' و '-5' و '900' ← غير معقولة.</li>
<li>قواعد السجلات: orphan_record و bad_date و action_before_report (بعد الربط) و implausible_minutes. اربط بـ <code>validate="many_to_one"</code>.</li>
<li>الالتزام بالهدف: المقام = البلاغات التي لها إجراء أول (لا سجلات الخدمة).</li>
<li><b>الحجب</b>: احكم على الإغلاق خلال 7 أيام فقط للبلاغات التي مضى عليها 7 أيام (مارس 0.62 ساذج مقابل 0.76 للمؤهلة).</li>
<li>علّم المجموعات الصغيرة (n &lt; 20) ولا تحذفها؛ واشرح اختلاف المسارين؛ وقارن بالوسيط و n والتشتت.</li></ul>`},

{id:"s34", unit:"u7", en:"Dashboard Presentation & Defence", ar:"عرض اللوحة والدفاع عنها",
en_body:`<h3>Key points</h3><ul>
<li>A dashboard is finished when you can say where every number comes from and what it cannot tell us.</li>
<li>Three layers: data (indicators.py) → tested view functions (views.py) → thin page (dashboard.py).</li>
<li>Headline rates: <b>sum numerators / sum denominators</b>, not the average of rates (0.627 vs 0.664).</li>
<li>Labels carry n ("Harbor (n=40)"); keep the small_n flag; sort highest first.</li>
<li>One format rule per indicator: 65.5%, 5.2 h, 1,543. Empty state: say why + what to do, then <code>st.stop()</code>.</li>
<li>Reproducible download: sorted, no index, UTF-8. Smoke-test the page with AppTest before every demo.</li>
<li>Data-source card built from the cleaning summary; limits stated as facts with numbers.</li>
<li>Claim verdicts: supported / not supported / misleading; "insufficient data" when a denominator &lt; 20.</li>
<li>Sensitivity: if the ranking changes when target hours change, don't present it as a finding.</li>
<li>Say it with counts: "65.5% (74/113)"; shares on a 0–1 axis. Demo: question → sources → main finding → limits → questions (5 min).</li></ul>`,
ar_body:`<h3>ملخص المهم</h3><ul>
<li>اللوحة تكتمل عندما تستطيع قول من أين يأتي كل رقم وما الذي لا يستطيع إخبارنا به.</li>
<li>ثلاث طبقات: البيانات (indicators.py) ← دوال عرض مختبرة (views.py) ← صفحة رفيعة (dashboard.py).</li>
<li>المعدلات الرئيسية: <b>مجموع البسوط ÷ مجموع المقامات</b> لا متوسط المعدلات (0.627 مقابل 0.664).</li>
<li>الأسماء تحمل n ("Harbor (n=40)")؛ وأبقِ علامة small_n؛ ورتّب الأعلى أولاً.</li>
<li>قاعدة تنسيق لكل مؤشر: 65.5% و 5.2 h و 1,543. الحالة الفارغة: قل السبب وماذا يفعل المستخدم ثم <code>st.stop()</code>.</li>
<li>تنزيل قابل للتكرار: مرتب وبلا فهرس و UTF-8. اختبر الصفحة بـ AppTest قبل كل عرض.</li>
<li>بطاقة المصدر تُبنى من ملخص التنظيف، والقيود تُذكر كحقائق بالأرقام.</li>
<li>أحكام الادعاءات: مدعوم / غير مدعوم / مضلل؛ و "insufficient data" عندما يكون مقام &lt; 20.</li>
<li>الحساسية: إذا تغيّر الترتيب مع تغيير ساعات الهدف فلا تعرضه كنتيجة.</li>
<li>قلها بالأعداد: "65.5% (74/113)"؛ والنسب على محور 0–1. العرض: السؤال ← المصادر ← النتيجة ← القيود ← الأسئلة (5 دقائق).</li></ul>`}
);

 const b = bestGet();
 let h = `<header class="hero"><p class="eyebrow">AI For Interior · personal study aid</p><h1>${t("title")}</h1><p class="lede">${t("sub")}.</p>
 <div class="stats"><div><b>${UNITS.length}</b><span>${t("units")}</span></div><div><b>${SECTIONS.length}</b><span>${t("sections")}</span></div><div><b>${QB.length}</b><span>${t("questions")}</span></div><div><b>${b!==null? b+"%" : "—"}</b><span>${t("best")}</span></div></div>
 <div class="cta"><a class="btn primary" href="#exam">${t("startExam")}</a><a class="btn" href="#bank">${t("bank")}</a></div></header>`;
 UNITS.forEach((u,ui)=>{
  const secs = SECTIONS.filter(s=>s.unit===u.id);
  h += `<section class="ugroup"><h2><span class="un">${ui+1}</span>${esc(unitTitle(u))}</h2><div class="cards">`;
  secs.forEach(s=>{
   h += `<a class="card" href="#${s.id}"><span class="sn">${secNum(s.id)}</span><b>${esc(secTitle(s))}</b><small>${qCount(s.id)? qCount(s.id)+' '+t("questions") : t("noQ")}</small></a>`;
  });
  h += `</div></section>`;
 });
 return h;
}

function viewSection(id){
 const s = secById(id), i = SECTIONS.indexOf(s), u = UNITS.find(x=>x.id===s.unit);
 const prev = SECTIONS[i-1], next = SECTIONS[i+1];
 const pbar = qCount(id) ? `<div class="practicebar"><button class="btn primary" data-act="practice" data-sec="${id}">${t("practice")}</button><span><b>${qCount(id)}</b> ${t("questions")} · ${t("practiceInfo")}</span></div>` : `<p class="note">${t("noQ")}</p>`;
 let h = `<article class="sec"><p class="eyebrow">${t("unit")} ${UNITS.indexOf(u)+1} · ${esc(unitTitle(u))}</p><h1><span class="sn big">${secNum(id)}</span>${esc(secTitle(s))}</h1>
 ${pbar}
 <div class="body">${st.lang==="ar"? s.ar_body : s.en_body}</div>
 ${pbar}
 <nav class="pager">${prev? `<a class="btn" href="#${prev.id}">‹ ${t("prevSec")}: ${esc(secTitle(prev))}</a>`:"<span></span>"}${next? `<a class="btn" href="#${next.id}">${t("nextSec")}: ${esc(secTitle(next))} ›</a>`:""}</nav></article>`;
 return h;
}

function viewBank(){
 let h = `<h1>${t("bank")}</h1><div class="filters">
  <label for="fsec">${t("study")}</label><select id="fsec"><option value="all">${t("allSections")}</option>${SECTIONS.filter(s=>QSECS.includes(s.id)).map(s=>`<option value="${s.id}" ${st.bankSec===s.id?"selected":""}>${secNum(s.id)}. ${esc(secTitle(s))}</option>`).join("")}</select>
  <label for="ftype">${t("type")}</label><select id="ftype"><option value="all">${t("anyType")}</option><option value="m" ${st.bankType==="m"?"selected":""}>${t("mcq")}</option><option value="tf" ${st.bankType==="tf"?"selected":""}>${t("tf")}</option></select>
  <label for="fq" class="vh">${t("search")}</label><input id="fq" type="search" placeholder="${t("search")}" value="${esc(st.bankQ)}"></div>`;
 const qq = st.bankQ.trim().toLowerCase();
 const list = QB.map((q,i)=>({q,i})).filter(({q})=> (st.bankSec==="all"||q.s===st.bankSec) && (st.bankType==="all"||q.t===st.bankType) && (!qq || (q.en+" "+q.ar+" "+q.eo.join(" ")+" "+(q.ao||[]).join(" ")).toLowerCase().includes(qq)));
 h += `<p class="muted">${list.length} ${t("shown")} ${t("of2")} ${QB.length}</p><ol class="banklist">`;
 list.forEach(({q,i})=>{
  const o = opts(q);
  h += `<li class="${TRSET.has(i)?"showtr":""}"><div class="qmeta"><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span><span class="chip ghost">${q.t==="tf"?t("tf"):t("mcq")}</span><span class="qid">#${i+1}</span>${trBtn(i)}</div>
  <p class="qt" dir="auto">${esc(qText(q))}${trLine(trQ(q))}</p><ol class="optlist" type="A">${o.map((x,p)=>`<li dir="auto">${esc(x)}${trOpt(q,p,o)}</li>`).join("")}</ol>
  <details class="ans"><summary>${t("showAns")}</summary><p><b>${t("rightAns")}:</b> <span dir="auto">${esc(o[q.a])}</span></p><p class="muted" dir="auto">${esc(qExp(q))}</p></details></li>`;
 });
 return h + `</ol>`;
}

const PY=["s05","s06","s07","s08","s09","s10","s21","s22","s23","s24"];
function alloc(secs, bySec, total){
 const N=secs.reduce((a,s)=>a+bySec[s].length,0);
 const r=secs.map(s=>{const x=bySec[s].length*total/N; return {s,n:Math.floor(x),f:x-Math.floor(x),k:Math.random()};});
 let left=total-r.reduce((a,o)=>a+o.n,0);
 r.slice().sort((a,b)=>(b.f-a.f)||(a.k-b.k)).slice(0,left).forEach(o=>o.n++);
 return r;
}
function buildExam(){
 const bySec = {}; QB.forEach((q,i)=>{(bySec[q.s]=bySec[q.s]||[]).push(i);});
 const all=Object.keys(bySec), py=all.filter(s=>PY.includes(s)), rest=all.filter(s=>!PY.includes(s));
 const pyN=Math.round(50*py.reduce((a,s)=>a+bySec[s].length,0)/QB.length);
 let picks=[];
 alloc(py,bySec,pyN).concat(alloc(rest,bySec,50-pyN)).forEach(o=>{ picks=picks.concat(shuffle(bySec[o.s]).slice(0,o.n)); });
 return newQuiz("exam", shuffle(picks));
}
function buildPractice(sec){ return newQuiz("practice", shuffle(QB.map((q,i)=>i).filter(i=>QB[i].s===sec)), sec); }
function newQuiz(mode, idxs, sec){
 return {mode, sec, idx:0, done:false, confirm:false,
  items: idxs.map(qi=>{ const q=QB[qi]; return {qi, perm: q.t==="tf"?[0,1]:shuffle([0,1,2,3]), ans:null}; })};
}

function viewQuizIntro(){
 const b = bestGet();
 return `<section class="intro"><h1>${t("exam")}</h1><p class="lede">${t("examInfo")}</p>
 <ul class="facts"><li><b>50</b> ${t("questions")}</li><li><b>${QSECS.length}</b> ${t("sections")}</li><li>${t("best")}: <b>${b!==null? b+"%" : t("none")}</b></li></ul>
 <button class="btn primary big" data-act="startexam">${t("startExam")}</button></section>`;
}

function viewQuiz(){
 const z = st.quiz; if(z.done) return viewResults();
 const it = z.items[z.idx], q = QB[it.qi], o = opts(q), n = z.items.length;
 const answered = z.items.filter(x=>x.ans!==null).length;
 const practice = z.mode==="practice";
 const locked = practice && it.ans!==null;
 let h = `<div class="quiz"><div class="qhead"><span>${practice? t("practiceOf")+" · "+esc(secTitle(secById(z.sec))) : t("exam")}</span><button class="link" data-act="exit">${t("exitQuiz")}</button></div>
 <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${answered}"><i style="width:${answered/n*100}%"></i></div>
 <p class="muted">${t("q")} ${z.idx+1} ${t("of")} ${n} · ${answered} ${t("answered")}</p>
 <div class="qcard ${TRSET.has(it.qi)?"showtr":""}"><div class="qmeta"><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span><span class="chip ghost">${q.t==="tf"?t("tf"):t("mcq")}</span>${trBtn(it.qi)}</div>
 <p class="qt big" dir="auto">${esc(qText(q))}${trLine(trQ(q))}</p><div class="opts" role="radiogroup">`;
 it.perm.forEach((p,k)=>{
  let cls = it.ans===p ? "sel" : "";
  if(locked){ if(p===q.a) cls="ok"; else if(it.ans===p) cls="bad"; }
  h += `<button class="opt ${cls}" role="radio" aria-checked="${it.ans===p}" data-act="pick" data-p="${p}" ${locked?"disabled":""}><span class="ol">${"ABCD"[k]}</span><span dir="auto">${esc(o[p])}${trOpt(q,p,o)}</span></button>`;
 });
 h += `</div>`;
 if(locked) h += `<div class="feedback ${it.ans===q.a?"good":"badfb"}"><b>${it.ans===q.a? "✓ "+t("correct") : "✗ "+t("wrong")}</b><p dir="auto">${esc(qExp(q))}</p></div>`;
 h += `</div><div class="qnav"><button class="btn" data-act="prev" ${z.idx===0?"disabled":""}>‹ ${t("prev")}</button>`;
 h += z.idx<n-1 ? `<button class="btn primary" data-act="next">${t("next")} ›</button>` : `<button class="btn primary" data-act="submit">${practice? t("finishPractice") : t("submit")}</button>`;
 h += `</div><div class="palette">${z.items.map((x,k)=>`<button class="pb ${x.ans!==null?"done":""} ${k===z.idx?"cur":""}" data-act="go" data-k="${k}" aria-label="${t("q")} ${k+1}">${k+1}</button>`).join("")}</div>`;
 if(z.idx<n-1) h += `<div class="submitrow"><button class="btn" data-act="submit">${practice? t("finishPractice") : t("submit")}</button></div>`;
 if(z.confirm) h += `<div class="confirm" role="alertdialog"><p>${t("confirmSubmit")} (${n-answered} ${t("unanswered")})</p><button class="btn primary" data-act="forcesubmit">${t("yesSubmit")}</button><button class="btn" data-act="cancel">${t("back")}</button></div>`;
 return h + `</div>`;
}

function viewResults(){
 const z = st.quiz, n = z.items.length;
 const right = z.items.filter(x=>x.ans===QB[x.qi].a).length;
 const blank = z.items.filter(x=>x.ans===null).length;
 const pct = Math.round(right/n*100);
 const band = pct>=85? ["pass","good"] : pct>=60? ["good","mid"] : ["weak","low"];
 const per = {}; z.items.forEach(x=>{ const s=QB[x.qi].s; per[s]=per[s]||[0,0]; per[s][1]++; if(x.ans===QB[x.qi].a) per[s][0]++; });
 let h = `<div class="results"><h1>${z.mode==="exam"? t("exam") : t("practiceOf")+" · "+esc(secTitle(secById(z.sec)))} — ${t("result")}</h1>
 <div class="scorebox ${band[1]}"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><p class="big"><b>${right}</b> / ${n}</p><p><span class="tag ok">${right} ${t("correct")}</span> <span class="tag bad">${n-right-blank} ${t("wrong")}</span> <span class="tag">${blank} ${t("unanswered")}</span></p><p class="bandlabel">${t(band[0])}</p></div></div>`;
 if(z.mode==="exam"){
  h += `<h2>${t("bySection")}</h2><div class="tablewrap"><table class="persec"><thead><tr><th>${t("study")}</th><th>${t("score")}</th><th></th></tr></thead><tbody>`;
  Object.keys(per).sort().forEach(s=>{ const [r,c]=per[s]; const p=r/c; h += `<tr><td><a href="#${s}">${secNum(s)}. ${esc(secTitle(secById(s)))}</a></td><td class="num">${r}/${c}</td><td><span class="bar"><i class="${p>=0.67?"g":p>=0.34?"m":"l"}" style="width:${p*100}%"></i></span></td></tr>`; });
  h += `</tbody></table></div>`;
 }
 h += `<h2>${t("review")}</h2><div class="seg"><button class="${st.reviewFilter==="all"?"on":""}" data-act="rf" data-v="all">${t("all")} (${n})</button><button class="${st.reviewFilter==="wrong"?"on":""}" data-act="rf" data-v="wrong">${t("wrongOnly")} (${n-right})</button></div><ol class="review">`;
 z.items.forEach((x,k)=>{
  const q=QB[x.qi], o=opts(q), ok = x.ans===q.a;
  if(st.reviewFilter==="wrong" && ok) return;
  h += `<li value="${k+1}" class="${ok?"rok":"rbad"} ${TRSET.has(x.qi)?"showtr":""}"><div class="qmeta"><span class="mark">${ok?"✓":"✗"}</span><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span>${trBtn(x.qi)}</div><p class="qt" dir="auto">${esc(qText(q))}${trLine(trQ(q))}</p>
  <ul class="ropts">${x.perm.map((p,i)=>`<li class="${p===q.a?"isright":""} ${x.ans===p&&!ok?"iswrong":""}"><span class="ol">${"ABCD"[i]}</span><span dir="auto">${esc(o[p])}${trOpt(q,p,o)}</span>${p===q.a?` <em>${t("rightAns")}</em>`:""}${x.ans===p&&!ok?` <em>${t("yourAns")}</em>`:""}</li>`).join("")}</ul>
  ${x.ans===null?`<p class="muted">${t("noAns")}</p>`:""}<p class="exp" dir="auto"><b>${t("explain")}:</b> ${esc(qExp(q))}</p></li>`;
 });
 h += `</ol><div class="qnav"><button class="btn primary" data-act="${z.mode==="exam"?"startexam":"practice"}" data-sec="${z.sec||""}">${t("retake")}</button><a class="btn" href="#home">${t("backHome")}</a></div></div>`;
 return h;
}

function render(){
 applyLang(); nav();
 $("#langbtn").textContent = t("lang");
 const cur = location.hash.slice(1)||"home"; let h;
 if(st.quiz && (cur==="exam" || cur==="practice")) h = viewQuiz();
 else if(cur==="exam") h = viewQuizIntro();
 else if(cur==="bank") h = viewBank();
 else if(secById(cur)) h = viewSection(cur);
 else h = viewHome();
 $("#main").innerHTML = h;
 document.body.classList.remove("navopen");
}

function finish(){ const z=st.quiz; z.done=true; z.confirm=false; st.reviewFilter="all";
 if(z.mode==="exam"){ const r=z.items.filter(x=>x.ans===QB[x.qi].a).length; bestSet(Math.round(r/z.items.length*100)); } }

document.addEventListener("click", e=>{
 const b = e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, z=st.quiz;
 if(a==="startexam"){ st.quiz=buildExam(); if(location.hash!=="#exam") location.hash="exam"; else render(); window.scrollTo(0,0); return; }
 if(a==="practice"){ st.quiz=buildPractice(b.dataset.sec); if(location.hash!=="#practice") location.hash="practice"; else render(); window.scrollTo(0,0); return; }
 if(a==="tr"){ const qi=parseInt(b.dataset.qi,10); const on=!TRSET.has(qi); if(on) TRSET.add(qi); else TRSET.delete(qi);
   const box=b.closest(".qcard, li"); if(box) box.classList.toggle("showtr", on);
   b.setAttribute("aria-pressed", on); b.textContent="🌐 "+(on? t("trHide") : t("trShow")); return; }
 if(!z) return;
 const it = z.items[z.idx];
 if(a==="pick"){ if(z.mode==="practice" && it.ans!==null) return; it.ans=parseInt(b.dataset.p,10); }
 else if(a==="next") { z.idx=Math.min(z.idx+1, z.items.length-1); }
 else if(a==="prev") { z.idx=Math.max(z.idx-1,0); }
 else if(a==="go") { z.idx=parseInt(b.dataset.k,10); }
 else if(a==="submit"){ if(z.items.some(x=>x.ans===null)) z.confirm=true; else finish(); }
 else if(a==="forcesubmit"){ finish(); }
 else if(a==="cancel"){ z.confirm=false; }
 else if(a==="rf"){ st.reviewFilter=b.dataset.v; }
 else if(a==="exit"){ st.quiz=null; location.hash = z.mode==="practice"? z.sec : "home"; return; }
 render();
 if(["next","prev","go","submit","forcesubmit"].includes(a)) $("#main").scrollIntoView({block:"start"});
});
document.addEventListener("change", e=>{
 if(e.target.id==="fsec"){ st.bankSec=e.target.value; render(); }
 if(e.target.id==="ftype"){ st.bankType=e.target.value; render(); }
});
let qt; document.addEventListener("input", e=>{ if(e.target.id==="fq"){ st.bankQ=e.target.value; clearTimeout(qt); qt=setTimeout(()=>{ render(); const f=$("#fq"); f.focus(); f.setSelectionRange(f.value.length,f.value.length); },250);} });
$("#langbtn").addEventListener("click", ()=> setLang(st.lang==="ar"?"en":"ar"));
$("#menubtn").addEventListener("click", ()=> document.body.classList.toggle("navopen"));
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(h!=="exam"&&h!=="practice"&&st.quiz&&st.quiz.done) st.quiz=null; render(); window.scrollTo(0,0); });
render();
})();

</script>
</body>
</html>
