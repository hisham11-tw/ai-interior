<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI For Interior Study Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 /* Layout: fixed side menu of units → sections, reading column for content, quiz as a focused card. */
 --ink:#1d1830; --paper:#f6f5fa; --panel:#ffffff; --line:#e1def0; --muted:#6a6585;
 --accent:#5b3fd1; --accent-2:#13a89e; --accent-soft:#ece8fd; --code-bg:#f0eef8;
 --ok:#16845b; --ok-soft:#e3f4ec; --bad:#c2384a; --bad-soft:#fbe7ea; --mid:#b7791f;
 --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
 --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --ink:#ece9f7; --paper:#14121c; --panel:#1d1a28; --line:#2f2b40; --muted:#a19cb8;
 --accent:#9d87ff; --accent-2:#3fd0c4; --accent-soft:#2a2442; --code-bg:#221f30;
 --ok:#4cc98f; --ok-soft:#163327; --bad:#f07786; --bad-soft:#3a1d24; --mid:#e0a84a; color-scheme:dark; }}
:root[data-theme="dark"]{
 --ink:#ece9f7; --paper:#14121c; --panel:#1d1a28; --line:#2f2b40; --muted:#a19cb8;
 --accent:#9d87ff; --accent-2:#3fd0c4; --accent-soft:#2a2442; --code-bg:#221f30;
 --ok:#4cc98f; --ok-soft:#163327; --bad:#f07786; --bad-soft:#3a1d24; --mid:#e0a84a; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar .t{font-family:var(--display);font-weight:600;font-size:15px}
.topbar button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
#menubtn{display:none}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 52px)}
#nav{position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);overflow:auto;padding:16px 12px 40px;border-inline-end:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.brand b{display:block;font-family:var(--display);font-size:15px;line-height:1.3}
.brand small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.navtop{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
.navtop:hover{background:var(--accent-soft)} .navtop.on{background:var(--accent);color:#fff}
.navtop.on .pill{background:rgba(255,255,255,.25);color:#fff}
.pill{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:0 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.navlabel{margin:14px 10px 4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
details.unit summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-weight:600}
details.unit summary::-webkit-details-marker{display:none}
details.unit summary:hover{background:var(--accent-soft)}
details.unit ol{list-style:none;margin:0 0 6px;padding:0 0 0 0;padding-inline-start:14px;display:flex;flex-direction:column;gap:2px}
details.unit ol a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.45}
details.unit ol a:hover{background:var(--accent-soft)} details.unit ol a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.un{flex:none;width:24px;height:24px;border-radius:6px;background:var(--accent-2);color:#fff;display:inline-grid;place-items:center;font-size:13px;font-weight:700}
.sn{flex:none;min-width:22px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.sn.big{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:20px;margin-inline-end:12px;vertical-align:middle}
#main{padding:28px clamp(16px,4vw,48px) 80px;max-width:980px;width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.3;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px);margin:0 0 12px} h2{font-size:21px;margin:32px 0 12px} h3{font-size:18px;margin:26px 0 8px;color:var(--accent)}
.eyebrow{margin:0 0 6px;color:var(--accent-2);font-weight:600;font-size:13px}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:0 0 18px}
.muted{color:var(--muted)}
.hero{padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:13px}
.cta,.qnav,.practicebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.practicebar{background:var(--accent-soft);padding:12px 14px;border-radius:12px;margin:16px 0}
.practicebar span{color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{font-size:18px;padding:12px 26px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.ugroup h2{display:flex;gap:10px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)} .card small{color:var(--muted)}
.sec h1{display:flex;align-items:center}
.body{max-width:72ch}
.body p,.body li{max-width:68ch}
.body table,.persec{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:15px;background:var(--panel)}
.body th,.body td,.persec th,.persec td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
.body th,.persec th{background:var(--accent-soft)}
.body table{display:block;overflow-x:auto}
main,article,.body{min-width:0}
.body code{overflow-wrap:anywhere}
pre{max-width:100%;direction:ltr;text-align:left;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;white-space:pre}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:1px 5px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.ex,.note{background:var(--panel);border-inline-start:4px solid var(--accent-2);padding:10px 14px;border-radius:8px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px;position:sticky;top:60px;z-index:5}
.filters label{font-weight:600;font-size:14px}
select,input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
input[type=search]{flex:1;min-width:180px}
.banklist,.review{padding:0;list-style-position:inside;display:flex;flex-direction:column;gap:12px}
.banklist>li,.review>li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;list-style:none}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.qid{margin-inline-start:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.trbtn{font:inherit;font-size:12.5px;font-weight:600;margin-inline-start:auto;border:1px solid var(--line);background:var(--paper);color:var(--accent);padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.trbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tr{display:none;font-weight:400;color:var(--muted);font-size:.88em;line-height:1.5;margin-top:4px}
p .tr{border-inline-start:3px solid var(--accent-soft);padding-inline-start:8px}
.showtr .tr{display:block}
.qt{font-weight:600;margin:4px 0 8px}
.qt.big{font-size:19px;line-height:1.6}
.optlist{margin:0 0 6px;padding-inline-start:24px}
.ans summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.ans p{margin:4px 0}
.intro{max-width:640px}
.facts{display:flex;gap:10px;flex-wrap:wrap;padding:0;list-style:none;margin:16px 0 22px}
.facts li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.quiz{max-width:760px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent-2);transition:width .25s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;display:flex;gap:12px;align-items:center;text-align:start;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1}
.ol{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;font-family:var(--mono)}
.opt.sel .ol{background:var(--accent);color:#fff;border-color:var(--accent)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px}
.feedback p{margin:4px 0 0}
.feedback.good{background:var(--ok-soft);color:var(--ok)} .feedback.badfb{background:var(--bad-soft);color:var(--bad)}
.feedback p{color:var(--ink)}
.qnav{justify-content:space-between}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pb{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.pb.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:700}
.pb.cur{outline:2px solid var(--accent);outline-offset:1px}
.submitrow{display:flex;justify-content:flex-end}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex-basis:100%;font-weight:600}
.scorebox{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.scorebox p{margin:4px 0} .scorebox .big{font-size:28px;font-family:var(--display);font-variant-numeric:tabular-nums}
.ring{--c:var(--accent);width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0)}
.ring b{width:92px;height:92px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.scorebox.good .ring{--c:var(--ok)} .scorebox.mid .ring{--c:var(--mid)} .scorebox.low .ring{--c:var(--bad)}
.bandlabel{font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:block;width:120px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%} .bar i.g{background:var(--ok)} .bar i.m{background:var(--mid)} .bar i.l{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:600;border:0;background:var(--panel);color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.review>li.rok{border-inline-start:5px solid var(--ok)} .review>li.rbad{border-inline-start:5px solid var(--bad)}
.mark{font-weight:700} .rok .mark{color:var(--ok)} .rbad .mark{color:var(--bad)}
.ropts{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:4px}
.ropts li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.ropts li.isright{background:var(--ok-soft);border-color:var(--ok)} .ropts li.iswrong{background:var(--bad-soft);border-color:var(--bad)}
.ropts em{font-style:normal;font-size:12px;font-weight:700;margin-inline-start:auto;white-space:nowrap}
.ropts li.isright em{color:var(--ok)} .ropts li.iswrong em{color:var(--bad)}
.exp{margin:0;font-size:14px}
@media (max-width:860px){
 #menubtn{display:inline-block}
 .layout{grid-template-columns:minmax(0,1fr)}
 #nav{position:fixed;top:52px;inset-inline-start:0;width:min(320px,88vw);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
 [dir="rtl"] #nav{transform:translateX(105%)}
 body.navopen #nav{transform:none}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="topbar"><button id="menubtn" aria-label="Menu">☰</button><span class="t">AI For Interior · Study notes</span><button id="langbtn">English</button></div>
<div class="layout"><nav id="nav" aria-label="Sections"></nav><main id="main"></main></div>
<script>
window.UNITS = [{"id":"u1","en":"Tools & Statistics","ar":"الأدوات والإحصاء"},{"id":"u2","en":"Python","ar":"بايثون"},{"id":"u3","en":"SQL & Databases","ar":"SQL وقواعد البيانات"},{"id":"u4","en":"Advanced SQL & PostGIS","ar":"SQL المتقدم و PostGIS"},{"id":"u5","en":"Python Libraries: NumPy & Pandas","ar":"مكتبات بايثون: NumPy و Pandas"},{"id":"u6","en":"EDA & Visualization","ar":"التحليل الاستكشافي والتصوير"},{"id":"u7","en":"Intro to Machine Learning","ar":"مقدمة تعلم الآلة"}];
window.SECTIONS = [{"id":"s02","unit":"u1","en":"Command Line & Bash","ar":"سطر الأوامر و Bash","en_body":"<h3>Key points</h3><ul>\n<li><b>Terminal</b> = the window; <b>shell</b> (Bash) = interprets commands; a command = program + options + arguments: <code>head -n 3 data.csv</code>.</li>\n<li>Paths: absolute starts with <code>/</code>; relative from the current folder; <code>.</code> current, <code>..</code> parent. Linux names are case-sensitive.</li>\n<li><code>&gt;</code> creates/replaces a file, <code>&gt;&gt;</code> appends, <code>|</code> sends stdout to the next command. Never read and write the same file in one command.</li>\n<li>Streams: stdin 0, stdout 1, stderr 2. <code>cmd &gt; file 2&gt;&amp;1</code> puts both in the file (order matters).</li>\n<li>Exit status <code>$?</code>: 0 = success; grep returns 1 for \"no match\". <code>set -o pipefail</code> exposes failures inside a pipeline.</li>\n<li>Quotes: <code>\"$city\"</code> expands, <code>'$city'</code> is literal. <code>export</code> makes a variable visible to child processes. Wildcards are expanded by the shell.</li>\n<li>Processes: <code>&amp;</code> runs in background, <code>$!</code> its PID, <code>kill -TERM</code> stops it (wait often returns 143).</li></ul>\n<pre>tail -n +2 f.csv | cut -d, -f2 | sort | uniq -c   # count values (sort before uniq)\ncmp a.csv b.csv; echo $?                            # 0 = identical</pre>\n<h3>Common mistakes</h3><ul><li>Pasting the <code>$</code> prompt or expected output as a command.</li><li>Using <code>sudo</code> or <code>chmod 777</code> as a generic fix.</li><li>Treating no output or status 0 as proof the data is correct.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li><b>الطرفية</b> (Terminal) هي النافذة التي تُكتب فيها الأوامر، أما <b>الصدفة</b> (Shell) مثل Bash فهي البرنامج الذي يفسّرها. ويتكوّن الأمر من اسم البرنامج والخيارات والوسائط، مثل: <code>head -n 3 data.csv</code>.</li>\n<li>يبدأ <b>المسار المطلق</b> بالرمز <code>/</code>، ويُحسب <b>المسار النسبي</b> من المجلد الحالي؛ ويدل <code>.</code> على المجلد الحالي و <code>..</code> على المجلد الأب. وأسماء الملفات في Linux حساسة لحالة الأحرف.</li>\n<li>يُنشئ العامل <code>&gt;</code> الملف أو يستبدل محتواه، ويُلحق <code>&gt;&gt;</code> المخرجات بنهايته، ويُمرّر <code>|</code> (الأنبوب) مخرجات أمر إلى الأمر التالي. ولا يجوز القراءة من ملف والكتابة فيه في الأمر نفسه.</li>\n<li>التدفقات القياسية ثلاثة: الإدخال stdin ‏(0)، والإخراج stdout ‏(1)، والأخطاء stderr ‏(2). ويضع الأمر <code>cmd &gt; file 2&gt;&amp;1</code> المخرجين كليهما في الملف، إذ تُقيَّم عمليات إعادة التوجيه من اليسار إلى اليمين.</li>\n<li>تُخزَّن <b>حالة الخروج</b> في <code>$?</code>؛ وتعني القيمة 0 النجاح، ويُعيد grep القيمة 1 عند عدم وجود تطابق. ويكشف <code>set -o pipefail</code> إخفاق أي مرحلة داخل خط الأنابيب.</li>\n<li>تُوسّع علامات التنصيص المزدوجة المتغيرات <code>\"$city\"</code>، بينما تحفظ المفردة النص حرفياً <code>'$city'</code>. ويجعل <code>export</code> المتغير متاحاً للعمليات الفرعية، وتتولى الصدفة توسيع الرموز البديلة (Wildcards) قبل تشغيل البرنامج.</li>\n<li>يُشغّل <code>&amp;</code> الأمر في الخلفية، ويحفظ <code>$!</code> معرِّف آخر عملية خلفية، ويُنهيها <code>kill -TERM</code>، وعندئذٍ يُعيد <code>wait</code> القيمة 143 غالباً.</li></ul>\n<pre>tail -n +2 f.csv | cut -d, -f2 | sort | uniq -c   # عدّ القيم (يسبق sort الأمر uniq)\ncmp a.csv b.csv; echo $?                            # 0 = الملفان متطابقان</pre>\n<h3>أخطاء شائعة</h3><ul><li>نسخ رمز المحث <code>$</code> أو المخرجات المتوقعة وتنفيذها بوصفها أوامر.</li><li>اللجوء إلى <code>sudo</code> أو <code>chmod 777</code> حلاً عاماً لمشكلات الصلاحيات.</li><li>عدّ غياب المخرجات أو حالة الخروج 0 دليلاً على صحة البيانات.</li></ul>"},{"id":"s03","unit":"u1","en":"uv, WSL, Git & GitHub","ar":"uv و WSL و Git و GitHub","en_body":"<h3>Key points</h3><ul>\n<li><b>uv</b> is a fast Python package manager (replaces pip + venv).</li>\n<li>A virtual environment isolates a project's packages; activate it before installing.</li>\n<li><b>WSL</b> runs Linux inside Windows: <code>wsl --install</code>, <code>wsl -l -v</code>, <code>wsl --shutdown</code>.</li>\n<li><b>Git</b> tracks versions locally; <b>GitHub</b> hosts the repository online. Set your name and email once.</li>\n<li><code>git fetch</code> downloads only; <code>git merge</code> merges; <code>git pull</code> = fetch + merge.</li></ul>\n<pre>uv venv my_env ; source my_env/bin/activate\nuv pip install pandas ; uv init ; uv add pandas\ngit init ; git add . ; git commit -m \"first commit\"\ngit branch -M main ; git remote add origin URL ; git push -u origin main\ngit checkout -b feature ; git checkout main ; git merge feature</pre>\n<h3>Remember</h3><ul><li><code>git restore --staged file</code> unstages a file.</li><li><code>uv sync</code> installs a cloned project's dependencies.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li><b>uv</b> مدير حزم سريع للغة Python، ويُستخدم بديلاً عن pip و venv.</li>\n<li>تعزل <b>البيئة الافتراضية</b> (Virtual Environment) حزم المشروع عن بقية النظام، ويجب تفعيلها قبل تثبيت الحزم.</li>\n<li>يتيح <b>WSL</b> تشغيل Linux داخل Windows، ومن أوامره: <code>wsl --install</code> و <code>wsl -l -v</code> و <code>wsl --shutdown</code>.</li>\n<li>يتتبّع <b>Git</b> إصدارات الملفات محلياً، بينما يستضيف <b>GitHub</b> المستودع على الإنترنت. ويُضبط اسم المستخدم وبريده الإلكتروني مرة واحدة.</li>\n<li>يجلب <code>git fetch</code> التغييرات البعيدة دون دمجها، ويدمج <code>git merge</code> الفروع، أما <code>git pull</code> فيكافئ fetch متبوعاً بـ merge.</li></ul>\n<pre>uv venv my_env ; source my_env/bin/activate\nuv pip install pandas ; uv init ; uv add pandas\ngit init ; git add . ; git commit -m \"first commit\"\ngit branch -M main ; git remote add origin URL ; git push -u origin main\ngit checkout -b feature ; git checkout main ; git merge feature</pre>\n<h3>ملاحظات مهمة</h3><ul><li>يُلغي <code>git restore --staged file</code> تجهيز الملف (Unstage).</li><li>يثبّت <code>uv sync</code> متطلبات مشروع منسوخ من مستودع.</li></ul>"},{"id":"s04","unit":"u1","en":"Statistics Fundamentals","ar":"أساسيات الإحصاء","en_body":"<h3>Key points</h3><ul>\n<li>Data types: <b>qualitative</b> (nominal = no order, ordinal = ordered) and <b>quantitative</b> (discrete = countable, continuous = any value).</li>\n<li>Independent variable = cause / controlled; dependent = the observed outcome.</li>\n<li>Population = all elements; sample = subset. Sampling: random, stratified (sample each stratum), cluster (whole clusters), systematic (every n-th).</li>\n<li>Analysis: descriptive (what happened), diagnostic (why — hypothesis tests, correlation), predictive (what will happen — regression, classification).</li>\n<li>Centre: mean (sensitive to extremes), median (middle value), mode (most frequent).</li>\n<li>Spread: range = max − min; IQR = Q3 − Q1 (robust); variance σ² = Σ(x − μ)²/N; std σ = √σ² (same units).</li>\n<li>Position: Q1 25%, Q2 = median, Q3 75%; z = (X − μ)/σ; |z| &gt; 2 may be unusual.</li></ul>\n<pre>Data 2, 4, 4, 6, 9 → mean 5, median 4, mode 4, range 7</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>تنقسم البيانات إلى <b>نوعية</b> (اسمية لا ترتيب لها، وترتيبية ذات فئات مرتبة) و<b>كمية</b> (منفصلة قابلة للعدّ، ومتصلة تأخذ أي قيمة ضمن مدى).</li>\n<li><b>المتغير المستقل</b> هو العامل المُتحكَّم فيه أو المفترض أنه السبب، و<b>المتغير التابع</b> هو النتيجة المرصودة.</li>\n<li><b>المجتمع الإحصائي</b> هو جميع العناصر محل الدراسة، و<b>العينة</b> جزء منه. ومن أساليب المعاينة: العشوائية البسيطة، والطبقية (عينة من كل طبقة)، والعنقودية (اختيار عناقيد كاملة)، والمنتظمة (عنصر كل n عنصراً).</li>\n<li>أنواع التحليل: <b>الوصفي</b> (ماذا حدث؟)، و<b>التشخيصي</b> (لماذا حدث؟ ويشمل اختبار الفرضيات والارتباط)، و<b>التنبؤي</b> (ماذا سيحدث؟ ويشمل الانحدار والتصنيف).</li>\n<li>مقاييس النزعة المركزية: <b>المتوسط الحسابي</b> (يتأثر بالقيم المتطرفة)، و<b>الوسيط</b> (القيمة الوسطى للبيانات المرتبة)، و<b>المنوال</b> (القيمة الأكثر تكراراً).</li>\n<li>مقاييس التشتت: <b>المدى</b> = أكبر قيمة − أصغر قيمة؛ و<b>المدى الربيعي</b> IQR = Q3 − Q1 (مقياس متين)؛ و<b>التباين</b> σ² = Σ(x − μ)²/N؛ و<b>الانحراف المعياري</b> σ = √σ² (بوحدة البيانات نفسها).</li>\n<li>مقاييس الموقع: Q1 عند 25%، و Q2 هو الوسيط، و Q3 عند 75%؛ و<b>الدرجة المعيارية</b> z = (X − μ)/σ، وقد تُعدّ القيمة غير اعتيادية إذا كانت |z| &gt; 2.</li></ul>\n<pre>البيانات 2, 4, 4, 6, 9 ← المتوسط 5، والوسيط 4، والمنوال 4، والمدى 7</pre>"},{"id":"s05","unit":"u2","en":"Variables, Types, Input & Operators","ar":"المتغيرات والأنواع والإدخال والعوامل","en_body":"<h3>Key points</h3><ul>\n<li>A variable is a name for a value; <code>=</code> assigns, <code>==</code> compares. Its type is the value's type.</li>\n<li>Python is <b>dynamically typed</b>: <code>x = 1</code> then <code>x = 'hello'</code> is allowed.</li>\n<li>Main types: str, int, float, complex, list, tuple, range, dict, set, bool, NoneType.</li>\n<li><code>/</code> always gives a float (5/5 → 1.0); <code>**</code> power; <code>&lt;&lt; 1</code> doubles, <code>&gt;&gt; 1</code> halves; <code>age += 20</code>.</li>\n<li><code>input()</code> always returns a string — convert with <code>int()</code>.</li>\n<li><code>20 + '20'</code> → TypeError; use <code>int('20')</code> or <code>str(20)</code>.</li>\n<li>Names: case-sensitive, can't start with a digit, can't be keywords (class, True…); avoid built-ins (sum, list).</li>\n<li>In a notebook only the last expression of a cell is displayed; cells depend on run order (NameError).</li></ul>\n<pre>age = input(\"age: \")                 # '40' (text)\nprint(\"birth year\", 2026 - int(age)) # 1986\ntype(9 > 5)                          # bool\n'Hani' == 'hani'                     # False (case-sensitive)</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>المتغير اسم يشير إلى قيمة؛ ويُستخدم <code>=</code> للإسناد و <code>==</code> للمقارنة، ونوع المتغير هو نوع القيمة التي يشير إليها.</li>\n<li>لغة Python <b>ديناميكية الأنواع</b>؛ إذ يجوز تنفيذ <code>x = 1</code> ثم <code>x = 'hello'</code>.</li>\n<li>الأنواع الأساسية: str و int و float و complex و list و tuple و range و dict و set و bool و NoneType.</li>\n<li>يُعيد عامل القسمة <code>/</code> عدداً عشرياً دائماً (5/5 ← 1.0)، ويمثّل <code>**</code> الأس، ويضاعف <code>&lt;&lt; 1</code> القيمة بينما ينصّفها <code>&gt;&gt; 1</code>، ويضيف عامل الإسناد المركب <code>age += 20</code> القيمة إلى المتغير.</li>\n<li>تُعيد الدالة <code>input()</code> سلسلة نصية دائماً، ويلزم تحويلها بالدالة <code>int()</code> عند الحاجة إلى عدد.</li>\n<li>يُطلق التعبير <code>20 + '20'</code> الخطأ TypeError، ويُعالَج بالتحويل الصريح <code>int('20')</code> أو <code>str(20)</code>.</li>\n<li>قواعد التسمية: الأسماء حساسة لحالة الأحرف، ولا تبدأ برقم، ولا تكون كلمة محجوزة (مثل class و True)، ويُتجنّب استخدام أسماء الدوال المدمجة (مثل sum و list).</li>\n<li>يعرض دفتر الملاحظات قيمة التعبير الأخير في الخلية فقط، وتعتمد الخلايا على ترتيب تنفيذها، وإلا ظهر الخطأ NameError.</li></ul>\n<pre>age = input(\"age: \")                 # '40' (سلسلة نصية)\nprint(\"birth year\", 2026 - int(age)) # 1986\ntype(9 > 5)                          # bool\n'Hani' == 'hani'                     # False (حساسة لحالة الأحرف)</pre>"},{"id":"s06","unit":"u2","en":"Strings","ar":"النصوص","en_body":"<h3>Key points</h3><ul>\n<li>Single and double quotes are equal; triple quotes make multi-line text; <code>\\n</code> is a new line.</li>\n<li>Index from 0, last is −1; an index past the end → IndexError, but a slice never errors.</li>\n<li>Slicing <code>[start:end:step]</code>: end is excluded; <code>[::-1]</code> reverses.</li>\n<li>Strings are immutable objects with methods: upper, lower, title, capitalize, strip, split, join, replace, find (−1 if missing), count, startswith, endswith.</li>\n<li><code>len()</code> length, <code>*</code> repeats, <code>in</code> checks membership.</li>\n<li>Build text with <code>+</code> (needs str()), <code>.format()</code> or <b>f-strings</b>.</li></ul>\n<pre>s = \"Pythonista\"\ns[2:5], s[-4:], s[::-1]   # 'tho', 'ista', 'atsinohtyP'\nf\"{10.5679:.2f}\"          # '10.57'\nf\"{1000000:,}\"            # '1,000,000'\nf\"{0.235:.1%}\"            # '23.5%'</pre>\n<h3>Common mistakes</h3><ul><li><code>name.upper</code> without () shows the method, not the result.</li><li>Expecting a method to change the original string — it returns a new one.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>علامات التنصيص المفردة والمزدوجة متكافئة، وتُستخدم الثلاثية للسلاسل متعددة الأسطر، ويمثّل <code>\\n</code> سطراً جديداً.</li>\n<li>تبدأ الفهرسة من 0، ويشير −1 إلى العنصر الأخير. ويُطلق الفهرس الخارج عن النطاق الخطأ IndexError، أما التقطيع فلا يُطلق خطأً.</li>\n<li>صيغة التقطيع <code>[start:end:step]</code>، وفهرس النهاية غير مشمول، ويعكس <code>[::-1]</code> السلسلة.</li>\n<li>السلاسل النصية كائنات <b>غير قابلة للتعديل</b> (Immutable)، ومن دوالها: upper و lower و title و capitalize و strip و split و join و replace و find (تُعيد −1 عند عدم وجود النص) و count و startswith و endswith.</li>\n<li>تُعيد <code>len()</code> طول السلسلة، ويكررها العامل <code>*</code>، ويختبر <code>in</code> العضوية.</li>\n<li>تُبنى السلسلة من المتغيرات بالعامل <code>+</code> (مع التحويل بـ str())، أو بالدالة <code>.format()</code>، أو بـ <b>f-strings</b>.</li></ul>\n<pre>s = \"Pythonista\"\ns[2:5], s[-4:], s[::-1]   # 'tho', 'ista', 'atsinohtyP'\nf\"{10.5679:.2f}\"          # '10.57'\nf\"{1000000:,}\"            # '1,000,000'\nf\"{0.235:.1%}\"            # '23.5%'</pre>\n<h3>أخطاء شائعة</h3><ul><li>كتابة <code>name.upper</code> دون أقواس، فيُعرض كائن الدالة بدلاً من نتيجتها.</li><li>افتراض أن دوال السلاسل تُعدّل السلسلة الأصلية، والصحيح أنها تُعيد سلسلة جديدة.</li></ul>"},{"id":"s07","unit":"u2","en":"Lists, Sets, Dictionaries & Tuples","ar":"القوائم والمجموعات والقواميس والصفوف","en_body":"<h3>Key points</h3><table><tr><th>Type</th><th>Ordered</th><th>Changeable</th><th>Duplicates</th></tr>\n<tr><td>list [ ]</td><td>yes</td><td>yes</td><td>yes</td></tr><tr><td>tuple ( )</td><td>yes</td><td>no</td><td>yes</td></tr>\n<tr><td>set { }</td><td>no</td><td>yes</td><td>no</td></tr><tr><td>dict {k: v}</td><td>insertion order</td><td>yes</td><td>unique keys</td></tr></table>\n<ul><li>List methods: append (one item), extend (many), insert, remove, pop, index, count, sort (in place, returns None), copy. <code>sorted()</code> returns a new list.</li>\n<li><code>b = a</code> is the same list (view); <code>a.copy()</code> or <code>a[:]</code> is a copy.</li>\n<li><code>enumerate()</code> gives index + item; <code>zip()</code> pairs lists and stops at the shortest.</li>\n<li>Sets: <code>&amp;</code> intersection, <code>|</code> union, <code>-</code> difference, <code>^</code> symmetric difference; no indexing; <code>{}</code> is an empty dict.</li>\n<li>Dict: <code>d[key]</code> (KeyError if missing), <code>d.update()</code>, <code>d.pop()</code>, <code>keys()</code>, <code>values()</code>, <code>items()</code>.</li>\n<li>Tuples can't change (TypeError / AttributeError); used to return several values.</li></ul>\n<pre>x = [1, 2, 3].sort()        # None!\ndict(zip([\"A\", \"B\"], [90, 80]))   # {'A': 90, 'B': 80}\n{1, 2, 3} &amp; {2, 3, 4}       # {2, 3}</pre>","ar_body":"<h3>النقاط الرئيسة</h3><table><tr><th>النوع</th><th>مرتب</th><th>قابل للتعديل</th><th>يقبل التكرار</th></tr>\n<tr><td>list [ ]</td><td>نعم</td><td>نعم</td><td>نعم</td></tr><tr><td>tuple ( )</td><td>نعم</td><td>لا</td><td>نعم</td></tr>\n<tr><td>set { }</td><td>لا</td><td>نعم</td><td>لا</td></tr><tr><td>dict {k: v}</td><td>بترتيب الإدراج</td><td>نعم</td><td>المفاتيح فريدة</td></tr></table>\n<ul><li>من دوال القوائم: append (تضيف عنصراً واحداً) و extend (تضيف عدة عناصر) و insert و remove و pop و index و count و sort (ترتّب في الموضع وتُعيد None) و copy؛ أما <code>sorted()</code> فتُعيد قائمة جديدة.</li>\n<li>يجعل الإسناد <code>b = a</code> الاسمين يشيران إلى القائمة نفسها، بينما يُنشئ <code>a.copy()</code> أو <code>a[:]</code> نسخة مستقلة.</li>\n<li>تُعيد <code>enumerate()</code> الفهرس والعنصر معاً، وتقرن <code>zip()</code> عناصر عدة تسلسلات وتتوقف عند أقصرها.</li>\n<li>عمليات المجموعات: <code>&amp;</code> التقاطع، و <code>|</code> الاتحاد، و <code>-</code> الفرق، و <code>^</code> الفرق المتماثل. والمجموعات لا تدعم الفهرسة، والرمز <code>{}</code> يُنشئ قاموساً فارغاً لا مجموعة.</li>\n<li>القواميس: يُطلق <code>d[key]</code> الخطأ KeyError إذا لم يوجد المفتاح، ومن دوالها <code>update()</code> و <code>pop()</code> و <code>keys()</code> و <code>values()</code> و <code>items()</code>.</li>\n<li>الصفوف الثابتة (Tuples) غير قابلة للتعديل (فيُطلق تعديلها TypeError أو AttributeError)، وتُستخدم لإعادة عدة قيم من الدالة.</li></ul>\n<pre>x = [1, 2, 3].sort()        # None!\ndict(zip([\"A\", \"B\"], [90, 80]))   # {'A': 90, 'B': 80}\n{1, 2, 3} &amp; {2, 3, 4}       # {2, 3}</pre>"},{"id":"s08","unit":"u2","en":"Comprehensions, Functions, Scope & Lambda","ar":"الاختصارات والدوال والنطاق و Lambda","en_body":"<h3>Key points</h3><ul>\n<li>List comprehension: <code>[expr for item in iterable if condition]</code>; also set <code>{…}</code> and dict <code>{k: v for …}</code>.</li>\n<li><code>def name(params): … return value</code>; no return → None. Several values return as a tuple.</li>\n<li>Default arguments: <code>def greet(name, greeting=\"Hello\")</code>; name is positional, greeting is a keyword argument.</li>\n<li>Scope: local (inside the function), enclosing (<code>nonlocal</code>), global (<code>global</code> to change it), built-in.</li>\n<li>Assigning to a name inside a function makes it local → UnboundLocalError if read first.</li>\n<li><code>import math</code>, <code>from math import sqrt</code>, <code>import pandas as pd</code>. A module is a .py file; a package is a folder with <code>__init__.py</code>.</li>\n<li><code>lambda x: x * x</code> — one expression; used with <code>map</code>, <code>sort(key=…)</code>.</li></ul>\n<pre>[x**2 for x in range(10) if x % 2 == 0]   # [0, 4, 16, 36, 64]\ndef calc(a, b): return a + b, a - b\ns, d = calc(10, 5)                       # 15, 5\nlist(map(lambda s: s.upper(), [\"a\", \"b\"]))\npairs.sort(key=lambda p: p[1])</pre>\n<h3>Common mistakes</h3><ul><li><code>v = v.append(1)</code> makes v None.</li><li>Naming a function sum or print hides the built-in.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li><b>استيعاب القوائم</b> (List Comprehension) صيغته <code>[expr for item in iterable if condition]</code>، ويُطبَّق المفهوم نفسه على المجموعات <code>{…}</code> والقواميس <code>{k: v for …}</code>.</li>\n<li>تُعرَّف الدالة بالصيغة <code>def name(params): … return value</code>؛ وتُعيد الدالة التي لا تحتوي على return القيمة None، وتُعاد القيم المتعددة في صف ثابت.</li>\n<li>القيم الافتراضية: في <code>def greet(name, greeting=\"Hello\")</code> تكون name وسيطة موضعية، و greeting وسيطة مسماة ذات قيمة افتراضية.</li>\n<li>النطاقات (Scopes): المحلي (داخل الدالة)، والمُحيط (يُعدَّل بـ <code>nonlocal</code>)، والعام (يُعدَّل بـ <code>global</code>)، والمدمج.</li>\n<li>الإسناد إلى اسم داخل الدالة يجعله محلياً، فيُطلق الخطأ UnboundLocalError إذا قُرئ قبل إسناد قيمة إليه.</li>\n<li>صيغ الاستيراد: <code>import math</code> و <code>from math import sqrt</code> و <code>import pandas as pd</code>. والوحدة (Module) ملف ‎.py، والحزمة (Package) مجلد يحتوي على <code>__init__.py</code>.</li>\n<li>دالة <code>lambda x: x * x</code> دالة مجهولة الاسم تتكوّن من تعبير واحد، وتُستخدم غالباً مع <code>map</code> و <code>sort(key=…)</code>.</li></ul>\n<pre>[x**2 for x in range(10) if x % 2 == 0]   # [0, 4, 16, 36, 64]\ndef calc(a, b): return a + b, a - b\ns, d = calc(10, 5)                       # 15, 5\nlist(map(lambda s: s.upper(), [\"a\", \"b\"]))\npairs.sort(key=lambda p: p[1])</pre>\n<h3>أخطاء شائعة</h3><ul><li>كتابة <code>v = v.append(1)</code>، فتصبح v مساوية لـ None.</li><li>تسمية دالة باسم sum أو print، فتُحجب الدالة المدمجة.</li></ul>"},{"id":"s09","unit":"u2","en":"Control Flow, Errors & Exceptions","ar":"التحكم بالتدفق والأخطاء والاستثناءات","en_body":"<h3>Key points</h3><ul>\n<li>Comparisons <code>== != &gt; &lt; &gt;= &lt;=</code> give True/False; combine with <code>and</code>, <code>or</code>, <code>not</code>.</li>\n<li><code>if / elif / else</code>: an elif chain stops at the first True condition, so order matters. Separate ifs are all checked.</li>\n<li>Nested if runs only when the outer if is True; indentation decides which if an else belongs to.</li>\n<li><code>match / case</code>: <code>case 3 | 4</code> matches several, <code>case _</code> is the default.</li>\n<li>Read a traceback from the bottom: error type + message, then the failing line, then the call chain.</li></ul>\n<table><tr><th>Error</th><th>Cause</th></tr><tr><td>NameError</td><td>name not defined</td></tr><tr><td>TypeError</td><td>wrong type for the operation</td></tr>\n<tr><td>ValueError</td><td>right type, bad value: int('abc')</td></tr><tr><td>IndexError</td><td>index out of range</td></tr>\n<tr><td>KeyError</td><td>missing dict key</td></tr><tr><td>AttributeError</td><td>no such method: (1,2).append</td></tr></table>\n<pre>try:\n    n = int(text)\nexcept ValueError:\n    print(\"enter an integer\")\nexcept Exception as e:     # general last\n    print(e)\nelse:   print(\"no error\")\nfinally: print(\"always runs\")\nraise ValueError(\"must be positive\")</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>تُعيد عوامل المقارنة <code>== != &gt; &lt; &gt;= &lt;=</code> قيمة منطقية (True أو False)، وتُركَّب الشروط بالعوامل المنطقية <code>and</code> و <code>or</code> و <code>not</code>.</li>\n<li>في بنية <code>if / elif / else</code> يتوقف التقييم عند أول شرط صحيح، لذا فترتيب الشروط مؤثر؛ أما جمل if المنفصلة فتُختبر جميعها.</li>\n<li>لا تُختبر جملة if المتداخلة إلا إذا تحقق شرط if الخارجية، وتحدّد الإزاحة جملة if التي تتبعها else.</li>\n<li>في بنية <code>match / case</code> تُطابَق عدة قيم بالصيغة <code>case 3 | 4</code>، وتمثّل <code>case _</code> الحالة الافتراضية.</li>\n<li>يُقرأ تتبّع المكدس (Stack Trace) من الأسفل: نوع الخطأ ورسالته أولاً، ثم السطر الذي أخفق، ثم سلسلة الاستدعاءات.</li></ul>\n<table><tr><th>الخطأ</th><th>السبب</th></tr><tr><td>NameError</td><td>استخدام اسم غير مُعرَّف</td></tr><tr><td>TypeError</td><td>نوع غير ملائم للعملية</td></tr>\n<tr><td>ValueError</td><td>نوع صحيح بقيمة غير صالحة، مثل int('abc')</td></tr><tr><td>IndexError</td><td>فهرس خارج النطاق</td></tr>\n<tr><td>KeyError</td><td>مفتاح غير موجود في القاموس</td></tr><tr><td>AttributeError</td><td>خاصية أو دالة غير موجودة، مثل (1,2).append</td></tr></table>\n<pre>try:\n    n = int(text)\nexcept ValueError:\n    print(\"enter an integer\")\nexcept Exception as e:     # المعالج العام يأتي أخيراً\n    print(e)\nelse:   print(\"no error\")\nfinally: print(\"always runs\")\nraise ValueError(\"must be positive\")</pre>"},{"id":"s10","unit":"u2","en":"Files, CSV & JSON","ar":"الملفات و CSV و JSON","en_body":"<h3>Key points</h3><ul>\n<li>Modes: <code>r</code> read, <code>w</code> create/replace, <code>a</code> append, <code>x</code> create (error if exists), <code>b</code> binary.</li>\n<li>Use <code>with open(path, mode, encoding=\"utf-8\")</code> — it closes the file automatically.</li>\n<li><code>os.getcwd()</code>, <code>os.path.join()</code> (portable paths), <code>os.path.exists()</code>, <code>os.makedirs(exist_ok=True)</code>.</li>\n<li>Errors: FileNotFoundError (missing path) ≠ PermissionError (no access).</li>\n<li>CSV: use the <code>csv</code> module with <code>newline=\"\"</code>; values come back as <b>text</b>; quoted commas stay in one field (never <code>split(\",\")</code>).</li>\n<li>JSON: <code>dump/load</code> = file, <code>dumps/loads</code> = string. true/false/null ↔ True/False/None. No comments, trailing commas or sets.</li>\n<li><code>indent=2</code> readable; <code>ensure_ascii=False</code> keeps Arabic readable.</li>\n<li>Valid JSON ≠ valid data: validate types and required keys. To update a JSON list: read, change, rewrite (never append with \"a\").</li></ul>\n<pre>with open(p, \"w\", encoding=\"utf-8\") as f:\n    json.dump(config, f, indent=2, ensure_ascii=False)\nwith open(p, encoding=\"utf-8\") as f:\n    data = json.load(f)\nfor row in csv.reader(f): ...   # ['Ahmed', '30', 'Riyadh']</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>أوضاع فتح الملفات: <code>r</code> للقراءة، و <code>w</code> للإنشاء أو الاستبدال، و <code>a</code> للإلحاق، و <code>x</code> للإنشاء الحصري (يُطلق خطأً إذا كان الملف موجوداً)، و <code>b</code> للملفات الثنائية.</li>\n<li>يُستخدم <code>with open(path, mode, encoding=\"utf-8\")</code>؛ لأنه يُغلق الملف تلقائياً.</li>\n<li>من دوال الوحدة os: <code>os.getcwd()</code>، و <code>os.path.join()</code> (لبناء مسارات صالحة في جميع أنظمة التشغيل)، و <code>os.path.exists()</code>، و <code>os.makedirs(exist_ok=True)</code>.</li>\n<li>يختلف الخطأ FileNotFoundError (المسار غير موجود) عن PermissionError (عدم امتلاك الصلاحية).</li>\n<li>CSV: تُستخدم الوحدة <code>csv</code> مع <code>newline=\"\"</code>، وتُقرأ القيم بوصفها <b>نصوصاً</b>، وتبقى الفاصلة الواقعة داخل علامات التنصيص جزءاً من الحقل؛ لذا لا يُعتمد على <code>split(\",\")</code>.</li>\n<li>JSON: تتعامل <code>dump</code> و <code>load</code> مع الملفات، و <code>dumps</code> و <code>loads</code> مع السلاسل النصية. وتُقابل true و false و null القيم True و False و None. ولا يسمح JSON بالتعليقات ولا بالفواصل اللاحقة، ولا يدعم المجموعات.</li>\n<li>تُحسّن <code>indent=2</code> قابلية القراءة، وتُبقي <code>ensure_ascii=False</code> النصوص العربية مقروءة.</li>\n<li>صحة صيغة JSON لا تعني صحة البيانات؛ فيلزم التحقق من الأنواع والمفاتيح المطلوبة. ولتحديث قائمة في ملف JSON: يُقرأ الملف، ثم تُعدَّل القيمة، ثم يُعاد كتابته كاملاً (لا يُستخدم الوضع \"a\").</li></ul>\n<pre>with open(p, \"w\", encoding=\"utf-8\") as f:\n    json.dump(config, f, indent=2, ensure_ascii=False)\nwith open(p, encoding=\"utf-8\") as f:\n    data = json.load(f)\nfor row in csv.reader(f): ...   # ['Ahmed', '30', 'Riyadh']</pre>"},{"id":"s12","unit":"u3","en":"Relational Model & First SQL Queries","ar":"النموذج العلائقي وأول استعلامات SQL","en_body":"<h3>Key points</h3><ul>\n<li>Database → schema (training) → table → rows (one record at the table's <b>grain</b>) and columns.</li>\n<li><b>Primary key</b>: unique, non-null identifier. <b>Foreign key</b>: a child row must reference an existing parent.</li>\n<li>Grain matters: 2 crashes with 5 vehicle rows ≠ 5 crashes.</li>\n<li>Identifiers like district '01' are stored as text to keep leading zeros.</li>\n<li><b>NULL ≠ 0</b>: zero is known, NULL is unknown. Use <code>IS NULL</code>, never <code>= NULL</code>; a comparison with NULL drops the row in WHERE.</li>\n<li>LIMIT is an upper bound, not a sample; add a unique tie-breaker in ORDER BY for reproducible results.</li>\n<li>DISTINCT lists which values occur (not a count); <code>COUNT(*)</code> + <code>GROUP BY</code> counts per category.</li>\n<li>Pass values as parameters (<code>%s</code>), never by joining user text into SQL.</li></ul>\n<pre>SELECT id, date, primary_type\nFROM training.crimes\nWHERE primary_type = 'THEFT'\nORDER BY date DESC, id\nLIMIT 10;\nSELECT primary_type, COUNT(*) AS n FROM training.crimes GROUP BY primary_type;</pre>\n<p>Clause order: SELECT → FROM → WHERE → GROUP BY → ORDER BY → LIMIT. A posted speed limit is not observed speed.</p>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>التسلسل الهرمي: قاعدة البيانات ← المخطط (مثل training) ← الجدول ← الصفوف والأعمدة؛ ويمثّل كل صف سجلاً واحداً وفق <b>مستوى تفصيل الصف</b> (Grain) في الجدول.</li>\n<li><b>المفتاح الأساسي</b> معرِّف فريد وغير فارغ، و<b>المفتاح الأجنبي</b> يُلزم صف الجدول الفرعي بالإشارة إلى صف موجود في الجدول الأب.</li>\n<li>لمستوى التفصيل أثر جوهري في التفسير: فحادثان لهما خمسة صفوف مركبات لا يعنيان خمسة حوادث.</li>\n<li>تُخزَّن المعرِّفات مثل رمز المنطقة '01' بوصفها نصوصاً للحفاظ على الأصفار البادئة.</li>\n<li><b>القيمة NULL ليست صفراً</b>: فالصفر قيمة معلومة، و NULL قيمة مجهولة. ويُستخدم <code>IS NULL</code> لا <code>= NULL</code>، كما أن المقارنة مع NULL تستبعد الصف في WHERE.</li>\n<li>LIMIT حد أعلى لعدد الصفوف وليست أسلوب معاينة؛ ولضمان نتائج قابلة لإعادة الإنتاج يُضاف مفتاح فريد لفضّ التساوي في ORDER BY.</li>\n<li>تعرض DISTINCT القيم المميزة الموجودة ولا تعدّها، بينما يعدّ <code>COUNT(*)</code> مع <code>GROUP BY</code> الصفوف لكل فئة.</li>\n<li>تُمرَّر القيم بوصفها معاملات (<code>%s</code>)، ولا يُدمج نص المستخدم في جملة SQL مباشرة.</li></ul>\n<pre>SELECT id, date, primary_type\nFROM training.crimes\nWHERE primary_type = 'THEFT'\nORDER BY date DESC, id\nLIMIT 10;\nSELECT primary_type, COUNT(*) AS n FROM training.crimes GROUP BY primary_type;</pre>\n<p>ترتيب كتابة العبارات: SELECT ← FROM ← WHERE ← GROUP BY ← ORDER BY ← LIMIT. ويمثّل العمود posted_speed_limit حد السرعة المُعلن، لا السرعة الفعلية للمركبة.</p>"},{"id":"s13","unit":"u3","en":"Database Infrastructure & Serverless","ar":"البنية التحتية لقواعد البيانات و Serverless","en_body":"<h3>Key points</h3><ul>\n<li>Client (Colab/app) → database engine (PostgreSQL compute) → persistent storage (tables, indexes, WAL).</li>\n<li>Physical server = dedicated machine; VPS = virtual machine on shared hardware (e.g. Hetzner). You manage the OS and database.</li>\n<li>Resources: CPU (queries), RAM (cache, sorts), disk (tables, WAL), network. WAL = write-ahead log for recovery.</li>\n<li>Backup = restorable copy (proven only by a <b>test restore</b>); replica copies mistakes too; RPO/RTO = allowed data loss / downtime.</li>\n<li><b>Serverless</b> (Neon): the provider runs the servers — servers still exist and it isn't free. Compute is separate from storage.</li>\n<li><b>Scale to zero</b> suspends idle compute; committed data stays; the next connection has a <b>cold start</b>.</li>\n<li>Your team always owns: schema, SQL, data quality, roles, secrets and recovery policy.</li>\n<li>Agent apps store sessions, runs/checkpoints, tool calls, memory and embeddings (pgvector for RAG).</li></ul>\n<p>Choose intermittent use → idle suspension; steady traffic → predictable capacity and monthly cost. If statement two fails in a transaction, the whole transaction rolls back.</p>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>تتكوّن المعمارية من: العميل (Colab أو التطبيق) ← محرّك قاعدة البيانات (حوسبة PostgreSQL) ← التخزين الدائم (الجداول والفهارس وسجل WAL).</li>\n<li><b>الخادم المادي</b> جهاز مخصَّص، أما <b>الخادم الخاص الافتراضي</b> (VPS) فآلة افتراضية على عتاد مشترك (مثل Hetzner)، ويتولى فريقك فيه إدارة نظام التشغيل وقاعدة البيانات.</li>\n<li>الموارد الأساسية: المعالج (لتنفيذ الاستعلامات)، والذاكرة (للتخزين المؤقت والفرز)، والقرص (للجداول وسجل WAL)، والشبكة. و<b>WAL</b> هو سجل الكتابة المسبقة (Write-Ahead Log) المستخدم في الاستعادة.</li>\n<li><b>النسخة الاحتياطية</b> نسخة قابلة للاستعادة، ولا يُثبت ذلك إلا <b>اختبار استعادة فعلي</b>؛ أما <b>النسخة المتماثلة</b> (Replica) فتنقل الأخطاء أيضاً. ويمثّل <b>RPO</b> مقدار فقدان البيانات المسموح به، و<b>RTO</b> مدة التوقف المسموح بها.</li>\n<li><b>الحوسبة دون خوادم</b> (Serverless) مثل Neon: يتولى المزوّد تشغيل الخوادم، فالخوادم موجودة وليست مجانية، والحوسبة منفصلة عن التخزين.</li>\n<li><b>التحجيم إلى الصفر</b> (Scale to Zero) يُوقف موارد الحوسبة الخاملة مع بقاء البيانات المُودَعة، ويصاحب الاتصالَ التالي <b>بدءٌ بارد</b> (Cold Start).</li>\n<li>تبقى على عاتق فريقك دائماً المسؤولية عن: المخطط، واستعلامات SQL، وجودة البيانات، والأدوار، والأسرار، وسياسة الاستعادة.</li>\n<li>تخزّن تطبيقات الوكلاء الذكية الجلسات، وعمليات التشغيل، ونقاط الحفظ، واستدعاءات الأدوات، والذاكرة، والمتجهات التضمينية (pgvector لتطبيقات RAG).</li></ul>\n<p>يناسب الاستخدامَ المتقطع التعليقُ عند الخمول، بينما تتطلب الحركة الثابتة سعة متوقعة وتقديراً للتكلفة الشهرية. وإذا أخفقت عبارة ضمن معاملة، تراجعت المعاملة كلها.</p>"},{"id":"s14","unit":"u3","en":"Filtering, NULL, Safe CRUD & Transactions","ar":"التصفية و NULL والتعديل الآمن والمعاملات","en_body":"<h3>Key points</h3><ul>\n<li><code>AND</code> binds tighter than <code>OR</code> — use parentheses; <code>IN (...)</code> is a cleaner choice list.</li>\n<li>A month is a half-open interval: <code>&gt;= '2025-01-01' AND &lt; '2025-02-01'</code> (includes all of Jan 31).</li>\n<li><code>LIKE 'SYNTH-%'</code>: % = any characters. <code>CASE WHEN … THEN … END</code> makes display labels.</li>\n<li>Parameters: <code>WHERE district = %s</code> with <code>('01',)</code> — prevents SQL injection; don't quote %s.</li>\n<li>Constraints: PRIMARY KEY, NOT NULL, CHECK (status IN …), FOREIGN KEY reject invalid data.</li>\n<li>Temporary tables belong to one connection and protect shared data.</li>\n<li><b>RETURNING</b> shows exactly which rows changed. Guard updates with key + expected state; zero affected rows is a valid result.</li>\n<li>A transaction is all-or-nothing: one failed statement rolls back the whole batch.</li></ul>\n<pre>UPDATE requests SET status = 'CLOSED'\nWHERE request_id = 104 AND status = 'OPEN'\nRETURNING request_id, status;</pre>\n<h3>Common mistakes</h3><ul><li>Removing a constraint or a WHERE clause to \"fix\" an error.</li><li>Querying again before an aborted transaction has rolled back.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>أولوية <code>AND</code> أعلى من أولوية <code>OR</code>؛ لذا تُستخدم الأقواس، ويُعدّ <code>IN (...)</code> أوضح عند المقارنة بقائمة من القيم.</li>\n<li>يُمثَّل الشهر بفترة نصف مفتوحة: <code>&gt;= '2025-01-01' AND &lt; '2025-02-01'</code>، وهي تشمل يوم 31 يناير كاملاً.</li>\n<li>في النمط <code>LIKE 'SYNTH-%'</code> يطابق الرمز % أي تسلسل من الأحرف، ويُنشئ تعبير <code>CASE WHEN … THEN … END</code> تسميات لأغراض العرض.</li>\n<li>الاستعلامات المُعامَلة: <code>WHERE district = %s</code> مع المعامل <code>('01',)</code> تمنع حقن SQL، ولا يُحاط العنصر النائب %s بعلامات تنصيص.</li>\n<li>القيود PRIMARY KEY و NOT NULL و CHECK (status IN …) و FOREIGN KEY ترفض البيانات غير الصالحة.</li>\n<li>ترتبط الجداول المؤقتة باتصال واحد، وتحمي البيانات المشتركة من التعديل.</li>\n<li>تعرض <b>RETURNING</b> الصفوف التي تغيّرت بالضبط. ويُقيَّد التحديث بالمفتاح والحالة المتوقعة، وعدم تأثر أي صف نتيجة صحيحة.</li>\n<li>المعاملة ذرّية: إما أن تنجح كلها أو تفشل كلها، وإخفاق عبارة واحدة يؤدي إلى التراجع عن الدفعة كاملة.</li></ul>\n<pre>UPDATE requests SET status = 'CLOSED'\nWHERE request_id = 104 AND status = 'OPEN'\nRETURNING request_id, status;</pre>\n<h3>أخطاء شائعة</h3><ul><li>حذف قيد أو شرط WHERE لتجاوز رسالة خطأ.</li><li>تنفيذ استعلام جديد قبل التراجع عن معاملة أخفقت.</li></ul>"},{"id":"s14b","unit":"u3","en":"Joins, Keys & Result Grain","ar":"الربط والمفاتيح ومستوى النتيجة","en_body":"<h3>Key points</h3><ul>\n<li>One department → many requests (one-to-many). department_id is unique in departments and repeats in requests.</li>\n<li>A <b>foreign key</b> checks a reference; a <b>JOIN</b> combines matching rows. A foreign key does not grant permission.</li>\n<li><b>INNER JOIN</b>: only matched rows (Training with no requests disappears). <b>LEFT JOIN</b>: keeps every left row, NULL-extended when unmatched.</li>\n<li>Condition in <b>ON</b> keeps all departments; the same condition in <b>WHERE</b> removes the NULL-extended rows — it changes the question.</li>\n<li>Find parents with no children: LEFT JOIN … WHERE child key IS NULL, or <code>NOT EXISTS</code>.</li>\n<li><b>EXISTS</b> answers yes/no per parent and never multiplies rows.</li>\n<li>Joining two child tables through the same crash multiplies rows: 2 vehicles × 3 people = 6 rows. Don't sum crash totals across them.</li>\n<li>Predict the output grain before each query; <code>DISTINCT</code> can hide a wrong relationship — fix the key instead.</li></ul>\n<pre>SELECT d.name, r.request_id\nFROM departments d\nLEFT JOIN requests r ON r.department_id = d.department_id AND r.status = 'OPEN';\n-- Intake R01 | Records R04 | Training NULL\nSELECT c.crash_record_id FROM training.crashes c\nWHERE EXISTS (SELECT 1 FROM training.people p WHERE p.crash_record_id = c.crash_record_id);</pre>\n<h3>Common mistakes</h3><ul><li>Ambiguous column: qualify it with the table alias.</li><li>Joining on row position, date or an invented key.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>للإدارة الواحدة طلبات كثيرة، فالعلاقة <b>واحد إلى متعدد</b>؛ إذ يكون department_id فريداً في departments ويتكرر في requests.</li>\n<li>يتحقق <b>المفتاح الأجنبي</b> من صحة المرجع، ويجمع <b>الربط</b> (JOIN) الصفوف المتطابقة، ولا يمنح المفتاح الأجنبي أي صلاحيات وصول.</li>\n<li><b>الربط الداخلي</b> (INNER JOIN) يُعيد الصفوف المتطابقة فقط، فتختفي الإدارة Training التي لا طلبات لها. أما <b>الربط اليساري</b> (LEFT JOIN) فيُبقي كل صفوف الجدول الأيسر ويُكمل غير المتطابق منها بالقيمة NULL.</li>\n<li>الشرط الموضوع في <b>ON</b> يُبقي جميع الإدارات، أما وضعه في <b>WHERE</b> فيحذف الصفوف المُكمَّلة بـ NULL، فيتغير السؤال الذي يجيب عنه الاستعلام.</li>\n<li>لاستخراج السجلات الأب التي لا سجلات فرعية لها: LEFT JOIN … WHERE مفتاح الجدول الفرعي IS NULL، أو <code>NOT EXISTS</code>.</li>\n<li>يُجيب <b>EXISTS</b> بنعم أو لا لكل صف أب، ولا يُضاعف الصفوف أبداً.</li>\n<li>ربط جدولين فرعيين عبر الحادث نفسه يُضاعف الصفوف: مركبتان × 3 أشخاص = 6 صفوف، فلا تُجمع إجماليات الحادث على هذه الصفوف.</li>\n<li>يُتوقَّع مستوى تفصيل النتيجة قبل تنفيذ كل استعلام؛ وقد تُخفي <code>DISTINCT</code> علاقة غير صحيحة، فيُصحَّح مفتاح الربط بدلاً من استخدامها.</li></ul>\n<pre>SELECT d.name, r.request_id\nFROM departments d\nLEFT JOIN requests r ON r.department_id = d.department_id AND r.status = 'OPEN';\n-- Intake R01 | Records R04 | Training NULL\nSELECT c.crash_record_id FROM training.crashes c\nWHERE EXISTS (SELECT 1 FROM training.people p WHERE p.crash_record_id = c.crash_record_id);</pre>\n<h3>أخطاء شائعة</h3><ul><li>العمود الملتبس (Ambiguous): يُؤهَّل باسم الجدول المستعار قبله.</li><li>الربط بموضع الصف أو بالتاريخ أو بمفتاح مُختلَق.</li></ul>"},{"id":"s14c","unit":"u3","en":"Data Quality Triage & Constrained Registers","ar":"فحص جودة البيانات والسجلات المقيدة","en_body":"<h3>Key points</h3><ul>\n<li>A valid type is only the first check: a request also needs a known department, an allowed status and a plausible duration.</li>\n<li>Keep raw rows unchanged as evidence; attach rejection reasons; get corrections from the data owner — don't guess.</li>\n<li>Missing key: <code>request_id IS NULL</code>. Zero minutes is an observed value, not missing.</li>\n<li><code>UPPER(TRIM(status))</code> standardizes spelling in the result only; it can't repair an unknown status (PENDING).</li>\n<li>Duplicate business key: a self-join with <code>a.row_no &lt; b.row_no</code> lists each pair once; choose a winner only with a policy (not DISTINCT).</li>\n<li>Out-of-domain: <code>minutes &lt; 0 OR minutes &gt; 120</code>; NULL is handled separately with IS NULL.</li>\n<li>Constraints reject invalid stored states; inspect them with <code>pg_constraint</code>.</li>\n<li>Idempotent update: <code>WHERE request_id = 'R06' AND status = 'OPEN'</code> — the second run returns no rows.</li>\n<li>Transaction + foreign-key violation → everything rolls back. A hostile parameter <code>R01' OR '1'='1</code> returns nothing.</li></ul>\n<pre>SELECT a.row_no, b.row_no, a.request_id\nFROM raw_requests a JOIN raw_requests b\n  ON a.request_id = b.request_id AND a.row_no &lt; b.row_no;</pre>\n<h3>Remember</h3><ul><li>Temporary objects vanish when the connection closes; rerunning INSERT can violate the primary key.</li><li>Never remove a WHERE clause to fix a failed update.</li></ul>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>صحة نوع البيانات أول فحص فحسب؛ إذ يحتاج الطلب أيضاً إلى إدارة معروفة، وحالة مسموح بها، ومدة معقولة.</li>\n<li>تبقى الصفوف الخام كما هي بوصفها دليلاً، وتُرفق بها أسباب الرفض، ويُطلب التصحيح من مالك البيانات دون تخمين.</li>\n<li>يُكشف المفتاح المفقود بالشرط <code>request_id IS NULL</code>، والمدة صفر دقيقة قيمة مرصودة وليست مفقودة.</li>\n<li>يوحّد <code>UPPER(TRIM(status))</code> طريقة الكتابة في النتيجة فقط، ولا يُصلح حالة مجهولة مثل PENDING.</li>\n<li>المفتاح المكرر: يعرض الربط الذاتي مع الشرط <code>a.row_no &lt; b.row_no</code> كل زوج مرة واحدة، ولا يُختار السجل المعتمد إلا وفق سياسة عمل (لا باستخدام DISTINCT).</li>\n<li>القيم خارج النطاق: <code>minutes &lt; 0 OR minutes &gt; 120</code>، وتُعالَج القيمة NULL منفصلة بالشرط IS NULL.</li>\n<li>ترفض القيود الحالات المخزَّنة غير الصالحة، ويمكن فحصها عبر <code>pg_constraint</code>.</li>\n<li>التحديث متساوي الأثر (Idempotent): <code>WHERE request_id = 'R06' AND status = 'OPEN'</code>؛ فلا يُعيد التشغيل الثاني أي صفوف.</li>\n<li>إذا وقع انتهاك لمفتاح أجنبي داخل معاملة، تراجعت المعاملة كلها. ولا يُعيد المعامل العدائي <code>R01' OR '1'='1</code> أي صفوف.</li></ul>\n<pre>SELECT a.row_no, b.row_no, a.request_id\nFROM raw_requests a JOIN raw_requests b\n  ON a.request_id = b.request_id AND a.row_no &lt; b.row_no;</pre>\n<h3>ملاحظات مهمة</h3><ul><li>تزول الكائنات المؤقتة عند إغلاق الاتصال، وقد تنتهك إعادة تنفيذ INSERT قيد المفتاح الأساسي.</li><li>لا يُحذف شرط WHERE لمعالجة تحديث أخفق.</li></ul>"},{"id":"s15","unit":"u4","en":"Aggregation, Denominators & CTEs","ar":"التجميع والمقامات و CTEs","en_body":"<h3>Key points</h3><ul>\n<li><code>COUNT(*)</code> counts rows; <code>COUNT(col)</code> counts non-NULL values; SUM and AVG ignore NULL.</li>\n<li>Durations 30, 0, NULL… → mean of observed = 150/3 = 50. Filling NULL with 0 (150/5 = 30) changes the question.</li>\n<li>Order: WHERE filters rows → GROUP BY → HAVING filters groups → ORDER BY presents.</li>\n<li>LEFT JOIN + <code>COUNT(child_key)</code> keeps empty groups at 0 (COUNT(*) would count 1).</li>\n<li><code>COUNT(*) FILTER (WHERE …)</code> = conditional count. Percentage: <code>100.0 * x / NULLIF(n, 0)</code> (avoid integer division; empty → NULL, not 0%).</li>\n<li>Joining two children multiplies rows; DISTINCT / SUM(DISTINCT) is not a fix. Aggregate each child first, then join.</li>\n<li>A <b>CTE</b> (WITH) names a step for one statement — readability, not automatic speed. A derived table needs an alias.</li>\n<li>COALESCE(child_count, 0) is fine for missing child rows, never for unknown observations.</li></ul>\n<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles FROM training.vehicles GROUP BY 1),\n     p AS (SELECT crash_record_id, COUNT(*) AS people   FROM training.people   GROUP BY 1)\nSELECT c.crash_record_id, COALESCE(v.vehicles,0), COALESCE(p.people,0)\nFROM training.crashes c LEFT JOIN v USING (crash_record_id) LEFT JOIN p USING (crash_record_id);</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>يعدّ <code>COUNT(*)</code> الصفوف، ويعدّ <code>COUNT(col)</code> القيم غير الفارغة، وتتجاهل الدالتان SUM و AVG القيم NULL.</li>\n<li>للمدد 30 و 0 و 120 وقيمتين NULL، يكون متوسط القيم المرصودة 150 ÷ 3 = 50؛ أما تعويض NULL بالصفر (150 ÷ 5 = 30) فيُغيّر السؤال المطروح.</li>\n<li>الترتيب المنطقي: تُصفّي WHERE الصفوف ← ثم GROUP BY ← ثم تُصفّي HAVING المجموعات ← ثم تحدّد ORDER BY ترتيب العرض.</li>\n<li>الربط اليساري مع <code>COUNT(مفتاح الجدول الفرعي)</code> يُبقي المجموعات الفارغة بقيمة صفر، بينما يعدّها COUNT(*) واحداً.</li>\n<li><code>COUNT(*) FILTER (WHERE …)</code> عدٌّ مشروط. وتُحسب النسبة بالصيغة <code>100.0 * x / NULLIF(n, 0)</code> تجنّباً للقسمة الصحيحة، فتكون نتيجة المجموعة الفارغة NULL لا 0%.</li>\n<li>ربط جدولين فرعيين يُضاعف الصفوف، وليست DISTINCT أو SUM(DISTINCT) حلاً صحيحاً؛ بل يُجمَّع كل جدول فرعي أولاً ثم يُربط.</li>\n<li><b>تعبير الجدول المشترك</b> (CTE) المعرَّف بـ WITH يُسمّي خطوة ضمن عبارة واحدة، والغرض منه الوضوح لا تحسين السرعة تلقائياً. ويحتاج الجدول المشتق إلى اسم مستعار.</li>\n<li>تناسب COALESCE(عدد السجلات الفرعية, 0) حالة غياب الصفوف الفرعية، ولا تُستخدم لتعويض القيم المرصودة المجهولة.</li></ul>\n<pre>WITH v AS (SELECT crash_record_id, COUNT(*) AS vehicles FROM training.vehicles GROUP BY 1),\n     p AS (SELECT crash_record_id, COUNT(*) AS people   FROM training.people   GROUP BY 1)\nSELECT c.crash_record_id, COALESCE(v.vehicles,0), COALESCE(p.people,0)\nFROM training.crashes c LEFT JOIN v USING (crash_record_id) LEFT JOIN p USING (crash_record_id);</pre>"},{"id":"s16","unit":"u4","en":"Time Series & Window Functions","ar":"السلاسل الزمنية ودوال النافذة","en_body":"<h3>Key points</h3><ul>\n<li>An aggregate reduces rows; a <b>window function</b> keeps rows and adds a cross-row value. ORDER BY inside OVER = calculation order; PARTITION BY = separate series.</li>\n<li>Build a complete calendar with <code>generate_series</code> + LEFT JOIN so missing months appear as 0 (only a true zero when coverage is known).</li>\n<li><code>LAG(x)</code> previous row (first is NULL); running total = <code>SUM … ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>; moving mean = <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</code>.</li>\n<li>Requests [2, 2, 1, 0]: LAG NULL, 2, 2, 1; running 2, 4, 5, 5; 3-row mean 2, 2, 1.67, 1 — smoothing, not a forecast.</li>\n<li>Compute the window in a CTE, then filter; filtering first removes the predecessor.</li>\n<li>Percentage change: <code>100.0 * (x − prev) / NULLIF(prev, 0)</code>.</li></ul>\n<table><tr><th>10, 8, 8, 5</th><th>Result</th></tr><tr><td>RANK</td><td>1, 2, 2, 4</td></tr><tr><td>DENSE_RANK</td><td>1, 2, 2, 3</td></tr><tr><td>ROW_NUMBER</td><td>1, 2, 3, 4</td></tr></table>\n<p>\"Exactly three months\" → ROW_NUMBER with a stable tie-breaker; \"every month tied at the top\" → DENSE_RANK = 1. Quota samples don't support growth conclusions; don't silently convert timestamps to UTC.</p>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>يختزل التجميع الصفوف، أما <b>دالة النافذة</b> (Window Function) فتحتفظ بها وتضيف قيمة محسوبة عبر الصفوف. وتحدّد ORDER BY داخل OVER ترتيب الحساب، وتُنشئ PARTITION BY سلسلة مستقلة لكل كيان.</li>\n<li>يُبنى تقويم كامل بالدالة <code>generate_series</code> مع ربط يساري لتظهر الأشهر الخالية بقيمة صفر، ولا يُعدّ الصفر حقيقياً إلا إذا ثبتت تغطية المصدر.</li>\n<li>تُعيد <code>LAG(x)</code> قيمة الصف السابق (وتكون NULL في الصف الأول)، ويُحسب المجموع التراكمي بـ <code>SUM … ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>، والمتوسط المتحرك بـ <code>ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</code>.</li>\n<li>للطلبات [2, 2, 1, 0]: قيم LAG هي NULL و 2 و 2 و 1، والمجاميع التراكمية 2 و 4 و 5 و 5، والمتوسط المتحرك لثلاثة صفوف 2 و 2 و 1.67 و 1؛ وهو تمهيد للبيانات لا تنبؤ.</li>\n<li>تُحسب دالة النافذة داخل CTE ثم تُطبَّق التصفية؛ لأن التصفية أولاً تحذف الصف السابق.</li>\n<li>نسبة التغير: <code>100.0 * (x − prev) / NULLIF(prev, 0)</code>.</li></ul>\n<table><tr><th>10, 8, 8, 5</th><th>النتيجة</th></tr><tr><td>RANK</td><td>1, 2, 2, 4</td></tr><tr><td>DENSE_RANK</td><td>1, 2, 2, 3</td></tr><tr><td>ROW_NUMBER</td><td>1, 2, 3, 4</td></tr></table>\n<p>لاختيار ثلاثة أشهر بالضبط تُستخدم ROW_NUMBER مع معيار ثابت لفضّ التساوي، ولاختيار كل الأشهر المتساوية في القمة تُستخدم DENSE_RANK = 1. ولا تكفي البيانات التدريبية لاستنتاج النمو، ولا تُحوَّل الأوقات إلى UTC دون إعلان.</p>"},{"id":"s17","unit":"u4","en":"Views, Query Plans & Indexes","ar":"العروض وخطط الاستعلام والفهارس","en_body":"<h3>Key points</h3><ul>\n<li>A normal <b>view</b> stores a SELECT and runs on current data every time (not a snapshot). A <b>materialized view</b> stores results and needs refreshing.</li>\n<li>A view gives query reuse — not automatic speed, not correct denominators, not permissions.</li>\n<li>Use known flags as the denominator: <code>100.0 * marked / NULLIF(observed, 0)</code>; show missing = records − observed.</li>\n<li>Overall rate: pool numerators and denominators — never average category percentages.</li>\n<li><code>EXPLAIN</code> shows the chosen plan with estimates (doesn't run); <code>EXPLAIN ANALYZE</code> runs it and adds actual rows (BUFFERS adds page usage).</li>\n<li>Costs are planner units, not milliseconds. Big estimate vs actual gaps = wrong selectivity.</li>\n<li>A raw range on a column fits a B-tree index; <code>DATE_TRUNC(col)</code> may need an expression index. A sequential scan on a small table is not a problem.</li>\n<li>Correctness first: equivalent queries must return the same IDs; performance claims need repeated measurements.</li></ul>\n<pre>CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date);\nEXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)\nSELECT crash_record_id FROM pg_temp.perf_crashes\nWHERE crash_date &gt;= '2025-03-01' AND crash_date &lt; '2025-04-01';</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>يحفظ <b>العرض</b> (View) العادي تعريف استعلام SELECT ويُنفّذه على البيانات الحالية في كل مرة، فليس لقطة ثابتة. أما <b>العرض المُجسَّد</b> (Materialized View) فيخزّن النتائج ويحتاج إلى سياسة تحديث.</li>\n<li>يوفّر العرض إعادة استخدام الاستعلام، ولا يضمن تلقائياً سرعة أعلى ولا مقامات صحيحة ولا صلاحيات.</li>\n<li>تُستخدم القيم المعروفة مقاماً: <code>100.0 * marked / NULLIF(observed, 0)</code>، مع إظهار عدد القيم المفقودة = records − observed.</li>\n<li>المعدل الإجمالي يُحسب بجمع البسوط والمقامات، لا بأخذ متوسط نسب الفئات.</li>\n<li>يعرض <code>EXPLAIN</code> الخطة المختارة مع التقديرات دون تنفيذ، بينما يُنفّذ <code>EXPLAIN ANALYZE</code> العبارة ويضيف عدد الصفوف الفعلي، ويضيف الخيار BUFFERS معلومات استخدام الصفحات.</li>\n<li>التكاليف وحدات اعتبارية للمخطِّط لا مللي ثانية، والفرق الكبير بين عدد الصفوف المقدَّر والفعلي يدل على تقدير خاطئ للانتقائية.</li>\n<li>يناسب فهرس B-tree التصفية بنطاق على عمود خام، بينما قد يحتاج التعبير <code>DATE_TRUNC(col)</code> إلى فهرس على التعبير. والمسح التسلسلي لجدول صغير ليس مشكلة.</li>\n<li>الصحة أولاً: يجب أن تُعيد الاستعلامات المتكافئة المعرِّفات نفسها، وتتطلب ادعاءات الأداء قياسات متكررة.</li></ul>\n<pre>CREATE INDEX perf_crash_date_idx ON pg_temp.perf_crashes(crash_date);\nEXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)\nSELECT crash_record_id FROM pg_temp.perf_crashes\nWHERE crash_date &gt;= '2025-03-01' AND crash_date &lt; '2025-04-01';</pre>"},{"id":"s18","unit":"u4","en":"Spatial SQL with PostGIS","ar":"SQL المكاني مع PostGIS","en_body":"<h3>Key points</h3><ul>\n<li>PostGIS adds spatial types and functions to PostgreSQL. In EPSG:4326, X = longitude, Y = latitude: <code>ST_MakePoint(lon, lat)</code>.</li>\n<li><code>ST_SetSRID</code> <b>labels</b> coordinates; <code>ST_Transform</code> <b>converts</b> them. Swapping them gives plausible but wrong results.</li>\n<li>Validate polygons with <code>ST_IsValid</code> before using predicates.</li>\n<li><code>ST_Covers</code> includes the boundary (an edge point matches both zones); <code>ST_Contains</code> excludes boundary-only points.</li>\n<li>One zone per point: <code>LEFT JOIN LATERAL (… ORDER BY zone LIMIT 1) ON true</code> keeps unmatched points as NULL. Report outside-coverage and missing coordinates separately.</li>\n<li>Distance in metres: cast to <b>geography</b>; geometry in 4326 gives degrees. <code>ST_DWithin(geog, anchor, 500)</code> = within 500 m.</li>\n<li>A GiST index must match the queried expression (geography ≠ geometry).</li>\n<li>Kilometre grid: transform to a metre projection (EPSG:26916), then <code>FLOOR(ST_X(g)/1000)</code>; cell counts must sum to the located points.</li></ul>\n<pre>SELECT id FROM distance_demo\nWHERE ST_DWithin(geom::geography,\n      ST_SetSRID(ST_MakePoint(-87.65, 41.82), 4326)::geography, 500);</pre>\n<p>A grid count is sampled volume, not risk or density.</p>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>يضيف PostGIS أنواعاً ودوالاً مكانية إلى PostgreSQL. وفي النظام EPSG:4326 يمثّل X خط الطول و Y دائرة العرض: <code>ST_MakePoint(lon, lat)</code>.</li>\n<li><code>ST_SetSRID</code> <b>يُعيّن</b> نظام الإسناد للإحداثيات، و <code>ST_Transform</code> <b>يحوّلها</b> إلى نظام آخر؛ والخلط بينهما يُنتج نتائج تبدو معقولة لكنها خاطئة.</li>\n<li>يُتحقق من صحة المضلعات بالدالة <code>ST_IsValid</code> قبل تطبيق الشروط المكانية.</li>\n<li>تشمل <code>ST_Covers</code> الحدود، فتطابق نقطة الحد المشترك المنطقتين كلتيهما، بينما تستثني <code>ST_Contains</code> النقاط الواقعة على الحد فقط.</li>\n<li>لإسناد منطقة واحدة لكل نقطة: <code>LEFT JOIN LATERAL (… ORDER BY zone LIMIT 1) ON true</code>، فتبقى النقاط غير المطابقة بقيمة NULL. ويُبلَّغ منفصلاً عن النقاط الواقعة خارج التغطية وعن الإحداثيات المفقودة.</li>\n<li>لقياس المسافة بالأمتار يُحوَّل النوع إلى <b>geography</b>، إذ تُعطي geometry في النظام 4326 درجات. ويعني <code>ST_DWithin(geog, anchor, 500)</code> المسافة ضمن 500 متر.</li>\n<li>يجب أن يطابق فهرس GiST التعبير المستعلَم عنه (geography ليست geometry).</li>\n<li>شبكة الكيلومتر: تُحوَّل الإحداثيات إلى إسقاط بوحدة المتر (EPSG:26916) ثم يُحسب <code>FLOOR(ST_X(g)/1000)</code>، ويجب أن يساوي مجموع الخلايا عدد النقاط ذات المواقع.</li></ul>\n<pre>SELECT id FROM distance_demo\nWHERE ST_DWithin(geom::geography,\n      ST_SetSRID(ST_MakePoint(-87.65, 41.82), 4326)::geography, 500);</pre>\n<p>يمثّل العدد في كل خلية من الشبكة حجم عينة، ولا يدل بذاته على الخطورة أو الكثافة.</p>"},{"id":"s21","unit":"u5","en":"NumPy Arrays, Selection & Calculation","ar":"مصفوفات NumPy: الإنشاء والاختيار والحساب","en_body":"<h3>Key points</h3><ul>\n<li>Lists store objects; arrays compute: <code>[12, 8] * 2</code> repeats, <code>np.array([12, 8]) * 2</code> doubles (<b>vectorization</b>).</li>\n<li>Anatomy: <code>shape</code> (4, 3), <code>ndim</code> 2, <code>size</code> 12, <code>dtype</code>. Axis 0 = rows (desks), axis 1 = columns (types). Keep label arrays beside the data.</li>\n<li>One dtype per array; IDs like '007' are text; <code>astype(int)</code> truncates; int8 overflows silently (120 + 10 → −126).</li>\n<li>Create: zeros, full, <code>arange</code> (end excluded), <code>linspace</code> (end included), <code>np.random.default_rng(seed)</code>.</li>\n<li><code>reshape</code> regroups in order; <code>.T</code> swaps the meaning of axes. <code>np.stack</code> adds a new axis; <code>concatenate</code> joins an existing one.</li>\n<li>Masks: <code>(a &gt;= 6) &amp; (a &lt;= 9)</code> — parentheses required; <code>and</code> fails on arrays.</li>\n<li>Slices are <b>views</b> (changing them changes the source); fancy/mask indexing makes copies; use <code>.copy()</code> first.</li>\n<li><b>The axis you pass disappears</b>: <code>sum(axis=0)</code> → per type; <code>sum(axis=1)</code> → per desk. argmax returns the first on ties.</li>\n<li>Broadcasting lines up shapes from the right; per-desk vector → <code>hours[:, None]</code>. On square tables a wrong broadcast gives no error.</li>\n<li>nan = unknown: <code>np.nanmean</code>, <code>np.nanmedian</code>; zero hours → rate nan via <code>np.divide(..., where=)</code>.</li></ul>\n<pre>shares = requests / requests.sum(axis=1, keepdims=True)\nrate = np.divide(c, h, out=np.full(c.shape, np.nan), where=h &gt; 0)</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>تخزّن القوائم كائنات، بينما تُجري المصفوفات الحسابات: فالتعبير <code>[12, 8] * 2</code> يكرر القائمة، أما <code>np.array([12, 8]) * 2</code> فيضاعف كل عنصر، وهذا ما يُسمّى <b>المعالجة المتجهية</b> (Vectorization).</li>\n<li>خصائص المصفوفة: <code>shape</code> ‏(4, 3)، و <code>ndim</code> ‏2، و <code>size</code> ‏12، و <code>dtype</code>. ويمثّل المحور 0 الصفوف (المكاتب) والمحور 1 الأعمدة (الأنواع)، ويُحتفظ بمصفوفات التسميات إلى جانب البيانات.</li>\n<li>للمصفوفة نوع بيانات واحد؛ والمعرِّفات مثل '007' تُخزَّن نصوصاً؛ وتقتطع <code>astype(int)</code> الجزء العشري؛ ويحدث الفيض في النوع int8 بصمت (120 + 10 ← −126).</li>\n<li>دوال الإنشاء: zeros و full و <code>arange</code> (لا تشمل النهاية) و <code>linspace</code> (تشمل النهاية) و <code>np.random.default_rng(seed)</code>.</li>\n<li>يُعيد <code>reshape</code> ترتيب العناصر بالتسلسل نفسه، ويُبدّل <code>.T</code> دلالة المحاور. وتضيف <code>np.stack</code> محوراً جديداً، بينما تدمج <code>concatenate</code> على محور موجود.</li>\n<li>الأقنعة المنطقية: <code>(a &gt;= 6) &amp; (a &lt;= 9)</code>؛ والأقواس ضرورية، والعامل <code>and</code> لا يعمل مع المصفوفات.</li>\n<li>يُعيد التقطيع <b>عرضاً</b> (View) يُغيّر تعديلُه المصدرَ، بينما تُنشئ الفهرسة المتقدمة والأقنعة نسخاً؛ لذا تُستخدم <code>.copy()</code> عند الحاجة.</li>\n<li><b>المحور المُمرَّر يُختزل</b>: <code>sum(axis=0)</code> يُعطي مجموعاً لكل نوع، و <code>sum(axis=1)</code> مجموعاً لكل مكتب. وتُعيد argmax الموضع الأول عند التساوي.</li>\n<li>يُحاذي البث (Broadcasting) الأشكال من اليمين، ويُحوَّل متجه المكاتب إلى عمود بالصيغة <code>hours[:, None]</code>. وفي الجداول المربعة لا يُطلق البث الخاطئ أي خطأ.</li>\n<li>تمثّل nan قيمة مجهولة، وتُستخدم معها <code>np.nanmean</code> و <code>np.nanmedian</code>؛ وعندما تكون الساعات صفراً يكون المعدل nan باستخدام <code>np.divide(..., where=)</code>.</li></ul>\n<pre>shares = requests / requests.sum(axis=1, keepdims=True)\nrate = np.divide(c, h, out=np.full(c.shape, np.nan), where=h &gt; 0)</pre>"},{"id":"s22","unit":"u5","en":"Vectors, Matrices & Linear Systems","ar":"المتجهات والمصفوفات والأنظمة الخطية","en_body":"<h3>Key points</h3><ul>\n<li>A row is a vector: position = meaning; keep one feature order.</li>\n<li>Norms: L1 = sum of absolute values (= total for counts), L2 = length √Σx², max = largest feature. [3, 4] → 7, 5, 4.</li>\n<li>Dot product = weighted total: <code>north @ w</code> = 217 minutes; <code>requests @ w</code> = one total per desk.</li>\n<li>Distance = norm of the difference (Euclidean, Manhattan); <b>cosine similarity</b> compares direction only: a vs 2a → 1; zero vector → undefined (nan).</li>\n<li>Standardize before distances: <code>(X − X.mean(axis=0)) / X.std(axis=0)</code>; constant column → z = 0. Scaling statistics come from training data only.</li>\n<li>Dot product 0 = orthogonal (90°); clip cosine before arccos.</li>\n<li>Matrix product rule: <b>(n, k) @ (k, m) → (n, m)</b>; <code>*</code> is elementwise; order matters (A@B ≠ B@A); (A@B).T = B.T @ A.T.</li>\n<li>One-hot matrix @ table aggregates groups; Gram matrix X @ X.T holds all pair dot products.</li>\n<li><code>np.linalg.solve(A, b)</code>, then verify the residual ≈ 0 and interpret; rank &lt; n → no unique answer; <code>lstsq</code> for more equations than unknowns (regression).</li></ul>\n<pre>cos = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))\nx = np.linalg.solve([[2, 1], [1, 2]], [24, 21])   # [9, 6]</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li>يمثّل كل صف متجهاً يدل فيه الموضع على المعنى؛ لذا يُلتزم بترتيب واحد للخصائص.</li>\n<li>المعايير (Norms): L1 مجموع القيم المطلقة (ويساوي المجموع للأعداد غير السالبة)، و L2 الطول الإقليدي √Σx²، و max أكبر قيمة مطلقة. وللمتجه [3, 4]: القيم 7 و 5 و 4.</li>\n<li>الضرب النقطي مجموع موزون: <code>north @ w</code> = ‏217 دقيقة، و <code>requests @ w</code> يُعطي مجموعاً لكل مكتب.</li>\n<li>المسافة هي معيار الفرق بين متجهين (إقليدية أو مانهاتن)، أما <b>تشابه جيب التمام</b> فيقارن الاتجاه فقط: فالمتجه a والمتجه 2a تشابههما 1، والمتجه الصفري تشابهه غير مُعرَّف (nan).</li>\n<li>يُوحَّد مقياس الأعمدة قبل حساب المسافات: <code>(X − X.mean(axis=0)) / X.std(axis=0)</code>، وتُجعل درجات العمود الثابت z = 0. وتُحسب إحصاءات التحجيم من بيانات التدريب فقط.</li>\n<li>الضرب النقطي الصفري يعني التعامد (90°)، ويُقصّ جيب التمام إلى المدى [−1, 1] قبل arccos.</li>\n<li>قاعدة ضرب المصفوفات: <b>(n, k) @ (k, m) ← (n, m)</b>؛ والعامل <code>*</code> يضرب عنصراً بعنصر؛ والضرب غير تبديلي (A@B ≠ B@A)؛ و (A@B).T = B.T @ A.T.</li>\n<li>ضرب مصفوفة الترميز الأحادي (One-Hot) في الجدول يُجمّع المجموعات، وتحتوي مصفوفة غرام X @ X.T على الضرب النقطي لكل زوج من الصفوف.</li>\n<li>يُحل النظام بـ <code>np.linalg.solve(A, b)</code>، ثم يُتحقق من أن الباقي ≈ 0 ويُفسَّر الحل. وإذا كانت الرتبة أقل من n فلا حل وحيد، وتُستخدم <code>lstsq</code> عندما تزيد المعادلات على المجاهيل (الانحدار).</li></ul>\n<pre>cos = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))\nx = np.linalg.solve([[2, 1], [1, 2]], [24, 21])   # [9, 6]</pre>"},{"id":"s23","unit":"u5","en":"Pandas: Loading & Inspecting Data","ar":"Pandas: تحميل البيانات وفحصها","en_body":"<h3>Key points</h3><ul>\n<li><b>Series</b> = one labelled column; <b>DataFrame</b> = several Series sharing an index. <code>s[\"East\"]</code> by label, <code>s.iloc[0]</code> by position.</li>\n<li>read_csv guesses and can damage data (007 → 7, 'unknown' turns numbers into text). Use a contract: <code>dtype=</code>, <code>na_values=</code>, <code>parse_dates=</code>.</li>\n<li>Rule of the day: describe and report problems; don't fix them yet.</li>\n<li>First look: shape, head/tail (not representative), <code>sample(random_state=)</code>, info, dtypes; profile with describe and <code>value_counts(dropna=False)</code>.</li>\n<li>Report missing values with a denominator: \"3 of 12 (25%)\". <code>duplicated(keep=False)</code> shows every copy.</li>\n<li>Select with <code>loc</code> (labels/masks) and <code>iloc</code> (positions); avoid chained assignment <code>df[m]['x'] = …</code>.</li>\n<li>Find bad tokens: present before but NaN after <code>pd.to_numeric(errors=\"coerce\")</code>.</li>\n<li>SQLite: open read-only, name columns, close with <code>closing()</code>; pass values as <b>parameters</b> (f-strings allow SQL injection).</li>\n<li>Honest numbers: count() is the denominator, not len(); <code>fillna(0)</code> before a mean is biased; size vs count = missing per group.</li>\n<li>Samples: random, stratified <code>groupby().sample()</code>; <code>head(30)</code> is a convenience sample.</li></ul>\n<pre>df = pd.read_csv(p, dtype={\"desk_code\": str}, na_values=[\"unknown\", \"n/a\"], parse_dates=[\"opened_at\"])\npd.read_sql_query(\"SELECT ... WHERE desk = ?\", con, params=(desk,))</pre>","ar_body":"<h3>النقاط الرئيسة</h3><ul>\n<li><b>Series</b> عمود واحد ذو تسميات، و<b>DataFrame</b> مجموعة من Series تشترك في فهرس واحد. ويُختار العنصر بالتسمية <code>s[\"East\"]</code> أو بالموضع <code>s.iloc[0]</code>.</li>\n<li>تستنتج read_csv الأنواع، وقد يُفسد ذلك البيانات (فيصبح 007 هو 7، وتحوّل القيمة 'unknown' العمود العددي إلى نصي)؛ لذا يُستخدم عقد بيانات صريح: <code>dtype=</code> و <code>na_values=</code> و <code>parse_dates=</code>.</li>\n<li>المبدأ في مرحلة الفحص: وصف المشكلات والإبلاغ عنها دون إصلاحها بعد.</li>\n<li>الفحص الأولي: shape و head/tail (ولا تمثّلان البيانات كلها) و <code>sample(random_state=)</code> و info و dtypes؛ ثم التحليل بـ describe و <code>value_counts(dropna=False)</code>.</li>\n<li>يُبلَّغ عن القيم المفقودة مع المقام، مثل: \"3 من 12 (25%)\". وتعرض <code>duplicated(keep=False)</code> جميع النسخ المكررة.</li>\n<li>يُختار بـ <code>loc</code> (بالتسميات والأقنعة) و <code>iloc</code> (بالمواضع)، ويُتجنّب الإسناد المتسلسل <code>df[m]['x'] = …</code>.</li>\n<li>الرموز المُفسِدة هي القيم الموجودة قبل التحويل والتي أصبحت NaN بعد <code>pd.to_numeric(errors=\"coerce\")</code>.</li>\n<li>SQLite: تُفتح قاعدة البيانات للقراءة فقط، وتُسمّى الأعمدة صراحةً، ويُغلق الاتصال بـ <code>closing()</code>، وتُمرَّر القيم بوصفها <b>معاملات</b>؛ لأن f-strings تتيح حقن SQL.</li>\n<li>الأرقام الأمينة: المقام هو count() لا len()، وتعويض القيم بـ <code>fillna(0)</code> قبل حساب المتوسط يُنتج تحيّزاً، والفرق بين size و count يساوي عدد القيم المفقودة في كل مجموعة.</li>\n<li>المعاينة: عشوائية، أو طبقية بـ <code>groupby().sample()</code>؛ أما <code>head(30)</code> فعينة ملائمة (Convenience Sample) لا تمثّل البيانات.</li></ul>\n<pre>df = pd.read_csv(p, dtype={\"desk_code\": str}, na_values=[\"unknown\", \"n/a\"], parse_dates=[\"opened_at\"])\npd.read_sql_query(\"SELECT ... WHERE desk = ?\", con, params=(desk,))</pre>"},{"id":"s24","unit":"u5","en":"Cleaning, Merging & Pipelines","ar":"التنظيف والدمج وخطوط المعالجة","en_body":"<h3>Key points</h3><ul>\n<li>Rule: every change is a named rule, every removed row has a reason, every count reconciles: <b>exact duplicates + accepted + rejected = raw rows</b>.</li>\n<li>Raw stays raw: load as text (<code>dtype=str, keep_default_na=False</code>), add <code>source_row</code>, work on a copy.</li>\n<li>Normalize: strip, lower/title, explicit mappings; unknown values are <b>flagged</b>, never guessed.</li>\n<li>Convert with named rules (\"30 min\" → 30); dates with an explicit <code>format=</code>; impossible dates → NaT and listed.</li>\n<li>IDs: strip, <code>zfill(3)</code> for digit-only codes, then validate against the lookup; never convert IDs to numbers.</li>\n<li>Exact duplicate → keep the first; conflicting duplicate (same ID, different content) → reject all copies.</li>\n<li>Missing: keep (default), exclude with a count, or impute with a flag column (<code>groupby().transform(\"median\")</code>).</li>\n<li>Implausible values (range rule) are flagged/rejected with reasons; IQR outliers are only \"worth a look\".</li>\n<li>Joins: check cardinality; <code>merge(..., how=\"left\", validate=\"many_to_one\", indicator=True)</code>; normalize keys in both tables.</li>\n<li>Reshape: <code>pivot_table</code> (aggregates repeats), <code>melt</code>; agg = row per group, transform = value per row.</li>\n<li>Pipe
