<tr><td>orphan_record</td><td>51</td></tr><tr><td>bad_date</td><td>9</td></tr>
<tr><td>action_before_report</td><td>9</td></tr><tr><td>implausible_minutes</td><td>11</td></tr>
<tr><td>السجلات المقبولة</td><td>1080</td></tr></table>
<p>orphan_record: لا بلاغ مقبول له (كثير منها يشير لبلاغات مرفوضة). الربط بـ <code>merge(..., validate="many_to_one", indicator=True)</code>. ترتيب الأحداث: إجراء قبل بلاغه مستحيل — يُفحص بعد الربط. التمرين EX08: جدول بحث معدّل يدوياً يذكر North مرتين؛ فيضيف الربط صفوفاً بصمت ما لم ترفع validate خطأ.</p>
<h3>10. غلّف السياسة: clean_sources()</h3>
<p>دالة واحدة: الجدولان والسياسة كاملة وخمسة مخرجات. الملخص: البلاغات 432 / التكرارات 8، والمقبول / المرفوض 403 / 21؛ والسجلات 1159، والمقبول / المرفوض 1080 / 79؛ ومتطابقة True. يُعاد استخدامها في الدفتر 06 ولوحة اليوم 4 ومشاريع اليوم 5.</p>
<h3>الدفتر 06 — المؤشر تعريف قبل أن يكون رقماً</h3>
<table><tr><th>الحقل</th><th>الالتزام بهدف الإجراء الأول</th></tr>
<tr><td>البسط</td><td>البلاغات التي جاء إجراؤها الأول خلال ساعات هدف أولويتها</td></tr>
<tr><td>المقام</td><td>البلاغات المقبولة التي لها إجراء مقبول واحد على الأقل</td></tr>
<tr><td>الوحدة</td><td>نسبة (0–1) تُعرض كنسبة مئوية</td></tr>
<tr><td>الصفوف المشمولة</td><td>البلاغات المقبولة؛ والبلاغات بلا إجراء تُعدّ منفصلة</td></tr>
<tr><td>التحفظ</td><td>ساعات الهدف قيم تدريبية</td></tr></table>
<p>EX01 يكتب تعريفي <code>volume</code> و <code>closure_7d</code> قبل حسابهما.</p>
<h3>الحجم والوقت حتى الإجراء الأول</h3>
<p>الحجم: خلايا المكتب × الشهر مجموعها 403 بلاغاً مقبولاً. الإجراء الأول = أقدم سجل مقبول لكل بلاغ؛ و 4 بلاغات في المثال بلا إجراء بعد — مفقودة لا صفر. الأوقات الملتوية: الوسيط مع IQR و n.</p>
<h3>الالتزام بالهدف: المقام هو البلاغات</h3>
<table><tr><th>الأولوية</th><th>ساعات الهدف</th><th>n المحكوم</th><th>ضمن الهدف</th><th>الالتزام</th></tr>
<tr><td>high</td><td>2</td><td>79</td><td>51</td><td>0.646</td></tr>
<tr><td>low</td><td>24</td><td>109</td><td>78</td><td>0.716</td></tr>
<tr><td>normal</td><td>8</td><td>211</td><td>138</td><td>0.654</td></tr></table>
<p>اربط الأهداف many_to_one على الأولوية؛ واحكم فقط على البلاغات التي لها إجراء أول وأبلغ عن الأخرى منفصلة. التمرين EX05: زميل قسم على سجلات الخدمة وحكم على كل إجراء — أصلح الاثنين (البلاغات، والإجراء الأول فقط).</p>
<h3>الحجب Censoring: بلاغات أحدث من أن يُحكم عليها</h3>
<p>الإغلاق خلال 7 أيام يُحكم عليه فقط للبلاغات المستلمة قبل نهاية التصدير بـ 7 أيام على الأقل. مارس في المثال: 0.62 بالحساب الساذج مقابل <b>0.76 بين البلاغات المؤهلة</b> — احتساب البلاغات المحجوبة كـ "غير مغلقة" يجعل مارس يبدو منخفضاً (EX06).</p>
<h3>العينات الصغيرة وفحص المسارين</h3>
<p>قاعدة n الصغيرة: 18 مجموعة مكتب × أولوية، منها 8 بـ n &lt; 20، وأصغرها n = 6 — <b>علّم المجموعات الصغيرة ولا تحذفها أبداً</b>. فحص المسارين للإغلاق: المسار A ‏status = closed ← 372 بلاغاً؛ والمسار B ملاحظة إغلاق في السجلات ← 360؛ و 12 يختلفان. عندما يختلف المساران اشرح الفرق — هنا ملاحظات إغلاق رُفضت في الدفتر 05 (EX07 و EX08).</p>
<h3>مقارنات عادلة وجدول مؤشرات مرتب واحد</h3>
<table><tr><th>المكتب</th><th>n</th><th>المتوسط ساعات</th><th>الوسيط ساعات</th><th>IQR ساعات</th></tr>
<tr><td>Harbor</td><td>40</td><td>6.93</td><td>3.03</td><td>6.09</td></tr>
<tr><td>West</td><td>47</td><td>11.72</td><td>6.02</td><td>14.2</td></tr></table>
<p>المتوسطات تضخم الفرق في الأوقات الملتوية؛ اذكر الوسيط و n والتشتت، واذكر مزيج الأولويات (التمرين EX09: "North أبطأ بمرتين تقريباً" يُعاد بناؤه بعدل). EX10 ‏<code>build_indicator_table()</code>: جدول مرتب بالأعمدة indicator و desk و num و den و value و small_n — يُستخدم في اليوم 4. مراجعة الصف: مؤشر لن تعرضه بلا تحذير، ولماذا.</p>`},

en_body:`
<p><b>Day 4 · topic 08.04 · Notebook 07 (a Streamlit dashboard on the indicator table) + Notebook 08 (presenting, defending and stating the limits).</b> One idea for today: <b>a dashboard is finished when you can say where every number comes from and what it cannot tell us.</b> Run locally: <code>streamlit run day04_apps/dashboard.py</code>.</p>
<h3>1. Three layers: tested functions, a thin page</h3>
<p><b>Data layer</b> <code>indicators.py</code>: raw files → clean_sources → measures → indicator table (Day 3). <b>View layer</b> <code>views.py</code>: kpi_summary, filter_indicators, chart_frame, format_value, empty_message, to_csv_bytes (tested today). <b>Page</b> <code>dashboard.py</code>: widgets + metrics + chart + table + download + expander (AppTest). A number computed in the app file can only be checked by clicking; a number computed by a function can be checked in one line. The export cell copies your six functions into views.py — rerun it after every change.</p>
<h3>2. Headline numbers: add numerators, add denominators</h3>
<table><tr><th>Within target, Harbor + North</th><th>Value</th></tr>
<tr><td>average of the two desk rates (wrong)</td><td>0.664</td></tr>
<tr><td>sum of numerators / sum of denominators</td><td>0.627</td></tr>
<tr><td>judged reports Harbor / North</td><td>40 / 102</td></tr></table>
<p>Averaging rates makes a small desk weigh as much as a large one; it is right only when all groups have the same denominator (EX01 <code>kpi_summary()</code>, EX03 the colleague's averaged headline).</p>
<h3>3. Chart data that carries its sample size</h3>
<p>Label "Harbor (n=40)" puts n where the eye is; keep the <code>small_n</code> flag so the page can warn; sort highest value first (EX04 <code>chart_frame(ind, indicator)</code>).</p>
<h3>4. Formats, the empty state and the download</h3>
<table><tr><th>Indicator</th><th>Value</th><th>Shown as</th></tr>
<tr><td>sla_compliance</td><td>0.655</td><td>65.5%</td></tr>
<tr><td>median_first_action_h</td><td>5.22</td><td>5.2 h</td></tr>
<tr><td>volume</td><td>1543</td><td>1,543</td></tr></table>
<p>Debug EX05: the colleague's formatter wrote "0.655%" — one rule per kind of indicator. Empty state: say why it's empty and what to do ("Choose at least one desk in the sidebar."), then <code>st.stop()</code>. Download: sorted, no index, UTF-8 bytes — the same file for the same selection (EX06, EX07).</p>
<h3>5. The page pattern, tested without a browser</h3>
<pre>@st.cache_data
def load(edition): return indicators.load_all(DATA_URL, edition)
st.title(...); st.caption("Synthetic training data | ...")
desks = st.sidebar.multiselect("Desks", all_desks, default=all_desks)
sel = views.filter_indicators(ind, desks=desks)
if views.empty_message(sel, desks): st.info(...); st.stop()
st.metric("Reports", ...)</pre>
<p>AppTest on the demo page: default → Reports 403, within target 66.9%; Harbor only → Reports 40, 75.0%; no desk → info message, no metrics.</p>
<h3>6–7. Smoke test, then the full dashboard</h3>
<p>Parts of dashboard.py: (1) sidebar selectbox for the indicator (sla_compliance by default); (2) subheader + bar chart of chart_frame(); (3) st.warning listing small-n desks; (4) table of the chosen indicator; (5) CSV download button; (6) expander "data source and limits". EX09 <code>check_dashboard()</code> runs the page and returns exception, title, metrics, info messages and caption — rerun it before every demo. EX10: the full dashboard, tested with AppTest in three situations.</p>
<h3>Notebook 08 — The data-source card</h3>
<table><tr><th>Field</th><th>Demo</th></tr>
<tr><td>Files</td><td>reports_demo.csv, service_records_demo.csv, desks.csv, sla_targets.csv</td></tr>
<tr><td>Reports</td><td>432 raw → 8 exact duplicates, 403 accepted, 21 rejected</td></tr>
<tr><td>Service records</td><td>1159 raw → 1080 accepted, 79 rejected</td></tr>
<tr><td>Period / export end</td><td>2025-01-02 to 2025-03-31 / 2025-03-31</td></tr>
<tr><td>Nature</td><td>synthetic training data</td></tr></table>
<p>Built from the cleaning summary, so it always matches the data (EX01 <code>source_card(summary, edition)</code>).</p>
<h3>Limits are facts, not phrases</h3>
<p>Small groups: 8 of 18 desk-priority groups have n &lt; 20 — not ranked. Censoring: 35 reports from the last 7 days not judged for 7-day closure. No first action: 4 reports outside the compliance denominator. Rejected records: 6.8% of service records rejected in cleaning. Weak: "the data may have limitations"; strong: what is limited, how much, and what the reader should not do.</p>
<h3>Check claims; compare with caution</h3>
<table><tr><th>Verdict</th><th>Meaning</th></tr>
<tr><td>supported</td><td>the table shows it, with enough reports</td></tr>
<tr><td>not supported</td><td>the table shows something else</td></tr>
<tr><td>misleading</td><td>right number, wrong conclusion (censoring, small n, mix)</td></tr></table>
<p><code>compare_desks()</code> answers "insufficient data" when either denominator &lt; 20, "no clear difference" when the gap is &lt; 0.05 (shares), 1 h or 10 reports, otherwise "&lt;desk&gt; higher". Example: "Harbor responds fastest" is supported (lowest median first action, 3.03 h) — EX04 checks four claims from a draft, EX05 writes compare_desks().</p>
<h3>Sensitivity: does the ranking survive the assumption?</h3>
<table><tr><th>Desk</th><th>targets ×1.0</th><th>rank</th><th>targets ×1.5</th><th>rank</th></tr>
<tr><td>Harbor</td><td>0.750</td><td>1</td><td>0.875</td><td>2</td></tr>
<tr><td>South</td><td>0.741</td><td>2</td><td>0.870</td><td>4</td></tr>
<tr><td>Central</td><td>0.727</td><td>3</td><td>0.883</td><td>1</td></tr>
<tr><td>East</td><td>0.684</td><td>4</td><td>0.873</td><td>3</td></tr>
<tr><td>West</td><td>0.596</td><td>5</td><td>0.809</td><td>5</td></tr>
<tr><td>North</td><td>0.578</td><td>6</td><td>0.755</td><td>6</td></tr></table>
<p>Target hours are training values: change them and recompute. If the order of desks changes, <b>do not present the ranking as a finding</b> (EX06: the most sensitive desk).</p>
<h3>Numbers and charts that don't exaggerate</h3>
<p>Say it with counts: "65.5% (74/113)" (<code>rate_with_n()</code>). Shares on a 0 to 1 axis: a truncated axis doubles a small gap (EX07, EX08).</p>
<h3>The five-minute demo and the oral defence</h3>
<table><tr><th>Step</th><th>Minutes</th></tr>
<tr><td>Open the dashboard and state the question</td><td>0.5</td></tr>
<tr><td>Data sources and cleaning</td><td>1.0</td></tr>
<tr><td>Main finding with its denominator</td><td>1.5</td></tr>
<tr><td>Limits, and one comparison you will not make</td><td>1.0</td></tr>
<tr><td>Questions</td><td>1.0</td></tr></table>
<p>Typical defence questions: How many reports are behind the smallest bar? Why does March look different? Would the ranking survive other target hours? Where do the data come from; how many rows were removed? Why is the overall rate not the average of desk rates? What does this dashboard not tell us? Practise the demo with a partner who asks two questions.</p>`,

<p><b>اليوم 4 · الموضوع 08.04 · الدفتر 07 (لوحة Streamlit على جدول المؤشرات) + الدفتر 08 (العرض والدفاع وذكر القيود).</b> فكرة اليوم: <b>اللوحة تكتمل عندما تستطيع قول من أين يأتي كل رقم وما الذي لا يستطيع إخبارنا به.</b> التشغيل المحلي: <code>streamlit run day04_apps/dashboard.py</code>.</p>
<h3>1. ثلاث طبقات: دوال مختبرة وصفحة رفيعة</h3>
<p><b>طبقة البيانات</b> <code>indicators.py</code>: الملفات الخام ← clean_sources ← المقاييس ← جدول المؤشرات (اليوم 3). <b>طبقة العرض</b> <code>views.py</code>: ‏kpi_summary و filter_indicators و chart_frame و format_value و empty_message و to_csv_bytes (تُختبر اليوم). <b>الصفحة</b> <code>dashboard.py</code>: أدوات + مؤشرات + رسم + جدول + تنزيل + expander (‏AppTest). الرقم المحسوب في ملف التطبيق لا يُفحص إلا بالضغط؛ والرقم المحسوب بدالة يُفحص في سطر واحد. خلية التصدير تنسخ دوالك الست إلى views.py — أعد تشغيلها بعد كل تغيير.</p>
<h3>2. الأرقام الرئيسية: اجمع البسوط واجمع المقامات</h3>
<table><tr><th>ضمن الهدف، Harbor + North</th><th>القيمة</th></tr>
<tr><td>متوسط معدلي المكتبين (خطأ)</td><td>0.664</td></tr>
<tr><td>مجموع البسوط ÷ مجموع المقامات</td><td>0.627</td></tr>
<tr><td>البلاغات المحكومة Harbor / North</td><td>40 / 102</td></tr></table>
<p>متوسط المعدلات يجعل المكتب الصغير يزن مثل الكبير؛ وهو صحيح فقط عندما تتساوى مقامات كل المجموعات (EX01 ‏<code>kpi_summary()</code>، و EX03 العنوان المتوسط للزميل).</p>
<h3>3. بيانات الرسم تحمل حجم العينة</h3>
<p>الاسم "Harbor (n=40)" يضع n حيث تنظر العين؛ أبقِ علامة <code>small_n</code> لتحذّر الصفحة؛ ورتّب الأعلى أولاً (EX04 ‏<code>chart_frame(ind, indicator)</code>).</p>
<h3>4. التنسيقات والحالة الفارغة والتنزيل</h3>
<table><tr><th>المؤشر</th><th>القيمة</th><th>يُعرض كـ</th></tr>
<tr><td>sla_compliance</td><td>0.655</td><td>65.5%</td></tr>
<tr><td>median_first_action_h</td><td>5.22</td><td>5.2 h</td></tr>
<tr><td>volume</td><td>1543</td><td>1,543</td></tr></table>
<p>التمرين EX05: منسّق الزميل كتب "0.655%" — قاعدة واحدة لكل نوع مؤشر. الحالة الفارغة: قل لماذا هي فارغة وماذا تفعل ("Choose at least one desk in the sidebar.")، ثم <code>st.stop()</code>. التنزيل: مرتب، بلا فهرس، بايتات UTF-8 — نفس الملف لنفس الاختيار (EX06 و EX07).</p>
<h3>5. نمط الصفحة، مختبر بلا متصفح</h3>
<pre>@st.cache_data
def load(edition): return indicators.load_all(DATA_URL, edition)
st.title(...); st.caption("Synthetic training data | ...")
desks = st.sidebar.multiselect("Desks", all_desks, default=all_desks)
sel = views.filter_indicators(ind, desks=desks)
if views.empty_message(sel, desks): st.info(...); st.stop()
st.metric("Reports", ...)</pre>
<p>AppTest على صفحة المثال: الافتراضي ← Reports ‏403 وضمن الهدف 66.9%؛ Harbor فقط ← Reports ‏40 و 75.0%؛ بلا مكتب ← رسالة معلومات وبلا مؤشرات.</p>
<h3>6–7. اختبار الدخان ثم اللوحة الكاملة</h3>
<p>أجزاء dashboard.py: (1) selectbox جانبي للمؤشر (sla_compliance افتراضياً)؛ (2) عنوان فرعي + رسم أعمدة من chart_frame()؛ (3) st.warning يسرد المكاتب الصغيرة n؛ (4) جدول المؤشر المختار؛ (5) زر تنزيل CSV؛ (6) expander "مصدر البيانات والقيود". EX09 ‏<code>check_dashboard()</code> تشغّل الصفحة وترجع الاستثناء والعنوان والمؤشرات ورسائل المعلومات والتعليق — أعد تشغيلها قبل كل عرض. EX10: اللوحة الكاملة مختبرة بـ AppTest في ثلاث حالات.</p>
<h3>الدفتر 08 — بطاقة مصدر البيانات</h3>
<table><tr><th>الحقل</th><th>المثال</th></tr>
<tr><td>الملفات</td><td>reports_demo.csv و service_records_demo.csv و desks.csv و sla_targets.csv</td></tr>
<tr><td>البلاغات</td><td>432 خاماً ← 8 تكرارات تامة و 403 مقبولة و 21 مرفوضة</td></tr>
<tr><td>سجلات الخدمة</td><td>1159 خاماً ← 1080 مقبولة و 79 مرفوضة</td></tr>
<tr><td>الفترة / نهاية التصدير</td><td>2025-01-02 إلى 2025-03-31 / 2025-03-31</td></tr>
<tr><td>الطبيعة</td><td>بيانات تدريب مصطنعة</td></tr></table>
<p>تُبنى من ملخص التنظيف فتطابق البيانات دائماً (EX01 ‏<code>source_card(summary, edition)</code>).</p>
<h3>القيود حقائق لا عبارات</h3>
<p>المجموعات الصغيرة: 8 من 18 مجموعة مكتب-أولوية لها n &lt; 20 — لا تُرتب. الحجب: 35 بلاغاً من آخر 7 أيام لا يُحكم عليها للإغلاق خلال 7 أيام. بلا إجراء أول: 4 بلاغات خارج مقام الالتزام. السجلات المرفوضة: 6.8% من سجلات الخدمة رُفضت في التنظيف. ضعيف: "قد يكون للبيانات قيود"؛ قوي: ما المحدود، وبكم، وما الذي يجب ألا يفعله القارئ.</p>
<h3>افحص الادعاءات وقارن بحذر</h3>
<table><tr><th>الحكم</th><th>المعنى</th></tr>
<tr><td>مدعوم</td><td>الجدول يُظهره مع بلاغات كافية</td></tr>
<tr><td>غير مدعوم</td><td>الجدول يُظهر شيئاً آخر</td></tr>
<tr><td>مضلل</td><td>رقم صحيح واستنتاج خاطئ (حجب، n صغيرة، مزيج)</td></tr></table>
<p><code>compare_desks()</code> تجيب "insufficient data" عندما يكون أي مقام &lt; 20، و "no clear difference" عندما يكون الفرق &lt; 0.05 (للنسب) أو ساعة أو 10 بلاغات، وإلا "&lt;desk&gt; higher". مثال: "Harbor الأسرع استجابة" مدعوم (أقل وسيط للإجراء الأول 3.03 ساعة) — EX04 يفحص أربعة ادعاءات من مسودة، و EX05 يكتب compare_desks().</p>
<h3>الحساسية: هل يصمد الترتيب أمام الافتراض؟</h3>
<table><tr><th>المكتب</th><th>الأهداف ×1.0</th><th>الرتبة</th><th>الأهداف ×1.5</th><th>الرتبة</th></tr>
<tr><td>Harbor</td><td>0.750</td><td>1</td><td>0.875</td><td>2</td></tr>
<tr><td>South</td><td>0.741</td><td>2</td><td>0.870</td><td>4</td></tr>
<tr><td>Central</td><td>0.727</td><td>3</td><td>0.883</td><td>1</td></tr>
<tr><td>East</td><td>0.684</td><td>4</td><td>0.873</td><td>3</td></tr>
<tr><td>West</td><td>0.596</td><td>5</td><td>0.809</td><td>5</td></tr>
<tr><td>North</td><td>0.578</td><td>6</td><td>0.755</td><td>6</td></tr></table>
<p>ساعات الهدف قيم تدريبية: غيّرها وأعد الحساب. إذا تغيّر ترتيب المكاتب <b>فلا تعرض الترتيب كنتيجة</b> (EX06: أكثر مكتب حساسية).</p>
<h3>أرقام ورسوم لا تبالغ</h3>
<p>قلها بالأعداد: "65.5% (74/113)" (<code>rate_with_n()</code>). النسب على محور من 0 إلى 1: المحور المقطوع يضاعف الفرق الصغير (EX07 و EX08).</p>
<h3>العرض في خمس دقائق والدفاع الشفهي</h3>
<table><tr><th>الخطوة</th><th>الدقائق</th></tr>
<tr><td>افتح اللوحة واذكر السؤال</td><td>0.5</td></tr>
<tr><td>مصادر البيانات والتنظيف</td><td>1.0</td></tr>
<tr><td>النتيجة الرئيسية بمقامها</td><td>1.5</td></tr>
<tr><td>القيود ومقارنة واحدة لن تقوم بها</td><td>1.0</td></tr>
<tr><td>الأسئلة</td><td>1.0</td></tr></table>
<p>أسئلة الدفاع المعتادة: كم بلاغاً خلف أصغر عمود؟ لماذا يبدو مارس مختلفاً؟ هل يصمد الترتيب مع ساعات هدف أخرى؟ من أين البيانات وكم صفاً حُذف؟ لماذا المعدل الكلي ليس متوسط معدلات المكاتب؟ ما الذي لا تخبرنا به هذه اللوحة؟ تدرّب على العرض مع زميل يسألك سؤالين.</p>`},

<p><b>Day 5 · topics 08.01–08.04 · Notebook 09 (individual) + Notebook 10 (team) · instructor-scored rubrics.</b> Timetable: 0:00–0:15 briefing; 0:15–2:00 individual milestones M1–M10; break; 2:15–2:30 teams agree contracts and roles A–D; 2:30–3:55 parallel role work then integration with run_pipeline; 3:55–4:35 five-minute demos and oral defence (every member speaks); 4:35–4:45 submission checklist. One rule for both projects: <b>every number comes from code, with its denominator; no staffing advice, no judgement about people.</b></p>
<table><tr><th>Topic</th><th>Individual</th><th>Team</th></tr>
<tr><td>08.01 ML concepts</td><td>M5 framing sheet</td><td>EX08 ML-readiness framing</td></tr>
<tr><td>08.02 Splitting and leakage</td><td>M6 leakage audit, M7 time-split baseline</td><td>EX08 forbidden features and baseline</td></tr>
<tr><td>08.03 Police data analysis</td><td>M1–M4 clean, indicators, validation</td><td>EX01–EX04, two source systems</td></tr>
<tr><td>08.04 Dashboard and defence</td><td>M8 charts, M9 export, M10 report</td><td>EX05–EX07, EX09–EX10, demo</td></tr></table>
<h3>Individual project — A validated indicator report with an ML-readiness check</h3>
<p>Data: a new quarterly export (reports_project.csv, service_records_project.csv) with the Day 3 defects. Question 1: a validated indicator report for the operations office. Question 2: could "will a report be closed within 7 days?" become an ML problem, and what is the honest baseline?</p>
<table><tr><th>Milestone</th><th>Acceptance criteria</th></tr>
<tr><td>M1 Inspect</td><td>six int counts; n_rows = raw rows</td></tr>
<tr><td>M2 Clean</td><td>both tables reconciled; unique ids; valid codes; reasons; event order</td></tr>
<tr><td>M3 Indicators</td><td>24 rows; volume sums to accepted reports</td></tr>
<tr><td>M4 Validate</td><td>two-path mismatches explained, or a next step</td></tr>
<tr><td>M5 Frame the ML question</td><td>supervised; decision at receipt; censoring</td></tr>
<tr><td>M6 Leakage audit</td><td>every after-receipt column is a leak</td></tr>
<tr><td>M7 Time-split baseline</td><td>no overlap; accuracy inside its interval; recall of late cases</td></tr>
<tr><td>M8 Two honest charts</td><td>0–1 scale; n in labels; titles and labels</td></tr>
<tr><td>M9 Export</td><td>four files; identical rerun</td></tr>
<tr><td>M10 Report</td><td>150–250 words; denominators; two limits; one recommendation</td></tr></table>
<p><b>ML-readiness check:</b> Frame (unit, decision time, label, task, which rows have a label — Day 1) → Audit (which candidate columns are known at receipt, which leak — Day 2) → Split (train before 2025-03-01, test after, no overlap) → Baseline (DummyClassifier accuracy with SE and 95% interval) → Meaning (recall of late closures: what a model must catch). No real model today: the baseline is the honest yardstick a Week 09 model must beat. Deliverables: <code>day05_individual_output/</code> (indicators.csv, rejected_reports.csv, rejected_records.csv, manifest.json, two PNG charts) and the 150–250 word report. Rubric (100): M1–M2 20; M3–M4 20; M5–M7 20; M8–M9 15; report numbers with denominators 10; two limits and one data-quality recommendation 10; code quality, no hard-coded results, Restart and Run All 5.</p>
<h3>Team project — A police indicator dashboard from two source systems</h3>
<table><tr><th></th><th>legacy (before 15 Feb)</th><th>new (from 15 Feb)</th></tr>
<tr><td>dates</td><td>2025-02-03 09:15</td><td>03/03/2025 09:15 (day first)</td></tr>
<tr><td>desk codes</td><td>7, 007, ' 7'</td><td>D-007</td></tr>
<tr><td>marked by</td><td>source_system = legacy</td><td>source_system = new</td></tr></table>
<p>One validated dashboard for the whole quarter, regenerated by one function call, then a five-minute demo and oral defence. Debug EX02: reusing the Day 3 normalisation turns almost every new-system date into missing and every D- code into unknown — <b>parse by system</b>.</p>
<table><tr><th>Role</th><th>Owns</th><th>Exercises</th></tr>
<tr><td>A Intake</td><td>load_team_sources, normalise_team_reports</td><td>EX01 EX02</td></tr>
<tr><td>B Cleaning and indicators</td><td>clean_team, team_indicators (by-system table)</td><td>EX03 EX04</td></tr>
<tr><td>C Dashboard</td><td>save_dashboard_data, team_dashboard.py, smoke test</td><td>EX05 EX06</td></tr>
<tr><td>D Defence and ML readiness</td><td>defence_pack, ml_readiness</td><td>EX07 EX08</td></tr>
<tr><td>Everyone</td><td>run_pipeline, CONTRIBUTIONS, BRIEF, DEMO_PLAN</td><td>EX09 EX10</td></tr></table>
<p>Contracts: raw_reports → reports_norm → accepted_reports → indicators; <code>check_interface(df, name)</code> raises a clear ValueError before a broken table is handed on.</p>
<pre>def run_pipeline(data_url, out_dir, desks=None):
    src = load_team_sources(data_url)            # A
    if desk codes repeat: raise ValueError       # nothing written yet
    cl = clean_team(src)                         # B
    r, ind, by_system = team_indicators(cl, sla) # B
    ready = ml_readiness(r)                      # D
    save_dashboard_data(...)                     # C: 3 files
    write rejected_*.csv + manifest.json         # 6 files, identical on rerun</pre>
<p>Integration checks: identical rerun; a broken lookup raises ValueError and leaves no folder. The dashboard reads only the saved files — no recalculation in the page. Page: caption (source, counts, two systems); sidebar desk filter (all by default); empty state with st.info; three weighted metrics; bar chart with n in labels + small-n warning; by-system table; download button; expander "Data source and limits". Smoke test (role C): AppTest three times — default, Harbor only, no desk; no exception; metrics agree with ind; one info message when empty.</p>
<p><b>Demo (5 min):</b> open the dashboard and state the question (0.5, role C); data sources, two systems, cleaning (1.0, role A); indicators and main finding with denominators (1.5, role B); limits and ML readiness (1.0, role D); questions (1.0, everyone). Each member explains one function and one failure it handles (day-first dates, a D- code, a repeated desk code, an orphan record, a censored report). Rubric (100): role A 15, B 20, C 20, D 15; team validate-before-write, identical rerun, broken lookup leaves no files 15; demo and defence 15.</p>
<h3>Common pitfalls</h3>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>counts don't reconcile</td><td>rows removed without a reason</td><td>rule matrix; duplicates + accepted + rejected = raw</td></tr>
<tr><td>more rows after a join</td><td>repeated key in a lookup</td><td>validate="many_to_one"</td></tr>
<tr><td>new-system rows rejected</td><td>one date format for both systems</td><td>parse by source_system</td></tr>
<tr><td>March closure looks low</td><td>censored reports counted as not closed</td><td>eligible reports only</td></tr>
<tr><td>baseline looks strong</td><td>majority-class accuracy</td><td>recall of late cases + interval</td></tr>
<tr><td>rerun differs</td><td>unsorted rows or JSON keys</td><td>fixed order; sort_keys=True</td></tr></table>
<p>Submit — individual: notebook + day05_individual_output/ (six files); team: notebook + team_output/ (six files) + day05_team_apps/team_dashboard.py. Next: Week 09, machine learning foundations and supervised learning — real models, judged against today's baselines.</p>`,

<p><b>اليوم 5 · المواضيع 08.01–08.04 · الدفتر 09 (فردي) + الدفتر 10 (فريق) · معايير يقيّمها المدرب.</b> الجدول: 0:00–0:15 الإحاطة؛ 0:15–2:00 المراحل الفردية M1–M10؛ استراحة؛ 2:15–2:30 الفرق تتفق على العقود والأدوار A–D؛ 2:30–3:55 عمل الأدوار المتوازي ثم التكامل بـ run_pipeline؛ 3:55–4:35 عروض 5 دقائق ودفاع شفهي (يتكلم كل عضو)؛ 4:35–4:45 قائمة التسليم. قاعدة واحدة للمشروعين: <b>كل رقم من الكود مع مقامه؛ بلا نصائح توظيف ولا أحكام على الأشخاص.</b></p>
<table><tr><th>الموضوع</th><th>الفردي</th><th>الفريق</th></tr>
<tr><td>08.01 مفاهيم تعلم الآلة</td><td>M5 ورقة التأطير</td><td>EX08 تأطير الجاهزية لتعلم الآلة</td></tr>
<tr><td>08.02 التقسيم والتسرب</td><td>M6 تدقيق التسرب، M7 خط أساس بتقسيم زمني</td><td>EX08 الخصائص الممنوعة وخط الأساس</td></tr>
<tr><td>08.03 تحليل بيانات الشرطة</td><td>M1–M4 التنظيف والمؤشرات والتحقق</td><td>EX01–EX04، نظاما مصدر</td></tr>
<tr><td>08.04 اللوحة والدفاع</td><td>M8 الرسوم، M9 التصدير، M10 التقرير</td><td>EX05–EX07 و EX09–EX10 والعرض</td></tr></table>
<h3>المشروع الفردي — تقرير مؤشرات موثّق مع فحص الجاهزية لتعلم الآلة</h3>
<p>البيانات: تصدير ربع سنوي جديد (reports_project.csv و service_records_project.csv) بعيوب اليوم 3. السؤال 1: تقرير مؤشرات موثّق لمكتب العمليات. السؤال 2: هل يمكن أن يصبح "هل سيُغلق البلاغ خلال 7 أيام؟" مشكلة تعلم آلة، وما خط الأساس الصادق؟</p>
<table><tr><th>المرحلة</th><th>معايير القبول</th></tr>
<tr><td>M1 الفحص</td><td>ستة أعداد صحيحة؛ n_rows = صفوف الخام</td></tr>
<tr><td>M2 التنظيف</td><td>الجدولان متطابقان؛ معرّفات فريدة؛ رموز صالحة؛ أسباب؛ ترتيب الأحداث</td></tr>
<tr><td>M3 المؤشرات</td><td>24 صفاً؛ الحجم مجموعه البلاغات المقبولة</td></tr>
<tr><td>M4 التحقق</td><td>اختلافات المسارين مشروحة أو خطوة تالية</td></tr>
<tr><td>M5 تأطير سؤال التعلم</td><td>موجّه؛ القرار عند الاستلام؛ الحجب</td></tr>
<tr><td>M6 تدقيق التسرب</td><td>كل عمود بعد الاستلام تسرب</td></tr>
<tr><td>M7 خط أساس بتقسيم زمني</td><td>بلا تداخل؛ الدقة داخل فترتها؛ استدعاء الحالات المتأخرة</td></tr>
<tr><td>M8 رسمان صادقان</td><td>مقياس 0–1؛ n في الأسماء؛ عناوين وأسماء محاور</td></tr>
<tr><td>M9 التصدير</td><td>أربعة ملفات؛ إعادة تشغيل متطابقة</td></tr>
<tr><td>M10 التقرير</td><td>150–250 كلمة؛ مقامات؛ قيدان؛ توصية واحدة</td></tr></table>
<p><b>فحص الجاهزية لتعلم الآلة:</b> التأطير (الوحدة ووقت القرار والتسمية والمهمة وأي الصفوف لها تسمية — اليوم 1) ← التدقيق (أي الأعمدة المرشحة معروفة عند الاستلام وأيها يتسرب — اليوم 2) ← التقسيم (التدريب قبل 2025-03-01 والاختبار بعده بلا تداخل) ← خط الأساس (دقة DummyClassifier مع SE وفترة 95%) ← المعنى (استدعاء الإغلاقات المتأخرة: ما يجب أن يلتقطه النموذج). لا نموذج حقيقي اليوم: خط الأساس هو المقياس الصادق الذي يجب أن يتجاوزه نموذج الأسبوع 09. المخرجات: <code>day05_individual_output/</code> (‏indicators.csv و rejected_reports.csv و rejected_records.csv و manifest.json ورسمان PNG) والتقرير 150–250 كلمة. المعايير (100): ‏M1–M2 ‏20؛ M3–M4 ‏20؛ M5–M7 ‏20؛ M8–M9 ‏15؛ أرقام التقرير بالمقامات 10؛ قيدان وتوصية جودة بيانات 10؛ جودة الكود بلا نتائج مكتوبة يدوياً و Restart and Run All ‏5.</p>
<h3>مشروع الفريق — لوحة مؤشرات شرطة من نظامي مصدر</h3>
<table><tr><th></th><th>القديم (قبل 15 فبراير)</th><th>الجديد (من 15 فبراير)</th></tr>
<tr><td>التواريخ</td><td>2025-02-03 09:15</td><td>03/03/2025 09:15 (اليوم أولاً)</td></tr>
<tr><td>رموز المكاتب</td><td>7 و 007 و ' 7'</td><td>D-007</td></tr>
<tr><td>العلامة</td><td>source_system = legacy</td><td>source_system = new</td></tr></table>
<p>لوحة موثّقة واحدة للربع كاملاً تُعاد توليدها باستدعاء دالة واحدة، ثم عرض خمس دقائق ودفاع شفهي. التمرين EX02: إعادة استخدام توحيد اليوم 3 تجعل معظم تواريخ النظام الجديد مفقودة وكل رموز D- مجهولة — <b>حلّل حسب النظام</b>.</p>
<table><tr><th>الدور</th><th>يملك</th><th>التمارين</th></tr>
<tr><td>A الاستلام</td><td>load_team_sources و normalise_team_reports</td><td>EX01 EX02</td></tr>
<tr><td>B التنظيف والمؤشرات</td><td>clean_team و team_indicators (جدول حسب النظام)</td><td>EX03 EX04</td></tr>
<tr><td>C اللوحة</td><td>save_dashboard_data و team_dashboard.py واختبار الدخان</td><td>EX05 EX06</td></tr>
<tr><td>D الدفاع والجاهزية</td><td>defence_pack و ml_readiness</td><td>EX07 EX08</td></tr>
<tr><td>الجميع</td><td>run_pipeline و CONTRIBUTIONS و BRIEF و DEMO_PLAN</td><td>EX09 EX10</td></tr></table>
<p>العقود: raw_reports ← reports_norm ← accepted_reports ← indicators؛ و <code>check_interface(df, name)</code> ترفع ValueError واضحاً قبل تسليم جدول معطوب.</p>
<pre>def run_pipeline(data_url, out_dir, desks=None):
    src = load_team_sources(data_url)            # A
    if desk codes repeat: raise ValueError       # لم يُكتب شيء بعد
    cl = clean_team(src)                         # B
    r, ind, by_system = team_indicators(cl, sla) # B
    ready = ml_readiness(r)                      # D
    save_dashboard_data(...)                     # C: ‏3 ملفات
    write rejected_*.csv + manifest.json         # 6 ملفات متطابقة عند الإعادة</pre>
<p>فحوص التكامل: إعادة تشغيل متطابقة؛ وجدول بحث معطوب يرفع ValueError ولا يترك مجلداً. اللوحة تقرأ الملفات المحفوظة فقط — بلا إعادة حساب في الصفحة. الصفحة: تعليق (المصدر والأعداد والنظامان)؛ مرشح مكاتب جانبي (الكل افتراضياً)؛ حالة فارغة بـ st.info؛ ثلاثة مؤشرات موزونة؛ رسم أعمدة بـ n في الأسماء + تحذير n الصغيرة؛ جدول حسب النظام؛ زر تنزيل؛ expander "مصدر البيانات والقيود". اختبار الدخان (الدور C): AppTest ثلاث مرات — الافتراضي و Harbor فقط وبلا مكتب؛ بلا استثناء؛ المؤشرات تطابق ind؛ ورسالة معلومات واحدة عند الفراغ.</p>
<p><b>العرض (5 دقائق):</b> افتح اللوحة واذكر السؤال (0.5، الدور C)؛ مصادر البيانات والنظامان والتنظيف (1.0، الدور A)؛ المؤشرات والنتيجة الرئيسية بمقاماتها (1.5، الدور B)؛ القيود والجاهزية لتعلم الآلة (1.0، الدور D)؛ الأسئلة (1.0، الجميع). كل عضو يشرح دالة واحدة وحالة فشل تعالجها (تواريخ اليوم أولاً، رمز D-، رمز مكتب مكرر، سجل يتيم، بلاغ محجوب). المعايير (100): الدور A ‏15 و B ‏20 و C ‏20 و D ‏15؛ الفريق: التحقق قبل الكتابة وإعادة تشغيل متطابقة وجدول معطوب لا يترك ملفات 15؛ العرض والدفاع 15.</p>
<h3>أخطاء شائعة</h3>
<table><tr><th>العَرَض</th><th>السبب المحتمل</th><th>الحل</th></tr>
<tr><td>الأعداد لا تتطابق</td><td>صفوف حُذفت بلا سبب</td><td>مصفوفة قواعد؛ التكرارات + المقبول + المرفوض = الخام</td></tr>
<tr><td>صفوف أكثر بعد الربط</td><td>مفتاح مكرر في جدول البحث</td><td>validate="many_to_one"</td></tr>
<tr><td>صفوف النظام الجديد مرفوضة</td><td>صيغة تاريخ واحدة للنظامين</td><td>حلّل حسب source_system</td></tr>
<tr><td>إغلاق مارس يبدو منخفضاً</td><td>البلاغات المحجوبة حُسبت غير مغلقة</td><td>البلاغات المؤهلة فقط</td></tr>
<tr><td>خط الأساس يبدو قوياً</td><td>دقة فئة الأغلبية</td><td>استدعاء الحالات المتأخرة + الفترة</td></tr>
<tr><td>إعادة التشغيل تختلف</td><td>صفوف أو مفاتيح JSON غير مرتبة</td><td>ترتيب ثابت؛ sort_keys=True</td></tr></table>
<p>التسليم — فردي: الدفتر + day05_individual_output/ (ستة ملفات)؛ فريق: الدفتر + team_output/ (ستة ملفات) + day05_team_apps/team_dashboard.py. التالي: الأسبوع 09، أسس تعلم الآلة والتعلم الموجّه — نماذج حقيقية تُقاس مقابل خطوط أساس اليوم.</p>`}

function qText(q){ return st.lang==="ar"? q.ar : q.en; }
function qExp(q){ return st.lang==="ar"? q.ae : q.ee; }
function bestGet(){ try{ return JSON.parse(localStorage.getItem("aiint_best")||"null"); }catch(e){ return null; } }
function bestSet(v){ try{ const b=bestGet(); if(!b||v>b) localStorage.setItem("aiint_best",JSON.stringify(v)); }catch(e){} }

function setLang(l){ st.lang=l; try{localStorage.setItem("aiint_lang",l);}catch(e){} applyLang(); render(); }
function applyLang(){ const h=document.documentElement; h.lang=st.lang; h.dir= st.lang==="ar"?"rtl":"ltr"; document.title = t("title"); }

function nav(){
 const cur = location.hash.slice(1)||"home";
 let h = `<div class="brand"><span class="logo" aria-hidden="true">AI</span><div><b>${t("title")}</b><small>${t("sub")}</small></div></div>`;
 h += `<a class="navtop ${cur==="home"?"on":""}" href="#home">${t("home")}</a>`;
 h += `<a class="navtop ${cur==="bank"?"on":""}" href="#bank">${t("bank")} <span class="pill">${QB.length}</span></a>`;
 h += `<a class="navtop exam ${cur==="exam"?"on":""}" href="#exam">${t("exam")} <span class="pill">50</span></a>`;
 h += `<div class="navlabel">${t("study")}</div>`;
 UNITS.forEach((u,ui)=>{
  const secs = SECTIONS.filter(s=>s.unit===u.id);
  const open = secs.some(s=>s.id===cur) ? " open" : (cur==="home"||cur==="bank"||cur==="exam") && ui===0 ? " open":"";
  h += `<details class="unit"${open}><summary><span class="un">${ui+1}</span>${esc(unitTitle(u))}</summary><ol>`;
  secs.forEach(s=>{ h += `<li><a class="${cur===s.id?"on":""}" href="#${s.id}"><span class="sn">${secNum(s.id)}</span>${esc(secTitle(s))}</a></li>`; });
  h += `</ol></details>`;
 });
 $("#nav").innerHTML = h;
}

function viewHome(){
 const b = bestGet();
 let h = `<header class="hero"><p class="eyebrow">AI For Interior · personal study aid</p><h1>${t("title")}</h1><p class="lede">${t("sub")}.</p>
 <div class="stats"><div><b>${UNITS.length}</b><span>${t("units")}</span></div><div><b>${SECTIONS.length}</b><span>${t("sections")}</span></div><div><b>${QB.length}</b><span>${t("questions")}</span></div><div><b>${b!==null? b+"%" : "—"}</b><span>${t("best")}</span></div></div>
 <div class="cta"><a class="btn primary" href="#exam">${t("startExam")}</a><a class="btn" href="#bank">${t("bank")}</a></div></header>`;
 UNITS.forEach((u,ui)=>{
  const secs = SECTIONS.filter(s=>s.unit===u.id);
  h += `<section class="ugroup"><h2><span class="un">${ui+1}</span>${esc(unitTitle(u))}</h2><div class="cards">`;
  secs.forEach(s=>{
   h += `<a class="card" href="#${s.id}"><span class="sn">${secNum(s.id)}</span><b>${esc(secTitle(s))}</b><small>${qCount(s.id)? qCount(s.id)+' '+t("questions") : t("noQ")}</small></a>`;
  });
  h += `</div></section>`;
 });
 return h;
}

function viewSection(id){
 const s = secById(id), i = SECTIONS.indexOf(s), u = UNITS.find(x=>x.id===s.unit);
 const prev = SECTIONS[i-1], next = SECTIONS[i+1];
 const pbar = qCount(id) ? `<div class="practicebar"><button class="btn primary" data-act="practice" data-sec="${id}">${t("practice")}</button><span><b>${qCount(id)}</b> ${t("questions")} · ${t("practiceInfo")}</span></div>` : `<p class="note">${t("noQ")}</p>`;
 let h = `<article class="sec"><p class="eyebrow">${t("unit")} ${UNITS.indexOf(u)+1} · ${esc(unitTitle(u))}</p><h1><span class="sn big">${secNum(id)}</span>${esc(secTitle(s))}</h1>
 ${pbar}
 <div class="body">${st.lang==="ar"? s.ar_body : s.en_body}</div>
 ${pbar}
 <nav class="pager">${prev? `<a class="btn" href="#${prev.id}">‹ ${t("prevSec")}: ${esc(secTitle(prev))}</a>`:"<span></span>"}${next? `<a class="btn" href="#${next.id}">${t("nextSec")}: ${esc(secTitle(next))} ›</a>`:""}</nav></article>`;
 return h;
}

function viewBank(){
 let h = `<h1>${t("bank")}</h1><div class="filters">
  <label for="fsec">${t("study")}</label><select id="fsec"><option value="all">${t("allSections")}</option>${SECTIONS.filter(s=>QSECS.includes(s.id)).map(s=>`<option value="${s.id}" ${st.bankSec===s.id?"selected":""}>${secNum(s.id)}. ${esc(secTitle(s))}</option>`).join("")}</select>
  <label for="ftype">${t("type")}</label><select id="ftype"><option value="all">${t("anyType")}</option><option value="m" ${st.bankType==="m"?"selected":""}>${t("mcq")}</option><option value="tf" ${st.bankType==="tf"?"selected":""}>${t("tf")}</option></select>
  <label for="fq" class="vh">${t("search")}</label><input id="fq" type="search" placeholder="${t("search")}" value="${esc(st.bankQ)}"></div>`;
 const qq = st.bankQ.trim().toLowerCase();
 const list = QB.map((q,i)=>({q,i})).filter(({q})=> (st.bankSec==="all"||q.s===st.bankSec) && (st.bankType==="all"||q.t===st.bankType) && (!qq || (q.en+" "+q.ar+" "+q.eo.join(" ")+" "+(q.ao||[]).join(" ")).toLowerCase().includes(qq)));
 h += `<p class="muted">${list.length} ${t("shown")} ${t("of2")} ${QB.length}</p><ol class="banklist">`;
 list.forEach(({q,i})=>{
  const o = opts(q);
  h += `<li><div class="qmeta"><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span><span class="chip ghost">${q.t==="tf"?t("tf"):t("mcq")}</span><span class="qid">#${i+1}</span></div>
  <p class="qt" dir="auto">${esc(qText(q))}</p><ol class="optlist" type="A">${o.map(x=>`<li dir="auto">${esc(x)}</li>`).join("")}</ol>
  <details class="ans"><summary>${t("showAns")}</summary><p><b>${t("rightAns")}:</b> <span dir="auto">${esc(o[q.a])}</span></p><p class="muted" dir="auto">${esc(qExp(q))}</p></details></li>`;
 });
 return h + `</ol>`;
}

const PY=["s05","s06","s07","s08","s09","s10","s21","s22","s23","s24"];
function alloc(secs, bySec, total){
 const N=secs.reduce((a,s)=>a+bySec[s].length,0);
 const r=secs.map(s=>{const x=bySec[s].length*total/N; return {s,n:Math.floor(x),f:x-Math.floor(x),k:Math.random()};});
 let left=total-r.reduce((a,o)=>a+o.n,0);
 r.slice().sort((a,b)=>(b.f-a.f)||(a.k-b.k)).slice(0,left).forEach(o=>o.n++);
 return r;
}
function buildExam(){
 const bySec = {}; QB.forEach((q,i)=>{(bySec[q.s]=bySec[q.s]||[]).push(i);});
 const all=Object.keys(bySec), py=all.filter(s=>PY.includes(s)), rest=all.filter(s=>!PY.includes(s));
 const pyN=Math.round(50*py.reduce((a,s)=>a+bySec[s].length,0)/QB.length);
 let picks=[];
 alloc(py,bySec,pyN).concat(alloc(rest,bySec,50-pyN)).forEach(o=>{ picks=picks.concat(shuffle(bySec[o.s]).slice(0,o.n)); });
 return newQuiz("exam", shuffle(picks));
}
function buildPractice(sec){ return newQuiz("practice", shuffle(QB.map((q,i)=>i).filter(i=>QB[i].s===sec)), sec); }
function newQuiz(mode, idxs, sec){
 return {mode, sec, idx:0, done:false, confirm:false,
  items: idxs.map(qi=>{ const q=QB[qi]; return {qi, perm: q.t==="tf"?[0,1]:shuffle([0,1,2,3]), ans:null}; })};
}

function viewQuizIntro(){
 const b = bestGet();
 return `<section class="intro"><h1>${t("exam")}</h1><p class="lede">${t("examInfo")}</p>
 <ul class="facts"><li><b>50</b> ${t("questions")}</li><li><b>${QSECS.length}</b> ${t("sections")}</li><li>${t("best")}: <b>${b!==null? b+"%" : t("none")}</b></li></ul>
 <button class="btn primary big" data-act="startexam">${t("startExam")}</button></section>`;
}

function viewQuiz(){
 const z = st.quiz; if(z.done) return viewResults();
 const it = z.items[z.idx], q = QB[it.qi], o = opts(q), n = z.items.length;
 const answered = z.items.filter(x=>x.ans!==null).length;
 const practice = z.mode==="practice";
 const locked = practice && it.ans!==null;
 let h = `<div class="quiz"><div class="qhead"><span>${practice? t("practiceOf")+" · "+esc(secTitle(secById(z.sec))) : t("exam")}</span><button class="link" data-act="exit">${t("exitQuiz")}</button></div>
 <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${answered}"><i style="width:${answered/n*100}%"></i></div>
 <p class="muted">${t("q")} ${z.idx+1} ${t("of")} ${n} · ${answered} ${t("answered")}</p>
 <div class="qcard"><div class="qmeta"><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span><span class="chip ghost">${q.t==="tf"?t("tf"):t("mcq")}</span></div>
 <p class="qt big" dir="auto">${esc(qText(q))}</p><div class="opts" role="radiogroup">`;
 it.perm.forEach((p,k)=>{
  let cls = it.ans===p ? "sel" : "";
  if(locked){ if(p===q.a) cls="ok"; else if(it.ans===p) cls="bad"; }
  h += `<button class="opt ${cls}" role="radio" aria-checked="${it.ans===p}" data-act="pick" data-p="${p}" ${locked?"disabled":""}><span class="ol">${"ABCD"[k]}</span><span dir="auto">${esc(o[p])}</span></button>`;
 });
 h += `</div>`;
 if(locked) h += `<div class="feedback ${it.ans===q.a?"good":"badfb"}"><b>${it.ans===q.a? "✓ "+t("correct") : "✗ "+t("wrong")}</b><p dir="auto">${esc(qExp(q))}</p></div>`;
 h += `</div><div class="qnav"><button class="btn" data-act="prev" ${z.idx===0?"disabled":""}>‹ ${t("prev")}</button>`;
 h += z.idx<n-1 ? `<button class="btn primary" data-act="next">${t("next")} ›</button>` : `<button class="btn primary" data-act="submit">${practice? t("finishPractice") : t("submit")}</button>`;
 h += `</div><div class="palette">${z.items.map((x,k)=>`<button class="pb ${x.ans!==null?"done":""} ${k===z.idx?"cur":""}" data-act="go" data-k="${k}" aria-label="${t("q")} ${k+1}">${k+1}</button>`).join("")}</div>`;
 if(z.idx<n-1) h += `<div class="submitrow"><button class="btn" data-act="submit">${practice? t("finishPractice") : t("submit")}</button></div>`;
 if(z.confirm) h += `<div class="confirm" role="alertdialog"><p>${t("confirmSubmit")} (${n-answered} ${t("unanswered")})</p><button class="btn primary" data-act="forcesubmit">${t("yesSubmit")}</button><button class="btn" data-act="cancel">${t("back")}</button></div>`;
 return h + `</div>`;
}

function viewResults(){
 const z = st.quiz, n = z.items.length;
 const right = z.items.filter(x=>x.ans===QB[x.qi].a).length;
 const blank = z.items.filter(x=>x.ans===null).length;
 const pct = Math.round(right/n*100);
 const band = pct>=85? ["pass","good"] : pct>=60? ["good","mid"] : ["weak","low"];
 const per = {}; z.items.forEach(x=>{ const s=QB[x.qi].s; per[s]=per[s]||[0,0]; per[s][1]++; if(x.ans===QB[x.qi].a) per[s][0]++; });
 let h = `<div class="results"><h1>${z.mode==="exam"? t("exam") : t("practiceOf")+" · "+esc(secTitle(secById(z.sec)))} — ${t("result")}</h1>
 <div class="scorebox ${band[1]}"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><p class="big"><b>${right}</b> / ${n}</p><p><span class="tag ok">${right} ${t("correct")}</span> <span class="tag bad">${n-right-blank} ${t("wrong")}</span> <span class="tag">${blank} ${t("unanswered")}</span></p><p class="bandlabel">${t(band[0])}</p></div></div>`;
 if(z.mode==="exam"){
  h += `<h2>${t("bySection")}</h2><div class="tablewrap"><table class="persec"><thead><tr><th>${t("study")}</th><th>${t("score")}</th><th></th></tr></thead><tbody>`;
  Object.keys(per).sort().forEach(s=>{ const [r,c]=per[s]; const p=r/c; h += `<tr><td><a href="#${s}">${secNum(s)}. ${esc(secTitle(secById(s)))}</a></td><td class="num">${r}/${c}</td><td><span class="bar"><i class="${p>=0.67?"g":p>=0.34?"m":"l"}" style="width:${p*100}%"></i></span></td></tr>`; });
  h += `</tbody></table></div>`;
 }
 h += `<h2>${t("review")}</h2><div class="seg"><button class="${st.reviewFilter==="all"?"on":""}" data-act="rf" data-v="all">${t("all")} (${n})</button><button class="${st.reviewFilter==="wrong"?"on":""}" data-act="rf" data-v="wrong">${t("wrongOnly")} (${n-right})</button></div><ol class="review">`;
 z.items.forEach((x,k)=>{
  const q=QB[x.qi], o=opts(q), ok = x.ans===q.a;
  if(st.reviewFilter==="wrong" && ok) return;
  h += `<li value="${k+1}" class="${ok?"rok":"rbad"}"><div class="qmeta"><span class="mark">${ok?"✓":"✗"}</span><span class="chip">${secNum(q.s)}. ${esc(secTitle(secById(q.s)))}</span></div><p class="qt" dir="auto">${esc(qText(q))}</p>
  <ul class="ropts">${x.perm.map((p,i)=>`<li class="${p===q.a?"isright":""} ${x.ans===p&&!ok?"iswrong":""}"><span class="ol">${"ABCD"[i]}</span><span dir="auto">${esc(o[p])}</span>${p===q.a?` <em>${t("rightAns")}</em>`:""}${x.ans===p&&!ok?` <em>${t("yourAns")}</em>`:""}</li>`).join("")}</ul>
  ${x.ans===null?`<p class="muted">${t("noAns")}</p>`:""}<p class="exp" dir="auto"><b>${t("explain")}:</b> ${esc(qExp(q))}</p></li>`;
 });
 h += `</ol><div class="qnav"><button class="btn primary" data-act="${z.mode==="exam"?"startexam":"practice"}" data-sec="${z.sec||""}">${t("retake")}</button><a class="btn" href="#home">${t("backHome")}</a></div></div>`;
 return h;
}

function render(){
 applyLang(); nav();
 $("#langbtn").textContent = t("lang");
 const cur = location.hash.slice(1)||"home"; let h;
 if(st.quiz && (cur==="exam" || cur==="practice")) h = viewQuiz();
 else if(cur==="exam") h = viewQuizIntro();
 else if(cur==="bank") h = viewBank();
 else if(secById(cur)) h = viewSection(cur);
 else h = viewHome();
 $("#main").innerHTML = h;
 document.body.classList.remove("navopen");
}

function finish(){ const z=st.quiz; z.done=true; z.confirm=false; st.reviewFilter="all";
 if(z.mode==="exam"){ const r=z.items.filter(x=>x.ans===QB[x.qi].a).length; bestSet(Math.round(r/z.items.length*100)); } }

document.addEventListener("click", e=>{
 const b = e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, z=st.quiz;
 if(a==="startexam"){ st.quiz=buildExam(); if(location.hash!=="#exam") location.hash="exam"; else render(); window.scrollTo(0,0); return; }
 if(a==="practice"){ st.quiz=buildPractice(b.dataset.sec); if(location.hash!=="#practice") location.hash="practice"; else render(); window.scrollTo(0,0); return; }
 if(!z) return;
 const it = z.items[z.idx];
 if(a==="pick"){ if(z.mode==="practice" && it.ans!==null) return; it.ans=parseInt(b.dataset.p,10); }
 else if(a==="next") { z.idx=Math.min(z.idx+1, z.items.length-1); }
 else if(a==="prev") { z.idx=Math.max(z.idx-1,0); }
 else if(a==="go") { z.idx=parseInt(b.dataset.k,10); }
 else if(a==="submit"){ if(z.items.some(x=>x.ans===null)) z.confirm=true; else finish(); }
 else if(a==="forcesubmit"){ finish(); }
 else if(a==="cancel"){ z.confirm=false; }
 else if(a==="rf"){ st.reviewFilter=b.dataset.v; }
 else if(a==="exit"){ st.quiz=null; location.hash = z.mode==="practice"? z.sec : "home"; return; }
 render();
 if(["next","prev","go","submit","forcesubmit"].includes(a)) $("#main").scrollIntoView({block:"start"});
});
document.addEventListener("change", e=>{
 if(e.target.id==="fsec"){ st.bankSec=e.target.value; render(); }
 if(e.target.id==="ftype"){ st.bankType=e.target.value; render(); }
});
let qt; document.addEventListener("input", e=>{ if(e.target.id==="fq"){ st.bankQ=e.target.value; clearTimeout(qt); qt=setTimeout(()=>{ render(); const f=$("#fq"); f.focus(); f.setSelectionRange(f.value.length,f.value.length); },250);} });
$("#langbtn").addEventListener("click", ()=> setLang(st.lang==="ar"?"en":"ar"));
$("#menubtn").addEventListener("click", ()=> document.body.classList.toggle("navopen"));
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(h!=="exam"&&h!=="practice"&&st.quiz&&st.quiz.done) st.quiz=null; render(); window.scrollTo(0,0); });
render();
})();

</script>
</body>
