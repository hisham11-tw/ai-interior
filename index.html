en_body:`
<p class="note">Setup guide and project files — explained here for study; they are not part of the question bank.</p>
<h3>Week 05 setup (Colab + Neon)</h3>
<p>Continue the Week 04 connection on the same Neon database with the assigned team account; no Docker for learners. The instructor imports the snapshot, enables PostGIS, creates analytical views and provisions restricted roles. Day plan: 06 joins/CTEs (pre-aggregate vehicles and people by crash), 07 rankings/LAG/moving averages (complete monthly calendar), 08 police & traffic dashboards (team-owned SQL views, plot only SQL result tables), 09 spatial checks/assignment/proximity (aggregate maps, no individual points), 10 integrated district-time report. 60 min concepts + two 90-min labs per day; six optional labs are outside the 40-hour course; optional Streamlit is separate.</p>
<p><b>Spatial check notebook (<code>00_colab_neon_spatial_check.ipynb</code>):</b> upload <code>colab_student_support.zip</code> (verified by its SHA-256 hash; archive paths checked to stay inside the destination), install requirements, read <code>DATABASE_URL</code> from Secrets without printing it, set <code>COURSE_TEAM_SCHEMA</code> (e.g. team_01). Permission checks: can read <code>training.crimes</code>, cannot INSERT into source, can CREATE in your team schema, and cannot access other <code>team_NN</code> schemas — an owner login isn't a valid student setup. Use a CPU runtime (a GPU gives no benefit for SQL).</p>
<pre>SELECT month, records, records - lag(records) OVER (ORDER BY month) AS change
FROM training.crime_monthly ORDER BY month;          -- 12 months; sum = crimes count; first change NULL
SELECT ST_Distance(ST_SetSRID(ST_MakePoint(-87.63,41.88),4326)::geography,
                   ST_SetSRID(ST_MakePoint(-87.63,41.881),4326)::geography) AS metres;  -- ~111 (100–120)
SELECT count(*) FROM training.districts WHERE ST_SRID(geom) &lt;&gt; 4326 OR NOT ST_IsValid(geom);  -- 0
SELECT count(*) AS all_records, count(geom) AS located_records, count(dist_num) AS assigned_records
FROM training.crime_districts;</pre>
<p>The district map counts only assigned records (darker = more sampled records, not greater risk). <code>training.integrated_monthly</code> is reconciled against <b>assigned</b> records (dist_num not NULL), not all source records. Build your own objects with schema-qualified names (e.g. <code>team_01.my_monthly_report</code>); never create objects in another team's schema. Close idle connections; for slow spatial joins check GiST indexes and EXPLAIN before increasing sample size. The boundary vintage may not match event dates.</p>
<h3>Capstone contract</h3>
<p>Integrate crime and traffic records at <b>district-month grain</b> for 2025. Roles: data-quality analyst, SQL analyst, spatial analyst, reviewer/presenter. Agree on the output key, calendar, assignment rule, observation denominators, NULL policy and exclusions <b>before</b> coding; everyone reviews another member's result.</p>
<ol><li>Verify synthetic provenance and the year boundary.</li><li>Assign each event to at most one district with ST_Covers, lowest dist_num on ties.</li><li>Retain unmatched events for coverage accounting.</li><li>Aggregate crime and traffic <b>independently</b> by district and month.</li><li>Build all districts × twelve months.</li><li>Join aggregates on <b>both</b> keys, filling absent counts with zero.</li><li>Reconcile every count before drawing conclusions.</li></ol>
<pre>CREATE TEMP VIEW assigned_crime AS
SELECT c.id, c.date, z.dist_num FROM training.crimes c
LEFT JOIN LATERAL (SELECT dist_num FROM training.districts d
                   WHERE ST_Covers(d.geom, c.geom) ORDER BY dist_num LIMIT 1) z ON true
WHERE c.date &gt;= '2025-01-01' AND c.date &lt; '2026-01-01';     -- same pattern for assigned_traffic
SELECT d.dist_num, m::date AS month FROM training.districts d
CROSS JOIN generate_series(timestamp '2025-01-01', timestamp '2025-12-01', interval '1 month') m;
CREATE TEMP VIEW integrated_report AS
WITH months AS (...), c AS (crime per dist_num, month), t AS (crash_records, observed_injuries, injuries per dist_num, month)
SELECT d.dist_num, m.month, COALESCE(c.crime_records,0), COALESCE(t.crash_records,0),
       COALESCE(t.observed_injuries,0), t.injuries
FROM training.districts d CROSS JOIN months m
LEFT JOIN c ON c.dist_num = d.dist_num AND c.month = m.month
LEFT JOIN t ON t.dist_num = d.dist_num AND t.month = m.month;</pre>
<p>Expected shape: 12 rows per district with a unique (district, month) key. Pitfalls: event-to-event joins multiply events; joining on district alone multiplies months; an injury sum that is missing must stay unknown (not an observed zero). Reconcile mapped totals with assigned sources, and all-source totals with assigned + unmatched; an independent Python grouping checks every district-month count.</p>
<h3>Dashboard, export and handover</h3>
<pre>SELECT dist_num, month, crime_records,
       LAG(crime_records) OVER (PARTITION BY dist_num ORDER BY month) AS previous
FROM pg_temp.integrated_report ORDER BY dist_num, month;
SELECT SUM(observed_injuries) AS observed,
       ROUND(SUM(injuries)::numeric / NULLIF(SUM(observed_injuries), 0), 3) AS mean_injuries
FROM pg_temp.integrated_report;           -- pooled mean over observations, not all crashes</pre>
<p>Show crime and crash counts in <b>separate</b> plots and maps (separate colour scales); never add them into an unsupported risk index. Without <code>PARTITION BY dist_num</code>, LAG leaks the previous district's last month into the next district. A mean of district means changes weights. The export writes <code>district_month_summary.csv</code> (reloaded and verified) and <code>report_provenance.json</code> (synthetic mode, year 2025, assignment rule, unmatched counts, limitations); exporting only a chart loses query and denominator evidence. Another team must reproduce the report in a fresh session with its own secret; outputs contain no credentials or event identifiers. Five-minute presentation: problem, schema, transformation stages, one rejected alternative, reconciliation evidence and a limitation; each member explains one decision. Rubric: SQL 40, validation 25, interpretation 20, reproducibility 15. A district with more sampled events isn't necessarily more dangerous (quota samples, unmatched coordinates, boundary vintage).</p>`,

<p class="note">دليل إعداد وملفات مشروع — مشروحة هنا للدراسة وليست ضمن بنك الأسئلة.</p>
<h3>إعداد الأسبوع 05 (Colab + Neon)</h3>
<p>نكمل اتصال الأسبوع 04 على نفس قاعدة Neon بحساب الفريق المخصص، بدون Docker للمتدرب. المدرب يستورد اللقطة ويفعّل PostGIS وينشئ العروض التحليلية ويجهز الأدوار المقيدة. خطة الأيام: 06 الربط و CTE (تجميع المركبات والأشخاص لكل حادث مسبقاً)، 07 الترتيب و LAG والمتوسطات المتحركة (تقويم شهري كامل)، 08 لوحات الشرطة والمرور (عروض SQL خاصة بالفريق ورسم جداول نتائج SQL فقط)، 09 الفحوص المكانية والإسناد والقرب (خرائط مجمّعة بدون نقاط فردية)، 10 تقرير متكامل للحي والزمن. 60 دقيقة مفاهيم + معملان كل منهما 90 دقيقة يومياً؛ وستة معامل اختيارية خارج المقرر ذي الـ 40 ساعة؛ و Streamlit اختياري ومنفصل.</p>
<p><b>دفتر الفحص المكاني (<code>00_colab_neon_spatial_check.ipynb</code>):</b> ارفع <code>colab_student_support.zip</code> (يُتحقق منه ببصمة SHA-256 وتُفحص المسارات لتبقى داخل مجلد الوجهة)، ثبّت المتطلبات، اقرأ <code>DATABASE_URL</code> من Secrets بدون طباعته، وحدد <code>COURSE_TEAM_SCHEMA</code> (مثل team_01). فحوص الصلاحيات: تقرأ <code>training.crimes</code>، ولا تستطيع الإدخال في المصدر، وتستطيع الإنشاء في مخطط فريقك، ولا تصل لمخططات <code>team_NN</code> الأخرى — الدخول بحساب المالك ليس إعداداً صحيحاً للمتدرب. استخدم معالجاً CPU (الـ GPU لا يفيد SQL).</p>
<pre>SELECT month, records, records - lag(records) OVER (ORDER BY month) AS change
FROM training.crime_monthly ORDER BY month;          -- 12 شهراً؛ المجموع = عدد الجرائم؛ أول تغير NULL

<p>خريطة الأحياء تعدّ السجلات المسندة فقط (الأغمق = سجلات أكثر في العينة لا خطر أكبر). و <code>training.integrated_monthly</code> يُطابق مع السجلات <b>المسندة</b> (dist_num ليس NULL) لا كل سجلات المصدر. ابنِ كائناتك بأسماء مؤهلة بالمخطط (مثل <code>team_01.my_monthly_report</code>) ولا تنشئ شيئاً في مخطط فريق آخر. أغلق الاتصالات الخاملة، وللربط المكاني البطيء افحص فهارس GiST و EXPLAIN قبل زيادة العينة. عمر حدود الأحياء قد لا يطابق تواريخ الأحداث.</p>
<h3>عقد المشروع</h3>
<p>دمج سجلات الجرائم والمرور على <b>مستوى الحي-الشهر</b> لسنة 2025. الأدوار: محلل جودة البيانات، محلل SQL، المحلل المكاني، المراجع/المقدم. اتفقوا على مفتاح المخرج والتقويم وقاعدة الإسناد ومقامات الملاحظة وسياسة NULL والاستثناءات <b>قبل</b> البرمجة، وكل عضو يراجع نتيجة عضو آخر.</p>
<ol><li>تحقق من أن المصدر مصطنع ومن حدود السنة.</li><li>أسند كل حدث لحي واحد على الأكثر بـ ST_Covers وأصغر dist_num عند التعادل.</li><li>احتفظ بالأحداث غير المطابقة لحساب التغطية.</li><li>جمّع الجرائم والمرور <b>كلاً على حدة</b> حسب الحي والشهر.</li><li>ابنِ كل الأحياء × 12 شهراً.</li><li>اربط التجميعات على <b>المفتاحين</b> واملأ الغائب بصفر.</li><li>طابق كل الأعداد قبل الاستنتاج.</li></ol>
<pre>CREATE TEMP VIEW assigned_crime AS
SELECT c.id, c.date, z.dist_num FROM training.crimes c
LEFT JOIN LATERAL (SELECT dist_num FROM training.districts d
                   WHERE ST_Covers(d.geom, c.geom) ORDER BY dist_num LIMIT 1) z ON true
WHERE c.date &gt;= '2025-01-01' AND c.date &lt; '2026-01-01';     -- ونفس النمط لـ assigned_traffic
SELECT d.dist_num, m::date AS month FROM training.districts d

CREATE TEMP VIEW integrated_report AS

FROM training.districts d CROSS JOIN months m
LEFT JOIN c ON c.dist_num = d.dist_num AND c.month = m.month
LEFT JOIN t ON t.dist_num = d.dist_num AND t.month = m.month;</pre>
<p>الشكل المتوقع: 12 صفاً لكل حي بمفتاح فريد (الحي، الشهر). أخطاء شائعة: ربط حدث بحدث يضاعف الأحداث؛ الربط على الحي فقط يضاعف الأشهر؛ ومجموع الإصابات المفقود يبقى مجهولاً (لا صفراً ملاحظاً). طابق المجاميع المرسومة مع المسندة، والمجموع الكلي مع المسند + غير المطابق؛ وتجميع مستقل في بايثون يفحص كل عدد حي-شهر.</p>
<h3>اللوحة والتصدير والتسليم</h3>
<pre>SELECT dist_num, month, crime_records,
       LAG(crime_records) OVER (PARTITION BY dist_num ORDER BY month) AS previous
FROM pg_temp.integrated_report ORDER BY dist_num, month;
SELECT SUM(observed_injuries) AS observed,
       ROUND(SUM(injuries)::numeric / NULLIF(SUM(observed_injuries), 0), 3) AS mean_injuries
FROM pg_temp.integrated_report;           -- متوسط مجمّع على الملاحظات لا كل الحوادث</pre>
<p>اعرض أعداد الجرائم والحوادث في رسوم وخرائط <b>منفصلة</b> (بمقاييس ألوان منفصلة)، ولا تجمعها في مؤشر خطر غير مدعوم. بدون <code>PARTITION BY dist_num</code> يسرّب LAG آخر شهر للحي السابق إلى الحي التالي. ومتوسط متوسطات الأحياء يغيّر الأوزان. التصدير يكتب <code>district_month_summary.csv</code> (يُعاد تحميله ويُتحقق منه) و <code>report_provenance.json</code> (النوع المصطنع، السنة 2025، قاعدة الإسناد، أعداد غير المطابق، القيود)؛ وتصدير الرسم وحده يفقد دليل الاستعلام والمقام. فريق آخر يجب أن يعيد إنتاج التقرير في جلسة جديدة بسرّه الخاص، والمخرجات بدون بيانات دخول أو معرّفات أحداث. عرض 5 دقائق: المشكلة، المخطط، مراحل التحويل، بديل مرفوض، دليل المطابقة، وقيد واحد؛ وكل عضو يشرح قراراً. التقييم: SQL 40، التحقق 25، التفسير 20، قابلية التكرار 15. الحي الذي فيه أحداث أكثر في العينة ليس بالضرورة أخطر (عينات بالحصص، إحداثيات غير مطابقة، عمر الحدود).</p>`}

{id:"s21", unit:"u5", en:"NumPy Arrays, Selection & Calculation", ar:"مصفوفات NumPy: الإنشاء والاختيار والحساب",
en_body:`
<p><b>Day 1 · topic 06.01 · Notebook A (01_numpy_police_arrays) + Notebook B (02_numpy_selection_and_calculation).</b> Each notebook: warm-up (not scored) → sections with a worked example and a <i>Try it</i> cell → EX01–EX10 (100 automatic points) → reflection (0–10, instructor) → skill report saved as <code>results_W06-D1-*.json</code>. Data are built from your <code>STUDENT_ID</code>, hidden inputs test your functions, and Python loops are rejected. Auto-check statuses: PASS, PARTIAL, TRY AGAIN, NOT ATTEMPTED, ERROR. Skills: Mastered ≥ 80%, Developing ≥ 50%, otherwise Not yet.</p>
<h3>1. Why arrays? Lists store objects, arrays compute</h3>
<table><tr><th>Operation</th><th>Python list</th><th>NumPy array</th></tr>
<tr><td><code>x * 2</code></td><td>repeats the list</td><td>doubles every value</td></tr>
<tr><td><code>x + y</code></td><td>joins two lists</td><td>adds matching values</td></tr>
<tr><td>sum of 1M values</td><td>slow Python loop</td><td>fast compiled loop</td></tr></table>
<pre>desk_list = [12, 8, 5];  desk_vector = np.array(desk_list)
desk_list * 2     # [12, 8, 5, 12, 8, 5]
desk_vector * 2   # [24 16 10]</pre>
<p>An array stores many values of <b>one type</b> in one memory block, so one operation runs on all values: <b>vectorization</b>. Common mistake: expecting list arithmetic to work like maths — if a list got longer instead of bigger, convert it first.</p>
<h3>2. Anatomy of an array</h3>
<table><tr><th></th><th>Report</th><th>Traffic</th><th>Document</th></tr>
<tr><td>North</td><td>12</td><td>8</td><td>5</td></tr><tr><td>East</td><td>9</td><td>6</td><td>10</td></tr>
<tr><td>South</td><td>15</td><td>4</td><td>6</td></tr><tr><td>West</td><td>6</td><td>10</td><td>9</td></tr></table>
<p><code>shape</code> = (4, 3) values per axis · <code>ndim</code> = 2 axes · <code>size</code> = 12 values · <code>dtype</code> = int64. <b>Axis 0</b> runs down the rows (desks), <b>axis 1</b> across the columns (types). <code>requests[1, 2]</code> = East, Document = 10. An array stores <b>no labels</b>: keep <code>desk_names</code> and <code>request_types</code> next to it, assert <code>requests.shape == (len(desk_names), len(request_types))</code>, and write a short data dictionary (axes, unit, dtype, source).</p>
<h3>3. Choose a dtype that keeps the meaning</h3>
<table><tr><th>Data</th><th>dtype</th><th>Why</th></tr>
<tr><td>Request counts</td><td>int64</td><td>exact whole numbers</td></tr>
<tr><td>Durations (min)</td><td>float64</td><td>decimals matter</td></tr>
<tr><td>Closed flags</td><td>bool</td><td><code>sum()</code> counts True</td></tr>
<tr><td>Desk code 001</td><td>text &lt;U3</td><td>an ID, not a quantity; leading zeros matter</td></tr></table>
<ul><li>An array has <b>one</b> dtype: <code>np.array(["North", 12, 8.5])</code> makes everything text, and "12" + "8.5" = "128.5".</li>
<li><code>astype(int)</code> <b>truncates</b>: [4.6, 7.2, 9.9] → [4 7 9]. For the nearest value use <code>np.rint(x).astype(int)</code>.</li>
<li>Small ints <b>overflow silently</b>: int8 holds −128..127, so 120 + 10 → −126 with no error. Sum with <code>dtype=np.int64</code> (EX07 debugs this).</li>
<li>Dtype kinds: "i" integer, "f" float, "U" text, "b" boolean.</li></ul>
<h3>4. Create arrays without typing every value</h3>
<table><tr><th>Function</th><th>Use</th><th>Watch out</th></tr>
<tr><td><code>np.zeros(shape, dtype=int)</code></td><td>empty count log</td><td>0 is not evidence that nothing happened</td></tr>
<tr><td><code>np.full(shape, v)</code></td><td>same planned value everywhere</td><td></td></tr>
<tr><td><code>np.arange(a, b, step)</code></td><td>stepped values</td><td>b is <b>excluded</b></td></tr>
<tr><td><code>np.linspace(a, b, n)</code></td><td>exact number of points</td><td>b is <b>included</b></td></tr>
<tr><td><code>np.random.default_rng(seed)</code></td><td>reproducible data</td><td>avoid the old <code>np.random.seed</code></td></tr></table>
<pre>g = np.random.default_rng(606)
week = g.integers(0, 20, size=(7, 3))
again = np.random.default_rng(606).integers(0, 20, size=(7, 3))
np.array_equal(week, again)   # True</pre>
<p>Common mistake: <code>np.arange(1, 1.3, 0.1)</code> gives 4 values, not 3 — use linspace for decimal steps.</p>
<h3>5. Reshape keeps order, transpose swaps meaning</h3>
<pre>day_by_desk (2 x 3)        .T -> (3 x 2) correct       reshape(3, 2) -> WRONG
        North East South          day1 day2               [[1, 2],
day 1 [   1    2    3 ]    North [  1    4 ]               [3, 4],
day 2 [   4    5    6 ]    East  [  2    5 ]               [5, 6]]
                           South [  3    6 ]</pre>
<p><code>reshape</code> regroups values in their original order (the new shape must hold the same number of values; <code>-1</code> lets NumPy infer one dimension); <code>ravel</code> flattens to 1D; <code>.T</code> swaps the axes. North over two days is [1, 4] — only the transpose gives it; reshape gives [1, 2] with <b>no error</b>. Never reshape just because the shape "looks right".</p>
<h3>6. More than two dimensions</h3>
<pre>day2 = requests + np.array([1, 0, 2])
cube = np.stack([day1, day2], axis=0)
cube.shape        # (2, 4, 3)  day, desk, type
cube[1, 1, 2]     # day 2, East, Document
cube[:, 2, 1]     # all days, South, Traffic</pre>
<p><code>np.stack</code> adds a <b>new</b> axis and keeps days separate; <code>np.concatenate</code> joins along an <b>existing</b> axis, giving (8, 3) and losing the day boundary. One index per axis; <code>:</code> keeps a whole axis. "Tensor" usually means an array with any number of dimensions. Write the axis order down: (day, desk, type) and (desk, day, type) hold the same numbers but answer different questions.</p>
<h3>7. Load numeric files</h3>
<table><tr><th>Function</th><th>Missing cells</th><th>Use</th></tr>
<tr><td><code>np.loadtxt</code></td><td>fails</td><td>clean numeric files</td></tr>
<tr><td><code>np.genfromtxt</code></td><td>become nan</td><td>files with gaps</td></tr>
<tr><td><code>np.save</code> / <code>np.load</code></td><td>—</td><td>exact .npy round trip</td></tr>
<tr><td><code>np.savetxt</code></td><td>—</td><td>readable CSV export</td></tr></table>
<pre>table = np.genfromtxt(path, delimiter=",", skip_header=1)
np.isnan(table).sum()   # number of gaps
table[:, -1]            # last column</pre>
<p><code>nan</code> is a float, so a column with a gap cannot stay integer. Count the gaps and report them; never replace them with 0 silently. Pandas handles mixed tables on Day 3.</p>
<h3>8. Engineering pattern: validate at the boundary (EX10 <code>build_daily_log</code>)</h3>
<p>Check arrays once, at the start: the number of values matches the shape (<code>ValueError</code> naming the expected count), the dtype matches the meaning (<code>TypeError</code> for non-integers), the input is not modified, no loops. Dtype also decides bytes per value at scale.</p>
<h3>Notebook B — 1. Indexing and slicing</h3>
<table><tr><th>Expression</th><th>Meaning</th><th>Shape</th></tr>
<tr><td><code>requests[1, 2]</code></td><td>one value</td><td>()</td></tr>
<tr><td><code>requests[-1]</code></td><td>last row</td><td>(3,)</td></tr>
<tr><td><code>requests[:, 1]</code></td><td>a column, 1D</td><td>(4,)</td></tr>
<tr><td><code>requests[:, 1:2]</code></td><td>a column, still 2D</td><td>(4, 1)</td></tr>
<tr><td><code>requests[1:3]</code></td><td>rows 1 and 2 (stop excluded)</td><td>(2, 3)</td></tr>
<tr><td><code>requests[::2]</code></td><td>every 2nd row</td><td>(2, 3)</td></tr></table>
<h3>2–3. Select by label and by rule</h3>
<pre>row = np.flatnonzero(desk_names == "South")   # check row.size first!
requests[row[0]]
order = np.argsort(totals)[::-1]               # high to low
traffic = requests[:, 1]
mask = (traffic >= 6) &amp; (traffic &lt;= 9)
desk_names[mask]                               # names, not True/False
np.where(traffic >= 8, "REVIEW", "OK")</pre>
<p>Fancy indexing <code>requests[[3, 0]]</code> returns rows in the order you ask (always a copy). An unknown label: raise <code>KeyError</code> with the name instead of an <code>IndexError</code> far away (EX02 <code>row_for</code>). Combine masks with <code>&amp;</code>, <code>|</code>, <code>~</code> and wrap every comparison in parentheses: <code>traffic >= 6 &amp; traffic &lt;= 9</code> raises a ValueError because &amp; runs before >=. <code>and</code> needs ONE True/False, so it fails on arrays. <code>mask.sum()</code> counts, <code>mask.any()/all()</code> answer yes/no. Thresholds are training values, not service standards or risk scores.</p>
<h3>4. Views and copies: protect your source</h3>
<table><tr><th>Selection</th><th>Returns</th><th>Changes source?</th></tr>
<tr><td><code>a[1:3]</code>, <code>a[:, 1]</code>, <code>a[:]</code></td><td>view</td><td>YES</td></tr>
<tr><td><code>a[[0, 2]]</code>, <code>a[a > 5]</code></td><td>copy</td><td>no</td></tr>
<tr><td><code>a.copy()</code></td><td>copy</td><td>no</td></tr></table>
<pre>demo = requests.copy(); view = demo[:, 1]; view += 100   # demo changed!
np.shares_memory(view, demo)   # True</pre>
<p>Copy first before any what-if scenario (EX04).</p>
<h3>5–6. Vectorized calculations and the axis rule</h3>
<p>Ufuncs (<code>np.round, np.clip, np.sqrt, np.abs</code>) work on every value; always state the unit (minutes / 60 = hours). <b>The axis you pass disappears:</b> <code>sum(axis=0)</code> removes desks → one total per <b>type</b> [42 28 30]; <code>sum(axis=1)</code> removes types → one total per <b>desk</b> [25 25 25 25]. The same rule holds for mean, max, min, argmax, cumsum. <code>argmax</code> returns the <b>first</b> position on ties; <code>keepdims=True</code> keeps shape (4, 1) for broadcasting; <code>argsort</code> ranks.</p>
<h3>7. Broadcasting: line shapes up from the right</h3>
<table><tr><th>Left</th><th>Right</th><th>Result</th><th>Meaning</th></tr>
<tr><td>(4, 3)</td><td>(3,)</td><td>(4, 3)</td><td>one value per type</td></tr>
<tr><td>(4, 3)</td><td>(4, 1)</td><td>(4, 3)</td><td>one value per desk</td></tr>
<tr><td>(4, 3)</td><td>(4,)</td><td>error</td><td>3 and 4 do not fit</td></tr></table>
<pre>estimated = requests * minutes_per_type
per_hour  = requests / hours[:, None]
shares    = requests / requests.sum(axis=1, keepdims=True)   # each row sums to 1</pre>
<p>Two dimensions fit if equal or one is 1. <b>The silent bug (EX07):</b> on a <b>square</b> table, <code>table / hours</code> gives no error but divides the columns, so every number is wrong. Turn a per-desk vector into a column: <code>hours[:, None]</code> or <code>reshape(-1, 1)</code>.</p>
<h3>8. Missing is not zero, undefined is not zero</h3>
<pre>d = np.array([12, 15.5, np.nan, 9, 240, 14])
d.mean()          # nan (it spreads)
np.nanmean(d)     # 58.1 (pulled up by 240)
np.nanmedian(d)   # 14.0
valid = np.isfinite(h) &amp; (h > 0)
np.divide(c, h, out=np.full(c.shape, np.nan), where=valid)</pre>
<p><code>nan</code> = unknown — report how many values were observed. <code>nanmean, nanmedian, nansum, nanpercentile</code> ignore gaps. Skewed data: report the median next to the mean. Zero hours: the rate is <b>undefined</b> — keep nan, not 0 or inf, and use <code>np.divide(..., where=)</code> so no RuntimeWarning appears (EX08 <code>safe_rate</code>).</p>
<h3>9. Combine arrays</h3>
<p><code>np.concatenate([a, b], axis=0)</code> existing axis · <code>np.vstack / np.hstack</code> rows/columns · <code>np.column_stack([table, vector])</code> adds a 1D vector as a column (needs same rows) · <code>np.stack</code> new axis. Check the meaning matches: a desk-total column needs one value per desk.</p>
<h3>10. One tested function (EX10 <code>summarize_workload</code>)</h3>
<p>Validate shapes once with clear errors; never modify inputs; stay vectorized; name results with units; keep undefined results as nan. Returns <code>total_by_desk, total_by_type, estimated_minutes_by_desk, rate_by_desk, busiest_desk</code> (first if tied) and <code>table_with_totals</code>; raises <code>ValueError</code> if requests is not 2D or other inputs don't match; tested on hidden data with a tie, a zero-hours desk, a missing value and four invalid inputs.</p>
<h3>Takeaways</h3>
<ul><li>Shape and labels say what every value means; dtype protects meaning.</li><li>Transpose swaps meaning; reshape only regroups.</li><li>The axis you pass disappears; broadcast per desk with <code>[:, None]</code>.</li><li>Unknown and undefined stay nan, and you report them.</li></ul>`,
ar_body:`
<p><b>اليوم 1 · الموضوع 06.01 · الدفتر A (01_numpy_police_arrays) + الدفتر B (02_numpy_selection_and_calculation).</b> كل دفتر: تمهيد (بدون درجات) ← أقسام فيها مثال محلول وخلية <i>جرّب</i> ← التمارين EX01–EX10 (100 درجة تلقائية) ← تأمل (0–10 يقيّمه المدرب) ← تقرير مهارات يُحفظ في <code>results_W06-D1-*.json</code>. البيانات تُبنى من <code>STUDENT_ID</code> الخاص بك، ومدخلات مخفية تختبر دوالك، والحلقات في بايثون مرفوضة. حالات الفحص: PASS و PARTIAL و TRY AGAIN و NOT ATTEMPTED و ERROR. المهارة: متقنة ≥ 80%، نامية ≥ 50%، وإلا لم تتحقق بعد.</p>
<h3>1. لماذا المصفوفات؟ القوائم تخزن كائنات والمصفوفات تحسب</h3>
<table><tr><th>العملية</th><th>قائمة بايثون</th><th>مصفوفة NumPy</th></tr>
<tr><td><code>x * 2</code></td><td>تكرر القائمة</td><td>تضاعف كل قيمة</td></tr>
<tr><td><code>x + y</code></td><td>تدمج قائمتين</td><td>تجمع القيم المتقابلة</td></tr>
<tr><td>جمع مليون قيمة</td><td>حلقة بايثون بطيئة</td><td>حلقة مترجمة سريعة</td></tr></table>
<pre>desk_list = [12, 8, 5];  desk_vector = np.array(desk_list)
desk_list * 2     # [12, 8, 5, 12, 8, 5]
desk_vector * 2   # [24 16 10]</pre>
<p>المصفوفة تخزن قيماً كثيرة من <b>نوع واحد</b> في كتلة ذاكرة واحدة، فتعمل العملية الواحدة على كل القيم: <b>التوجيه Vectorization</b>. خطأ شائع: توقع أن حساب القوائم يعمل كالرياضيات — إذا طالت القائمة بدل أن تكبر قيمها فحوّلها أولاً.</p>
<h3>2. تشريح المصفوفة</h3>
<table><tr><th></th><th>Report</th><th>Traffic</th><th>Document</th></tr>
<tr><td>North</td><td>12</td><td>8</td><td>5</td></tr><tr><td>East</td><td>9</td><td>6</td><td>10</td></tr>
<tr><td>South</td><td>15</td><td>4</td><td>6</td></tr><tr><td>West</td><td>6</td><td>10</td><td>9</td></tr></table>
<p><code>shape</code> = (4, 3) عدد القيم في كل محور · <code>ndim</code> = 2 محوران · <code>size</code> = 12 قيمة · <code>dtype</code> = int64. <b>المحور 0</b> ينزل عبر الصفوف (المكاتب)، و<b>المحور 1</b> يمر عبر الأعمدة (الأنواع). <code>requests[1, 2]</code> = East و Document = 10. المصفوفة <b>لا تخزن أسماء</b>: احتفظ بـ <code>desk_names</code> و <code>request_types</code> بجانبها، وتحقق بـ <code>requests.shape == (len(desk_names), len(request_types))</code>، واكتب قاموس بيانات قصيراً (المحاور، الوحدة، النوع، المصدر).</p>
<h3>3. اختر نوعاً يحفظ المعنى</h3>
<table><tr><th>البيانات</th><th>النوع</th><th>السبب</th></tr>
<tr><td>أعداد الطلبات</td><td>int64</td><td>أعداد صحيحة دقيقة</td></tr>
<tr><td>المدد (دقائق)</td><td>float64</td><td>الكسور مهمة</td></tr>

<tr><td>رمز المكتب 001</td><td>نص &lt;U3</td><td>معرّف لا كمية، والأصفار البادئة مهمة</td></tr></table>
<ul><li>للمصفوفة نوع <b>واحد</b>: <code>np.array(["North", 12, 8.5])</code> تجعل الكل نصاً، و "12" + "8.5" = "128.5".</li>
<li><code>astype(int)</code> <b>تقطع</b> الكسور: [4.6, 7.2, 9.9] ← [4 7 9]. للأقرب استخدم <code>np.rint(x).astype(int)</code>.</li>

week = g.integers(0, 20, size=(7, 3))
again = np.random.default_rng(606).integers(0, 20, size=(7, 3))
np.array_equal(week, again)   # True</pre>
<p>خطأ شائع: <code>np.arange(1, 1.3, 0.1)</code> تعطي 4 قيم لا 3 — استخدم linspace للخطوات العشرية.</p>
<h3>5. إعادة التشكيل تحفظ الترتيب والتبديل يغيّر المعنى</h3>
<pre>day_by_desk (2 x 3)        .T -> (3 x 2) صحيح          reshape(3, 2) -> خطأ
        North East South          day1 day2               [[1, 2],
day 1 [   1    2    3 ]    North [  1    4 ]               [3, 4],
day 2 [   4    5    6 ]    East  [  2    5 ]               [5, 6]]
                           South [  3    6 ]</pre>
<p><code>reshape</code> يعيد تجميع القيم بترتيبها الأصلي (الشكل الجديد يجب أن يتسع لنفس العدد، و <code>-1</code> تدع NumPy يستنتج بُعداً)؛ <code>ravel</code> تسطّح إلى 1D؛ <code>.T</code> تبدّل المحاور. North على يومين هو [1, 4] — التبديل وحده يعطيه، و reshape يعطي [1, 2] <b>بلا خطأ</b>. لا تستخدم reshape لأن الشكل "يبدو صحيحاً".</p>
<h3>6. أكثر من بُعدين</h3>
<pre>day2 = requests + np.array([1, 0, 2])
cube = np.stack([day1, day2], axis=0)
cube.shape        # (2, 4, 3)  يوم، مكتب، نوع
cube[1, 1, 2]     # اليوم 2، East، Document
cube[:, 2, 1]     # كل الأيام، South، Traffic</pre>
<p><code>np.stack</code> تضيف محوراً <b>جديداً</b> وتبقي الأيام منفصلة؛ <code>np.concatenate</code> تدمج على محور <b>موجود</b> فتعطي (8, 3) وتضيع حدود اليوم. فهرس واحد لكل محور، و <code>:</code> تبقي المحور كاملاً. "Tensor" تعني عادة مصفوفة بأي عدد من الأبعاد. دوّن ترتيب المحاور: (يوم، مكتب، نوع) و (مكتب، يوم، نوع) فيهما نفس الأرقام لكنهما يجيبان عن أسئلة مختلفة.</p>

<h3>8. نمط هندسي: تحقق عند الحدود (EX10 <code>build_daily_log</code>)</h3>
<p>افحص المصفوفات مرة في البداية: عدد القيم يطابق الشكل (<code>ValueError</code> يذكر العدد المتوقع)، والنوع يطابق المعنى (<code>TypeError</code> لغير الصحيح)، والمدخل لا يُعدّل، وبلا حلقات. النوع يحدد أيضاً عدد البايتات لكل قيمة عند الحجم الكبير.</p>
<h3>الدفتر B — 1. الفهرسة والتقطيع</h3>
<table><tr><th>التعبير</th><th>المعنى</th><th>الشكل</th></tr>
<tr><td><code>requests[1, 2]</code></td><td>قيمة واحدة</td><td>()</td></tr>
<tr><td><code>requests[-1]</code></td><td>الصف الأخير</td><td>(3,)</td></tr>
<tr><td><code>requests[:, 1]</code></td><td>عمود 1D</td><td>(4,)</td></tr>
<tr><td><code>requests[:, 1:2]</code></td><td>عمود يبقى 2D</td><td>(4, 1)</td></tr>
<tr><td><code>requests[1:3]</code></td><td>الصفان 1 و 2 (النهاية غير مشمولة)</td><td>(2, 3)</td></tr>
<tr><td><code>requests[::2]</code></td><td>كل صف ثانٍ</td><td>(2, 3)</td></tr></table>
<h3>2–3. الاختيار بالاسم وبالقاعدة</h3>
<pre>row = np.flatnonzero(desk_names == "South")   # افحص row.size أولاً!
requests[row[0]]
order = np.argsort(totals)[::-1]               # من الأعلى للأقل
traffic = requests[:, 1]
mask = (traffic >= 6) &amp; (traffic &lt;= 9)
desk_names[mask]                               # الأسماء لا True/False
np.where(traffic >= 8, "REVIEW", "OK")</pre>
<p>الفهرسة الخاصة <code>requests[[3, 0]]</code> ترجع الصفوف بالترتيب المطلوب (نسخة دائماً). الاسم غير الموجود: ارفع <code>KeyError</code> بالاسم بدل <code>IndexError</code> بعيد عن السبب (EX02 <code>row_for</code>). اجمع الأقنعة بـ <code>&amp;</code> و <code>|</code> و <code>~</code> وضع كل مقارنة بين أقواس: <code>traffic >= 6 &amp; traffic &lt;= 9</code> يعطي ValueError لأن &amp; تُنفذ قبل >=. و <code>and</code> تحتاج True/False واحدة فتفشل مع المصفوفات. <code>mask.sum()</code> تعدّ، و <code>mask.any()/all()</code> تجيب بنعم/لا. العتبات قيم تدريبية لا معايير خدمة ولا مؤشرات خطر.</p>
<h3>4. العروض والنسخ: احمِ مصدرك</h3>
<table><tr><th>الاختيار</th><th>يرجع</th><th>يغيّر المصدر؟</th></tr>
<tr><td><code>a[1:3]</code> و <code>a[:, 1]</code> و <code>a[:]</code></td><td>عرض view</td><td>نعم</td></tr>
<tr><td><code>a[[0, 2]]</code> و <code>a[a > 5]</code></td><td>نسخة copy</td><td>لا</td></tr>
<tr><td><code>a.copy()</code></td><td>نسخة</td><td>لا</td></tr></table>
<pre>demo = requests.copy(); view = demo[:, 1]; view += 100   # demo تغيّر!
np.shares_memory(view, demo)   # True</pre>
<p>انسخ أولاً قبل أي سيناريو "ماذا لو" (EX04).</p>
<h3>5–6. الحساب الموجّه وقاعدة المحور</h3>
<p>الدوال الشاملة (<code>np.round, np.clip, np.sqrt, np.abs</code>) تعمل على كل قيمة؛ اذكر الوحدة دائماً (الدقائق ÷ 60 = ساعات). <b>المحور الذي تمرره يختفي:</b> <code>sum(axis=0)</code> يحذف المكاتب ← مجموع لكل <b>نوع</b> [42 28 30]؛ و <code>sum(axis=1)</code> يحذف الأنواع ← مجموع لكل <b>مكتب</b> [25 25 25 25]. نفس القاعدة لـ mean و max و min و argmax و cumsum. <code>argmax</code> ترجع <b>أول</b> موضع عند التعادل؛ و <code>keepdims=True</code> تبقي الشكل (4, 1) للبث؛ و <code>argsort</code> للترتيب.</p>
<h3>7. البث Broadcasting: طابق الأشكال من اليمين</h3>
<table><tr><th>اليسار</th><th>اليمين</th><th>الناتج</th><th>المعنى</th></tr>
<tr><td>(4, 3)</td><td>(3,)</td><td>(4, 3)</td><td>قيمة لكل نوع</td></tr>
<tr><td>(4, 3)</td><td>(4, 1)</td><td>(4, 3)</td><td>قيمة لكل مكتب</td></tr>
<tr><td>(4, 3)</td><td>(4,)</td><td>خطأ</td><td>3 و 4 لا يتوافقان</td></tr></table>
<pre>estimated = requests * minutes_per_type
per_hour  = requests / hours[:, None]
shares    = requests / requests.sum(axis=1, keepdims=True)   # كل صف مجموعه 1</pre>
<p>البُعدان يتوافقان إذا تساويا أو كان أحدهما 1. <b>الخطأ الصامت (EX07):</b> في جدول <b>مربع</b>، <code>table / hours</code> لا يعطي خطأ لكنه يقسم الأعمدة فتصبح كل الأرقام خاطئة. حوّل متجه المكاتب إلى عمود: <code>hours[:, None]</code> أو <code>reshape(-1, 1)</code>.</p>
<h3>8. المفقود ليس صفراً وغير المعرّف ليس صفراً</h3>
<pre>d = np.array([12, 15.5, np.nan, 9, 240, 14])
d.mean()          # nan (تنتشر)
np.nanmean(d)     # 58.1 (ترفعها 240)
np.nanmedian(d)   # 14.0
valid = np.isfinite(h) &amp; (h > 0)
np.divide(c, h, out=np.full(c.shape, np.nan), where=valid)</pre>
<p><code>nan</code> = مجهول — أبلغ عن عدد القيم الملاحظة. <code>nanmean و nanmedian و nansum و nanpercentile</code> تتجاهل الفجوات. البيانات الملتوية: اذكر الوسيط بجانب المتوسط. الساعات صفر: المعدل <b>غير معرّف</b> — أبقِه nan لا 0 ولا inf، واستخدم <code>np.divide(..., where=)</code> حتى لا يظهر RuntimeWarning (EX08 <code>safe_rate</code>).</p>
<h3>9. دمج المصفوفات</h3>
<p><code>np.concatenate([a, b], axis=0)</code> محور موجود · <code>np.vstack / np.hstack</code> صفوف/أعمدة · <code>np.column_stack([table, vector])</code> تضيف متجهاً 1D كعمود (نفس عدد الصفوف) · <code>np.stack</code> محور جديد. تأكد من تطابق المعنى: عمود مجاميع المكاتب يحتاج قيمة لكل مكتب.</p>
<h3>10. دالة واحدة مختبرة (EX10 <code>summarize_workload</code>)</h3>
<p>تحقق من الأشكال مرة بأخطاء واضحة؛ لا تعدّل المدخلات؛ ابقَ موجّهاً؛ سمِّ النتائج بوحداتها؛ أبقِ غير المعرّف nan. ترجع <code>total_by_desk و total_by_type و estimated_minutes_by_desk و rate_by_desk و busiest_desk</code> (الأول عند التعادل) و <code>table_with_totals</code>؛ وترفع <code>ValueError</code> إذا لم تكن requests ثنائية الأبعاد أو لم تتطابق بقية المدخلات؛ وتُختبر على بيانات مخفية فيها تعادل ومكتب ساعاته صفر وقيمة مفقودة وأربعة مدخلات غير صالحة.</p>
<h3>الخلاصة</h3>
<ul><li>الشكل والأسماء تقول ماذا تعني كل قيمة، والنوع يحمي المعنى.</li><li>التبديل يغيّر المعنى وإعادة التشكيل تعيد التجميع فقط.</li><li>المحور الذي تمرره يختفي، والبث لكل مكتب بـ <code>[:, None]</code>.</li><li>المجهول وغير المعرّف يبقيان nan وتبلغ عنهما.</li></ul>`},

{id:"s22", unit:"u5", en:"Vectors, Matrices & Linear Systems", ar:"المتجهات والمصفوفات والأنظمة الخطية",
en_body:`
<p><b>Day 2 · topic 06.01 · Notebook 03 (vectors, norms & similarity) + Notebook 04 (matrices & linear systems).</b> Same rhythm as Day 1. We compute and verify; we do not prove theorems. Eigenvectors are an optional, unscored appendix.</p>
<h3>Why AI engineers need this</h3>
<table><tr><th>Today's operation</th><th>Where you meet it again</th><th>Week</th></tr>
<tr><td>Distance between feature vectors</td><td>nearest-neighbour models, clustering</td><td>10</td></tr>
<tr><td>Feature scaling (z-scores)</td><td>distance/gradient models; leakage rules</td><td>08–10</td></tr>
<tr><td>Least squares A x ≈ b</td><td>linear regression</td><td>09</td></tr>
<tr><td>Matrix product layer @ weights</td><td>neural network layers</td><td>11</td></tr>
<tr><td>Cosine similarity</td><td>text embeddings, semantic search</td><td>12</td></tr>
<tr><td>Similarity search, top-k</td><td>retrieval in RAG systems</td><td>14</td></tr></table>
<h3>1. A row is a vector: position = meaning</h3>
<pre>north, east = requests[0], requests[1]   # [12, 8, 5], [9, 6, 10]
north + east           # [21 14 15]
east - north           # [-3 -2  5]  change per feature
1.5 * north            # a what-if scenario, not data
requests.mean(axis=0)  # the average profile</pre>
<p>Common mistake: adding vectors whose features are in a different order — NumPy gives no warning. Keep one order and its label array.</p>
<h3>2. Norms measure size</h3>
<table><tr><th>Norm</th><th>[3, 4]</th><th>NumPy</th><th>Meaning for counts</th></tr>
<tr><td>L1</td><td>3+4 = 7</td><td><code>np.linalg.norm(v, ord=1)</code></td><td>equals the <b>total</b> (non-negative counts)</td></tr>
<tr><td>L2</td><td>√(9+16) = 5</td><td><code>np.linalg.norm(v)</code></td><td>geometric length, not a number of requests</td></tr>
<tr><td>max</td><td>4</td><td><code>np.linalg.norm(v, ord=np.inf)</code></td><td>the largest single feature</td></tr></table>
<p><code>np.linalg.norm(requests)</code> returns ONE number for the whole table; <code>axis=1</code> gives one norm per desk.</p>
<h3>3. The dot product is a weighted total</h3>
<pre>w = np.array([8, 12, 5])    # minutes per request
north @ w                    # 12*8 + 8*12 + 5*5 = 217
north * w                    # [96 96 25]  three products, not a total
requests @ w                 # one dot product per desk = (requests * w).sum(axis=1)</pre>
<p>Units: requests × minutes/request = minutes. Weights are assumptions, results are estimates. With weights [10, 10, 10] every result is 10 × the desk total.</p>
<h3>4. Distance: which desk is closest?</h3>
<pre>reference = np.array([10.0, 7.0, 7.0])
diff = requests - reference                   # (4,3) - (3,)
euclid = np.linalg.norm(diff, axis=1)
manhattan = np.abs(diff).sum(axis=1)          # requests you would have to move
desk_names[euclid.argmin()]                   # closest desk
d = np.linalg.norm(requests - requests[0], axis=1); d[0] = np.inf   # exclude itself</pre>
<p>Distance = norm of the difference. Broadcasting compares every desk at once — exactly how nearest-neighbour models search.</p>
<h3>5. Direction: unit vectors and cosine similarity</h3>
<pre>unit = v / np.linalg.norm(v)                          # length 1
cos  = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))</pre>
<table><tr><th>Pair (a = [3, 4, 0])</th><th>Distance</th><th>Cosine</th><th>Reading</th></tr>
<tr><td>a vs 2a</td><td>5.0</td><td>1.0</td><td>same mix, more work</td></tr>
<tr><td>a vs [0, 0, 5]</td><td>7.07</td><td>0.0</td><td>no overlap</td></tr></table>
<p>Distance mixes <b>how much</b> work (magnitude) and <b>what kind</b> (mix); cosine compares direction only: 1 = same mix, 0 = orthogonal, never negative for non-negative counts. A <b>zero vector</b> has no direction: cosine is undefined → return nan without dividing by zero. Missing parentheses: <code>u @ v / norm(u) * norm(v)</code> divides, then multiplies — values above 1 are the symptom (debug EX06). In the concept guide, Euclidean distance says Desk C is closest to A while cosine says Desk B has exactly A's mix at twice the volume.</p>
<h3>6. Feature scale: distances follow the biggest unit</h3>
<pre>z = (X - X.mean(axis=0)) / X.std(axis=0)   # every column: mean 0, std 1</pre>
<p>With requests_per_week (hundreds), avg_minutes (tens) and avg_distance_km (units), raw distance is dominated by the <b>largest numbers</b>, not the most important feature — the nearest desk to North changes from East (raw) to South (standardized). Mistakes: one mean for all <code>(X - X.mean()) / X.std()</code> mixes units — use <code>axis=0</code>; a constant column has std 0 → 0/0 = nan, so state a rule: its z-scores become 0 (debug EX08). Min-max scaling: <code>(x - min) / (max - min)</code>. In ML the scaling statistics come from the <b>training data only</b> (Week 08: leakage). NumPy's default std is the population std.</p>
<h3>7. Angles: parallel and orthogonal</h3>
<pre>c = np.clip(cos, -1, 1); np.degrees(np.arccos(c))
u @ v == 0   # orthogonal?</pre>
<p>Parallel: cosine 1, angle 0° (any positive multiple). Orthogonal: dot product 0, angle 90° — no shared request type. Rounding can push cosine above 1, so clip first.</p>
<h3>8. Challenge EX10 <code>rank_similar(profiles, names, query, k, metric="cosine")</code></h3>
<p>Returns the k most similar desk names: cosine → largest first, euclidean → smallest first. Zero vectors (nan cosine) rank <b>last</b>; ties keep the original row order (stable sort); <code>ValueError</code> if profiles isn't 2D, names don't match rows, query length differs, k is outside 1..n, or the metric is unknown. No warnings, no loops, inputs unchanged.</p>
<h3>Notebook 04 — 1. The matrix product rule</h3>
<p><b>(n, k) @ (k, m) → (n, m):</b> inner sizes match; the result keeps the outer sizes. <code>C[i, j]</code> = dot product of row i of A with column j of B. <code>*</code> is elementwise ((4,3) with (3,) → (4,3)); <code>@</code> multiplies and adds ((4,3) @ (3,) → (4,)). Operand order: <code>minutes_per_type @ requests</code> fails because (3,) @ (4, 3) has inner sizes 3 and 4.</p>
<h3>2. Many scenarios in one product</h3>
<table><tr><th></th><th>Current</th><th>Slow</th><th>Fast</th></tr>
<tr><td>Report</td><td>8</td><td>10</td><td>6</td></tr><tr><td>Traffic</td><td>12</td><td>15</td><td>9</td></tr><tr><td>Document</td><td>5</td><td>6</td><td>4</td></tr></table>
<p><code>requests @ scenarios</code> (desks × 3) gives North 217 / 270 / 164, East 194 / 240 / 148, South 198 / 246 / 150, West 213 / 264 / 162; <code>argmin(axis=1)</code> = cheapest scenario per desk. Silent bug (debug EX05): on square inputs <code>requests * scenarios</code> runs without error and is meaningless — use @ and validate the inner sizes.</p>
<h3>3. Aggregate rows with a one-hot matrix</h3>
<pre>regions = np.unique(desk_region)
M = (regions[:, None] == desk_region[None, :]).astype(int)   # regions x desks
M @ requests                                                 # regions x types</pre>
<p>Central = North + East → [21 14 15]; Coast = South + West → [21 14 15]. Invariant: every column of M has exactly one 1, and region totals add up to the grand total.</p>
<h3>4. Transpose and similarity matrices</h3>
<p><code>A @ I = A</code>; in general <code>A @ B ≠ B @ A</code>; <code>(A @ B).T = B.T @ A.T</code> (order reverses). The <b>Gram matrix</b> <code>X @ X.T</code> holds the dot product of every pair of rows; the cosine matrix = Gram / <code>np.outer(norms, norms)</code>, diagonal 1 (EX04: most similar pair, ignore the diagonal).</p>
<h3>5. From a word problem to A @ x = b</h3>
<table><tr><th></th><th>Format X</th><th>Format Y</th><th>Target</th></tr>
<tr><td>records</td><td>2</td><td>1</td><td>24</td></tr><tr><td>traffic</td><td>1</td><td>2</td><td>21</td></tr></table>
<pre>x = np.linalg.solve(A, b)          # [9. 6.]
np.linalg.norm(A @ x - b)          # ~0 -> verified</pre>
<p>Rows = requirements, columns = unknowns. Verify the residual is near 0, then interpret: sessions must be whole and non-negative to be a usable plan — a target of [20, 21] gives 6.33 and 7.33: correct, but not usable.</p>
<h3>6–7. No unique answer: rank, singular, inverse</h3>
<table><tr><th>Situation</th><th>Rank</th><th>solve()</th></tr>
<tr><td>independent rows</td><td>= n</td><td>unique answer</td></tr>
<tr><td>dependent, consistent</td><td>&lt; n</td><td>LinAlgError: infinitely many</td></tr>
<tr><td>dependent, contradictory</td><td>&lt; n</td><td>LinAlgError: none</td></tr></table>
<p>Decide with <code>np.linalg.matrix_rank</code>, not a "small" determinant. <code>inv(A)</code> is for understanding; <code>solve(A, b)</code> for computing. <code>cond(A)</code> far above 1e6 means small input errors cause big output errors. Debug EX08: <code>solve_plan</code> must return None when rank &lt; n and validate shapes.</p>
<h3>8. More equations than unknowns: least squares</h3>
<pre>design = np.column_stack([requests_obs, np.ones_like(requests_obs)])
slope, intercept = np.linalg.lstsq(design, hours_obs, rcond=None)[0]</pre>
<p>8 weeks, 2 unknowns: no exact solution; <code>lstsq</code> minimizes squared errors — this is linear regression (Week 09). The line describes synthetic data; it is not a staffing rule and does not prove cause and effect (EX09 predicts hours for 40 requests). Challenge EX10: <code>region_scenario_report()</code>.</p>
<h3>Takeaways</h3>
<ul><li>Norms measure size; distances compare volume; cosine compares mix; zero vectors are undefined.</li><li>Scale features before comparing distances.</li><li>Write (n, k) @ (k, m) → (n, m) first; one-hot @ table aggregates groups.</li><li>Solve, then verify and interpret the answer.</li></ul>`,

<p><b>اليوم 2 · الموضوع 06.01 · الدفتر 03 (المتجهات والمعايير والتشابه) + الدفتر 04 (المصفوفات والأنظمة الخطية).</b> نفس إيقاع اليوم 1. نحسب ونتحقق ولا نبرهن نظريات. المتجهات الذاتية ملحق اختياري بدون درجات.</p>
<h3>لماذا يحتاج مهندسو الذكاء الاصطناعي هذا</h3>
<table><tr><th>عملية اليوم</th><th>أين تقابلها لاحقاً</th><th>الأسبوع</th></tr>
<tr><td>المسافة بين متجهات الخصائص</td><td>نماذج أقرب الجيران والتجميع</td><td>10</td></tr>
<tr><td>توحيد مقياس الخصائص (z-scores)</td><td>نماذج المسافة/التدرج وقواعد التسرب</td><td>08–10</td></tr>
<tr><td>المربعات الصغرى A x ≈ b</td><td>الانحدار الخطي</td><td>09</td></tr>
<tr><td>ضرب المصفوفات layer @ weights</td><td>طبقات الشبكات العصبية</td><td>11</td></tr>
<tr><td>تشابه جيب التمام</td><td>تضمينات النصوص والبحث الدلالي</td><td>12</td></tr>
<tr><td>بحث التشابه top-k</td><td>الاسترجاع في أنظمة RAG</td><td>14</td></tr></table>
<h3>1. الصف متجه: الموضع = المعنى</h3>
<pre>north, east = requests[0], requests[1]   # [12, 8, 5], [9, 6, 10]
north + east           # [21 14 15]
east - north           # [-3 -2  5]  التغير لكل خاصية
1.5 * north            # سيناريو افتراضي لا بيانات
requests.mean(axis=0)  # الملف المتوسط</pre>
<p>خطأ شائع: جمع متجهات خصائصها بترتيب مختلف — NumPy لا يحذّر. التزم بترتيب واحد ومصفوفة أسمائه.</p>
<h3>2. المعايير Norms تقيس الحجم</h3>
<table><tr><th>المعيار</th><th>[3, 4]</th><th>NumPy</th><th>المعنى للأعداد</th></tr>
<tr><td>L1</td><td>3+4 = 7</td><td><code>np.linalg.norm(v, ord=1)</code></td><td>يساوي <b>المجموع</b> (أعداد غير سالبة)</td></tr>
<tr><td>L2</td><td>√(9+16) = 5</td><td><code>np.linalg.norm(v)</code></td><td>طول هندسي لا عدد طلبات</td></tr>
<tr><td>max</td><td>4</td><td><code>np.linalg.norm(v, ord=np.inf)</code></td><td>أكبر خاصية منفردة</td></tr></table>
<p><code>np.linalg.norm(requests)</code> ترجع رقماً واحداً للجدول كله؛ و <code>axis=1</code> تعطي معياراً لكل مكتب.</p>
<h3>3. الضرب النقطي مجموع موزون</h3>
<pre>w = np.array([8, 12, 5])    # دقائق لكل طلب
north @ w                    # 12*8 + 8*12 + 5*5 = 217
north * w                    # [96 96 25]  ثلاثة نواتج لا مجموع
requests @ w                 # ضرب نقطي لكل مكتب = (requests * w).sum(axis=1)</pre>
<p>الوحدات: طلبات × دقائق/طلب = دقائق. الأوزان افتراضات والنتائج تقديرات. مع الأوزان [10, 10, 10] تكون كل نتيجة 10 × مجموع المكتب.</p>
<h3>4. المسافة: أي مكتب الأقرب؟</h3>
<pre>reference = np.array([10.0, 7.0, 7.0])
diff = requests - reference                   # (4,3) - (3,)
euclid = np.linalg.norm(diff, axis=1)
manhattan = np.abs(diff).sum(axis=1)          # الطلبات التي يلزم نقلها
desk_names[euclid.argmin()]                   # أقرب مكتب
d = np.linalg.norm(requests - requests[0], axis=1); d[0] = np.inf   # استبعد نفسه</pre>
<p>المسافة = معيار الفرق. البث يقارن كل المكاتب دفعة واحدة — تماماً كما تبحث نماذج أقرب الجيران.</p>
<h3>5. الاتجاه: متجهات الوحدة وتشابه جيب التمام</h3>
<pre>unit = v / np.linalg.norm(v)                          # طوله 1
cos  = u @ v / (np.linalg.norm(u) * np.linalg.norm(v))</pre>
<table><tr><th>الزوج (a = [3, 4, 0])</th><th>المسافة</th><th>جيب التمام</th><th>القراءة</th></tr>
<tr><td>a مقابل 2a</td><td>5.0</td><td>1.0</td><td>نفس المزيج وعمل أكثر</td></tr>
<tr><td>a مقابل [0, 0, 5]</td><td>7.07</td><td>0.0</td><td>لا تداخل</td></tr></table>
<p>المسافة تخلط <b>كم</b> العمل (الحجم) و<b>نوعه</b> (المزيج)؛ وجيب التمام يقارن الاتجاه فقط: 1 = نفس المزيج، 0 = متعامد، ولا يكون سالباً للأعداد غير السالبة. <b>المتجه الصفري</b> بلا اتجاه: جيب التمام غير معرّف ← أرجع nan دون القسمة على صفر. نسيان الأقواس: <code>u @ v / norm(u) * norm(v)</code> يقسم ثم يضرب — ظهور قيم أكبر من 1 هو العَرَض (التمرين EX06). في دليل المفاهيم، المسافة الإقليدية تقول إن المكتب C الأقرب لـ A، بينما جيب التمام يقول إن B له نفس مزيج A تماماً بضعف الحجم.</p>
<h3>6. مقياس الخصائص: المسافات تتبع أكبر وحدة</h3>
<pre>z = (X - X.mean(axis=0)) / X.std(axis=0)   # كل عمود: متوسط 0 وانحراف 1</pre>
<p>مع requests_per_week (مئات) و avg_minutes (عشرات) و avg_distance_km (آحاد)، تهيمن <b>الأرقام الأكبر</b> على المسافة الخام لا الخاصية الأهم — أقرب مكتب لـ North يتغير من East (خام) إلى South (موحّد). أخطاء: متوسط واحد للكل <code>(X - X.mean()) / X.std()</code> يخلط الوحدات — استخدم <code>axis=0</code>؛ والعمود الثابت انحرافه 0 ← 0/0 = nan، فضع قاعدة: درجاته المعيارية تصبح 0 (التمرين EX08). التحجيم بين الأدنى والأعلى: <code>(x - min) / (max - min)</code>. في تعلم الآلة تُحسب إحصاءات التحجيم من <b>بيانات التدريب فقط</b> (الأسبوع 08: التسرب). الانحراف الافتراضي في NumPy هو انحراف المجتمع.</p>
<h3>7. الزوايا: المتوازي والمتعامد</h3>
<pre>c = np.clip(cos, -1, 1); np.degrees(np.arccos(c))
u @ v == 0   # متعامدان؟</pre>
<p>المتوازي: جيب التمام 1 والزاوية 0° (أي مضاعف موجب). المتعامد: الضرب النقطي 0 والزاوية 90° — لا نوع طلب مشترك. التقريب قد يرفع جيب التمام فوق 1، فقصّه أولاً.</p>
<h3>8. التحدي EX10 <code>rank_similar(profiles, names, query, k, metric="cosine")</code></h3>
<p>ترجع أسماء أكثر k مكاتب تشابهاً: cosine ← الأكبر أولاً، و euclidean ← الأصغر أولاً. المتجهات الصفرية (جيب تمام nan) تأتي <b>آخراً</b>؛ والتعادل يحفظ ترتيب الصفوف الأصلي (فرز مستقر)؛ و <code>ValueError</code> إذا لم تكن profiles ثنائية الأبعاد، أو لم تطابق الأسماء الصفوف، أو اختلف طول الاستعلام، أو كان k خارج 1..n، أو كان المقياس مجهولاً. بلا تحذيرات ولا حلقات والمدخلات بلا تغيير.</p>
<h3>الدفتر 04 — 1. قاعدة ضرب المصفوفات</h3>
<p><b>(n, k) @ (k, m) ← (n, m):</b> الأحجام الداخلية تتطابق والناتج يحتفظ بالخارجية. <code>C[i, j]</code> = الضرب النقطي للصف i من A مع العمود j من B. <code>*</code> عنصراً بعنصر ((4,3) مع (3,) ← (4,3))؛ و <code>@</code> تضرب وتجمع ((4,3) @ (3,) ← (4,)). ترتيب المعاملات: <code>minutes_per_type @ requests</code> تفشل لأن (3,) @ (4, 3) أحجامها الداخلية 3 و 4.</p>
<h3>2. سيناريوهات كثيرة في ضرب واحد</h3>
<table><tr><th></th><th>الحالي</th><th>البطيء</th><th>السريع</th></tr>
<tr><td>Report</td><td>8</td><td>10</td><td>6</td></tr><tr><td>Traffic</td><td>12</td><td>15</td><td>9</td></tr><tr><td>Document</td><td>5</td><td>6</td><td>4</td></tr></table>
<p><code>requests @ scenarios</code> (مكاتب × 3) تعطي North ‏217 / 270 / 164 و East ‏194 / 240 / 148 و South ‏198 / 246 / 150 و West ‏213 / 264 / 162؛ و <code>argmin(axis=1)</code> = أرخص سيناريو لكل مكتب. خطأ صامت (EX05): مع المدخلات المربعة <code>requests * scenarios</code> تعمل بلا خطأ ولا معنى لها — استخدم @ وتحقق من الأحجام الداخلية.</p>
<h3>3. تجميع الصفوف بمصفوفة One-hot</h3>
<pre>regions = np.unique(desk_region)
M = (regions[:, None] == desk_region[None, :]).astype(int)   # مناطق × مكاتب
M @ requests                                                 # مناطق × أنواع</pre>
<p>Central = North + East ← [21 14 15]؛ و Coast = South + West ← [21 14 15]. الثابت: كل عمود في M فيه 1 واحد بالضبط، ومجاميع المناطق تساوي المجموع الكلي.</p>
<h3>4. التبديل ومصفوفات التشابه</h3>
<p><code>A @ I = A</code>؛ وعموماً <code>A @ B ≠ B @ A</code>؛ و <code>(A @ B).T = B.T @ A.T</code> (الترتيب ينعكس). <b>مصفوفة غرام</b> <code>X @ X.T</code> فيها الضرب النقطي لكل زوج صفوف؛ ومصفوفة جيب التمام = غرام ÷ <code>np.outer(norms, norms)</code> وقطرها 1 (EX04: أكثر زوج تشابهاً مع تجاهل القطر).</p>
<h3>5. من مسألة كلامية إلى A @ x = b</h3>
<table><tr><th></th><th>الصيغة X</th><th>الصيغة Y</th><th>الهدف</th></tr>
<tr><td>records</td><td>2</td><td>1</td><td>24</td></tr><tr><td>traffic</td><td>1</td><td>2</td><td>21</td></tr></table>
<pre>x = np.linalg.solve(A, b)          # [9. 6.]
np.linalg.norm(A @ x - b)          # ~0 -> تم التحقق</pre>
<p>الصفوف = المتطلبات والأعمدة = المجاهيل. تحقق أن البواقي قريبة من 0 ثم فسّر: الجلسات يجب أن تكون صحيحة وغير سالبة لتكون خطة قابلة للاستخدام — الهدف [20, 21] يعطي 6.33 و 7.33: صحيح رياضياً لكنه غير قابل للاستخدام.</p>
<h3>6–7. لا حل وحيد: الرتبة والمنفردة والمعكوس</h3>
<table><tr><th>الحالة</th><th>الرتبة</th><th>solve()</th></tr>
<tr><td>صفوف مستقلة</td><td>= n</td><td>حل وحيد</td></tr>
<tr><td>تابعة ومتسقة</td><td>&lt; n</td><td>LinAlgError: حلول لا نهائية</td></tr>
<tr><td>تابعة ومتناقضة</td><td>&lt; n</td><td>LinAlgError: لا حل</td></tr></table>
<p>قرّر بـ <code>np.linalg.matrix_rank</code> لا بمحدد "صغير". <code>inv(A)</code> للفهم و <code>solve(A, b)</code> للحساب. <code>cond(A)</code> أعلى بكثير من 1e6 يعني أن أخطاء صغيرة في المدخلات تسبب أخطاء كبيرة في الناتج. التمرين EX08: <code>solve_plan</code> يجب أن ترجع None عندما الرتبة &lt; n وتتحقق من الأشكال.</p>
<h3>8. معادلات أكثر من المجاهيل: المربعات الصغرى</h3>
<pre>design = np.column_stack([requests_obs, np.ones_like(requests_obs)])
slope, intercept = np.linalg.lstsq(design, hours_obs, rcond=None)[0]</pre>
<p>8 أسابيع ومجهولان: لا حل دقيق؛ و <code>lstsq</code> تقلل مجموع مربعات الأخطاء — هذا هو الانحدار الخطي (الأسبوع 09). الخط يصف بيانات مصطنعة، وليس قاعدة توظيف ولا يثبت السببية (EX09 يتنبأ بالساعات لـ 40 طلباً). التحدي EX10: <code>region_scenario_report()</code>.</p>
<h3>الخلاصة</h3>
<ul><li>المعايير تقيس الحجم، والمسافات تقارن الحجم، وجيب التمام يقارن المزيج، والمتجهات الصفرية غير معرّفة.</li><li>وحّد مقياس الخصائص قبل مقارنة المسافات.</li><li>اكتب (n, k) @ (k, m) ← (n, m) أولاً؛ و one-hot @ table يجمّع المجموعات.</li><li>حُلّ ثم تحقق ثم فسّر الحل.</li></ul>`}
);

{id:"s23", unit:"u5", en:"Pandas: Loading & Inspecting CSV and SQL Data", ar:"Pandas: تحميل بيانات CSV و SQL وفحصها",
en_body:`
<p><b>Day 3 · topic 06.02 · Notebook 05 (CSV loading & inspection, depth DEEP) + Notebook 06 (SQL, summaries & sampling).</b> Rule of the day: <b>describe the data and report problems; do not fix them yet</b> — cleaning is Day 4. Loading can damage data (007 becomes 7; one "unknown" turns numbers into text). Inspection measures problems with denominators: "28 of 303 minutes values are missing (9.2%)". Cleaning needs decisions from a data owner; today we write the notes that support those decisions.</p>
<p>Pipeline: <code>Load with a contract → First look → Profile → Report issues → Clean (Day 4) → Merge (Day 4)</code>.</p>
<h3>1. From arrays to labelled tables</h3>
<table><tr><th>Object</th><th>What it is</th><th>Labels</th></tr>
<tr><td>Series</td><td>one column: values + an index</td><td>index (row names)</td></tr>
<tr><td>DataFrame</td><td>several Series sharing one index</td><td>index + column names</td></tr></table>
<pre>s = pd.Series([18.5, 12.0, 25.5], index=["North", "East", "South"])
s["East"]     # by label -> 12.0
s.iloc[0]     # by position -> 18.5
s.idxmax()    # label of max -> 'South'</pre>
<p>Day 1 kept <code>desk_names</code> next to the array; a DataFrame keeps labels <b>inside</b>, so they can't get out of step. Common mistake: <code>pd.DataFrame(list_of_lists)</code> without <code>columns=</code> gives columns 0, 1, 2 — nothing fails until code needs the names.</p>
<h3>2. read_csv guesses — guessing damages data</h3>
<pre>naive = pd.read_csv(path)
naive["desk_code"].unique()   # [1 2 7 3 4]   007 became 7
naive["minutes"].dtype        # text: 'unknown' broke the column

requests_df = pd.read_csv(path,
    dtype={"request_id": str, "desk_code": str},
    na_values=["unknown", "n/a"],
    parse_dates=["opened_at"])</pre>
<table><tr><th>Parameter</th><th>Use</th><th>Example</th></tr>
<tr><td><code>dtype=</code></td><td>force column types</td><td>{"desk_code": str}</td></tr>
<tr><td><code>na_values=</code></td><td>extra tokens meaning missing</td><td>["unknown", "n/a"]</td></tr>
<tr><td><code>parse_dates=</code></td><td>text → datetimes</td><td>["opened_at"]</td></tr>
<tr><td><code>usecols=</code> / <code>nrows=</code></td><td>fewer columns / a preview</td><td>["request_id"] / 5</td></tr></table>
<p><b>Fix types in read_csv, not afterwards:</b> <code>naive['desk_code'].astype(str)</code> gives '7' — the zeros are gone, and <code>zfill(3)</code> only guesses them back if every code has 3 digits. After the contract, <code>minutes</code> can still be text because of "15 min" — it is NOT an agreed missing token: inspect it today, Day 4 decides a rule. Debug EX03 restores the contract in a team loader; hidden files with only agreed tokens must give a numeric minutes column. When a file is too messy for a contract, load everything as text with <code>dtype=str, keep_default_na=False</code>.</p>
<h3>3. First look</h3>
<table><tr><th>Method</th><th>Answers</th></tr>
<tr><td><code>df.shape</code></td><td>rows and columns</td></tr>
<tr><td><code>df.head() / df.tail()</code></td><td>first / last rows (often sorted, not representative)</td></tr>
<tr><td><code>df.sample(n, random_state=1)</code></td><td>a random, reproducible look</td></tr>
<tr><td><code>df.info()</code></td><td>non-null counts, dtypes, memory</td></tr>
<tr><td><code>df.memory_usage(deep=True)</code></td><td>bytes per column</td></tr>
<tr><td><code>df.select_dtypes(...)</code></td><td>columns by kind</td></tr></table>
<p>Why is <code>minutes</code> among the text columns? Because of the "15 min" tokens.</p>
<h3>4. Profile columns</h3>
<p><code>describe()</code> numeric columns (count, mean, std, quartiles) · <code>describe(exclude="number")</code> text (count, unique, top, freq) · <code>value_counts(dropna=False)</code> counts including missing · <code>value_counts(normalize=True)</code> shares · <code>nunique()</code> / <code>unique()</code>. Profiling <b>reveals</b> "Closed" vs "closed" (counted separately) — preview with <code>.str.strip().str.lower()</code> without changing the data, and record the issue.</p>
<h3>5. Missing values and duplicates</h3>
<pre>df.isna().sum()          # gaps per column
df.isna().mean()         # share per column
df.isna().any(axis=1)    # rows with a gap
df.duplicated()          # repeats an EARLIER row exactly
df.duplicated(subset=["request_id"], keep=False)   # every copy of a repeated ID</pre>
<p>Report with a denominator: "3 of 12 minutes values are missing (25%)", not just "3 missing". <code>keep=False</code> marks every copy so you see both rows of a pair.</p>
<h3>6. Select rows and columns</h3>
<table><tr><th>Expression</th><th>Selects by</th></tr>
<tr><td><code>df["minutes"]</code></td><td>name → Series</td></tr>
<tr><td><code>df[["request_id", "minutes"]]</code></td><td>names → DataFrame</td></tr>
<tr><td><code>df.loc[mask, ["request_id"]]</code></td><td>labels and masks</td></tr>
<tr><td><code>df.iloc[:5, -2:]</code></td><td>positions (stop excluded)</td></tr>
<tr><td><code>df.query("desk == 'North' and status == 'open'")</code></td><td>a readable condition</td></tr></table>
<p><b>Chained assignment fails:</b> <code>df[mask]['flag'] = True</code> changes a TEMPORARY selection (warning or nothing). Use <code>df.loc[mask, 'flag'] = True</code> on your own <code>copy()</code>, or build the column in one expression. Debug EX08 <code>flag_long_cases</code> left every flag False and added a column to the caller's table; missing minutes are not long cases.</p>
<h3>7. Find the tokens that break a column</h3>
<pre>as_number = pd.to_numeric(df["minutes"], errors="coerce")   # a NEW Series
bad = df["minutes"].notna() &amp; as_number.isna()
df.loc[bad, "minutes"].unique()   # e.g. ['15 min']; df itself is unchanged</pre>
<p>Present before + NaN after = a bad token. Record it; decide the rule on Day 4. <code>pd.to_datetime(..., errors="coerce")</code> does the same for dates. Never compute with identifiers.</p>
<h3>8–9. Index, sorting and an inspection report</h3>
<p><code>set_index("request_id")</code> after checking <code>index.is_unique</code> (duplicate labels make loc return several rows); <code>sort_values(["desk", "opened_at"], ascending=[...])</code>; <code>reset_index()</code>. EX10 <code>inspect_table(df, expected_schema, id_column)</code> returns plain values (int, dict, list) for JSON: <code>n_rows, n_cols, missing_by_column, duplicate_rows, id_unique</code> and a sorted <code>schema_problems</code> list with exact messages: <code>"missing column: desk"</code>, <code>"unexpected column: note"</code>, <code>"wrong type: minutes (expected number, found text)"</code>. Never modify the table you inspect.</p>
<h3>Notebook 06 — 1. SQLite from Python</h3>
<pre>with closing(sqlite3.connect(path)) as con:     # closed even after an error
    pd.read_sql_query("SELECT name FROM sqlite_master WHERE type = 'table'", con)
sqlite3.connect(Path(p).resolve().as_uri() + "?mode=ro", uri=True)   # read-only</pre>
<p>SQLite stores a whole database in one file; <code>PRAGMA table_info(name)</code> lists columns. Common mistake: a wrong path silently <b>creates</b> an empty database, so you get "no such table" instead of "file not found". The read-only URI fails for a missing file and refuses every write.</p>
<h3>2. read_sql_query with explicit columns</h3>
<p>Name the columns (no <code>SELECT *</code>) so a new database column can't change results silently. TEXT stays text (codes keep zeros); NULL becomes NaN; dates need <code>parse_dates</code>.</p>
<h3>3. Security: parameters, never string formatting</h3>
<table><tr><th>Query built with</th><th>Input <code>North' OR '1'='1</code></th></tr>
<tr><td>f-string <code>WHERE desk = '{user_input}'</code></td><td>12 rows: every desk leaked</td></tr>
<tr><td>parameter <code>WHERE desk = ?, params=(user_input,)</code></td><td>0 rows: treated as data</td></tr></table>
<pre>ph = ",".join("?" * len(statuses))           # "?,?"
sql = f"... WHERE status IN ({ph})"          # placeholders only
pd.read_sql_query(sql, con, params=statuses)</pre>
<p>That is <b>SQL injection</b>, one of the most common security flaws. Parameters also make values with quotes (O'Hare) work (debug EX03).</p>
<h3>4. Do two sources agree?</h3>
<pre>a = db.set_index("request_id").sort_index()["minutes"]
b = csv.set_index("request_id").sort_index()["minutes"]
differs = ~((a == b) | (a.isna() &amp; b.isna()))
a.index[differs]</pre>
<p>Check the same ID set first; align by ID, not row position (exports are shuffled); <code>NaN == NaN</code> is False, so treat both-missing as equal; <code>df.compare</code> shows differing cells.</p>
<h3>5 &amp; 8. Describe numbers honestly</h3>
<table><tr><th>Demo minutes (12 rows)</th><th>Value</th></tr>
<tr><td>observed (count)</td><td>9</td></tr><tr><td>mean of observed</td><td>18.5</td></tr>
<tr><td>median of observed</td><td>15.0</td></tr><tr><td>mean after fillna(0)</td><td>13.9 (biased)</td></tr></table>
<p>Pandas skips NaN by default. <code>std()</code>: Pandas ddof=1 (sample), NumPy ddof=0. Denominator: <code>count()</code>, not <code>len()</code>. Three classic mistakes: <code>fillna(0)</code> before averaging makes slow desks look fast (debug EX08); <code>len(s)</code> as observations; <code>head(n)</code> as a sample.</p>
<h3>6–7. Groups and time</h3>
<pre>df.groupby("desk")["minutes"].agg(n_requests="size", n_observed="count", median_minutes="median")
pd.crosstab(df["desk"], df["status"], normalize="index")</pre>
<p><code>size</code> counts rows, <code>count</code> observed values; the difference is the missing values per group. <code>.dt.month</code>, <code>.dt.year</code>, <code>.dt.day_name()</code>, <code>.dt.to_period("M")</code> (2025-01), and <code>(max - min).days</code> for a span.</p>
<h3>9. Samples: random, stratified, convenient</h3>
<table><tr><th>Sample</th><th>Code</th><th>Risk</th></tr>
<tr><td>simple random</td><td><code>df.sample(n=30, random_state=7)</code></td><td>small groups may be missed</td></tr>
<tr><td>stratified</td><td><code>df.groupby("desk").sample(n=3, random_state=7)</code></td><td>fixed number per group</td></tr>
<tr><td>convenience</td><td><code>df.head(30)</code></td><td>table in time order → only the earliest weeks</td></tr></table>
<p><code>random_state</code> makes every sample reproducible by your instructor.</p>
<h3>10. A safe loader (EX10 <code>load_desk_requests(db_path, desk, statuses)</code>)</h3>
<p>Fail clearly if the file is missing (<code>FileNotFoundError</code>, no file created); read-only connection (<code>mode=ro</code>); explicit columns and parameters only — for desk AND every status; <code>ValueError</code> for an empty statuses list (invalid IN); close with <code>closing(...)</code>; return typed, sorted data with parsed dates. Example: <code>load_desk_requests(db, "Gate", ["open", "pending"])</code> → K-1, K-4, K-5.</p>
<h3>Takeaways</h3>
<ul><li>Contracts protect data at load time; inspect, measure and report with denominators.</li><li>loc / iloc; no chained assignment.</li><li>Parameters, never f-strings, in SQL.</li><li>Observed values only: count() is the denominator. Sample randomly and reproducibly.</li></ul>`,
