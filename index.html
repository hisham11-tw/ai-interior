<p><b>اليوم 3 · الموضوع 06.02 · الدفتر 05 (تحميل CSV وفحصه، عمق عميق) + الدفتر 06 (SQL والملخصات والعينات).</b> قاعدة اليوم: <b>صِف البيانات وأبلغ عن المشكلات ولا تصلحها بعد</b> — التنظيف في اليوم 4. التحميل قد يتلف البيانات (007 تصبح 7، وكلمة "unknown" واحدة تحوّل الأرقام إلى نص). الفحص يقيس المشكلات بمقاماتها: "28 من 303 قيمة minutes مفقودة (9.2%)". التنظيف يحتاج قرارات من مالك البيانات، واليوم نكتب الملاحظات التي تدعم تلك القرارات.</p>
<p>المسار: <code>تحميل بعقد ← نظرة أولى ← تحليل الأعمدة ← الإبلاغ عن المشكلات ← التنظيف (اليوم 4) ← الدمج (اليوم 4)</code>.</p>
<h3>1. من المصفوفات إلى الجداول المسماة</h3>
<table><tr><th>الكائن</th><th>ما هو</th><th>الأسماء</th></tr>
<tr><td>Series</td><td>عمود واحد: قيم + فهرس</td><td>الفهرس (أسماء الصفوف)</td></tr>
<tr><td>DataFrame</td><td>عدة Series تتشارك فهرساً واحداً</td><td>الفهرس + أسماء الأعمدة</td></tr></table>
<pre>s = pd.Series([18.5, 12.0, 25.5], index=["North", "East", "South"])
s["East"]     # بالاسم -> 12.0
s.iloc[0]     # بالموضع -> 18.5
s.idxmax()    # اسم الأكبر -> 'South'</pre>
<p>في اليوم 1 أبقينا <code>desk_names</code> بجانب المصفوفة؛ أما DataFrame فيحفظ الأسماء <b>بداخله</b> فلا تنفصل عن القيم. خطأ شائع: <code>pd.DataFrame(list_of_lists)</code> بدون <code>columns=</code> يعطي أعمدة 0 و 1 و 2 — لا شيء يفشل حتى يحتاج الكود الأسماء.</p>
<h3>2. read_csv يخمّن — والتخمين يتلف البيانات</h3>
<pre>naive = pd.read_csv(path)
naive["desk_code"].unique()   # [1 2 7 3 4]   007 أصبحت 7
naive["minutes"].dtype        # نص: 'unknown' أفسدت العمود

requests_df = pd.read_csv(path,
    dtype={"request_id": str, "desk_code": str},
    na_values=["unknown", "n/a"],
    parse_dates=["opened_at"])</pre>
<table><tr><th>المعامل</th><th>الاستخدام</th><th>مثال</th></tr>
<tr><td><code>dtype=</code></td><td>فرض أنواع الأعمدة</td><td>{"desk_code": str}</td></tr>
<tr><td><code>na_values=</code></td><td>رموز إضافية تعني مفقود</td><td>["unknown", "n/a"]</td></tr>
<tr><td><code>parse_dates=</code></td><td>نص ← تواريخ</td><td>["opened_at"]</td></tr>
<tr><td><code>usecols=</code> / <code>nrows=</code></td><td>أعمدة أقل / معاينة</td><td>["request_id"] / 5</td></tr></table>
<p><b>أصلح الأنواع داخل read_csv لا بعدها:</b> <code>naive['desk_code'].astype(str)</code> تعطي '7' — الأصفار ضاعت، و <code>zfill(3)</code> تخمّنها فقط إذا كانت كل الرموز من 3 خانات. بعد العقد قد يبقى <code>minutes</code> نصاً بسبب "15 min" — وهي ليست رمز فقد متفقاً عليه: افحصها اليوم وقرر القاعدة في اليوم 4. التمرين EX03 يعيد العقد في دالة تحميل الفريق، والملفات المخفية التي فيها الرموز المتفق عليها فقط يجب أن تعطي عمود minutes رقمياً. عندما يكون الملف فوضوياً جداً للعقد، حمّل كل شيء كنص بـ <code>dtype=str, keep_default_na=False</code>.</p>
<h3>3. النظرة الأولى</h3>
<table><tr><th>الدالة</th><th>تجيب عن</th></tr>
<tr><td><code>df.shape</code></td><td>الصفوف والأعمدة</td></tr>
<tr><td><code>df.head() / df.tail()</code></td><td>أول/آخر الصفوف (مرتبة غالباً فلا تمثل الكل)</td></tr>
<tr><td><code>df.sample(n, random_state=1)</code></td><td>نظرة عشوائية قابلة للتكرار</td></tr>
<tr><td><code>df.info()</code></td><td>أعداد غير الفارغ والأنواع والذاكرة</td></tr>
<tr><td><code>df.memory_usage(deep=True)</code></td><td>البايتات لكل عمود</td></tr>
<tr><td><code>df.select_dtypes(...)</code></td><td>الأعمدة حسب الصنف</td></tr></table>
<p>لماذا <code>minutes</code> ضمن الأعمدة النصية؟ بسبب رموز "15 min".</p>
<h3>4. تحليل الأعمدة</h3>
<p><code>describe()</code> للأعمدة الرقمية (العدد والمتوسط والانحراف والربيعيات) · <code>describe(exclude="number")</code> للنصية (العدد والفريد والأكثر وتكراره) · <code>value_counts(dropna=False)</code> الأعداد مع المفقود · <code>value_counts(normalize=True)</code> النسب · <code>nunique()</code> / <code>unique()</code>. التحليل <b>يكشف</b> "Closed" مقابل "closed" (تُعدّان منفصلتين) — عاين بـ <code>.str.strip().str.lower()</code> دون تغيير البيانات وسجّل المشكلة.</p>
<h3>5. القيم المفقودة والتكرارات</h3>
<pre>df.isna().sum()          # الفجوات لكل عمود
df.isna().mean()         # النسبة لكل عمود
df.isna().any(axis=1)    # الصفوف التي فيها فجوة
df.duplicated()          # يكرر صفاً سابقاً تماماً
df.duplicated(subset=["request_id"], keep=False)   # كل نسخ المعرّف المكرر</pre>
<p>أبلغ بالمقام: "3 من 12 قيمة minutes مفقودة (25%)" لا "3 مفقودة" فقط. <code>keep=False</code> تعلّم كل النسخ لترى الصفين معاً.</p>
<h3>6. اختيار الصفوف والأعمدة</h3>
<table><tr><th>التعبير</th><th>يختار بـ</th></tr>
<tr><td><code>df["minutes"]</code></td><td>الاسم ← Series</td></tr>
<tr><td><code>df[["request_id", "minutes"]]</code></td><td>الأسماء ← DataFrame</td></tr>
<tr><td><code>df.loc[mask, ["request_id"]]</code></td><td>الأسماء والأقنعة</td></tr>
<tr><td><code>df.iloc[:5, -2:]</code></td><td>المواضع (النهاية غير مشمولة)</td></tr>
<tr><td><code>df.query("desk == 'North' and status == 'open'")</code></td><td>شرط مقروء</td></tr></table>
<p><b>الإسناد المتسلسل يفشل:</b> <code>df[mask]['flag'] = True</code> يغيّر اختياراً <b>مؤقتاً</b> (تحذير أو لا شيء). استخدم <code>df.loc[mask, 'flag'] = True</code> على نسختك <code>copy()</code>، أو ابنِ العمود في تعبير واحد. التمرين EX08: <code>flag_long_cases</code> تركت كل العلامات False وأضافت عموداً لجدول المستدعي؛ والدقائق المفقودة ليست حالات طويلة.</p>
<h3>7. ابحث عن الرموز التي تكسر العمود</h3>
<pre>as_number = pd.to_numeric(df["minutes"], errors="coerce")   # Series جديدة
bad = df["minutes"].notna() &amp; as_number.isna()
df.loc[bad, "minutes"].unique()   # مثل ['15 min']؛ و df نفسه لم يتغير</pre>
<p>موجودة قبل + NaN بعد = رمز سيئ. سجّله وقرر القاعدة في اليوم 4. <code>pd.to_datetime(..., errors="coerce")</code> تفعل نفس الشيء للتواريخ. لا تحسب أبداً بالمعرّفات.</p>
<h3>8–9. الفهرس والترتيب وتقرير الفحص</h3>
<p><code>set_index("request_id")</code> بعد التحقق من <code>index.is_unique</code> (الأسماء المكررة تجعل loc ترجع عدة صفوف)؛ و <code>sort_values(["desk", "opened_at"], ascending=[...])</code>؛ و <code>reset_index()</code>. التمرين EX10 ‏<code>inspect_table(df, expected_schema, id_column)</code> يرجع قيماً بسيطة (int و dict و list) لحفظها JSON: <code>n_rows و n_cols و missing_by_column و duplicate_rows و id_unique</code> وقائمة مرتبة <code>schema_problems</code> برسائل دقيقة: <code>"missing column: desk"</code> و <code>"unexpected column: note"</code> و <code>"wrong type: minutes (expected number, found text)"</code>. لا تعدّل الجدول الذي تفحصه.</p>
<h3>الدفتر 06 — 1. SQLite من بايثون</h3>
<pre>with closing(sqlite3.connect(path)) as con:     # يُغلق حتى بعد الخطأ
    pd.read_sql_query("SELECT name FROM sqlite_master WHERE type = 'table'", con)
sqlite3.connect(Path(p).resolve().as_uri() + "?mode=ro", uri=True)   # قراءة فقط</pre>
<p>SQLite يخزن قاعدة البيانات كلها في ملف واحد؛ و <code>PRAGMA table_info(name)</code> يعرض الأعمدة. خطأ شائع: المسار الخاطئ <b>ينشئ</b> قاعدة فارغة بصمت، فتحصل على "no such table" بدل "file not found". رابط القراءة فقط يفشل مع الملف المفقود ويرفض أي كتابة.</p>
<h3>2. read_sql_query بأعمدة صريحة</h3>
<p>سمِّ الأعمدة (لا <code>SELECT *</code>) حتى لا يغيّر عمود جديد في القاعدة نتائجك بصمت. TEXT يبقى نصاً (الرموز تحتفظ بأصفارها)؛ و NULL تصبح NaN؛ والتواريخ تحتاج <code>parse_dates</code>.</p>
<h3>3. الأمان: معاملات لا تنسيق نصوص</h3>
<table><tr><th>الاستعلام مبني بـ</th><th>المدخل <code>North' OR '1'='1</code></th></tr>
<tr><td>f-string ‏<code>WHERE desk = '{user_input}'</code></td><td>12 صفاً: تسربت كل المكاتب</td></tr>
<tr><td>معامل <code>WHERE desk = ?, params=(user_input,)</code></td><td>0 صفوف: عومل كبيانات</td></tr></table>
<pre>ph = ",".join("?" * len(statuses))           # "?,?"
sql = f"... WHERE status IN ({ph})"          # عناصر نائبة فقط
pd.read_sql_query(sql, con, params=statuses)</pre>
<p>هذا هو <b>حقن SQL</b>، من أشهر الثغرات الأمنية. والمعاملات تجعل القيم التي فيها علامات تنصيص (O'Hare) تعمل أيضاً (التمرين EX03).</p>
<h3>4. هل يتفق المصدران؟</h3>
<pre>a = db.set_index("request_id").sort_index()["minutes"]
b = csv.set_index("request_id").sort_index()["minutes"]
differs = ~((a == b) | (a.isna() &amp; b.isna()))
a.index[differs]</pre>
<p>تحقق أولاً من نفس مجموعة المعرّفات؛ وطابق بالمعرّف لا بموضع الصف (الملفات المصدّرة مخلوطة)؛ و <code>NaN == NaN</code> تعطي False فاعتبر المفقود في الطرفين متساوياً؛ و <code>df.compare</code> تعرض الخلايا المختلفة.</p>
<h3>5 و 8. صِف الأرقام بأمانة</h3>
<table><tr><th>دقائق المثال (12 صفاً)</th><th>القيمة</th></tr>
<tr><td>الملاحظة (count)</td><td>9</td></tr><tr><td>متوسط الملاحظة</td><td>18.5</td></tr>
<tr><td>وسيط الملاحظة</td><td>15.0</td></tr><tr><td>المتوسط بعد fillna(0)</td><td>13.9 (منحاز)</td></tr></table>
<p>Pandas يتجاهل NaN افتراضياً. <code>std()</code>: في Pandas ‏ddof=1 (عينة) وفي NumPy ‏ddof=0. المقام: <code>count()</code> لا <code>len()</code>. ثلاثة أخطاء كلاسيكية: <code>fillna(0)</code> قبل المتوسط تجعل المكاتب البطيئة تبدو سريعة (التمرين EX08)؛ و <code>len(s)</code> كعدد الملاحظات؛ و <code>head(n)</code> كعينة.</p>
<h3>6–7. المجموعات والزمن</h3>
<pre>df.groupby("desk")["minutes"].agg(n_requests="size", n_observed="count", median_minutes="median")
pd.crosstab(df["desk"], df["status"], normalize="index")</pre>
<p><code>size</code> تعدّ الصفوف و <code>count</code> تعدّ القيم الملاحظة، والفرق هو المفقود في كل مجموعة. <code>.dt.month</code> و <code>.dt.year</code> و <code>.dt.day_name()</code> و <code>.dt.to_period("M")</code> (2025-01) و <code>(max - min).days</code> للمدة.</p>
<h3>9. العينات: عشوائية وطبقية وملائمة</h3>
<table><tr><th>العينة</th><th>الكود</th><th>الخطر</th></tr>
<tr><td>عشوائية بسيطة</td><td><code>df.sample(n=30, random_state=7)</code></td><td>قد تفوّت المجموعات الصغيرة</td></tr>
<tr><td>طبقية</td><td><code>df.groupby("desk").sample(n=3, random_state=7)</code></td><td>عدد ثابت لكل مجموعة</td></tr>
<tr><td>ملائمة</td><td><code>df.head(30)</code></td><td>الجدول مرتب زمنياً ← أقدم الأسابيع فقط</td></tr></table>
<p><code>random_state</code> تجعل كل عينة قابلة للتكرار عند المدرب.</p>
<h3>10. دالة تحميل آمنة (EX10 ‏<code>load_desk_requests(db_path, desk, statuses)</code>)</h3>
<p>افشل بوضوح إذا كان الملف مفقوداً (<code>FileNotFoundError</code> بلا إنشاء ملف)؛ اتصال قراءة فقط (<code>mode=ro</code>)؛ أعمدة صريحة ومعاملات فقط — للمكتب ولكل حالة؛ و <code>ValueError</code> لقائمة حالات فارغة (IN غير صالحة)؛ أغلق بـ <code>closing(...)</code>؛ وأرجع بيانات بأنواع صحيحة ومرتبة وتواريخ محللة. مثال: <code>load_desk_requests(db, "Gate", ["open", "pending"])</code> ← K-1 و K-4 و K-5.</p>
<h3>الخلاصة</h3>
<ul><li>العقود تحمي البيانات عند التحميل؛ افحص وقِس وأبلغ بالمقامات.</li><li>loc / iloc ولا إسناد متسلسل.</li><li>معاملات لا f-strings في SQL.</li><li>القيم الملاحظة فقط: count() هو المقام. خذ العينات عشوائياً وبشكل قابل للتكرار.</li></ul>`},

{id:"s24", unit:"u5", en:"Cleaning, Merging & Reproducible Pipelines", ar:"التنظيف والدمج وخطوط المعالجة القابلة لإعادة التشغيل",
en_body:`
<p><b>Day 4 · topics 06.03 + 06.04 · Notebook 07 (cleaning types, duplicates, missing) + Notebook 08 (merging, reshaping & pipelines).</b> Rule of the day: <b>every change is a named rule, every removed row has a reason, every count reconciles.</b> Day 5 reuses today's cleaner and pipeline.</p>
<p>Route: <code>Raw (text) → Normalize → Convert → Flag → Accept / reject → Merge + derive</code>. Raw stays raw (loaded as text, never modified, with a <code>source_row</code> for every record); rules make new columns or flags; counts reconcile: <b>exact duplicates + accepted + rejected = raw rows</b>.</p>
<h3>1. Raw stays raw: work on a copy with lineage</h3>
<pre>raw = pd.read_csv(path, dtype=str, keep_default_na=False)
raw_before = raw.copy(deep=True)
work = raw.copy()
work.insert(0, "source_row", range(1, len(work) + 1))
# ... rules add new columns ...
assert raw.equals(raw_before)</pre>
<p>Text first: nothing guessed. <code>source_row</code> identifies every record even when IDs repeat. Never overwrite: once "30 min" is replaced by 30 in place, nobody can check later whether the conversion rule was right.</p>
<h3>2. Normalize text categories</h3>
<table><tr><th>Problem</th><th>Rule</th></tr>
<tr><td>surrounding spaces</td><td><code>s.str.strip()</code></td></tr>
<tr><td>Closed / CLOSED</td><td><code>s.str.lower()</code> or <code>.str.title()</code></td></tr>
<tr><td>known variants</td><td>explicit mapping <code>s.replace({'clsd': 'closed'})</code></td></tr>
<tr><td>unknown values</td><td>flag: <code>~s.isin(allowed)</code> — never guess</td></tr></table>
<p>Course policy: desk names title case, status lower case. Demo status: 6 spellings before → 3 values after strip + lower. Count distinct values before and after: normalization reduces variants, never invents new ones; an unexpected value is flagged, not turned into the most common category.</p>
<h3>3. Convert types with named rules</h3>
<pre>m = work["minutes"].str.strip()
suffix = m.str.extract(r"^(\d+(?:\.\d+)?)\s*min$")[0]
minutes = pd.to_numeric(m.where(suffix.isna(), suffix), errors="coerce")
opened = pd.to_datetime(work["opened_at"], format="%Y-%m-%d %H:%M", errors="coerce")</pre>
<p>Minutes policy: strip; "", unknown, n/a → missing; "30 min" → 30 by the named rule <b>min_suffix</b>; "12.5" → number; anything else becomes missing <b>and is counted</b>. Count every rule (how many min_suffix converted, how many became missing) in the cleaning log. Dates: always state the format — without it, "03/04/2025" can become 4 March or 3 April; impossible dates (2025-02-30) become NaT and are <b>listed</b>, never dropped silently.</p>
<h3>4. Identifiers: normalize, then validate</h3>
<pre>codes = work["desk_code"].str.strip()
digits = codes.str.fullmatch(r"\d+")
clean = codes.where(~digits, codes.str.zfill(3))
unknown = ~clean.isin(VALID_CODES)</pre>
<table><tr><th>Raw</th><th>Clean</th><th>Valid?</th></tr>
<tr><td>'7'</td><td>'007'</td><td>yes</td></tr><tr><td>' 002'</td><td>'002'</td><td>yes</td></tr>
<tr><td>'099'</td><td>'099'</td><td>no (well-formed but unknown)</td></tr><tr><td>'A1'</td><td>'A1'</td><td>flagged</td></tr></table>
<p>Debug EX04: <code>normalize_codes</code> used <code>astype(int).astype(str)</code> — it crashed on missing codes, turned 007 into 7 and crashed on 'A1'. Keep missing missing; return a new Series. Never convert identifiers to numbers.</p>
<h3>5. Duplicates: exact versus conflicting</h3>
<table><tr><th>Kind</th><th>Demo</th><th>Course policy</th></tr>
<tr><td>exact duplicate</td><td>RQ-00008 twice, identical</td><td>keep the first, drop the rest, count them</td></tr>
<tr><td>conflicting duplicate</td><td>RQ-00011: 41 vs 44 minutes</td><td>reject ALL copies: no authoritative winner</td></tr></table>
<pre>exact = work.duplicated(subset=raw_cols, keep="first")
deduped = work[~exact]
conflict = deduped["request_id"].duplicated(keep=False)</pre>
<p>Common mistake: <code>drop_duplicates(subset=['request_id'])</code> silently keeps one of two conflicting records (the first by file order) — nobody decided it was correct.</p>
<h3>6. Missing values: keep, exclude, or impute with a flag</h3>
<table><tr><th>Option</th><th>When</th><th>Risk</th></tr>
<tr><td>keep missing</td><td>reporting (default)</td><td>use observed values</td></tr>
<tr><td>exclude rows</td><td>the value is essential</td><td>report how many</td></tr>
<tr><td>impute + flag</td><td>a model needs a value</td><td>invented numbers</td></tr></table>
<pre>med = df.groupby("desk")["minutes"].transform("median")
df["minutes_imputed"] = df["minutes"].fillna(med)
df["was_imputed"] = df["minutes"].isna()</pre>
<p><code>transform</code> returns one value per row (same length as the table), which is why it can feed <code>fillna</code>. Missing is not zero; imputation always adds a flag column.</p>
<h3>7. Implausible values: flag, do not delete</h3>
<table><tr><th>Tool</th><th>Source</th><th>Meaning</th></tr>
<tr><td>range rule 0 &lt; m ≤ 480</td><td>domain policy (one shift)</td><td>implausible</td></tr>
<tr><td>IQR fences</td><td>the data</td><td>unusual, worth a look — not automatically wrong</td></tr></table>
<pre>q1, q3 = m.quantile([.25, .75]); iqr = q3 - q1
iqr_flag = (m &lt; q1 - 1.5*iqr) | (m > q3 + 1.5*iqr)</pre>
<p>Debug EX08: <code>remove_outliers</code> kept only values below the 95th percentile — reports lost ~5% of requests weekly, including all missing values and long valid cases. Rewrite as <code>flag_implausible(df, max_minutes=480)</code>: keep every row, add a boolean <code>implausible</code> (missing is NOT implausible).</p>
<h3>8–9. A rule matrix: accepted and rejected with reasons</h3>
<pre>rules = pd.DataFrame({"conflicting_id": ..., "unknown_desk": ...,
                      "bad_date": ..., "implausible_minutes": ...})
failed = rules.any(axis=1)
reasons = rules.apply(lambda r: ";".join(r.index[r]), axis=1)</pre>
<p>Rejection rules in order: <code>conflicting_id, unknown_desk, bad_date, implausible_minutes</code>; reasons list every failed rule, ";"-joined. Missing minutes are <b>not</b> a rejection reason — they stay accepted as missing. Demo: 13 raw rows = 1 exact duplicate + 6 accepted + 6 rejected. Evaluate all rules on the same table: filtering rule by rule hides earlier reasons and makes the conflict rule depend on which rows were removed first. Before-and-after checks: raw unchanged; dups + accepted + rejected = raw rows; accepted and rejected <code>source_row</code> sets don't overlap; cleaning twice gives the same result (<b>idempotent</b>); category counts before vs after.</p>
<h3>10. A reusable cleaning function (EX10)</h3>
<pre>accepted, rejected, report = clean_requests(raw_table, valid_codes, max_minutes=480)
# report = {"raw_rows": 9, "exact_duplicates": 1, "accepted": 2, "rejected": 6}</pre>
<p>Policy as arguments; stable column names (<code>source_row, request_id, desk_code, desk, request_type, status, opened_at, minutes</code>) for Notebook 08; same output on every run; input unchanged. Tested on a hidden table with an exact duplicate, a conflict, an unknown code, a bad date and two implausible values.</p>
<h3>Notebook 08 — 1. Keys and cardinality</h3>
<table><tr><th>Cardinality</th><th>Example</th><th>Left-join rows</th></tr>
<tr><td>one-to-one</td><td>request → its review</td><td>same as left</td></tr>
<tr><td>many-to-one</td><td>requests → desk lookup</td><td>same as left</td></tr>
<tr><td>one-to-many</td><td>desk → requests</td><td>can grow</td></tr>
<tr><td>many-to-many</td><td>usually a bug</td><td>multiplies</td></tr></table>
<p>Before joining ask: same type and format in both tables? unique in the lookup? expected cardinality?</p>
<h3>2. Join types and indicator=True</h3>
<table><tr><th>how=</th><th>Demo rows</th><th>Use</th></tr>
<tr><td>inner</td><td>8</td><td>rarely: drops unmatched</td></tr>
<tr><td>left</td><td>10</td><td>enrich requests</td></tr>
<tr><td>right</td><td>9</td><td>swap the tables instead</td></tr>
<tr><td>outer</td><td>11</td><td>reconcile sources</td></tr></table>
<pre>m = demo.merge(desks, on="desk_code", how="left", indicator=True)
m["_merge"].value_counts()    # both / left_only / right_only</pre>
<p>An inner join drops the two Harbor requests (code 007 not in the lookup) without any message. Use a left join and inspect the <code>left_only</code> rows.</p>
<h3>3. Validate cardinality before you trust a join</h3>
<table><tr><th>Lookup</th><th>Rows</th><th>Total minutes</th></tr>
<tr><td>correct (001 once)</td><td>10</td><td>179.5</td></tr>
<tr><td>001 twice</td><td>13</td><td>221.0 (inflated)</td></tr></table>
<pre>merged = requests.merge(desks, on="desk_code", how="left",
                        validate="many_to_one", indicator=True)
assert (merged["_merge"] == "both").all()</pre>
<p><code>validate</code> turns a silent error into a loud one: a repeated key raises <code>MergeError</code> instead of duplicating requests.</p>
<h3>4. Key hygiene</h3>
<p>'007' (text) vs 7 (int): error; '007' vs '7': no match; '001' vs '001 ': no match; None vs None: <b>match in Pandas</b> (not SQL). Normalize the key in BOTH tables with the same rule, then join with validate (debug EX03 <code>enrich</code>: numeric lookup codes, dropped unknown desks, duplicated requests).</p>
<h3>5. Stack extracts with pd.concat</h3>
<pre>pd.concat([jan.assign(source="jan"), feb.assign(source="feb"),
           mar.assign(source="mar")], ignore_index=True)</pre>
<p>Add a source column first; columns align by name; a missing column becomes NaN for its rows. Compare column sets before stacking (EX04: February has an extra "channel", March has no "request_type").</p>
<h3>6–7. Row and group features</h3>
<pre>df.assign(hours=df["minutes"] / 60,
          month=df["opened_at"].dt.month,
          band=pd.cut(df["minutes"], [0, 15, 30, 60, np.inf]))
g = df.groupby("desk")["minutes"]
df["share"] = df["minutes"] / g.transform("sum")
df["rank"] = g.rank(ascending=False, method="first")</pre>
<p>Weekend: <code>.dt.dayofweek >= 5</code>. <code>pd.cut</code> intervals include the <b>right</b> edge: (15, 30] contains 30 but not 15; missing stays missing. <b>agg</b> = one row per group (a summary); <b>transform</b> = one value per original row (a group statistic placed back). Ranks within groups follow row order on ties; missing values get no rank.</p>
<h3>8. Wide and long tables</h3>
<table><tr><th>Function</th><th>Direction</th><th>Note</th></tr>
<tr><td>pivot_table</td><td>long → wide</td><td>aggregates repeats</td></tr>
<tr><td>pivot</td><td>long → wide</td><td>fails on repeats</td></tr>
<tr><td>melt</td><td>wide → long</td><td>for grouping / plots</td></tr></table>
<pre>wide = df.pivot_table(index="desk", columns="month", values="request_id",
                      aggfunc="count", fill_value=0)
long = wide.reset_index().melt(id_vars="desk")</pre>
<p>Long = one row per (desk, month), good for filtering, grouping and plotting; wide = one row per desk, good for reading. Check totals after every reshape. Debug EX08: <code>monthly_minutes</code> used pivot and crashed when a desk had two requests in a month — pivot_table with <code>aggfunc='sum'</code> and <code>fill_value=0</code> fixes it.</p>
<h3>9. Actuals versus targets: a two-key join</h3>
<p>Aggregate first, then join on <code>["region", "month"]</code> starting from the <b>targets</b> table, so region-months with no requests appear with 0; validate <code>one_to_one</code>; gap = n_requests − target_requests.</p>
<h3>10. A reproducible, validated pipeline (EX10 <code>build_analytical_table</code>)</h3>
<p><code>Validate keys → Join (m:1) → Derive → Sort + order → Write → Reload + compare</code>. <b>Validate first, write last</b>: a failed check leaves no partial files (ValueError for a repeated desk_code or unmatched codes). <b>Deterministic</b>: sorted rows and a fixed column order (<code>request_id, desk_code, desk, region, request_type, status, opened_at, month, minutes, hours</code>) give identical bytes on every rerun. Round-trip test with the same dtype contract; record counts per step (provenance / manifest). Writes <code>analytical_table.csv</code> and <code>region_month_summary.csv</code>; returns rows_in, rows_out and the paths.</p>
<h3>Takeaways</h3>
<ul><li>Raw stays raw; rules add columns and flags.</li><li>Conflicts are rejected, not resolved by file order; implausible values are flagged, not deleted.</li><li>Counts reconcile after cleaning and after joins; <code>validate='many_to_one'</code> in every enrichment join.</li><li>Validate, then write; reruns give identical files.</li></ul>`,
ar_body:`
<p><b>اليوم 4 · الموضوعان 06.03 + 06.04 · الدفتر 07 (تنظيف الأنواع والتكرار والمفقود) + الدفتر 08 (الدمج وإعادة التشكيل وخطوط المعالجة).</b> قاعدة اليوم: <b>كل تغيير قاعدة لها اسم، وكل صف محذوف له سبب، وكل عدد يتطابق.</b> اليوم 5 يعيد استخدام أداة التنظيف وخط المعالجة.</p>
<p>المسار: <code>خام (نص) ← توحيد ← تحويل ← تعليم ← قبول / رفض ← دمج + اشتقاق</code>. الخام يبقى خاماً (يُحمّل نصاً ولا يُعدّل ولكل سجل <code>source_row</code>)؛ والقواعد تنشئ أعمدة أو علامات جديدة؛ والأعداد تتطابق: <b>التكرارات التامة + المقبول + المرفوض = صفوف الخام</b>.</p>
<h3>1. الخام يبقى خاماً: اعمل على نسخة مع تتبع الأصل</h3>
<pre>raw = pd.read_csv(path, dtype=str, keep_default_na=False)
raw_before = raw.copy(deep=True)
work = raw.copy()
work.insert(0, "source_row", range(1, len(work) + 1))
# ... القواعد تضيف أعمدة جديدة ...
assert raw.equals(raw_before)</pre>
<p>النص أولاً: لا تخمين. <code>source_row</code> يحدد كل سجل حتى عند تكرار المعرّفات. لا تكتب فوق الأصل: إذا استُبدلت "30 min" بـ 30 في مكانها فلن يستطيع أحد لاحقاً التحقق من صحة قاعدة التحويل.</p>
<h3>2. توحيد الفئات النصية</h3>
<table><tr><th>المشكلة</th><th>القاعدة</th></tr>
<tr><td>مسافات محيطة</td><td><code>s.str.strip()</code></td></tr>
<tr><td>Closed / CLOSED</td><td><code>s.str.lower()</code> أو <code>.str.title()</code></td></tr>
<tr><td>صيغ معروفة</td><td>ربط صريح <code>s.replace({'clsd': 'closed'})</code></td></tr>
<tr><td>قيم مجهولة</td><td>علّمها: <code>~s.isin(allowed)</code> — لا تخمّن</td></tr></table>
<p>سياسة الدورة: أسماء المكاتب بحرف أول كبير، والحالة بأحرف صغيرة. حالة المثال: 6 كتابات قبل ← 3 قيم بعد strip + lower. عدّ القيم المميزة قبل وبعد: التوحيد يقلل الصيغ ولا يخترع جديدة؛ والقيمة غير المتوقعة تُعلّم ولا تُحوّل إلى الفئة الأكثر شيوعاً.</p>
<h3>3. حوّل الأنواع بقواعد مسماة</h3>
<pre>m = work["minutes"].str.strip()
suffix = m.str.extract(r"^(\d+(?:\.\d+)?)\s*min$")[0]
minutes = pd.to_numeric(m.where(suffix.isna(), suffix), errors="coerce")
opened = pd.to_datetime(work["opened_at"], format="%Y-%m-%d %H:%M", errors="coerce")</pre>
<p>سياسة الدقائق: strip؛ و "" و unknown و n/a ← مفقود؛ و "30 min" ← 30 بالقاعدة المسماة <b>min_suffix</b>؛ و "12.5" ← رقم؛ وأي شيء آخر يصبح مفقوداً <b>ويُعدّ</b>. سجّل أعداد كل قاعدة (كم حوّلت min_suffix وكم أصبح مفقوداً) في سجل التنظيف. التواريخ: اذكر الصيغة دائماً — بدونها قد تصبح "03/04/2025" ‏4 مارس أو 3 أبريل؛ والتواريخ المستحيلة (2025-02-30) تصبح NaT و<b>تُسرد</b> ولا تُحذف بصمت.</p>
<h3>4. المعرّفات: وحّد ثم تحقق</h3>
<pre>codes = work["desk_code"].str.strip()
digits = codes.str.fullmatch(r"\d+")
clean = codes.where(~digits, codes.str.zfill(3))
unknown = ~clean.isin(VALID_CODES)</pre>
<table><tr><th>الخام</th><th>بعد التنظيف</th><th>صالح؟</th></tr>
<tr><td>'7'</td><td>'007'</td><td>نعم</td></tr><tr><td>' 002'</td><td>'002'</td><td>نعم</td></tr>
<tr><td>'099'</td><td>'099'</td><td>لا (صحيح الشكل لكنه مجهول)</td></tr><tr><td>'A1'</td><td>'A1'</td><td>مُعلّم</td></tr></table>
<p>التمرين EX04: <code>normalize_codes</code> استخدمت <code>astype(int).astype(str)</code> — فتعطلت مع الرموز المفقودة وحوّلت 007 إلى 7 وتعطلت مع 'A1'. أبقِ المفقود مفقوداً وأرجع Series جديدة. لا تحوّل المعرّفات إلى أرقام أبداً.</p>
<h3>5. التكرارات: التامة مقابل المتعارضة</h3>
<table><tr><th>النوع</th><th>المثال</th><th>سياسة الدورة</th></tr>
<tr><td>تكرار تام</td><td>RQ-00008 مرتين متطابقتين</td><td>أبقِ الأول واحذف الباقي وعدّها</td></tr>
<tr><td>تكرار متعارض</td><td>RQ-00011: ‏41 مقابل 44 دقيقة</td><td>ارفض كل النسخ: لا فائز موثوق</td></tr></table>
<pre>exact = work.duplicated(subset=raw_cols, keep="first")
deduped = work[~exact]
conflict = deduped["request_id"].duplicated(keep=False)</pre>
<p>خطأ شائع: <code>drop_duplicates(subset=['request_id'])</code> تبقي بصمت أحد السجلين المتعارضين (الأول حسب ترتيب الملف) — ولم يقرر أحد أنه الصحيح.</p>
<h3>6. القيم المفقودة: أبقِ أو استبعد أو عوّض مع علامة</h3>
<table><tr><th>الخيار</th><th>متى</th><th>الخطر</th></tr>
<tr><td>إبقاء المفقود</td><td>التقارير (الافتراضي)</td><td>استخدم القيم الملاحظة</td></tr>
<tr><td>استبعاد الصفوف</td><td>القيمة أساسية</td><td>أبلغ عن عددها</td></tr>
<tr><td>تعويض + علامة</td><td>نموذج يحتاج قيمة</td><td>أرقام مخترعة</td></tr></table>
<pre>med = df.groupby("desk")["minutes"].transform("median")
df["minutes_imputed"] = df["minutes"].fillna(med)
df["was_imputed"] = df["minutes"].isna()</pre>
<p><code>transform</code> ترجع قيمة لكل صف (بطول الجدول)، ولهذا يمكن تمريرها لـ <code>fillna</code>. المفقود ليس صفراً، والتعويض يضيف دائماً عمود علامة.</p>
<h3>7. القيم غير المعقولة: علّمها ولا تحذفها</h3>
<table><tr><th>الأداة</th><th>المصدر</th><th>المعنى</th></tr>
<tr><td>قاعدة المدى 0 &lt; m ≤ 480</td><td>سياسة المجال (وردية واحدة)</td><td>غير معقولة</td></tr>
<tr><td>أسوار IQR</td><td>البيانات</td><td>غير عادية تستحق النظر — وليست خاطئة تلقائياً</td></tr></table>
<pre>q1, q3 = m.quantile([.25, .75]); iqr = q3 - q1
iqr_flag = (m &lt; q1 - 1.5*iqr) | (m > q3 + 1.5*iqr)</pre>
<p>التمرين EX08: <code>remove_outliers</code> أبقت القيم تحت المئين 95 فقط — فخسرت التقارير ~5% من الطلبات أسبوعياً، ومعها كل المفقود والحالات الطويلة الصحيحة. أعد كتابتها كـ <code>flag_implausible(df, max_minutes=480)</code>: أبقِ كل صف وأضف عموداً منطقياً <code>implausible</code> (المفقود ليس غير معقول).</p>
<h3>8–9. مصفوفة القواعد: المقبول والمرفوض مع الأسباب</h3>
<pre>rules = pd.DataFrame({"conflicting_id": ..., "unknown_desk": ...,
                      "bad_date": ..., "implausible_minutes": ...})
failed = rules.any(axis=1)
reasons = rules.apply(lambda r: ";".join(r.index[r]), axis=1)</pre>
<p>قواعد الرفض بالترتيب: <code>conflicting_id و unknown_desk و bad_date و implausible_minutes</code>؛ والأسباب تسرد كل قاعدة فشلت مفصولة بـ ";". الدقائق المفقودة <b>ليست</b> سبب رفض — تبقى مقبولة كمفقودة. المثال: 13 صفاً خاماً = تكرار تام واحد + 6 مقبولة + 6 مرفوضة. قيّم كل القواعد على نفس الجدول: التصفية قاعدة بعد قاعدة تخفي الأسباب السابقة وتجعل قاعدة التعارض تعتمد على الصفوف التي حُذفت أولاً. فحوص قبل وبعد: الخام لم يتغير؛ التكرارات + المقبول + المرفوض = صفوف الخام؛ مجموعتا <code>source_row</code> للمقبول والمرفوض لا تتداخلان؛ التنظيف مرتين يعطي نفس النتيجة (<b>ثبات Idempotent</b>)؛ أعداد الفئات قبل وبعد.</p>
<h3>10. دالة تنظيف قابلة لإعادة الاستخدام (EX10)</h3>
<pre>accepted, rejected, report = clean_requests(raw_table, valid_codes, max_minutes=480)
# report = {"raw_rows": 9, "exact_duplicates": 1, "accepted": 2, "rejected": 6}</pre>
<p>السياسة كوسائط؛ أسماء أعمدة ثابتة (<code>source_row, request_id, desk_code, desk, request_type, status, opened_at, minutes</code>) للدفتر 08؛ نفس الناتج في كل تشغيل؛ المدخل بلا تغيير. تُختبر على جدول مخفي فيه تكرار تام وتعارض ورمز مجهول وتاريخ سيئ وقيمتان غير معقولتين.</p>
<h3>الدفتر 08 — 1. المفاتيح والعلاقة العددية</h3>
<table><tr><th>العلاقة</th><th>مثال</th><th>صفوف الربط اليساري</th></tr>
<tr><td>واحد لواحد</td><td>طلب ← مراجعته</td><td>مثل اليسار</td></tr>
<tr><td>كثير لواحد</td><td>طلبات ← جدول المكاتب</td><td>مثل اليسار</td></tr>
<tr><td>واحد لكثير</td><td>مكتب ← طلبات</td><td>قد تزيد</td></tr>
<tr><td>كثير لكثير</td><td>خطأ غالباً</td><td>تتضاعف</td></tr></table>
<p>قبل الربط اسأل: نفس النوع والصيغة في الجدولين؟ فريد في جدول البحث؟ ما العلاقة المتوقعة؟</p>
<h3>2. أنواع الربط و indicator=True</h3>
<table><tr><th>how=</th><th>صفوف المثال</th><th>الاستخدام</th></tr>
<tr><td>inner</td><td>8</td><td>نادراً: يحذف غير المطابق</td></tr>
<tr><td>left</td><td>10</td><td>إثراء الطلبات</td></tr>
<tr><td>right</td><td>9</td><td>بدّل الجدولين بدلاً منه</td></tr>
<tr><td>outer</td><td>11</td><td>مطابقة المصادر</td></tr></table>
<pre>m = demo.merge(desks, on="desk_code", how="left", indicator=True)
m["_merge"].value_counts()    # both / left_only / right_only</pre>
<p>الربط الداخلي يحذف طلبي Harbor (الرمز 007 ليس في جدول البحث) بلا أي رسالة. استخدم الربط اليساري وافحص صفوف <code>left_only</code>.</p>
<h3>3. تحقق من العلاقة قبل الثقة بالربط</h3>
<table><tr><th>جدول البحث</th><th>الصفوف</th><th>مجموع الدقائق</th></tr>
<tr><td>صحيح (001 مرة)</td><td>10</td><td>179.5</td></tr>
<tr><td>001 مرتين</td><td>13</td><td>221.0 (متضخم)</td></tr></table>
<pre>merged = requests.merge(desks, on="desk_code", how="left",
                        validate="many_to_one", indicator=True)
assert (merged["_merge"] == "both").all()</pre>
<p><code>validate</code> تحوّل الخطأ الصامت إلى خطأ صريح: المفتاح المكرر يرفع <code>MergeError</code> بدل مضاعفة الطلبات.</p>
<h3>4. نظافة المفاتيح</h3>
<p>'007' (نص) مقابل 7 (صحيح): خطأ؛ '007' مقابل '7': لا تطابق؛ '001' مقابل '001 ': لا تطابق؛ None مقابل None: <b>تتطابق في Pandas</b> (لا في SQL). وحّد المفتاح في الجدولين بنفس القاعدة ثم اربط مع validate (التمرين EX03 ‏<code>enrich</code>: رموز رقمية في جدول البحث، ومكاتب مجهولة محذوفة، وطلبات مكررة).</p>
<h3>5. تكديس المستخرجات بـ pd.concat</h3>
<pre>pd.concat([jan.assign(source="jan"), feb.assign(source="feb"),
           mar.assign(source="mar")], ignore_index=True)</pre>
<p>أضف عمود المصدر أولاً؛ الأعمدة تُطابق بالاسم؛ والعمود الغائب يصبح NaN لصفوفه. قارن مجموعات الأعمدة قبل التكديس (EX04: فبراير فيه عمود "channel" إضافي ومارس بلا "request_type").</p>
<h3>6–7. خصائص الصفوف والمجموعات</h3>
<pre>df.assign(hours=df["minutes"] / 60,
          month=df["opened_at"].dt.month,
          band=pd.cut(df["minutes"], [0, 15, 30, 60, np.inf]))
g = df.groupby("desk")["minutes"]
df["share"] = df["minutes"] / g.transform("sum")
df["rank"] = g.rank(ascending=False, method="first")</pre>
<p>نهاية الأسبوع: <code>.dt.dayofweek >= 5</code>. فترات <code>pd.cut</code> تشمل الحد <b>الأيمن</b>: (15, 30] تحتوي 30 لا 15؛ والمفقود يبقى مفقوداً. <b>agg</b> = صف لكل مجموعة (ملخص)؛ و <b>transform</b> = قيمة لكل صف أصلي (إحصاء المجموعة يوضع على كل صف). الترتيب داخل المجموعات يتبع ترتيب الصفوف عند التعادل، والمفقود بلا رتبة.</p>
<h3>8. الجداول العريضة والطويلة</h3>
<table><tr><th>الدالة</th><th>الاتجاه</th><th>ملاحظة</th></tr>
<tr><td>pivot_table</td><td>طويل ← عريض</td><td>تجمّع المكرر</td></tr>
<tr><td>pivot</td><td>طويل ← عريض</td><td>تفشل مع المكرر</td></tr>
<tr><td>melt</td><td>عريض ← طويل</td><td>للتجميع والرسم</td></tr></table>
<pre>wide = df.pivot_table(index="desk", columns="month", values="request_id",
                      aggfunc="count", fill_value=0)
long = wide.reset_index().melt(id_vars="desk")</pre>
<p>الطويل = صف لكل (مكتب، شهر) ومناسب للتصفية والتجميع والرسم؛ والعريض = صف لكل مكتب ومناسب للقراءة. تحقق من المجاميع بعد كل إعادة تشكيل. التمرين EX08: <code>monthly_minutes</code> استخدمت pivot فتعطلت عندما كان لمكتب طلبان في شهر — pivot_table مع <code>aggfunc='sum'</code> و <code>fill_value=0</code> تصلحها.</p>
<h3>9. الفعلي مقابل المستهدف: ربط بمفتاحين</h3>
<p>جمّع أولاً ثم اربط على <code>["region", "month"]</code> بدءاً من جدول <b>المستهدفات</b>، فتظهر المنطقة-الشهر بلا طلبات بقيمة 0؛ وتحقق بـ <code>one_to_one</code>؛ والفجوة gap = n_requests − target_requests.</p>
<h3>10. خط معالجة موثّق وقابل لإعادة التشغيل (EX10 ‏<code>build_analytical_table</code>)</h3>
<p><code>تحقق من المفاتيح ← ربط (كثير:1) ← اشتقاق ← ترتيب + تنظيم الأعمدة ← كتابة ← إعادة تحميل + مقارنة</code>. <b>تحقق أولاً واكتب آخراً</b>: الفحص الفاشل لا يترك ملفات جزئية (ValueError لرمز مكتب مكرر أو رموز غير مطابقة). <b>حتمي</b>: صفوف مرتبة وترتيب أعمدة ثابت (<code>request_id, desk_code, desk, region, request_type, status, opened_at, month, minutes, hours</code>) يعطيان نفس البايتات في كل إعادة تشغيل. اختبار ذهاب وعودة بنفس عقد الأنواع، وتسجيل الأعداد لكل خطوة (المصدر / Manifest). يكتب <code>analytical_table.csv</code> و <code>region_month_summary.csv</code> ويرجع rows_in و rows_out والمسارات.</p>
<h3>الخلاصة</h3>
<ul><li>الخام يبقى خاماً، والقواعد تضيف أعمدة وعلامات.</li><li>التعارضات تُرفض ولا تُحسم بترتيب الملف؛ والقيم غير المعقولة تُعلّم ولا تُحذف.</li><li>الأعداد تتطابق بعد التنظيف وبعد الربط؛ و <code>validate='many_to_one'</code> في كل ربط إثراء.</li><li>تحقق ثم اكتب، وإعادة التشغيل تعطي ملفات متطابقة.</li></ul>`}
);

en_body:`
<p><b>Week 06 — Python Libraries for Data Analysis (police data edition).</b> Four curriculum topics: <b>06.01</b> NumPy numerical and matrix operations; <b>06.02</b> loading and inspecting data with Pandas (CSV and SQL); <b>06.03</b> cleaning missing, duplicate and implausible values without damaging data; <b>06.04</b> merging and transforming data into a traceable, rerunnable analytical table. Every day has two notebooks and one slide deck; every notebook has auto-checked exercises. All data are synthetic police administrative requests.</p>
<table><tr><th>Day</th><th>Theme</th><th>Notebooks</th></tr>
<tr><td>1</td><td>NumPy arrays (06.01)</td><td>01 numpy police arrays, 02 selection & calculation</td></tr>
<tr><td>2</td><td>Vectors, matrices, linear systems (06.01)</td><td>03 vectors, norms & similarity, 04 matrices & linear systems</td></tr>
<tr><td>3</td><td>Pandas loading & inspection (06.02)</td><td>05 CSV loading & inspection, 06 SQL summaries & sampling</td></tr>
<tr><td>4</td><td>Cleaning, merging, pipelines (06.03, 06.04)</td><td>07 types, duplicates, missing; 08 merging, reshaping & pipelines</td></tr>
<tr><td>5</td><td>Projects (all topics)</td><td>09 individual desk quality report, 10 team reproducible data pipeline</td></tr></table>
<h3>Architecture of the week</h3>
<pre>Day 1  numbers -> NumPy arrays -> select, reduce, broadcast, handle gaps
Day 2  rows as vectors -> norms, distance, cosine -> matrix products, linear systems
Day 3  CSV + SQLite -> Pandas DataFrames with a dtype contract -> inspect, describe, sample
Day 4  raw table -> cleaning rules + reasons -> validated joins -> analytical table
Day 5  individual report (one source) + team pipeline (three sources, four roles)</pre>
<h3>Why this week matters</h3>
<p>Every AI system for the security sector starts from tables of records. If a loader silently drops blank values, a join silently multiplies rows or a cleaning step silently deletes inconvenient cases, every later model and chart is wrong and nobody can trace why. Three habits: <b>know the shape and meaning of your data before calculating</b>; <b>never change data silently</b> (every rule has a name, a reason and a count); <b>make results reproducible</b> (same inputs and code → same files).</p>
<h3>Environment and workflow</h3>
<ul><li>Prerequisites: Python basics (variables, lists, dictionaries, loops, functions, exceptions). Google Colab (NumPy, Pandas, Matplotlib and sqlite3 preinstalled) or locally: <code>uv sync --locked --extra notebooks --extra test --extra data</code>. No account, download or real data; each setup cell writes its own input files (day01_files, day03_files, day04_files, day05_files, day05_team_files).</li>
<li><b>Step 1:</b> set <code>STUDENT_ID</code> in the first cell — the same value all week (your team code such as TEAM-03 in Notebook 10). Data are generated from it; function checks run on hidden inputs, so hard-coded answers fail.</li>
<li><b>Step 2:</b> each notebook (~150 min): warm-up (10 min, not scored) → sections with explanation, worked example and Try it → EX01–EX10 (100 automatic points; edit only the "Your answer" cell, then run the Auto-check) → reflection (0–10, instructor) → skill report saving <code>results_&lt;KEY&gt;_&lt;STUDENT_ID&gt;.json</code>. Levels: Basic, Intermediate, Debug, Challenge.</li>
<li><b>Step 3:</b> Auto-check messages: PASS (all correct), PARTIAL (hint names the missing part), TRY AGAIN, NOT ATTEMPTED (still the starter), ERROR (read the exception). Skill marks: Mastered ≥ 80%, Developing ≥ 50%, Not yet. Don't edit check cells.</li>
<li><b>Step 4:</b> Restart and Run All without errors; submit the notebook and its results JSON; on Day 5 also the output folders. Colab files are temporary: download outputs, e.g. <code>files.download("results_W06-D1-A_S001.json")</code>.</li></ul>
<table><tr><th>Symptom</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>NameError in a check</td><td>an earlier cell was not run</td><td>Restart and Run All</td></tr>
<tr><td>Numbers differ from a partner</td><td>different STUDENT_ID</td><td>expected: data are personal</td></tr>
<tr><td>NotImplementedError or ...</td><td>exercise still a starter</td><td>implement it</td></tr>
<tr><td>Blank values vanish on load</td><td>keep_default_na left on</td><td>follow the Notebook 05 dtype contract</td></tr>
<tr><td>More rows after a join</td><td>repeated keys in the lookup</td><td>validate="many_to_one" (Notebook 08)</td></tr>
<tr><td>Passes locally, fails for the instructor</td><td>hard-coded values</td><td>compute from the inputs</td></tr></table>
<p>Files: 00_start_here, 01_concepts_and_visuals (key ideas on a few pages), the two project briefs with rubrics, references (official NumPy, Pandas, Matplotlib and sqlite3 documentation: broadcasting, copies and views, data types and overflow, nanmean, genfromtxt, linalg.norm/solve/matrix_rank/lstsq, read_csv, read_sql_query, indexing, Copy-on-Write, missing data, text methods, to_numeric/to_datetime, duplicated). Instructor guides and solutions are not shared before assessment.</p>
<h3>Key takeaways of the week</h3>
<ol><li>Predict the shape before you run the code, and name the axis you reduce.</li>
<li>Keep units, denominators and missing values visible; nan is more honest than a fabricated 0.</li>
<li>Load as text first, inspect, then convert with named rules.</li>
<li>Every rejected row has a reason, and every run reconciles.</li>
<li>Validate every join's cardinality before trusting the result.</li>
<li>Validate first, write last, and make reruns identical.</li>
<li>Synthetic data teach a method; they are not evidence about real policing.</li></ol>`,
ar_body:`
<p><b>الأسبوع 06 — مكتبات بايثون لتحليل البيانات (نسخة بيانات الشرطة).</b> أربعة مواضيع في المنهج: <b>06.01</b> عمليات NumPy العددية والمصفوفية؛ <b>06.02</b> تحميل البيانات وفحصها بـ Pandas (CSV و SQL)؛ <b>06.03</b> تنظيف القيم المفقودة والمكررة وغير المعقولة دون إتلاف البيانات؛ <b>06.04</b> دمج البيانات وتحويلها إلى جدول تحليلي قابل للتتبع وإعادة التشغيل. لكل يوم دفتران وعرض شرائح، وكل دفتر فيه تمارين تُصحح تلقائياً. كل البيانات طلبات إدارية شرطية مصطنعة.</p>
<table><tr><th>اليوم</th><th>الموضوع</th><th>الدفاتر</th></tr>
<tr><td>1</td><td>مصفوفات NumPy ‏(06.01)</td><td>01 مصفوفات الشرطة، 02 الاختيار والحساب</td></tr>
<tr><td>2</td><td>المتجهات والمصفوفات والأنظمة الخطية (06.01)</td><td>03 المتجهات والمعايير والتشابه، 04 المصفوفات والأنظمة الخطية</td></tr>
<tr><td>3</td><td>تحميل Pandas والفحص (06.02)</td><td>05 تحميل CSV وفحصه، 06 ملخصات SQL والعينات</td></tr>
<tr><td>4</td><td>التنظيف والدمج وخطوط المعالجة (06.03، 06.04)</td><td>07 الأنواع والتكرار والمفقود؛ 08 الدمج وإعادة التشكيل وخطوط المعالجة</td></tr>
<tr><td>5</td><td>المشاريع (كل المواضيع)</td><td>09 تقرير جودة المكاتب الفردي، 10 خط معالجة الفريق القابل لإعادة التشغيل</td></tr></table>
<h3>بنية الأسبوع</h3>
<pre>اليوم 1  أرقام -> مصفوفات NumPy -> اختيار، تجميع، بث، معالجة الفجوات
اليوم 2  الصفوف كمتجهات -> معايير، مسافة، جيب تمام -> ضرب مصفوفات، أنظمة خطية
اليوم 3  CSV + SQLite -> جداول Pandas بعقد أنواع -> فحص، وصف، عينات
اليوم 4  جدول خام -> قواعد تنظيف + أسباب -> روابط موثّقة -> جدول تحليلي
اليوم 5  تقرير فردي (مصدر واحد) + خط معالجة فريق (ثلاثة مصادر، أربعة أدوار)</pre>
<h3>لماذا هذا الأسبوع مهم</h3>
<p>كل نظام ذكاء اصطناعي للقطاع الأمني يبدأ من جداول سجلات. إذا أسقطت دالة التحميل القيم الفارغة بصمت، أو ضاعف الربط الصفوف بصمت، أو حذفت خطوة التنظيف الحالات المزعجة بصمت، فكل نموذج ورسم لاحق خاطئ ولا أحد يعرف السبب. ثلاث عادات: <b>اعرف شكل بياناتك ومعناها قبل الحساب</b>؛ <b>لا تغيّر البيانات بصمت</b> (كل قاعدة لها اسم وسبب وعدد)؛ <b>اجعل النتائج قابلة للتكرار</b> (نفس المدخلات والكود ← نفس الملفات).</p>
<h3>البيئة وطريقة العمل</h3>
<ul><li>المتطلبات: أساسيات بايثون (المتغيرات والقوائم والقواميس والحلقات والدوال والاستثناءات). Google Colab (فيه NumPy و Pandas و Matplotlib و sqlite3 جاهزة) أو محلياً: <code>uv sync --locked --extra notebooks --extra test --extra data</code>. لا حساب ولا تنزيل ولا بيانات حقيقية؛ كل خلية إعداد تكتب ملفات مدخلاتها (day01_files و day03_files و day04_files و day05_files و day05_team_files).</li>
<li><b>الخطوة 1:</b> اكتب <code>STUDENT_ID</code> في أول خلية — نفس القيمة طوال الأسبوع (رمز الفريق مثل TEAM-03 في الدفتر 10). البيانات تُولّد منه، وفحوص الدوال تعمل على مدخلات مخفية فالإجابات الثابتة تفشل.</li>
<li><b>الخطوة 2:</b> كل دفتر (~150 دقيقة): تمهيد (10 دقائق بدون درجات) ← أقسام فيها شرح ومثال محلول و"جرّب" ← EX01–EX10 (100 درجة تلقائية؛ عدّل خلية "Your answer" فقط ثم شغّل الفحص) ← تأمل (0–10 من المدرب) ← تقرير مهارات يحفظ <code>results_&lt;KEY&gt;_&lt;STUDENT_ID&gt;.json</code>. المستويات: أساسي ومتوسط وتصحيح أخطاء وتحدٍّ.</li>
<li><b>الخطوة 3:</b> رسائل الفحص: PASS (الكل صحيح)، PARTIAL (التلميح يذكر الجزء الناقص)، TRY AGAIN، NOT ATTEMPTED (ما زالت البداية)، ERROR (اقرأ الاستثناء). المهارات: متقنة ≥ 80%، نامية ≥ 50%، لم تتحقق بعد. لا تعدّل خلايا الفحص.</li>
<li><b>الخطوة 4:</b> Restart and Run All بلا أخطاء؛ سلّم الدفتر وملف JSON؛ وفي اليوم 5 مجلدات المخرجات أيضاً. ملفات Colab مؤقتة: نزّل المخرجات مثل <code>files.download("results_W06-D1-A_S001.json")</code>.</li></ul>
<table><tr><th>العَرَض</th><th>السبب المحتمل</th><th>الحل</th></tr>
<tr><td>NameError في الفحص</td><td>خلية سابقة لم تُشغّل</td><td>Restart and Run All</td></tr>
<tr><td>أرقامك تختلف عن زميلك</td><td>STUDENT_ID مختلف</td><td>متوقع: البيانات شخصية</td></tr>
<tr><td>NotImplementedError أو ...</td><td>التمرين ما زال بدايته</td><td>نفّذه</td></tr>
<tr><td>القيم الفارغة تختفي عند التحميل</td><td>keep_default_na مفعلة</td><td>اتبع عقد الأنواع في الدفتر 05</td></tr>
<tr><td>صفوف أكثر بعد الربط</td><td>مفاتيح مكررة في جدول البحث</td><td>validate="many_to_one" (الدفتر 08)</td></tr>
<tr><td>ينجح محلياً ويفشل عند المدرب</td><td>قيم ثابتة مكتوبة</td><td>احسب من المدخلات</td></tr></table>
<p>الملفات: 00_start_here، و 01_concepts_and_visuals (الأفكار الأساسية في صفحات قليلة)، وموجزا المشروعين مع معايير التقييم، والمراجع (توثيق NumPy و Pandas و Matplotlib و sqlite3 الرسمي: البث، والنسخ والعروض، والأنواع والفيض، و nanmean، و genfromtxt، و linalg.norm/solve/matrix_rank/lstsq، و read_csv، و read_sql_query، والفهرسة، و Copy-on-Write، والبيانات المفقودة، ودوال النصوص، و to_numeric/to_datetime، و duplicated). أدلة المدرب والحلول لا تُشارك قبل التقييم.</p>
<h3>خلاصات الأسبوع</h3>
<ol><li>توقّع الشكل قبل تشغيل الكود، وسمِّ المحور الذي تجمّع عليه.</li>
<li>أبقِ الوحدات والمقامات والقيم المفقودة ظاهرة؛ nan أصدق من صفر مختلق.</li>
<li>حمّل كنص أولاً، ثم افحص، ثم حوّل بقواعد مسماة.</li>
<li>كل صف مرفوض له سبب، وكل تشغيل يتطابق.</li>
<li>تحقق من العلاقة العددية لكل ربط قبل الثقة بالنتيجة.</li>
<li>تحقق أولاً واكتب آخراً، واجعل إعادة التشغيل متطابقة.</li>
<li>البيانات المصطنعة تعلّم طريقة؛ وليست دليلاً عن العمل الشرطي الحقيقي.</li></ol>`},

{id:"s25", unit:"u5", en:"Week 06 Projects: Desk Quality Report & Team Pipeline", ar:"مشاريع الأسبوع 06: تقرير جودة المكاتب وخط معالجة الفريق",
en_body:`
<p><b>Day 5 · topics 06.01–06.04 · Notebook 09 (individual, ~180 min) + Notebook 10 (team, ~135 min) + 5-minute team presentations.</b> Individual work is individual: help with understanding, never share code. Team work runs in parallel: agree on the contracts first.</p>
<h3>Individual project — A validated quarterly desk report</h3>
<p>Scenario: the records unit of a fictional police administration receives a messy quarterly export (January–March): inconsistent spellings, codes without leading zeros, text in minutes, impossible dates, exact and conflicting duplicates and implausible durations. Inputs: <code>my_quarter_raw.csv</code> (~457 rows from your STUDENT_ID, all loaded as text) and <code>my_desks.csv</code> (desk_code → region, staffed_hours per week).</p>
<pre>my_quarter_raw.csv -> M1 load (text) -> M2 inspect -> M3 clean -> accepted / rejected / report
my_desks.csv ------------------------> M4 enrich (validated m:1) -> M5 features -> M6 NumPy profile
  -> M7 summaries -> M8 figures -> M9 export + manifest -> M10 key facts + findings note</pre>
<table><tr><th>Milestone</th><th>You implement</th><th>Pts</th></tr>
<tr><td>M1 Load</td><td>raw as text, desks with text codes</td><td>8</td></tr>
<tr><td>M2 Inspect</td><td><code>inspect_raw</code>: six counts (hidden table)</td><td>10</td></tr>
<tr><td>M3 Clean</td><td><code>clean</code>: accepted, rejected, report</td><td>12</td></tr>
<tr><td>M4 Enrich</td><td><code>enrich</code>: validated m:1, raises on repeated/unmatched codes</td><td>10</td></tr>
<tr><td>M5 Features</td><td><code>add_features</code>: month, hours, weekend, band</td><td>10</td></tr>
<tr><td>M6 NumPy profile</td><td>type matrix, row shares, most similar desk pair (cosine), minutes stats</td><td>10</td></tr>
<tr><td>M7 Summaries</td><td><code>summarize</code>: desk-month + desk summary with requests per staffed hour</td><td>12</td></tr>
<tr><td>M8 Figures</td><td><code>make_figures</code>: two labelled PNG files</td><td>10</td></tr>
<tr><td>M9 Export</td><td><code>export</code>: 4 CSV + manifest.json, identical rerun</td><td>8</td></tr>
<tr><td>M10 Facts</td><td><code>key_facts</code> + findings note</td><td>10</td></tr></table>
<p>Cleaning policy recap: minutes "NN min" → NN; "", unknown, n/a → missing; dates exact format %Y-%m-%d %H:%M; desk_code strip + zfill(3) for digit-only; desk strip + title, status strip + lower; exact duplicates keep first, conflicting reject all; reasons in order conflicting_id, unknown_desk, bad_date, implausible_minutes (≤ 0 or > 480); missing minutes kept. Must hold: exact duplicates + accepted + rejected = raw rows, and <code>manifest.json</code> reports <code>"reconciled": true</code>.</p>
<p>Deliverables a supervisor can trust: sort before writing (identical rerun); manifest.json (counts without the notebook); title + axis labels on every chart; facts computed by code. Output folder <code>day05_individual_output/</code>: accepted.csv, rejected.csv, analytical_table.csv, desk_summary.csv, manifest.json, requests_by_desk.png, requests_by_month.png. <b>Findings note</b> (80–150 words, 0–20): your computed numbers, one main pattern, two honest limitations (missing minutes, synthetic data, the 480-minute rule, scope), <b>no staffing or performance advice</b>. Final grade = 0.8 × automatic score + findings note (20).</p>
<table><tr><th>Symptom</th><th>Fix</th></tr>
<tr><td>Blank minutes disappear</td><td>reload raw as text with keep_default_na=False</td></tr>
<tr><td>Desk 7 does not match 007</td><td>strip, then zfill(3) digit-only codes</td></tr>
<tr><td>More rows after the join</td><td>validate="many_to_one" and check duplicated()</td></tr>
<tr><td>str.fullmatch mask error</td><td>missing values in the mask: .fillna(False).astype(bool)</td></tr>
<tr><td>Rerun writes different files</td><td>sort by request_id before writing</td></tr>
<tr><td>Figures check fails</td><td>set title, xlabel and ylabel on every axis</td></tr></table>
<h3>Team project — A reproducible multi-source pipeline (teams of four)</h3>
<table><tr><th>Source</th><th>Format</th><th>Difference to handle</th></tr>
<tr><td>January</td><td>jan_requests.csv</td><td>standard export</td></tr>
<tr><td>February</td><td>feb_requests.csv</td><td>extra column: channel</td></tr>
<tr><td>March</td><td>SQLite table march_requests</td><td>read-only, explicit columns</td></tr>
<tr><td>Desk lookup</td><td>SQLite table desks</td><td>must have unique codes</td></tr>
<tr><td>Targets</td><td>targets.csv</td><td>one target per region and month (training values)</td></tr></table>
<p>~549 raw rows generated from the team code. Goal: <code>run_pipeline(paths, out_dir, valid_codes)</code> regenerates every file from the raw sources, validates first and writes identical files on rerun.</p>
<table><tr><th>Role</th><th>Owns</th><th>Exercises</th><th>Pts</th></tr>
<tr><td>A Intake</td><td>load_sources (read-only SQLite, explicit columns, targets as integers), intake_report</td><td>EX01 EX02</td><td>18</td></tr>
<tr><td>B Cleaning</td><td>clean_month (course policy, extra columns dropped), cleaning summary (reconciled)</td><td>EX03 EX04</td><td>20</td></tr>
<tr><td>C Integration</td><td>integrate (concat with source, validated enrich, month, hours), compare_targets (start from targets, one-to-one, gap)</td><td>EX05 EX06</td><td>20</td></tr>
<tr><td>D Analysis</td><td>summaries, make_team_figures (3 PNG), brief_facts</td><td>EX07 EX08 EX10</td><td>30</td></tr>
<tr><td>Everyone</td><td>run_pipeline + integration test</td><td>EX09</td><td>12</td></tr></table>
<p><b>Interface contracts</b> make parallel work possible: raw_month (A→B), accepted (B→C), analytical (C→D), e.g. <code>INTERFACES["accepted"] = {"source_row": "number", "request_id": "text", ..., "opened_at": "datetime", "minutes": "number"}</code>. Every owner calls <code>check_interface(df, name)</code> (raises a clear ValueError) before handing a table on. Plan: 0–15 min contracts agreed and TEAM_PLAN filled; 15–90 parallel work; 90 integration and run_pipeline (EX09); 120 outputs, facts and brief agree; 135–150 presentation. EX09's check copies the database, inserts a duplicate desk and expects ValueError with <b>no files written</b>, then reruns and compares bytes. Outputs in <code>team_output/</code>: analytical_table.csv, region_month.csv, vs_target.csv, cleaning_summary.csv, manifest.json and three figures. CONTRIBUTIONS lists each member's functions and the notebook checks they exist.</p>
<p>Troubleshooting: minutes still text → apply min_suffix and to_numeric in clean_month; February rows rejected as conflicts → check exact duplicates on all source columns including channel; March codes don't match → read explicit columns and <code>.astype(str)</code>; files left after a failure → call all role functions first, write last; rerun differs → sort by request_id with a fixed column order.</p>
<p><b>Presentation (5 min):</b> run the pipeline once, open manifest.json, show the target-gap figure, read the main facts; every member explains one function and one failure case (repeated desk code, unknown code, impossible date). Grade = 0.8 × automatic + brief (100–180 words: numbers + 2 limitations, 8) + every member explains (8) + data-quality recommendation (4) — e.g. numeric minutes at entry, never staffing or performance decisions. "Not yet" role lines must show a corrected function before the grade is final.</p>
<p>Next: Week 07 starts from your analytical table, not raw files — distributions, correlations and outliers explored and documented (not deleted), better charts with Matplotlib and Seaborn, and a dashboard.</p>`,
ar_body:`
<p><b>اليوم 5 · المواضيع 06.01–06.04 · الدفتر 09 (فردي، ~180 دقيقة) + الدفتر 10 (فريق، ~135 دقيقة) + عروض الفرق 5 دقائق.</b> العمل الفردي فردي: ساعد في الفهم ولا تشارك الكود أبداً. عمل الفريق متوازٍ: اتفقوا على العقود أولاً.</p>
<h3>المشروع الفردي — تقرير ربع سنوي موثّق للمكاتب</h3>
<p>السيناريو: وحدة السجلات في إدارة شرطة خيالية تستلم ملفاً ربع سنوياً فوضوياً (يناير–مارس): كتابات غير متسقة، ورموز بلا أصفار بادئة، ونص في الدقائق، وتواريخ مستحيلة، وتكرارات تامة ومتعارضة، ومدد غير معقولة. المدخلات: <code>my_quarter_raw.csv</code> (~457 صفاً من STUDENT_ID تُحمّل كنص) و <code>my_desks.csv</code> (desk_code ← المنطقة و staffed_hours أسبوعياً).</p>
<pre>my_quarter_raw.csv -> M1 تحميل (نص) -> M2 فحص -> M3 تنظيف -> مقبول / مرفوض / تقرير
my_desks.csv ------------------------> M4 إثراء (كثير:1 موثّق) -> M5 خصائص -> M6 ملف NumPy
  -> M7 ملخصات -> M8 رسوم -> M9 تصدير + manifest -> M10 حقائق أساسية + ملاحظة النتائج</pre>

{id:"s26", unit:"u6", en:"EDA: Distributions, Relationships & Outliers", ar:"التحليل الاستكشافي: التوزيعات والعلاقات والقيم الشاذة",
en_body:`
<p><b>Week 07 · Day 1 · topic 07.01 · Notebook 01 (distributions & summaries) + Notebook 02 (relationships & outliers).</b> Week 07 at a glance: Day 1 EDA (07.01) · Day 2 Matplotlib & Seaborn (07.02) · Day 3 Streamlit dashboards (07.03) · Day 4 communicating and verifying findings (07.04) · Day 5 projects. One idea runs through the week: <b>a chart or dashboard is only as trustworthy as the analysis behind it.</b> Data come by link from the course GitHub data repository; each notebook opens with a 10-minute warm-up.</p>
<h3>What EDA is, and what it is not</h3>
<p><code>Question → Row grain → Audit → One column → Groups and time → Relationships → Findings</code>. EDA asks "what is in this table, and what could mislead us?" — it is not yet a report or a model. Row grain: one row = one request; a duplicate would distort every count, mean and share. Output: an <b>EDA log</b> where each finding = <b>number + denominator + caveat</b>.</p>
<h3>Audit before any chart</h3>
<table><tr><th>Check</th><th>Code</th></tr>
<tr><td>Size</td><td><code>df.shape</code></td></tr><tr><td>Types</td><td><code>df.dtypes</code></td></tr>
<tr><td>Gaps</td><td><code>df.isna().sum()</code></td></tr><tr><td>Duplicates</td><td><code>df.duplicated().sum()</code></td></tr>
<tr><td>Row grain</td><td><code>df['request_id'].is_unique</code></td></tr><tr><td>Ranges</td><td><code>df.agg(['min', 'max'])</code></td></tr></table>
<p>Why audit a clean table? A chart of a broken table looks just as convincing as a chart of a good one.</p>
<h3>Centre and spread: match the summary to the shape</h3>
<table><tr><th>Summary</th><th>All 480</th><th>Without 4 largest</th></tr>
<tr><td>mean</td><td>35.8</td><td>32.8</td></tr><tr><td>median</td><td>25.0</td><td>24.7</td></tr>
<tr><td>std</td><td>42.7</td><td>26.7</td></tr><tr><td>IQR</td><td>24.5</td><td>about the same</td></tr></table>
<p>Skewed data: report median and IQR and show the tail with P95 (95.4 min). Symmetric data: mean and standard deviation are fine. <b>Robust</b> = barely moved by a few extreme values. Rows were removed only to <b>measure sensitivity</b> — the 4 long requests are real cases and stay in the data.</p>
<h3>Shape: the histogram shows what summaries hide</h3>
<p>Right-skewed: a long tail of large values, mean &gt; median — typical for durations and waits. <code>Series.skew()</code>: about 0 symmetric, &gt; 0 right, &lt; 0 left. Every chart: title, x label, y label. Bins change the story: too few hide structure, too many show noise — state your bins or use <code>np.histogram</code> with fixed edges to show counts and the modal bin. Long tail? Try a log-scaled axis and say so in the title (the values don't change, only the axis).</p>
<h3>Debug EX04: a summary that lies</h3>
<pre>def describe_column(series):
    values = series.fillna(0)
    return {"n": len(values), "mean": values.mean(), "median": values.mean(),
            "iqr": values.quantile(0.75) - values.quantile(0.5)}</pre>
<p>Bugs: <code>fillna(0)</code> invents zeros and lowers the mean; <code>len(values)</code> counts missing values; median = mean hides the skew; Q3 − median is not the IQR; no <code>n_missing</code>, so gaps disappear from the report.</p>
<h3>Categories and time patterns</h3>
<ul><li>Counts + shares: "Report: 147 of 480 (30.6%)". Rare levels (share &lt; 12%) give unstable percentages: group as "Other" for <b>display only</b>.</li>
<li>Zero hours vanish unless you <code>reindex(range(24), fill_value=0)</code>; weekdays: reindex Monday–Sunday, not alphabetical.</li>
<li>Per day: <code>set_index('opened_at').resample('D').size()</code> keeps zero days. "No trend" is a valid finding: the 7-day rolling mean of the demo quarter is flat.</li></ul>
<h3>Compare distributions between groups</h3>
<p>Box plot: box = Q1 to Q3, line = median, dots = beyond 1.5 IQR. Always show <b>n</b>: a median from 12 requests is less stable than one from 120. <b>ECDF</b>: the share handled within x minutes, for every x, without bins. EX07 <code>desk_profile</code>: n, median, q1, q3, iqr sorted by median.</p>
<h3>Missing values are a pattern</h3>
<table><tr><th>Wrong denominator</th><th>Result</th></tr>
<tr><td>count() (observed)</td><td>can exceed 1</td></tr>
<tr><td>all rows overall</td><td>diluted by other groups</td></tr>
<tr><td>overall missing</td><td>same numerator for all</td></tr></table>
<p>Caveat next to every satisfaction number: phone has the most requests but the lowest response rate (90 of 205 answered), so the overall mean under-weights phone requesters.</p>
<h3>Writing an EDA finding</h3>
<table><tr><th>Weak</th><th>Strong: number + denominator + caveat</th></tr>
<tr><td>Requests take about 36 minutes.</td><td>The median request took 25 minutes (n = 480); four cases above 300 minutes pull the mean to 36.</td></tr>
<tr><td>Phone users are less satisfied.</td><td>Phone mean satisfaction is 3.9, but only 44% of phone requesters answered.</td></tr>
<tr><td>Mondays are busy.</td><td>Monday had 80 of 480 requests (17%), Tuesday 79: one request is not a pattern.</td></tr></table>
<pre>n_long, n_total = int((df["minutes"] > 60).sum()), len(df)
print(f"{n_long} of {n_total} requests ({n_long / n_total:.1%}) took more than 60 minutes")</pre>
<p>EX10 challenge: <code>profile_numeric(series)</code>.</p>
<h3>Notebook 02 — Which tool for which pair?</h3>
<table><tr><th>Pair</th><th>Question</th><th>Chart</th><th>Number</th></tr>
<tr><td>number–number</td><td>do they move together?</td><td>scatter</td><td>Pearson / Spearman r</td></tr>
<tr><td>number–category</td><td>do the groups differ?</td><td>box plot per group</td><td>median + IQR + n</td></tr>
<tr><td>category–category</td><td>are the levels linked?</td><td>stacked bars</td><td>crosstab with shares</td></tr></table>
<p>Look before you compute (one scatter shows what a single number hides). <b>Association is not cause</b>: a third factor can drive both. <b>Unusual is not wrong</b>: investigate an outlier before deciding anything.</p>
<h3>Pearson correlation and its traps</h3>
<pre>xc, yc = x - x.mean(), y - y.mean()
r = (xc @ yc) / (np.linalg.norm(xc) * np.linalg.norm(yc))   # cosine of the centred columns</pre>
<p>Range −1 to +1; measures a <b>straight-line</b> pattern. Correlation-matrix traps: self-pairs (r = 1) → drop the diagonal; a–b and b–a both listed → keep one triangle; sorted by sign → sort by <code>abs(r)</code>; ID-like numbers → choose measure columns (debug EX04 <code>top_correlations</code> listed self-pairs, duplicates and hid strong negatives).</p>
<h3>Pearson or Spearman?</h3>
<p>Spearman = Pearson on ranks: <code>x.rank().corr(y.rank())</code> — for monotonic, curved patterns and extremes. backlog_at_open–wait_hours: Pearson 0.670, Spearman 0.784 (curved but one-directional). attachments–minutes: Pearson 0.296 with all rows, 0.430 without flagged rows — extremes weaken Pearson; report both.</p>
<h3>Crosstabs: choose the denominator</h3>
<table><tr><th>normalize=</th><th>Denominator</th><th>Question</th></tr>
<tr><td>"index"</td><td>each row total</td><td>Of the Online requests, what share are Reports?</td></tr>
<tr><td>"columns"</td><td>each column total</td><td>Of the Report requests, what share came Online?</td></tr>
<tr><td>"all"</td><td>grand total</td><td>What share of all requests are Online Reports?</td></tr></table>
<p>Composition can mislead: a priority gap may partly be a request-type gap — check the mix before explaining a group difference.</p>
<h3>Unusual values: three rules, three answers</h3>
<table><tr><th>Rule (demo minutes)</th><th>Flagged</th></tr>
<tr><td>IQR fences 1.5</td><td>42</td></tr><tr><td>robust z &gt; 3.5</td><td>36</td></tr><tr><td>z-score &gt; 3</td><td>5</td></tr></table>
<p>z-scores use the mean and std, which the outliers themselves inflate (<b>masking</b>). Robust z = 0.6745 (x − median) / MAD. A flag starts an investigation; always state the rule next to the count.</p>
<h3>Error or valid extreme? Then test the influence</h3>
<table><tr><th>Evidence</th><th>Action</th></tr>
<tr><td>impossible value</td><td>report to the data owner</td></tr>
<tr><td>possible but rare</td><td>keep; report influence</td></tr>
<tr><td>many beyond the fence</td><td>describe the tail</td></tr>
<tr><td>cluster at 999</td><td>ask what the code means</td></tr></table>
<p>Sensitivity table (all vs without flagged): mean 35.8 vs 26.6, median 25.0 vs 23.0, r attachments–minutes 0.296 vs 0.430. The mean drops by about a quarter, the median barely moves, the correlation changes: <b>report both; delete nothing</b> (debug EX08 fixes a filter that deletes; EX10 <code>outlier_report(df, column, by, k)</code>). Keep your EDA log: Day 4 and the Day 5 project build on it.</p>`,

<p><b>الأسبوع 07 · اليوم 1 · الموضوع 07.01 · الدفتر 01 (التوزيعات والملخصات) + الدفتر 02 (العلاقات والقيم الشاذة).</b> الأسبوع 07 باختصار: اليوم 1 التحليل الاستكشافي (07.01) · اليوم 2 ‏Matplotlib و Seaborn ‏(07.02) · اليوم 3 لوحات Streamlit ‏(07.03) · اليوم 4 إيصال النتائج والتحقق منها (07.04) · اليوم 5 المشاريع. فكرة واحدة تمتد طوال الأسبوع: <b>الرسم أو اللوحة جديران بالثقة بقدر التحليل الذي خلفهما فقط.</b> البيانات تُقرأ برابط من مستودع بيانات الدورة على GitHub، وكل دفتر يبدأ بتمهيد 10 دقائق.</p>
<h3>ما هو التحليل الاستكشافي وما ليس هو</h3>
<p><code>السؤال ← مستوى الصف ← التدقيق ← عمود واحد ← المجموعات والزمن ← العلاقات ← النتائج</code>. يسأل EDA: "ماذا في هذا الجدول، وما الذي قد يضللنا؟" — وليس تقريراً ولا نموذجاً بعد. مستوى الصف: صف واحد = طلب واحد، والتكرار يشوّه كل عدد ومتوسط ونسبة. المخرج: <b>سجل EDA</b> كل نتيجة فيه = <b>رقم + مقام + تحفظ</b>.</p>
<h3>دقّق قبل أي رسم</h3>
<table><tr><th>الفحص</th><th>الكود</th></tr>
<tr><td>الحجم</td><td><code>df.shape</code></td></tr><tr><td>الأنواع</td><td><code>df.dtypes</code></td></tr>
<tr><td>الفجوات</td><td><code>df.isna().sum()</code></td></tr><tr><td>التكرارات</td><td><code>df.duplicated().sum()</code></td></tr>
<tr><td>مستوى الصف</td><td><code>df['request_id'].is_unique</code></td></tr><tr><td>المدى</td><td><code>df.agg(['min', 'max'])</code></td></tr></table>
<p>لماذا ندقق جدولاً نظيفاً؟ رسم الجدول المعطوب يبدو مقنعاً تماماً مثل رسم الجدول السليم.</p>
<h3>المركز والتشتت: طابق الملخص مع الشكل</h3>
<table><tr><th>الملخص</th><th>كل الـ 480</th><th>بدون أكبر 4</th></tr>
<tr><td>المتوسط</td><td>35.8</td><td>32.8</td></tr><tr><td>الوسيط</td><td>25.0</td><td>24.7</td></tr>
<tr><td>الانحراف</td><td>42.7</td><td>26.7</td></tr><tr><td>IQR</td><td>24.5</td><td>تقريباً نفسه</td></tr></table>
<p>البيانات الملتوية: اذكر الوسيط و IQR وأظهر الذيل بالمئين 95 (95.4 دقيقة). البيانات المتماثلة: المتوسط والانحراف المعياري مناسبان. <b>المقياس المتين</b> = بالكاد يتأثر بقيم متطرفة قليلة. حُذفت الصفوف فقط <b>لقياس الحساسية</b> — الطلبات الأربعة الطويلة حالات حقيقية وتبقى في البيانات.</p>
<h3>الشكل: المدرج التكراري يكشف ما تخفيه الملخصات</h3>
<p>الالتواء لليمين: ذيل طويل من القيم الكبيرة والمتوسط &gt; الوسيط — نموذجي للمدد والانتظار. <code>Series.skew()</code>: قرابة 0 متماثل، &gt; 0 يمين، &lt; 0 يسار. كل رسم: عنوان واسم محور x واسم محور y. الفئات (Bins) تغيّر القصة: القليلة تخفي البنية والكثيرة تُظهر الضجيج — اذكر فئاتك أو استخدم <code>np.histogram</code> بحدود ثابتة لعرض الأعداد والفئة الأكثر تكراراً. ذيل طويل؟ جرّب محوراً لوغاريتمياً واذكره في العنوان (القيم لا تتغير، المحور فقط).</p>
<h3>التمرين EX04: ملخص يكذب</h3>
<pre>def describe_column(series):
    values = series.fillna(0)
    return {"n": len(values), "mean": values.mean(), "median": values.mean(),
            "iqr": values.quantile(0.75) - values.quantile(0.5)}</pre>
<p>الأخطاء: <code>fillna(0)</code> تخترع أصفاراً وتخفض المتوسط؛ و <code>len(values)</code> تعدّ المفقود؛ والوسيط = المتوسط يخفي الالتواء؛ و Q3 − الوسيط ليس IQR؛ ولا يوجد <code>n_missing</code> فتختفي الفجوات من التقرير.</p>
<h3>أنماط الفئات والزمن</h3>
<ul><li>أعداد + نسب: "Report: ‏147 من 480 (30.6%)". المستويات النادرة (نسبة &lt; 12%) تعطي نسباً غير مستقرة: اجمعها كـ "Other" <b>للعرض فقط</b>.</li>
<li>الساعات الصفرية تختفي إلا إذا استخدمت <code>reindex(range(24), fill_value=0)</code>؛ وأيام الأسبوع: أعد الفهرسة من الاثنين للأحد لا أبجدياً.</li>
<li>لكل يوم: <code>set_index('opened_at').resample('D').size()</code> تبقي الأيام الصفرية. "لا اتجاه" نتيجة صالحة: المتوسط المتحرك 7 أيام لربع المثال مسطّح.</li></ul>
<h3>قارن التوزيعات بين المجموعات</h3>
<p>مخطط الصندوق: الصندوق = Q1 إلى Q3، والخط = الوسيط، والنقاط = ما بعد 1.5 IQR. اعرض <b>n</b> دائماً: وسيط من 12 طلباً أقل ثباتاً من وسيط من 120. <b>ECDF</b>: نسبة ما أُنجز خلال x دقيقة لكل x بدون فئات. التمرين EX07 ‏<code>desk_profile</code>: ‏n والوسيط و q1 و q3 و iqr مرتبة بالوسيط.</p>
<h3>القيم المفقودة نمط بحد ذاتها</h3>
<table><tr><th>مقام خاطئ</th><th>النتيجة</th></tr>
<tr><td>count() (الملاحظ)</td><td>قد تتجاوز 1</td></tr>
<tr><td>كل الصفوف إجمالاً</td><td>مخففة بالمجموعات الأخرى</td></tr>
<tr><td>المفقود الإجمالي</td><td>نفس البسط للجميع</td></tr></table>
<p>تحفّظ بجانب كل رقم رضا: الهاتف له أكثر الطلبات لكن أقل معدل استجابة (90 من 205 أجابوا)، فالمتوسط الإجمالي يقلل وزن طالبي الخدمة بالهاتف.</p>
<h3>كتابة نتيجة استكشافية</h3>
<table><tr><th>ضعيفة</th><th>قوية: رقم + مقام + تحفظ</th></tr>
<tr><td>الطلبات تأخذ حوالي 36 دقيقة.</td><td>الطلب الوسيط أخذ 25 دقيقة (n = 480)؛ وأربع حالات فوق 300 دقيقة ترفع المتوسط إلى 36.</td></tr>
<tr><td>مستخدمو الهاتف أقل رضا.</td><td>متوسط رضا الهاتف 3.9، لكن 44% فقط من طالبيه أجابوا.</td></tr>
<tr><td>أيام الاثنين مزدحمة.</td><td>الاثنين فيه 80 من 480 طلباً (17%) والثلاثاء 79: طلب واحد ليس نمطاً.</td></tr></table>
<pre>n_long, n_total = int((df["minutes"] > 60).sum()), len(df)
print(f"{n_long} of {n_total} requests ({n_long / n_total:.1%}) took more than 60 minutes")</pre>
<p>التحدي EX10: <code>profile_numeric(series)</code>.</p>
<h3>الدفتر 02 — أي أداة لأي زوج؟</h3>
<table><tr><th>الزوج</th><th>السؤال</th><th>الرسم</th><th>الرقم</th></tr>
<tr><td>رقم–رقم</td><td>هل يتحركان معاً؟</td><td>تشتت</td><td>بيرسون / سبيرمان r</td></tr>
<tr><td>رقم–فئة</td><td>هل تختلف المجموعات؟</td><td>صندوق لكل مجموعة</td><td>الوسيط + IQR + n</td></tr>
<tr><td>فئة–فئة</td><td>هل المستويات مرتبطة؟</td><td>أعمدة مكدسة</td><td>جدول تقاطع بالنسب</td></tr></table>
<p>انظر قبل أن تحسب (رسم تشتت واحد يكشف ما يخفيه رقم واحد). <b>الارتباط ليس سببية</b>: عامل ثالث قد يحرك الاثنين. <b>غير العادي ليس خاطئاً</b>: افحص القيمة الشاذة قبل أي قرار.</p>
<h3>ارتباط بيرسون وفخاخه</h3>
<pre>xc, yc = x - x.mean(), y - y.mean()
r = (xc @ yc) / (np.linalg.norm(xc) * np.linalg.norm(yc))   # جيب تمام الأعمدة المتمركزة</pre>
<p>المدى −1 إلى +1، ويقيس نمط <b>الخط المستقيم</b>. فخاخ مصفوفة الارتباط: الأزواج الذاتية (r = 1) ← احذف القطر؛ و a–b و b–a معاً ← أبقِ مثلثاً واحداً؛ الترتيب بالإشارة ← رتّب بـ <code>abs(r)</code>؛ الأرقام الشبيهة بالمعرّفات ← اختر أعمدة القياس (التمرين EX04 ‏<code>top_correlations</code> عرضت الأزواج الذاتية والمكررة وأخفت الارتباطات السالبة القوية).</p>
<h3>بيرسون أم سبيرمان؟</h3>
<p>سبيرمان = بيرسون على الرتب: <code>x.rank().corr(y.rank())</code> — للأنماط الرتيبة والمنحنية والقيم المتطرفة. backlog_at_open–wait_hours: بيرسون 0.670 وسبيرمان 0.784 (منحنٍ لكن باتجاه واحد). attachments–minutes: بيرسون 0.296 مع كل الصفوف و 0.430 بدون المُعلّمة — المتطرفة تضعف بيرسون؛ اذكر القيمتين.</p>
<h3>جداول التقاطع: اختر المقام</h3>
<table><tr><th>normalize=</th><th>المقام</th><th>السؤال</th></tr>
<tr><td>"index"</td><td>مجموع كل صف</td><td>من طلبات Online، ما نسبة Reports؟</td></tr>
<tr><td>"columns"</td><td>مجموع كل عمود</td><td>من طلبات Report، ما نسبة ما جاء Online؟</td></tr>
<tr><td>"all"</td><td>المجموع الكلي</td><td>ما نسبة Online Reports من كل الطلبات؟</td></tr></table>
<p>التركيبة قد تضلل: فرق الأولوية قد يكون جزئياً فرقاً في نوع الطلب — افحص المزيج قبل تفسير فرق بين مجموعات.</p>
<h3>القيم غير العادية: ثلاث قواعد وثلاث إجابات</h3>
<table><tr><th>القاعدة (دقائق المثال)</th><th>المُعلّم</th></tr>
<tr><td>أسوار IQR ‏1.5</td><td>42</td></tr><tr><td>robust z &gt; 3.5</td><td>36</td></tr><tr><td>z-score &gt; 3</td><td>5</td></tr></table>
<p>الدرجات المعيارية تستخدم المتوسط والانحراف اللذين تضخمهما القيم الشاذة نفسها (<b>الإخفاء Masking</b>). Robust z = ‏0.6745 (x − الوسيط) ÷ MAD. العلامة تبدأ تحقيقاً، واذكر القاعدة دائماً بجانب العدد.</p>
<h3>خطأ أم قيمة متطرفة صحيحة؟ ثم اختبر التأثير</h3>
<table><tr><th>الدليل</th><th>الإجراء</th></tr>
<tr><td>قيمة مستحيلة</td><td>أبلغ مالك البيانات</td></tr>
<tr><td>ممكنة لكنها نادرة</td><td>أبقِها وأبلغ عن تأثيرها</td></tr>
<tr><td>كثيرة بعد السور</td><td>صِف الذيل</td></tr>
<tr><td>تجمّع عند 999</td><td>اسأل ماذا يعني الرمز</td></tr></table>
<p>جدول الحساسية (الكل مقابل بدون المُعلّمة): المتوسط 35.8 مقابل 26.6، والوسيط 25.0 مقابل 23.0، و r للمرفقات–الدقائق 0.296 مقابل 0.430. المتوسط ينخفض قرابة الربع والوسيط بالكاد يتحرك والارتباط يتغير: <b>اذكر الاثنين ولا تحذف شيئاً</b> (التمرين EX08 يصلح مرشحاً يحذف، و EX10 ‏<code>outlier_report(df, column, by, k)</code>). احتفظ بسجل EDA: اليوم 4 ومشروع اليوم 5 يبنيان عليه.</p>`},

en_body:`
<p><b>Day 2 · topic 07.02 · Notebook 03 (Matplotlib anatomy & chart choice) + Notebook 04 (Seaborn statistical plots).</b> Readers, not explorers: today's charts are for a supervisor, a team or a dashboard user. Every chart: a question, a title, axis labels, an honest scale and a stated denominator. Charts are data: you can read bars, lines, ticks and colours back from your Axes to check them.</p>
<h3>1. Anatomy of a figure</h3>
<table><tr><th>Object</th><th>Calls</th></tr>
<tr><td>Figure</td><td>plt.subplots, suptitle, savefig</td></tr>
<tr><td>Axes</td><td>bar, plot, set_title</td></tr>
<tr><td>Axis</td><td>set_ylim, set_xticks</td></tr>
<tr><td>Artists</td><td>ax.patches, ax.lines, ax.texts</td></tr></table>
<pre>fig, ax = plt.subplots()
ax.bar(counts.index, counts.values)
ax.set_title("...")</pre>
<h3>2. Start from the question</h3>
<table><tr><th>The question is about</th><th>Chart</th><th>Example</th></tr>
<tr><td>comparison across categories</td><td>bar</td><td>Which desk handled the most requests?</td></tr>
<tr><td>trend over time</td><td>line</td><td>How did weekly requests change?</td></tr>
<tr><td>distribution of one number</td><td>histogram / ECDF</td><td>Is there a long tail of slow requests?</td></tr>
<tr><td>distribution across groups</td><td>box plot</td><td>How do minutes and their spread compare by desk?</td></tr>
<tr><td>relationship of two numbers</td><td>scatter</td><td>Do waits rise with the backlog?</td></tr>
<tr><td>composition within groups</td><td>stacked bar</td><td>What is the channel mix in each desk?</td></tr>
<tr><td>concentration over two categories</td><td>heatmap</td><td>Which weekday and hour are busiest?</td></tr></table>
<p>Avoid pies with more than three slices, 3-D charts and dual y axes.</p>
<h3>3–4. Bars and lines</h3>
<p><b>Bars:</b> start at zero, sort, label — a bar's length is its value, so a cut axis makes a small gap look huge (debug EX04). Line charts may start above zero; bar charts may not. <b>Lines</b> for trends with an ordered x (time or a natural sequence); <code>label=</code> + <code>legend()</code>, one entry per line, at most about four lines; partial periods (first/last weeks may have fewer days) — say so. EX03: weekly counts per region with <code>pd.Grouper</code>.</p>
<h3>6–7. Small multiples and colour with a purpose</h3>
<p>Small multiples: same bins, <code>sharex=True</code> and <code>sharey=True</code>, a title per panel and <code>fig.suptitle</code>. Emphasis: one highlighted category, everything else grey. The same colour for the same category in every chart; don't rely on red versus green alone.</p>
<h3>8. Reference lines and annotations</h3>
<p><code>axhline</code>: a median, target or threshold; <code>annotate</code>: point at one value and explain it; computed text with f-strings, never typed numbers. EX07: daily counts, a 7-day rolling mean, a median line and an annotation of the busiest day.</p>
<h3>9. Honest axes: order and scale</h3>
<p>Truncated axis honest only for a line of change; log scale for long tails, labelled; x order by time or sorted; percent axis with the denominator stated. Debug EX08: <code>month_name().value_counts()</code> sorts by count, so the line runs Jan → Mar → Feb — group by <code>dt.to_period('M')</code> and label ticks with <code>strftime('%b')</code>.</p>
<h3>10–11. Export and reuse</h3>
<table><tr><th>Setting</th><th>Typical value</th></tr>
<tr><td>figsize=(w, h)</td><td>(8, 4.5)</td></tr><tr><td>dpi=</td><td>150 report, 300 print</td></tr>
<tr><td>bbox_inches=</td><td>"tight" always</td></tr><tr><td>format</td><td>PNG web, SVG/PDF documents</td></tr></table>
<p><b>Save first, then show</b> — in scripts <code>plt.show()</code> can clear the figure. EX10 <code>ranked_bar(series, title, xlabel, highlight=None, ax=None)</code>: largest at top, x from 0, value labels, grey + highlight, ValueError for an unknown highlight.</p>
<h3>Notebook 04 — Seaborn thinks in tidy data</h3>
<table><tr><th>Argument</th><th>Role</th></tr>
<tr><td>data=</td><td>the DataFrame</td></tr><tr><td>x=, y=</td><td>positions</td></tr>
<tr><td>hue=</td><td>colour groups</td></tr><tr><td>col=, row=</td><td>panels (figure-level)</td></tr>
<tr><td>order=, hue_order=</td><td>category order</td></tr></table>
<p>Axes-level functions (histplot, boxplot) return an Axes — Notebook 03 still applies (set_title, set_ylim, ax.patches). Figure-level functions (displot, catplot, relplot) return a FacetGrid.</p>
<h3>Distributions</h3>
<p>Different group sizes? <code>stat='percent'</code> with <code>common_norm=False</code> makes each group sum to 100% and compares shapes (EX01). KDE depends on a bandwidth and can spill below zero; ECDF needs neither. Box plots need <code>order=</code> (EX02: median order, log y).</p>
<h3>What does a bar plot estimate?</h3>
<table><tr><th>Priority</th><th>Low</th><th>Normal</th><th>High</th></tr>
<tr><td>mean / median minutes</td><td>30.1 / 19.5</td><td>35.9 / 25.8</td><td>45.4 / 31.6</td></tr></table>
<p>A Seaborn bar of means hides skew; state the estimator (debug EX04: a bar of means that misleads).</p>
<h3>Relationships and two-way tables</h3>
<p>Overplotting: alpha 0.3–0.5, smaller markers, a 2-D histogram for thousands of points. A <code>regplot</code> line is a description that assumes a straight pattern. Heatmap: <code>annot=True, fmt='d'</code>, a sequential cmap for counts; <code>RdBu_r</code> with <code>center=0</code> for correlations (EX05 scatter with hue and alpha; EX06 desk × weekday heatmap).</p>
<h3>Facets, one colour per category, wide to long</h3>
<pre>sns.countplot(..., hue="channel", hue_order=CHANNELS, palette=CHANNEL_COLORS)
weekly_long = (weekly_wide.reset_index()
    .melt(id_vars="opened_at", var_name="measure", value_name="value"))
sns.relplot(..., col="measure", facet_kws={"sharey": False})   # different units, separate panels</pre>
<p>Debug EX08: colours that change meaning between charts. EX10 <code>compare_groups(df, value, group, kind="box", order=None, log=False, ax=None)</code>: box or violin (<code>cut=0</code>), default order by median descending, ticks "level\n(n=count)", ValueError for other kinds.</p>
<h3>Accuracy checklist</h3>
<ul><li>question named; title + axis labels; bars start at 0</li><li>categories in a meaningful order; denominator stated</li><li>shared scales across panels; skew → median, not mean; one colour per category</li></ul>`,
